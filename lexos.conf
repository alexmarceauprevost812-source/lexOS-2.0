# =============================================================================
#  LexOS — configuration centrale de la distribution
# =============================================================================
#  Ce fichier est la SEULE source de vérité pour l'identité de la distro.
#  Il est lu par auto/config, build.sh et par les hooks de branding.
#  Modifie-le, relance `sudo ./build.sh`, et toute l'ISO suit.
# =============================================================================

# --- Identité ----------------------------------------------------------------
LEXOS_NAME="LexOS"
LEXOS_ID="lexos"
LEXOS_VERSION="2.0.2-rtx5060"
LEXOS_CODENAME="Nomad"
LEXOS_BRAND="TI-LEX-AL"
LEXOS_TAGLINE="Explore. Build. Own your machine."
LEXOS_PUBLISHER="Alex Marceau-Prevost"
LEXOS_HOME_URL="https://github.com/alexmarceauprevost812-source/lexOS-2.0"
LEXOS_BUG_URL="https://github.com/alexmarceauprevost812-source/lexOS-2.0/issues"
LEXOS_LICENSE="MIT"

# --- Base technique ----------------------------------------------------------
#  trixie = Debian 13, le socle moderne : noyau 6.12 LTS, systemd 257, Mesa 25.
#  C'est la génération de composants qu'utilise Ubuntu 26.04 — même moteur.
#  bookworm = Debian 12, plus ancien mais ultra éprouvé.
LEXOS_DEBIAN_SUITE="trixie"
LEXOS_ARCH="amd64"
LEXOS_MIRROR="https://deb.debian.org/debian/"
LEXOS_MIRROR_SECURITY="https://security.debian.org/debian-security/"

#  Noyau : stock = celui de la suite ; backports = le plus récent disponible
#  (meilleure prise en charge du matériel neuf, un peu moins éprouvé).
LEXOS_KERNEL_CHANNEL="stock"

#  Méta-paquet de branche NVIDIA à forcer (saveur pro, carte NVIDIA présente).
#  VIDE À DESSEIN — et c'est le résultat de deux constructions perdues.
#  On a d'abord épinglé « 595 », la branche que fait tourner Ubuntu 26.04 sur
#  la machine d'essai (Alienware Aurora ACT1250, GeForce RTX 5060, TV Hisense
#  en HDMI, bureau parfait sans aucun réglage). Puis « 580 ». Les deux fois,
#  le hook 0260 est retombé sur le défaut du dépôt : ni nvidia-open-595 ni
#  nvidia-open-580 n'existe sous ce nom dans le dépôt NVIDIA debian13 — ces
#  méta-paquets de branche sont une convention Ubuntu, pas Debian. Deux ISO
#  de trois heures livrées avec exactement le pilote qu'elles devaient éviter.
#  Le hook ne devine donc plus de noms : il demande au dépôt son inventaire
#  (apt-cache madison), l'écrit dans le journal et dans /etc/lexos/nvidia-
#  report, et installe la version la plus récente d'AVANT la branche 610 —
#  celle qui porte la régression HDMI documentée sur téléviseur
#  (NVIDIA/open-gpu-kernel-modules#1238), exactement le symptôme observé :
#  BIOS, menu de démarrage et logo LexOS s'affichent, puis plus rien dès que
#  le pilote prend la main.
#  Ne remplir cette variable que pour forcer un méta-paquet précis dont on a
#  VÉRIFIÉ l'existence dans l'inventaire du rapport ci-dessus.
LEXOS_NVIDIA_BRANCH=""

# --- Session live (démo) -----------------------------------------------------
LEXOS_LIVE_USER="lex"
LEXOS_HOSTNAME="lexos"
LEXOS_TIMEZONE="America/Toronto"
LEXOS_LOCALE="fr_CA.UTF-8"
LEXOS_KEYBOARD_LAYOUT="ca"
LEXOS_KEYBOARD_VARIANT="fr"

# --- Apparence : LexOS Noir --------------------------------------------------
# Accent par défaut. Variantes : orange bleu rouge vert gris violet neon
LEXOS_ACCENT_NAME="orange"
LEXOS_BG="#000000"          # noir pur
LEXOS_FG="#FFFFFF"          # écriture blanche
LEXOS_TERM_FG="#39FF14"     # terminal : vert néon
LEXOS_GTK_BASE_THEME="Arc-Dark"
#  « LexOS » ne redéfinit QUE les dossiers (les poches orange de la démo) et
#  hérite de Papirus-Dark pour tout le reste — voir son index.theme. C'est LUI
#  qu'il faut nommer ici : le squelette disait déjà LexOS, mais le hook 0600
#  et lexos-firstrun réécrivaient « Papirus-Dark » par-dessus — d'où les
#  dossiers BLEUS sur la photo d'Alex, build 69, alors que le thème orange
#  était dans l'ISO depuis le 66. Trois écrivains, une seule valeur : celle-ci.
LEXOS_ICON_THEME="LexOS"

# Position du dock. Valeurs : right (défaut) | left | bottom | top
LEXOS_DOCK_POSITION="right"

# --- Effets CRT (ouverture/fermeture de fenêtres façon TV 1980) -------------
# on   : Compiz démarre si l'accélération 3D est disponible, sinon repli xfwm4
# off  : xfwm4 seul (compositing simple)
#
# DÉFAUT PASSÉ À « off », ET VOICI POURQUOI.
# ═══ POURQUOI C'ÉTAIT « off », ET POURQUOI CETTE RAISON N'EXISTE PLUS ═══
# Sur le portable 2016, Alex a vu la barre du haut APPARAÎTRE puis DISPARAÎTRE
# quelques secondes plus tard. La chaîne était celle-ci, et chacun de ses
# maillons portait le nom de COMPIZ :
#   · xfce4-session lance lexos-wm en premier (priorité 15) ;
#   · lexos-wm devait d'abord SAVOIR s'il y avait une vraie accélération 3D
#     pour choisir entre Compiz et xfwm4 : il exécutait glxinfo, plusieurs
#     secondes ;
#   · pendant ce temps la session démarrait xfce4-panel (priorité 25) : LA
#     BARRE APPARAISSAIT ;
#   · glxinfo répondait enfin « oui », et Compiz démarrait en « --replace ».
#     Il remplaçait le GESTIONNAIRE DE FENÊTRES sous une barre déjà affichée,
#     qui perdait son ancrage et disparaissait.
#
# COMPIZ N'EST PLUS SUR CE CHEMIN, et ça se lit dans lexos-wm : sans
# LEXOS_WM_COMPIZ=1, il fait « exec xfwm4 --replace » TOUT DE SUITE et lance
# lexos-crt détaché derrière. Trois choses en découlent, et ce sont elles qui
# rendent le « off » caduc :
#   · glxinfo ne retarde plus rien : il est appelé dans le superviseur
#     détaché, pas dans le chemin qui décide du gestionnaire de fenêtres ;
#   · picom est un COMPOSITEUR, pas un gestionnaire de fenêtres. Il ne fait
#     jamais « --replace » : la barre garde son ancrage ;
#   · et le « exec xfwm4 --replace » a lieu dans LES DEUX branches — celle
#     des effets allumés comme celle des effets éteints. Mettre « on » ne
#     rajoute donc aucun remplacement ; ça ajoute seulement un superviseur
#     détaché qui démarre picom deux secondes plus tard.
#
# CE QUE « off » COÛTAIT, ET C'EST TOUT LE SUJET. lexos-crt lit ce réglage en
# premier : « effets non demandés — rien à faire », et il sort AVANT même de
# regarder si picom est là. L'animation ne pouvait donc pas jouer sur une
# machine fraîchement installée, quoi qu'on fasse d'autre. C'est exactement
# ce qu'Alex décrit depuis des semaines : « l'effet d'animation n'est pas là
# quand je ferme des fenêtres ».
#
# ═══ CE QUI RESTE OUVERT, ET QU'ON N'EFFACE PAS ═══
# Sur l'Alienware, le signal HDMI du téléviseur Hisense se perdait « quand le
# bureau graphique démarre » — soupçonné d'être le contexte OpenGL que Compiz
# créait sur la carte NVIDIA. picom en « backend = glx » crée lui aussi un
# contexte OpenGL : ce soupçon n'est PAS levé, il est seulement déplacé.
# Il n'a jamais été prouvé, et un effet qu'Alex demande depuis des semaines
# ne se refuse pas sur un soupçon. Si l'écran du téléviseur se coupe encore
# au démarrage, une seule commande le tranche :
#     lexos crt off
# et la session suivante repart sans compositeur. C'est aussi le premier
# geste de diagnostic à faire dans ce cas.
LEXOS_CRT_EFFECTS="on"

# --- Performance -------------------------------------------------------------
# Profil appliqué au premier démarrage : petit | medium | performant | max
# « auto » laisse LexOS choisir d'après la RAM et le nombre de cœurs.
LEXOS_PERF_PROFILE="auto"

# --- Réseau ------------------------------------------------------------------
# Connexion automatique aux réseaux Wi-Fi SANS mot de passe.
# Laissé sur « off » : un réseau ouvert n'est pas chiffré, tout le monde à
# portée peut lire ce qui y circule. L'utilisateur peut l'activer lui-même
# avec « lexos net auto on », qui redemande confirmation.
LEXOS_WIFI_AUTO_OPEN="off"

# --- Sécurité ----------------------------------------------------------------
# Proposer le chiffrement du disque (mot de passe au démarrage) à l'installation.
LEXOS_DISK_ENCRYPTION="proposed"

# --- Saveur par défaut (minimal | standard | dev | full | gaming) ------------
LEXOS_FLAVOUR="standard"
