<?xml version="1.0" encoding="UTF-8"?>
<!--
  LexOS — Réglages (Paramètres).
  Roue dentée classique : huit dents trapézoïdales autour d'un anneau, trou
  central rond. Dessin original, construit par calcul (pas de tracé copié) —
  la roue dentée est un symbole universel des réglages, pas une forme propre
  à qui que ce soit.

  Dans la démo web, la roue tourne (voir reglagesGlyph()) ; dans le vrai
  système, cette icône reste statique (thème d'icônes GTK/Xfce).

  #E8590C est un JETON, remplacé par l'accent courant par lexos-theme-gen.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-label="Réglages — LexOS">
  <!-- Cadre -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="#E8590C"/>
  <rect x="40" y="40" width="432" height="200" rx="96" fill="#FFFFFF" opacity="0.12"/>

  <!-- Roue dentée : anneau plein + 8 dents, trou central creusé -->
  <g fill="#FFFFFF">
    <circle cx="256" cy="256" r="118"/>
    <g>
      <rect x="234" y="72"  width="44" height="72" rx="12"/>
      <rect x="234" y="368" width="44" height="72" rx="12"/>
      <rect x="72"  y="234" width="72" height="44" rx="12"/>
      <rect x="368" y="234" width="72" height="44" rx="12"/>
      <rect x="234" y="72"  width="44" height="72" rx="12" transform="rotate(45 256 256)"/>
      <rect x="234" y="368" width="44" height="72" rx="12" transform="rotate(45 256 256)"/>
      <rect x="72"  y="234" width="72" height="44" rx="12" transform="rotate(45 256 256)"/>
      <rect x="368" y="234" width="72" height="44" rx="12" transform="rotate(45 256 256)"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="56" fill="#E8590C"/>
</svg>
