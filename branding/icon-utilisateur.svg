<?xml version="1.0" encoding="UTF-8"?>
<!--
  LexOS — icône « Changer d'utilisateur ». Deux silhouettes côte à côte :
  c'est le 👥 de la démo web, redessiné au trait de la famille.

  ═══ POURQUOI ELLES NE SE CHEVAUCHENT PAS ═══
  Premier jet : une silhouette devant l'autre, détachée par un liseré de la
  couleur du fond. Rendu et regardé, les deux épaules se fondaient en une
  seule masse avec une virgule à côté — illisible, et pire encore à 24 px,
  la taille réelle dans la liste. Le liseré supposait en plus un fond noir :
  sur le thème de jour il aurait dessiné une entaille claire en plein
  milieu. Deux silhouettes séparées disent la même chose sans rien supposer.

  ═══ POURQUOI BLANC, ET PAS LA COULEUR D'ACCENT ═══
  Premier jet : le jeton #E8590C, pour que le logo suive l'accent comme le
  reste. Rendu et REGARDÉ dans une maquette de la fenêtre, le défaut saute
  aux yeux — la ligne SÉLECTIONNÉE est peinte en accent (voir la règle
  « treeview.view:selected » de lexos-theme-gen), et un logo de la couleur du
  fond n'est plus un logo. Or yad sélectionne la première ligne d'office :
  on aurait livré une fenêtre dont une icône sur six est invisible, celle
  qu'on regarde.

  Les contrastes, calculés (WCAG) plutôt qu'estimés :
      accent sur le panneau noir  4,9:1   ·  accent sur l'accent   1,0:1
      blanc  sur le panneau noir 18,4:1   ·  blanc  sur l'accent   3,4:1
  Le blanc est la SEULE valeur qui tienne sur les deux surfaces. C'est aussi
  la couleur du libellé de la ligne sélectionnée : le logo et son texte
  disent la même chose.

  Le thème de JOUR renverse le fond : lexos-theme-gen écrit alors une copie
  où ce blanc devient l'encre sombre du mode clair (~/.config/lexos/
  session-icons), que lexos-session préfère. Voir sa section « 4 bis ».
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-label="Changer d'utilisateur — LexOS">

  <!--  Le sens de l'arc a été choisi en rendant les DEUX : « sweep=0 » donne
        un sourire (l'arc creuse vers le bas), « sweep=1 » la coupole qu'on
        veut. Le premier jet portait des sourires sous deux têtes — deux
        bonshommes tristes au lieu de deux personnes. -->
  <circle cx="148" cy="180" r="58" fill="none" stroke="#FFFFFF" stroke-width="40"/>
  <path d="M 60,392 A 90,90 0 0 1 236,392"
        fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>

  <circle cx="364" cy="180" r="58" fill="none" stroke="#FFFFFF" stroke-width="40"/>
  <path d="M 276,392 A 90,90 0 0 1 452,392"
        fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
</svg>
