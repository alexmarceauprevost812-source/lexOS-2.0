<?xml version="1.0" encoding="UTF-8"?>
<!--
  LexOS — Terminal.
  Écran arrondi + chevron d'invite ">" et curseur "_", dessin original
  (le symbole ">_" est une convention universelle des terminaux, pas une
  forme propre à qui que ce soit).

  Dans le vrai système, cette icône reste statique (thème d'icônes GTK/Xfce,
  pas d'animation CSS possible) — le clignotement du chevron n'existe que
  dans la démo web (voir web-demo/index.html, terminalGlyph()).

  #E8590C est un JETON, remplacé par l'accent courant par lexos-theme-gen.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-label="Terminal — LexOS">
  <!-- Cadre -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="#E8590C"/>
  <rect x="40" y="40" width="432" height="200" rx="96" fill="#FFFFFF" opacity="0.12"/>
  <!-- Écran -->
  <rect x="76" y="76" width="360" height="360" rx="68" fill="#1A1A1D"/>
  <!-- Chevron d'invite -->
  <path d="M 152 176 L 244 256 L 152 336" fill="none"
        stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Curseur -->
  <rect x="268" y="312" width="108" height="30" rx="6" fill="#FFFFFF"/>
</svg>
