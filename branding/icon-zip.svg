<?xml version="1.0" encoding="UTF-8"?>
<!--
  LexOS — icône de l'outil d'archives (ZIP).
  Carré arrondi + bande de fermeture éclair + étiquette « ZIP ».

  #E8590C est un JETON, remplacé par l'accent courant par lexos-theme-gen
  avant le rendu des PNG — comme icon-files.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-label="Archives ZIP LexOS">

  <!-- Fond : carré arrondi -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="#E8590C"/>

  <!-- Léger relief -->
  <rect x="40" y="40" width="432" height="432" rx="96"
        fill="#000000" opacity="0.06"/>
  <rect x="40" y="40" width="432" height="216" rx="96"
        fill="#FFFFFF" opacity="0.08"/>

  <!-- Bande de fermeture éclair -->
  <rect x="226" y="40" width="60" height="432" fill="#000000" opacity="0.18"/>

  <!-- Dents de la fermeture -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M238 76 h20 v20 h-20 z"/>
    <path d="M254 116 h20 v20 h-20 z"/>
    <path d="M238 156 h20 v20 h-20 z"/>
    <path d="M254 196 h20 v20 h-20 z"/>
    <path d="M238 236 h20 v20 h-20 z"/>
    <path d="M254 276 h20 v20 h-20 z"/>
    <path d="M238 316 h20 v20 h-20 z"/>
    <path d="M254 356 h20 v20 h-20 z"/>
  </g>

  <!-- Curseur de la fermeture -->
  <g transform="translate(256,404)">
    <rect x="-26" y="-14" width="52" height="40" rx="8"
          fill="#2A1D12" stroke="#000000" stroke-opacity="0.25" stroke-width="3"/>
    <rect x="-9" y="-30" width="18" height="22" rx="6" fill="#2A1D12"/>
  </g>

  <!-- Étiquette ZIP -->
  <text x="256" y="470" text-anchor="middle"
        font-family="'DejaVu Sans',Arial,sans-serif" font-weight="700"
        font-size="34" letter-spacing="2" fill="#000000">ZIP</text>
</svg>
