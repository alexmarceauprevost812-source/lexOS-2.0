<?xml version="1.0" encoding="UTF-8"?>
<!--
  LexOS — icône Bluetooth. Carré arrondi + rune Bluetooth blanche.

  La rune est la bind-rune officielle (Hagall + Bjarkan, les initiales de
  Harald Blåtand), tracée d'un seul trait, comme le logo d'origine :

      (-2,-2) ─→ (2,2) ─→ (0,4) ─→ (0,-4) ─→ (2,-2) ─→ (-2,2)

  Les deux triangles naissent du croisement des diagonales avec le fût
  vertical — ils ne sont pas dessinés séparément. Jointures en pointe
  (miter) pour garder les sommets aigus, extrémités coupées net.

  #E8590C est un JETON, remplacé par l'accent courant par lexos-theme-gen
  avant le rendu des PNG — comme icon-files.svg et icon-zip.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-label="Bluetooth LexOS">

  <!-- Fond : carré arrondi -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="#E8590C"/>
  <rect x="40" y="40" width="432" height="216" rx="96" fill="#FFFFFF" opacity="0.08"/>

  <!-- Rune Bluetooth, tracée d'un seul trait -->
  <path d="M 174,174 L 338,338 L 256,420 L 256,92 L 338,174 L 174,338"
        fill="none" stroke="#FFFFFF" stroke-width="30"
        stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10"/>
</svg>
