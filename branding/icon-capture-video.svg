<?xml version="1.0" encoding="UTF-8"?>
<!--
  LexOS — icône « Enregistrer l'écran en vidéo ».

  MÊME RAISON QUE icon-capture-zone.svg : les trois boutons de capture de
  la barre du haut portaient la même icône d'appareil photo, et Alex les a
  comptés sur sa photo de l'ISO 73.

  LE POINT D'ENREGISTREMENT, PAS UNE CAMÉRA. C'est ce que montre la démo :
  #qcVideo est un disque plein de la couleur d'accent (border-radius:50%,
  background:currentColor), et il devient un carré rouge qui bat pendant
  l'enregistrement. Le disque plein est le signe universel de « ça
  enregistre » — sur un caméscope, sur un magnétophone, dans un studio.

  LE CERCLE FIN AUTOUR. La démo pose son disque dans un bouton de 26x24
  qui lui fait un cadre. Ici l'icône EST le bouton : sans rien autour, un
  disque orange seul ressemble à une pastille de notification. L'anneau
  lui rend la lecture qu'il avait dans la démo, avec le même trait que les
  deux autres icônes de la famille.

  Jeton #E8590C, remplacé par l'accent courant — comme ses deux voisines.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-label="Enregistrer l'écran — LexOS">

  <circle cx="256" cy="256" r="196"
          fill="none" stroke="#E8590C" stroke-width="34"/>
  <circle cx="256" cy="256" r="112" fill="#E8590C"/>
</svg>
