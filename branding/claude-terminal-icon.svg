<?xml version="1.0" encoding="UTF-8"?>
<!--
  LexOS — Claude Terminal.

  ALEX, PHOTO DU DOCK : deux étoiles Claude identiques, côte à côte.
  « Pour l'application Claude Terminal, le mettre pareil à ce logo, bien noir
  avec un tit tin de gris autour, mais le logo Claude Terminal le mettre
  ROUGE. » Puis, pour lever mon erreur de lecture : « logo officiel de Claude
  mais en ROUGE ».

  POURQUOI CE FICHIER EXISTE.
  Les DEUX lanceurs — « Claude » (l'application claude.ai) et « Claude
  Terminal » — portaient « Icon=lexos-claude ». Le dock affichait donc deux
  fois exactement le même dessin, côte à côte, et rien ne disait lequel
  ouvrait quoi. Une icône qui ne distingue pas n'est pas une icône.

  CE QUE C'EST : le tracé OFFICIEL d'Anthropic, celui de claude-icon.svg,
  inchangé — marque déposée d'Anthropic, employée ici comme icône d'un
  lanceur qui ouvre Claude Code, le même usage qu'une icône de favori.

  CE QUI CHANGE, ET RIEN D'AUTRE :
    · le tracé est ROUGE au lieu du terracotta d'Anthropic ;
    · le fond est le NOIR de LexOS et non le crème de l'application Claude ;
    · un liseré clair très discret — « un tit tin de gris autour ».

  Trois icônes, trois lectures :
    Terminal ......... le cadre à l'accent, un écran et « >_ »
    Claude Terminal .. l'étoile ROUGE sur noir
    Claude ........... l'étoile terracotta sur crème

  LE ROUGE N'EST PAS INVENTÉ POUR L'OCCASION : c'est DANGER dans
  lexos-theme-gen, déjà celui de la pastille de fermeture et des icônes de
  session « arrêter » et « redémarrer ».

  ET IL EST ÉCRIT EN DUR, EXPRÈS. L'orange d'icon-terminal.svg est un JETON
  que lexos-theme-gen remplace par l'accent courant, et c'est voulu — le
  Terminal suit le thème. Ici NON : si le rouge suivait l'accent, choisir
  « lexos accent rouge » rendrait Claude et Claude Terminal identiques et on
  serait revenu au problème de départ. Le rouge est ce qui DISTINGUE ; il ne
  peut pas être la couleur qui change.

  Le liseré est écrit comme une transparence et non comme un gris opaque :
  c'est le même procédé que les bordures du panneau et des notifications
  (rgba(255,255,255,0.12) dans le squelette GTK), donc une seule manière de
  dire « bordure discrète » dans tout LexOS.

  Le tracé officiel tient dans un carré de 248 ; on le ramène à 176 et on le
  centre dans 256 — facteur 176/248 = 0.709677, décalage (256-176)/2 = 40.
  Exactement la construction de claude-icon.svg, pour que les deux icônes
  aient le même poids visuel dans le dock.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-label="Claude Terminal — LexOS">
  <rect width="256" height="256" rx="56" fill="#0B0B0C"/>
  <!-- Le liseré est posé À L'INTÉRIEUR du carré : un contour centré sur le
       bord serait rogné de moitié au rendu, et l'icône paraîtrait sans
       bordure aux petites tailles — celles, justement, où le dock l'affiche. -->
  <rect x="3" y="3" width="250" height="250" rx="53"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"/>
  <g transform="translate(40,40) scale(0.709677)">
