<?xml version="1.0" encoding="UTF-8"?>
<!--
  LexOS — Mises à jour.
  Flèche circulaire aux trois quarts (symbole universel du rafraîchissement/
  mise à jour) sur pastille pleine, même famille que icon-share.svg. Dessin
  original, construit par calcul (points à distance égale du centre).

  Dans la démo web, la flèche tourne pendant la recherche de mises à jour
  (voir majGlyph() / majSpin) ; dans le vrai système, cette icône reste
  statique (thème d'icônes GTK/Xfce).

  #E8590C est un JETON, remplacé par l'accent courant par lexos-theme-gen.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" role="img" aria-label="Mises à jour — LexOS">
  <circle cx="256" cy="256" r="212" fill="#E8590C"/>
  <path d="M 256 44 A 212 212 0 0 1 468 256 A 212 212 0 0 0 256 44 Z"
        fill="#FFFFFF" opacity="0.10"/>

  <!-- Arc aux trois quarts : du haut, vers la droite/bas, jusqu'à gauche -->
  <path d="M 256 106 A 150 150 0 1 1 106 256" fill="none"
        stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <!-- Pointe de flèche, au bout de l'arc (côté gauche) -->
  <path d="M 78 246 L 134 246 L 106 300 Z" fill="#FFFFFF"/>
</svg>
