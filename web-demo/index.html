*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* --- Fond d'écran ------------------------------------------------------- */
#desktop{position:fixed;inset:0;
  background:
    radial-gradient(60% 45% at 50% 55%, rgba(232,135,58,.14), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 63px, rgba(232,135,58,.05) 63px 64px),
    repeating-linear-gradient(90deg, transparent 0 63px, rgba(232,135,58,.05) 63px 64px),
    #000}
#wall{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;text-align:center}
#wall .mark{font:700 clamp(48px,9vw,110px)/1 "Fira Code",ui-monospace,monospace;
  letter-spacing:-.04em}
#wall .mark b{color:var(--ac);font-weight:700}
#wall .rule{width:min(420px,60vw);height:2px;margin:18px 0 14px;
  background:linear-gradient(90deg,transparent,var(--ac),transparent)}
#wall .brand{font:400 clamp(11px,1.6vw,16px)/1 ui-monospace,monospace;
  letter-spacing:.7em;color:var(--fg-dim)}
#wall .ver{margin-top:10px;font:400 12px/1 ui-monospace,monospace;
  letter-spacing:.35em;color:#6e6e74}

/* --- Barre du haut ------------------------------------------------------ */
#panel{position:fixed;top:0;left:0;right:0;height:32px;z-index:900;
  display:flex;align-items:center;background:#000;
  border-bottom:1px solid var(--bd);padding:0 10px;font-size:13px}
#panel .apps{display:flex;align-items:center;gap:7px;padding:1px 10px;border-radius:6px}
#panel .apps:hover{background:var(--bg-hi)}
#panel .apps .glyph{width:29px;height:29px;border-radius:4px;
  background-image:var(--logo-icon);background-size:contain;background-repeat:no-repeat;
  background-position:center}
#clock{position:absolute;left:50%;transform:translateX(-50%);color:var(--fg-dim)}
/*  Chaque caractère de l'heure occupe une cellule de largeur FIXE : les
    idéogrammes du brouillage sont bien plus larges qu'un chiffre, sans ça
    toute la barre sursauterait à chaque minute. La date, elle, reste du
    texte normal — des cellules fixes abîmeraient son espacement. */
#clktime .ck{display:inline-block;width:.62em;text-align:center;
  font-variant-numeric:tabular-nums}
#clktime .ck.mtx{color:#39FF14;text-shadow:0 0 9px rgba(57,255,20,.55);
  font-size:.8em;vertical-align:baseline}
@media (prefers-reduced-motion:reduce){ #clktime .ck.mtx{color:inherit;text-shadow:none} }
#tray{margin-left:auto;display:flex;gap:4px;color:var(--fg-dim)}
#tray button{padding:3px 8px;border-radius:6px}
#tray button:hover{background:var(--bg-hi);color:var(--fg)}

/* --- Dock --------------------------------------------------------------- */
#dock{position:fixed;z-index:900;display:flex;gap:8px;padding:8px;
  background:rgba(10,10,11,.72);border:1px solid var(--bd);border-radius:16px;
  backdrop-filter:blur(8px);
  transition:transform .34s cubic-bezier(.4,0,.2,1),opacity .22s ease}
/*  Masqué : la barre sort par le bord le plus proche. Le décalage compose
    avec le transform de centrage, il ne le remplace pas — sinon la barre
    partirait aussi de travers en glissant. */
#dock.hidden{opacity:0;pointer-events:none}
#dock.right.hidden {transform:translateY(-50%) translateX(calc(100% + 20px))}
#dock.left.hidden  {transform:translateY(-50%) translateX(calc(-100% - 20px))}
#dock.bottom.hidden{transform:translateX(-50%) translateY(calc(100% + 20px))}
#dock.top.hidden   {transform:translateX(-50%) translateY(calc(-100% - 50px))}
/*  La poignée reste TOUJOURS visible, collée au bord : sans elle, une barre
    masquée serait impossible à rappeler. */
#dockTab{position:fixed;z-index:901;background:rgba(10,10,11,.82);
  border:1px solid var(--bd);color:var(--fg-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  backdrop-filter:blur(8px);transition:color .15s,background .15s}
#dockTab:hover{color:var(--fg);background:var(--bg-hi)}
#dockTab.right {right:0;top:50%;transform:translateY(-50%);width:17px;height:58px;border-radius:9px 0 0 9px;border-right:0}
#dockTab.left  {left:0; top:50%;transform:translateY(-50%);width:17px;height:58px;border-radius:0 9px 9px 0;border-left:0}
#dockTab.bottom{bottom:0;left:50%;transform:translateX(-50%);width:58px;height:17px;border-radius:9px 9px 0 0;border-bottom:0}
#dockTab.top   {top:32px;left:50%;transform:translateX(-50%);width:58px;height:17px;border-radius:0 0 9px 9px;border-top:0}
body.light #dock{background:rgba(239,235,227,.85)}
body.light #dockTab{background:rgba(239,235,227,.9)}
@media (prefers-reduced-motion:reduce){ #dock{transition:none} }
#dock.right{right:10px;top:50%;transform:translateY(-50%);flex-direction:column}
#dock.left {left:10px; top:50%;transform:translateY(-50%);flex-direction:column}
#dock.bottom{bottom:10px;left:50%;transform:translateX(-50%);flex-direction:row}
#dock.top{top:42px;left:50%;transform:translateX(-50%);flex-direction:row}
.dicon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:22px;background:var(--bg-hi);
  border:1px solid var(--bd);transition:transform .13s ease,border-color .13s ease;
  position:relative}
.dicon:hover{transform:scale(1.22);border-color:var(--ac);z-index:2}
.dicon:active{transform:scale(1.05)}
.dicon .applogo{width:42px;height:42px;background-image:var(--logo-icon);
  background-size:contain;background-repeat:no-repeat;background-position:center}
.dicon .tip{position:absolute;white-space:nowrap;font-size:12px;color:var(--fg);
  background:var(--bg-alt);border:1px solid var(--ac);border-radius:8px;
  padding:4px 10px;opacity:0;pointer-events:none;transition:opacity .12s}
#dock.right .tip{right:120%;top:50%;transform:translateY(-50%)}
#dock.left  .tip{left:120%;top:50%;transform:translateY(-50%)}
#dock.bottom .tip{bottom:120%;left:50%;transform:translateX(-50%)}
#dock.top    .tip{top:120%;left:50%;transform:translateX(-50%)}
.dicon:hover .tip{opacity:1}

/* --- Fenêtres ----------------------------------------------------------- */
.win{position:fixed;min-width:300px;background:var(--bg);
  border:1px solid var(--bd);border-radius:10px;overflow:hidden;z-index:100;
  box-shadow:0 18px 60px rgba(0,0,0,.85);display:flex;flex-direction:column}
.win.active{border-color:#3a3a40}
/* Fenêtre agrandie : coins droits et ombre plus discrète, comme un vrai
   gestionnaire de fenêtres qui colle la fenêtre aux bords de l'écran. */
.win.max{border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.win.max .tbar{cursor:default}
.tbar{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--bg-alt);border-bottom:1px solid var(--bd);cursor:grab;
  font-weight:600;font-size:13px}
.tbar .ticon{font-size:15px}
.tbar .ttitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:12px;color:var(--fg-dim)}
.tbtn:hover{background:var(--bg-hi);color:var(--fg)}
.tbtn.close:hover{background:#E5484D;color:#fff}
.wbody{flex:1;overflow:auto;-webkit-user-select:text;user-select:text}

/* Effet TV 1980 : la fenêtre s'écrase en une ligne puis s'éteint */
@keyframes crtOn{
  0%{transform:scale(1,.004);opacity:0;filter:brightness(4)}
  45%{transform:scale(1,.004);opacity:1;filter:brightness(4)}
  100%{transform:scale(1,1);opacity:1;filter:brightness(1)}}
@keyframes crtOff{
  0%{transform:scale(1,1);opacity:1;filter:brightness(1)}
  55%{transform:scale(1,.004);opacity:1;filter:brightness(4)}
  100%{transform:scale(.35,.004);opacity:0;filter:brightness(6)}}
body.crt .win.opening{animation:crtOn var(--crt-open) ease-out}
body.crt .win.closing{animation:crtOff var(--crt-close) ease-in forwards}
body:not(.crt) .win.opening{animation:fadeIn .15s ease-out}
body:not(.crt) .win.closing{animation:fadeOut .15s ease-in forwards}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0;transform:scale(.97)}}

/* --- Boutons LexOS Noir -------------------------------------------------- */
.btn{background:var(--ac);border:1px solid var(--ac-lo);color:var(--btn-fg);
  border-radius:6px;padding:7px 14px;font-weight:600;font-size:13px;
  transition:background .14s,color .14s}
.btn:hover{background:var(--ac-hi)}
/* --- Glyphes officiels Wi-Fi et Bluetooth -------------------------------
   Mêmes tracés que branding/icon-wifi.svg et branding/icon-bluetooth.svg.
   Posés en masque : le glyphe prend la couleur du texte courant, donc il
   reste lisible en thème sombre comme en thème de jour, et sur un bouton
   peint à l'accent. */
/* --- Dossiers ------------------------------------------------------------
   Le dossier est en deux pièces : le dos et le rabat avant. Faire pivoter le
   rabat au survol, c'est le dossier qui s'ouvre. */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));
  gap:6px;padding:10px 12px}
.fold{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:8px 4px 10px;border-radius:10px;cursor:pointer;
  -webkit-user-select:none;user-select:none;transition:background .12s}
.fold:hover,.fold:focus-visible{background:var(--bg-hi);outline:none}
.fold svg{width:62px;height:62px;display:block;overflow:visible}
.fold .ff-g{transform-box:view-box;transform-origin:256px 438px;
  transition:transform .3s cubic-bezier(.34,1.25,.5,1)}
.fold:hover .ff-g,.fold:focus-visible .ff-g{transform:rotate(-15deg)}
/*  Petit rebond au clic — court, pour ne pas retarder l'ouverture. */
.fold.bounce svg{animation:foldBounce .4s ease}
@keyframes foldBounce{
  0%{transform:scale(1)} 28%{transform:scale(.86)}
  58%{transform:scale(1.08)} 100%{transform:scale(1)} }
@media (prefers-reduced-motion:reduce){
  .fold .ff-g{transition:none} .fold.bounce svg{animation:none} }
/*  Le nom complet sous l'image, sur autant de lignes qu'il faut. */
.fold .fname{font-size:11.5px;line-height:1.25;text-align:center;
  color:var(--fg);overflow-wrap:anywhere}
/* --- Globe de la Musique : les méridiens tournent ------------------------
   « rx » est animable en CSS sur une ellipse : chaque méridien s'aplatit
   puis se rouvre, décalé de ses voisins. Le globe paraît tourner sans
   qu'aucune 3D ne soit en jeu. */
.globe{display:block}
@keyframes meridien{ 0%,100%{rx:150px} 50%{rx:0px} }
.globe-mer ellipse{animation:meridien 5s linear infinite}
.globe-mer ellipse:nth-child(2){animation-delay:-1s}
.globe-mer ellipse:nth-child(3){animation-delay:-2s}
.globe-mer ellipse:nth-child(4){animation-delay:-3s}
.globe-mer ellipse:nth-child(5){animation-delay:-4s}
@media (prefers-reduced-motion:reduce){ .globe-mer ellipse{animation:none} }
.gly{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.17em;
  background-color:currentColor;flex:none;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain}
.gly-bt{-webkit-mask-image:var(--m-bt);mask-image:var(--m-bt)}
.gly-wifi{-webkit-mask-image:var(--m-wifi);mask-image:var(--m-wifi)}
.gly-avion{-webkit-mask-image:var(--m-avion);mask-image:var(--m-avion)}
/*  L'aiguille balaie jusqu'à sa nouvelle valeur — léger dépassement, comme
    une vraie aiguille lancée. Respecte « animations réduites » du système. */
.gauge{display:block}
.gauge .needle{transform-box:view-box;transform-origin:256px 256px;
  transition:transform .9s cubic-bezier(.34,1.28,.44,1)}
@media (prefers-reduced-motion:reduce){ .gauge .needle{transition:none} }
.gly-share{-webkit-mask-image:var(--m-share);mask-image:var(--m-share)}
/*  La boîte d'archive est une IMAGE, pas un masque : elle est en couleurs
    (carton gris, démon en flammes), donc pas de teinte à appliquer. */
.gly-zip{background:var(--i-zip) center/contain no-repeat;width:1.15em;height:1.15em}
.gly-usb{background:var(--i-usb) center/contain no-repeat;width:1.15em;height:1.15em}
/*  Rebond réutilisable : mêmes temps que celui des dossiers, pour que tout
    l'habillage réagisse de la même façon au clic. */
.bump{animation:foldBounce .4s ease}
@media (prefers-reduced-motion:reduce){ .bump{animation:none} }
/*  Le Wi-Fi dit son état par sa couleur : vert connecté, orange connecté mais
    sans accès à internet, rouge pas de connexion. Ces couleurs portent le
    sens — elles ne suivent donc pas l'accent choisi par l'utilisateur. */
.gly-ok{background-color:var(--ok)}
.gly-warn{background-color:var(--warn)}
.gly-off{background-color:var(--off)}
.btn.ghost{background:transparent;border-color:var(--bd);color:var(--fg)}
.btn.ghost:hover{background:var(--bg-hi)}
/*  Le rouge de « danger » est fixe : son texte doit l'être aussi. Sans ça, il
    héritait de --btn-fg, calculé d'après l'ACCENT — avec un accent clair
    (néon), on obtenait du noir sur rouge, illisible. */
.btn.danger{background:#E5484D;border-color:#A32B2F;color:#fff}
.btn.danger:hover{background:#F05257}

/* --- Terminal ------------------------------------------------------------ */
.term{background:#000;color:var(--term-fg);
  font:13px/1.5 "Fira Code",ui-monospace,Menlo,Consolas,monospace;
  padding:10px 12px;height:100%;overflow-y:auto;white-space:pre-wrap;
  overflow-wrap:anywhere;cursor:text}
.term .p{color:var(--term-hi)}
.term .path{color:var(--ac)}
.term .w{color:#fff}.term .d{color:#7a7a80}.term .a{color:var(--ac)}
.term .err{color:#FF6B6F}
.term .in{display:inline}
.caret{display:inline-block;width:8px;height:15px;vertical-align:-2px;
  background:var(--ac);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* --- Contenus divers ----------------------------------------------------- */
.pad{padding:18px}
.pad h2{font-size:17px;margin-bottom:10px}
.pad p{color:var(--fg-dim);margin-bottom:10px}
.pad code,.kbd{font-family:ui-monospace,monospace;background:var(--bg-hi);
  border:1px solid var(--bd);border-radius:5px;padding:1px 6px;font-size:12px;
  color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.swatch{width:34px;height:34px;border-radius:8px;border:2px solid transparent}
.swatch.sel{border-color:var(--fg)}
.files li{list-style:none;display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-bottom:1px solid var(--bg-hi);color:var(--fg)}
.files li:hover{background:var(--bg-hi)}
.files .sz{margin-left:auto;color:var(--fg-dim);font-size:12px}
.warnbox{border:1px solid #A32B2F;background:#1a0d0e;border-radius:8px;
  padding:12px;color:#ffb4b6;font-size:13px;margin:10px 0}
.notice{border:1px solid var(--ac-lo);background:#170f08;border-radius:8px;
  padding:12px;color:var(--ac-hi);font-size:13px;margin:10px 0}
.menu{position:fixed;top:34px;left:8px;z-index:950;background:var(--bg-alt);
  border:1px solid var(--bd);border-radius:10px;padding:6px;min-width:230px;
  box-shadow:0 14px 40px rgba(0,0,0,.8)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;
  border-radius:7px;text-align:left;font-size:13px}
.menu button:hover{background:var(--ac);color:var(--btn-fg)}
.menu .kbd{margin-left:auto;color:var(--fg-dim);font-size:11px}
.menu button:hover .kbd{color:var(--btn-fg)}
.msep{height:1px;background:var(--bd);margin:5px 3px}

/* --- Barre d'outils du gestionnaire de fichiers -------------------------- */
.ftoolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--bg-hi);font-size:12.5px;color:var(--fg-dim)}
.ftoolbar .fpath{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ficonbtn{width:26px;height:26px;flex:none;border-radius:7px;font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;color:var(--fg-dim)}
.ficonbtn:hover{background:var(--bg-hi);color:var(--fg)}
.files li.sel{background:var(--ac);color:var(--btn-fg)}
.dl-mascot{flex:none;width:0;overflow:hidden;display:flex;align-items:center;
  justify-content:center;transition:width .25s ease}
.dl-mascot.show{width:34px}
.dl-mascot img{width:34px;height:34px;border-radius:9px;border:1px solid var(--ac);
  opacity:0;transform:scale(.7);transition:opacity .2s ease,transform .2s ease}
.dl-mascot.show img{opacity:1;transform:scale(1)}

/* --- Vue Applications : grille plein écran, façon « Activités » ---------- */
#appsview{position:fixed;inset:0;z-index:1200;display:none;flex-direction:column;
  align-items:center;padding:44px 24px 24px;
  background:rgba(0,0,0,.82);backdrop-filter:blur(22px)}
#appsview.on{display:flex;animation:avIn .18s ease-out}
@keyframes avIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
#appsview .search{width:min(420px,90vw);padding:9px 16px;border-radius:999px;
  background:var(--bg-hi);border:1px solid var(--bd);color:var(--fg);
  font:14px/1.2 inherit;outline:none;text-align:center;margin-bottom:30px}
#appsview .search:focus{border-color:var(--ac)}
#appsview .search::placeholder{color:var(--fg-dim)}
#appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:14px 8px;width:min(880px,94vw);max-height:calc(100vh - 170px);overflow-y:auto;
  align-content:start}
#appgrid .app{display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:12px 6px;border-radius:14px;color:var(--fg);text-align:center}
#appgrid .app:hover{background:rgba(255,255,255,.09)}
#appgrid .app .ai{width:52px;height:52px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;font-size:26px;
  background:var(--bg-hi);border:1px solid var(--bd)}
#appgrid .app:hover .ai{border-color:var(--ac)}
#appgrid .app .an{font-size:12px;line-height:1.25;max-width:96px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#appsview .hint{margin-top:18px;font-size:11.5px;color:var(--fg-dim)}
#appsview .empty{color:var(--fg-dim);font-size:13px;padding:30px}

/* --- Paramètres rapides : panneau qui se déplie depuis la barre du haut --- */
.qs-panel{position:fixed;top:38px;right:8px;z-index:960;width:322px;
  background:var(--bg-alt);border:1px solid var(--bd);border-radius:14px;
  padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.qs-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.qs-head .t{font-size:11px;color:var(--fg-dim);letter-spacing:.08em;text-transform:uppercase}
.qs-headbtn{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;color:var(--fg-dim);font-size:14px}
.qs-headbtn:hover{background:var(--bg-hi);color:var(--fg)}
.qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qs-grid.compact{grid-template-columns:repeat(4,1fr)}
.qs-tile{background:var(--bg-hi);border:1px solid var(--bd);border-radius:12px;
  padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;
  position:relative;min-height:52px;justify-content:center;
  cursor:pointer;color:inherit;font:inherit}
.qs-tile .ic{font-size:16px}
.qs-tile .ti{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs-tile .su{font-size:10.5px;color:var(--fg-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs-tile.on{background:var(--ac);border-color:var(--ac-lo)}
.qs-tile.on .su{color:var(--btn-fg-dim)}
.qs-tile.on .ti{color:var(--btn-fg)}
.qs-tile.qs-disabled{opacity:.4;cursor:not-allowed}
.qs-tile.compact{align-items:center;justify-content:center;padding:12px 4px;min-height:44px}
.qs-tile.compact .ti,.qs-tile.compact .su{display:none}
.qs-tile.compact .ic{font-size:20px}
.qs-chev{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;font-size:9px;color:inherit;opacity:.7}
.qs-chev:hover{background:rgba(255,255,255,.2)}
.qs-sub{grid-column:1/-1;background:var(--bg);border:1px solid var(--bd);border-radius:10px;
  padding:4px 10px;font-size:12px;margin-top:-2px}
.qs-sub .row2{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:6px 2px;border-bottom:1px solid var(--bg-hi)}
.qs-sub .row2:last-child{border-bottom:0}
.qs-sub .row2 .m{color:var(--fg-dim);font-size:11px;flex:none}

/* --- Bulle d'information éphémère ----------------------------------------- */
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg-alt);border:1px solid var(--ac);border-radius:10px;padding:9px 16px;
  font-size:12.5px;color:var(--fg);opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:1500;box-shadow:0 10px 30px rgba(0,0,0,.6);
  max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* --- Panneau de Paramètres façon Ubuntu : volet + contenu --------------- */
.set-shell{display:flex;height:100%;min-height:420px}
.set-nav{width:210px;flex:none;overflow-y:auto;background:var(--bg-alt);
  border-right:1px solid var(--bd);padding:8px}
.set-nav .grp{color:var(--fg-dim);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;padding:10px 10px 4px}
.set-nav button{display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 10px;border-radius:7px;font-size:13px;text-align:left;color:var(--fg)}
.set-nav button:hover{background:var(--bg-hi)}
.set-nav button.on{background:var(--ac);color:var(--btn-fg)}
.set-main{flex:1;overflow-y:auto;padding:20px 22px}
.set-main h2{font-size:16px;margin-bottom:4px}
.set-main .sub{color:var(--fg-dim);font-size:12.5px;margin-bottom:16px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:11px 2px;border-bottom:1px solid var(--bg-hi)}
.srow:last-child{border-bottom:0}
.srow .t{font-size:13.5px}
.srow .d{color:var(--fg-dim);font-size:12px;margin-top:2px}
.sw{position:relative;width:40px;height:22px;border-radius:999px;flex:none;
  background:var(--bg-hi);border:1px solid var(--bd);cursor:pointer;transition:background .15s}
.sw i{position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;
  background:var(--fg-dim);transition:transform .15s,background .15s}
.sw.on{background:var(--ac);border-color:var(--ac-lo)}
.sw.on i{transform:translateX(18px);background:#fff}
.set-soon{color:var(--fg-dim);font-size:12.5px;font-style:italic}

/* --- Thème de jour : crème, jamais blanc pur — écriture noire ----------- */
/* Le terminal (.term, #boot, #desktop) reste toujours noir, comme le vrai LexOS. */
body.light{--bg:#F7F5F0;--bg-alt:#EFEBE3;--bg-hi:#E5DFD3;--bd:#D9D2C3;--fg:#1B1A17;--fg-dim:#6B675E}
body.light #panel{background:var(--bg-alt);border-color:var(--bd)}
body.light #dock{background:rgba(239,235,227,.85)}
body.light .menu{background:var(--bg-alt)}
/*  Cette règle ne doit PAS toucher les boutons « ghost » (non sélectionnés).
    Sans le :not(), elle l'emportait sur .btn.ghost — plus spécifique — et
    leur imposait --btn-fg, calculé d'après l'accent : en thème de jour, du
    texte blanc sur fond clair, illisible (« Sombre », « Gauche », « petit »…). */
body.light .btn:not(.ghost){color:var(--btn-fg)}
/*  Encadrés : le fond sombre en dur restait noir en thème de jour. */
body.light .notice{background:#FDF1E5;color:#7A3B08;border-color:var(--ac-lo)}
body.light .warnbox{background:#FDECEC;color:#8A2226;border-color:#D98B8E}

/* --- Démarrage / extinction --------------------------------------------- */
#boot{position:fixed;inset:0;z-index:2000;background:#000;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:22px}
#boot .mascot{width:96px;height:96px;image-rendering:-webkit-optimize-contrast;
  filter:drop-shadow(0 0 18px rgba(232,89,12,.35))}
#boot .mark{font:700 54px/1 ui-monospace,monospace;letter-spacing:-.03em}
#boot .mark b{color:var(--ac)}
#boot .bar{width:220px;height:4px;background:#1a1a1c;border-radius:4px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:var(--ac);
  animation:load 2.1s ease-out forwards}
@keyframes load{to{width:100%}}
#boot .sub{color:#6e6e74;font:12px/1 ui-monospace,monospace;letter-spacing:.3em}
@keyframes crtPowerOn{
  0%{transform:scale(1,.002);filter:brightness(6)}
  40%{transform:scale(1,.002);filter:brightness(6)}
  100%{transform:scale(1,1);filter:brightness(1)}}
#screen{position:fixed;inset:0}
#screen.on{animation:crtPowerOn .8s ease-out}
body.off #screen{animation:crtOff .5s ease-in forwards}

/* --- Verrouillage / mise en veille / extinction -------------------------- */
#powerOverlay{position:fixed;inset:0;z-index:2100;background:#000;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;
  cursor:pointer;color:#fff;text-align:center}
#powerOverlay.on{display:flex;animation:fadeIn .25s ease-out}
#powerOverlay .picto{font-size:52px;opacity:.9}
#powerOverlay .msg{font-size:15px;color:#c8c8cc}
#powerOverlay .msg b{color:#fff}
#powerOverlay .hint{font-size:12px;color:#6e6e74;letter-spacing:.05em}
#powerOverlay.suspend{transition:opacity .4s ease}

/* --- Écran de connexion (verrouillage) : sélecteur d'utilisateur --------- */
#powerOverlay.login{cursor:default}
.login-title{font-size:16px;color:#e6e6ea;letter-spacing:.02em}
.login-tiles{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.login-tile{width:148px;padding:16px 10px;border-radius:14px;cursor:pointer;
  transition:background .15s ease;outline:none}
.login-tile:hover,.login-tile:focus-visible{background:rgba(255,255,255,.07)}
.login-tile.sel{background:rgba(255,255,255,.1)}
.login-avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:var(--bg-hi);border:2px solid var(--bd)}
.login-avatar.lex{border-color:var(--ac);background:#000}
.login-avatar.lex img{width:100%;height:100%;object-fit:cover}
.login-avatar.guest{font-size:32px;color:#9a9aa0}
.login-name{font-size:15px;font-weight:600;color:#fff}
.login-sub{font-size:12px;color:#8a8a90;margin-top:2px}
.login-pass{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:default}
.login-pass-input{width:220px;padding:9px 14px;border-radius:999px;cursor:text;
  background:var(--bg-hi);border:1px solid var(--bd);color:#fff;
  font:14px/1.2 inherit;outline:none;text-align:center}
.login-pass-input:focus{border-color:var(--ac)}
.login-err{font-size:12px;color:#FF6B6F;min-height:14px}
@keyframes loginShake{
  10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)}}
.login-pass-input.shake{animation:loginShake .4s}

/* --- Menu de démarrage/veille/extinction --------------------------------- */

<script>
"use strict";
/* ======================= État global ======================= */
const ACCENTS = {
  orange:["#E8590C","#FF7A33","#A84007"], bleu:["#1A5FB4","#3584E4","#10375F"],
  rouge:["#E5484D","#FF6B6F","#A32B2F"],  vert:["#1F8F4E","#2DBF6B","#125C32"],
  gris:["#8A8A8A","#B4B4B4","#5A5A5A"],   violet:["#8B5CF6","#A78BFA","#6234D1"],
  neon:["#39FF14","#7BFF5C","#1FA30A"],
};
const LANGS = { fr_CA:"Français (Québec)", fr_FR:"Français (France)",
  en_US:"English (US)", en_CA:"English (Canada)", es_ES:"Español", de_DE:"Deutsch" };
const state = { accent:"orange", perf:"medium", crt:true, dock:"right",
                avion:false, mode:"sombre", wifiAuto:false, lang:"fr_CA",
                filesFav:false, wifi:true, bt:true, wifiIssue:false,
                lum:80, eco:false, dimBat:true, ecranOff:"10", veille:"30",
                qsCompact:false, dockHidden:false, zTop:100 };

/* --- Glyphes qui disent leur état par la couleur ------------------------- */
//  Wi-Fi   : vert connecté · orange connecté sans accès internet · rouge coupé
//  Avion   : vert activé · orange désactivé
function wifiGlyph(){
  let s = "gly-off";                                   // rouge par défaut
  if(!state.avion && state.wifi) s = state.wifiIssue ? "gly-warn" : "gly-ok";
  const t = s==="gly-ok" ? "Wi-Fi connecté"
          : s==="gly-warn" ? "Wi-Fi connecté, sans accès à internet"
          : (state.avion ? "Mode avion — Wi-Fi coupé" : "Wi-Fi non connecté");
  return `<i class="gly gly-wifi ${s}" title="${t}"></i>`;
}
function avionGlyph(){
  const s = state.avion ? "gly-ok" : "gly-warn";
  return `<i class="gly gly-avion ${s}" title="Mode avion ${state.avion?"activé":"désactivé"}"></i>`;
}

/*  Même calcul que lexos-theme-gen sur la vraie ISO : on ne devine pas avec un
    seuil, on calcule le VRAI contraste WCAG du noir et du blanc sur l'accent
    et on garde le meilleur. L'ancien seuil (299r+587g+114b > 150) mettait du
    blanc sur le bleu et sur l'orange, où le noir contraste bien mieux —
    mesuré : 3,3 au lieu de 5,4, sous le seuil lisible de 4,5. */
function relLum(hex){
  const n=parseInt(hex.slice(1),16);
  const ch=[(n>>16)&255,(n>>8)&255,n&255].map(v=>{
    v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*ch[0] + 0.7152*ch[1] + 0.0722*ch[2];
}
/*  Renvoie true si le NOIR est le plus lisible sur cette couleur. */
function preferBlackOn(hex){
  const L = relLum(hex);
  return (L + 0.05) / 0.05 >= 1.05 / (L + 0.05);
}
function setAccent(name){
  const c = ACCENTS[name]; if(!c) return false;
  state.accent = name;
  const r = document.documentElement.style;
  r.setProperty("--ac",c[0]); r.setProperty("--ac-hi",c[1]); r.setProperty("--ac-lo",c[2]);
  const dark = preferBlackOn(c[0]);
  r.setProperty("--btn-fg", dark ? "#000" : "#fff");
  r.setProperty("--btn-fg-dim", dark ? "rgba(0,0,0,.65)" : "rgba(255,255,255,.82)");
  document.querySelectorAll(".swatch").forEach(s=>
    s.classList.toggle("sel", s.dataset.a===name));
  return true;
}
function setDock(pos){
  const map={droite:"right",gauche:"left",bas:"bottom",haut:"top",
             right:"right",left:"left",bottom:"bottom",top:"top"};
  const p = map[pos]; if(!p) return false;
  state.dock = p; applyDock(); return true;
}
/*  Flèche de la poignée : elle montre où va la barre si on clique — vers le
    bord quand elle est visible, vers l'intérieur quand elle est masquée. */
const DOCK_FLECHE = {right:["›","‹"], left:["‹","›"], bottom:["⌄","⌃"], top:["⌃","⌄"]};
function applyDock(){
  const d = document.getElementById("dock");
  const t = document.getElementById("dockTab");
  if(!d || !t) return;
  d.className = state.dock + (state.dockHidden ? " hidden" : "");
  t.className = state.dock;
  t.textContent = DOCK_FLECHE[state.dock][state.dockHidden ? 1 : 0];
  t.title = state.dockHidden ? "Afficher la barre d'outils" : "Masquer la barre d'outils";
  //  Une fenêtre agrandie doit reprendre la place libérée, ou la rendre.
  document.querySelectorAll(".win.max").forEach(applyMax);
}
function toggleDock(){
  state.dockHidden = !state.dockHidden;
  applyDock();
  toast(state.dockHidden ? "Barre masquée — la poignée du bord la ramène"
                         : "Barre d'outils affichée");
}
function setCrt(on){ state.crt = on; document.body.classList.toggle("crt",on); }
function setMode(mode){
  state.mode = mode; document.body.classList.toggle("light", mode==="clair");
}
function setLang(code){ if(!LANGS[code]) return; state.lang=code; showSettingsSection("region"); }

/* ======================= Fenêtres ======================= */
const winsRoot = document.getElementById("screen");
function openWin(id, title, icon, html, w, h, x, y){
  const old = document.getElementById("win-"+id);
  if(old){ focusWin(old); return old; }
  const el = document.createElement("div");
  el.className = "win opening"; el.id = "win-"+id;
  el.style.width = (w||520)+"px";
  if(h) el.style.height = h+"px";
  const vw=innerWidth, vh=innerHeight;
  el.style.left = Math.max(8, x ?? (vw/2-(w||520)/2 + (Math.random()*60-30)))+"px";
  el.style.top  = Math.max(40, y ?? (vh/2-(h||360)/2 + (Math.random()*40-20)))+"px";
  el.innerHTML =
    `<div class="tbar"><span class="ticon">${icon}</span>`+
    `<span class="ttitle">${title}</span>`+
    `<button class="tbtn wmenu" title="Plus d'options">⋮</button>`+
    `<button class="tbtn maxi" title="Agrandir (double-clic sur la barre)">⛶</button>`+
    `<button class="tbtn close" title="Fermer">✕</button></div>`+
    `<div class="wbody">${html}</div>`;
  winsRoot.appendChild(el);
  el.addEventListener("animationend", e=>{
    if(e.animationName==="crtOn"||e.animationName==="fadeIn") el.classList.remove("opening");
  });
  el.querySelector(".close").onclick = ()=>closeWin(el);
  el.querySelector(".maxi").onclick = e=>{ e.stopPropagation(); toggleMax(el); };
  el.querySelector(".wmenu").onclick = e=>{ e.stopPropagation(); toggleWinMenu(el, e.currentTarget); };
  el.querySelector(".tbar").addEventListener("dblclick", e=>{
    if(e.target.closest(".tbtn")) return;
    toggleMax(el);
  });
  el.addEventListener("mousedown", ()=>focusWin(el));
  dragify(el);
  focusWin(el);
  return el;
}
/* --- Agrandir / restaurer, façon gestionnaire de fenêtres ---------------- */
//  La zone « plein écran » s'arrête au panneau du haut et au dock : une
//  fenêtre agrandie ne doit jamais recouvrir les barres du système, quel que
//  soit le côté où le dock est posé.
function maxArea(){
  const m = 8, box = {l:m, t:40, r:m, b:m};
  const d = document.getElementById("dock");
  if(d && !state.dockHidden){          // masquée : la fenêtre prend toute la place
    const rc = d.getBoundingClientRect();
    switch(state.dock){
      case "right":  box.r = innerWidth  - rc.left   + m; break;
      case "left":   box.l = rc.right    + m;             break;
      case "bottom": box.b = innerHeight - rc.top    + m; break;
      case "top":    box.t = rc.bottom   + m;             break;
    }
  }
  return box;
}
function applyMax(el){
  const b = maxArea();
  el.style.left   = b.l + "px";
  el.style.top    = b.t + "px";
  el.style.width  = Math.max(280, innerWidth  - b.l - b.r) + "px";
  el.style.height = Math.max(200, innerHeight - b.t - b.b) + "px";
}
function toggleMax(el, force){
  const isMax = el.classList.contains("max");
  const want  = force === undefined ? !isMax : force;
  if(want === isMax) return;
  const btn = el.querySelector(".maxi");
  if(want){
    // On garde la taille d'avant pour pouvoir revenir exactement dessus.
    el.dataset.geo = JSON.stringify({
      left:el.style.left, top:el.style.top,
      width:el.style.width, height:el.style.height});
    el.classList.add("max");
    applyMax(el);
    if(btn){ btn.textContent="🗗"; btn.title="Restaurer la taille"; }
  }else{
    let g={};
    try{ g = JSON.parse(el.dataset.geo || "{}"); }catch(_){}
    el.style.left   = g.left   || "80px";
    el.style.top    = g.top    || "80px";
    el.style.width  = g.width  || "520px";
    el.style.height = g.height || "";
    el.classList.remove("max");
    if(btn){ btn.textContent="⛶"; btn.title="Agrandir (double-clic sur la barre)"; }
  }
  focusWin(el);
}
// Une fenêtre agrandie suit la taille de l'écran (rotation, redimensionnement).
addEventListener("resize", ()=>{
  document.querySelectorAll(".win.max").forEach(applyMax);
});

/* --- Menu « ⋮ » de la barre de titre ------------------------------------- */
//  Même dessin que le menu ⋮ du gestionnaire de fichiers. Les entrées propres
//  à une fenêtre (terminal, fichiers…) s'ajoutent au-dessus des entrées
//  communes à toutes les fenêtres.
let winMenuEl = null;
function closeWinMenu(){ if(winMenuEl){ winMenuEl.remove(); winMenuEl = null; } }
const WIN_MENU_EXTRA = {
  term: el => (
    `<button onclick="termNewWindow()">▮ Nouveau terminal</button>`+
    `<button onclick="termClearFromMenu()">↻ Effacer l'écran<span class="kbd">clear</span></button>`+
    `<button onclick="termCopyAll()">⧉ Copier tout le texte</button>`+
    `<div class="msep"></div>`),
  files: () => (
    `<button onclick="closeWinMenu();openTerminal()">▮ Ouvrir un terminal</button>`+
    `<div class="msep"></div>`),
};
function toggleWinMenu(el, btn){
  const wasOpen = winMenuEl && winMenuEl.dataset.forWin === el.id;
  closeWinMenu();
  if(wasOpen) return;
  const id = el.id.replace(/^win-/, "");
  const r  = btn.getBoundingClientRect();
  const m  = document.createElement("div");
  m.className = "menu";
  m.dataset.forWin = el.id;
  m.style.top   = (r.bottom + 6) + "px";
  m.style.left  = "auto";
  m.style.right = Math.max(8, innerWidth - r.right) + "px";
  const isMax = el.classList.contains("max");
  m.innerHTML =
    (WIN_MENU_EXTRA[id] ? WIN_MENU_EXTRA[id](el) : "")+
    `<button onclick="winMenuAct('${el.id}','max')">${isMax?"🗗 Restaurer la taille":"⛶ Agrandir l'écran"}`+
      `<span class="kbd">${isMax?"Super+↓":"Super+↑"}</span></button>`+
    `<button onclick="winMenuAct('${el.id}','center')">⊹ Recentrer la fenêtre</button>`+
    `<div class="msep"></div>`+
    `<button onclick="closeWinMenu();openSettings()">⚙ Paramètres</button>`+
    `<button onclick="closeWinMenu();openApps()">▦ Toutes les applications</button>`+
    `<div class="msep"></div>`+
    `<button onclick="winMenuAct('${el.id}','close')">✕ Fermer<span class="kbd">Alt+F4</span></button>`;
  document.body.appendChild(m);
  winMenuEl = m;
}
function winMenuAct(winId, what){
  const el = document.getElementById(winId);
  closeWinMenu();
  if(!el) return;
  if(what === "max")   toggleMax(el);
  if(what === "close") closeWin(el);
  if(what === "center"){
    toggleMax(el, false);
    el.style.left = Math.max(8, (innerWidth  - el.offsetWidth)/2) + "px";
    el.style.top  = Math.max(40, (innerHeight - el.offsetHeight)/2) + "px";
    focusWin(el);
  }
}
document.addEventListener("click", e=>{
  if(winMenuEl && !e.target.closest(".menu,.tbtn.wmenu")) closeWinMenu();
});
function closeWin(el){
  el.classList.add("closing");
  el.addEventListener("animationend", ()=>el.remove(), {once:true});
  setTimeout(()=>el.remove(), 600);   /* filet si l'animation est coupée */
}
function focusWin(el){
  document.querySelectorAll(".win").forEach(w=>w.classList.remove("active"));
  el.classList.add("active"); el.style.zIndex = ++state.zTop;
}
function dragify(el){
  const bar = el.querySelector(".tbar");
  let sx,sy,ox,oy,drag=false;
  bar.addEventListener("pointerdown", e=>{
    if(e.target.closest(".tbtn")) return;
    drag=true; sx=e.clientX; sy=e.clientY;
    ox=el.offsetLeft; oy=el.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener("pointermove", e=>{
    if(!drag) return;
    // Tirer une fenêtre agrandie la restaure et la met sous le curseur,
    // comme sur un vrai bureau.
    if(el.classList.contains("max")){
      const w = parseInt(el.dataset.geo ? (JSON.parse(el.dataset.geo).width||"520") : "520", 10) || 520;
      toggleMax(el, false);
      ox = Math.max(0, e.clientX - w/2); oy = 40;
      sx = e.clientX; sy = e.clientY;
      el.style.left = ox+"px"; el.style.top = oy+"px";
      return;
    }
    el.style.left=Math.max(-el.offsetWidth+90, ox+e.clientX-sx)+"px";
    el.style.top =Math.max(32, oy+e.clientY-sy)+"px";
  });
  bar.addEventListener("pointerup", ()=>drag=false);
}

const FETCH_ART = [
"        ▄▄██████████▄▄",
"     ▄██████████████████▄",
"  ▄████████████████████████▄",
"  ▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀",
"   ███▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄███",
"    ██ ▐████▌    ▐████▌ ██",
"    ██ ▐████▌    ▐████▌ ██",
"   ███▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀███",
"    ███████▄▄▄▄▄▄▄▄███████",
"    █████  ▄  ▄  ▄  █████",
"    ████   █  █  █   ████",
"    ▀███▄  ▀  ▀  ▀  ▄███▀",
"      ▀███▄▄▄▄▄▄▄▄▄▄███▀",
"         ▀▀████████▀▀"];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const PERF_LABEL = {petit:"Petit — machine modeste, autonomie maximale",
  medium:"Médium — équilibre, réglage par défaut",
  performant:"Performant — priorité à la vitesse",
  max:"Performance max — tout à fond, secteur recommandé"};

/* --- Compte-tours de performance ----------------------------------------
   Un vrai cadran plutôt qu'une image figée : seule l'aiguille tourne, et la
   transition CSS la fait BALAYER jusqu'à la nouvelle valeur au lieu de sauter.
   Échelle 0-9, comme un compte-tours : petit 2 · medium 4 · performant 6 ·
   max 9, zone rouge à partir de 8. */
const PERF_RPM = {petit:2, medium:4, performant:6, max:9};
const G_A0 = -125, G_A1 = 125, G_VMAX = 9;
function gaugeAngle(v){ return G_A0 + (G_A1-G_A0)*(v/G_VMAX); }
function gaugePt(a, r){
  const t=(a-90)*Math.PI/180;
  return [256+r*Math.cos(t), 256+r*Math.sin(t)];
}
function gaugeArc(v0, v1, r){
  const [x0,y0]=gaugePt(gaugeAngle(v0),r), [x1,y1]=gaugePt(gaugeAngle(v1),r);
  return `M ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
function gaugeDial(){
  let tk="", nb="";
  for(let i=0;i<=9;i++){
    const a=gaugeAngle(i);
    const [x0,y0]=gaugePt(a,126), [x1,y1]=gaugePt(a,152);
    tk+=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke-width="13"/>`;
    const [mx,my]=gaugePt(a,100);
    nb+=`<text x="${mx.toFixed(1)}" y="${(my+13).toFixed(1)}" text-anchor="middle">${i}</text>`;
    if(i<9){
      const a2=gaugeAngle(i+0.5);
      const [u0,v0]=gaugePt(a2,139), [u1,v1]=gaugePt(a2,152);
      tk+=`<line x1="${u0.toFixed(1)}" y1="${v0.toFixed(1)}" x2="${u1.toFixed(1)}" y2="${v1.toFixed(1)}" stroke-width="7"/>`;
    }
  }
  return `<path d="${gaugeArc(0,9,150)}" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" opacity=".35"/>`+
         `<path d="${gaugeArc(8,9,150)}" fill="none" stroke="#FF3B30" stroke-width="11" stroke-linecap="round"/>`+
         `<g stroke="currentColor" stroke-linecap="round" opacity=".85">${tk}</g>`+
         `<g fill="currentColor" opacity=".85" font-family="ui-monospace,monospace" font-weight="700" font-size="38">${nb}</g>`;
}
//  size : côté en pixels. profil : clé de PERF_RPM (défaut : profil courant).
function perfGauge(size, profil){
  const v = PERF_RPM[profil || state.perf] ?? 4;
  return `<svg class="gauge" viewBox="0 0 512 512" width="${size}" height="${size}" aria-hidden="true">`+
    gaugeDial()+
    `<g class="needle" style="transform:rotate(${gaugeAngle(v)}deg)">`+
      `<line x1="256" y1="284" x2="256" y2="138" stroke="currentColor" stroke-width="17" stroke-linecap="round"/>`+
    `</g>`+
    `<circle cx="256" cy="256" r="25" fill="currentColor"/>`+
    `<circle cx="256" cy="256" r="10" fill="var(--bg)"/>`+
  `</svg>`;
}

function fetchOut(){
  const info = [
    ["","<b class='p'>lex</b><span class='d'>@</span><b class='p'>lexos</b>"],
    ["","<span class='d'>────────────────────────────</span>"],
    ["OS       ","LexOS 1.0 (Nomad) x86_64 — démo web"],

    ["Bureau   ","XFCE + LexOS Noir"],
    ["Accent   ",state.accent],
    ["Perf     ",state.perf],
    ["Effets   ","CRT "+(state.crt?"on":"off")],
    ["Dock     ",{right:"droite",left:"gauche",bottom:"bas",top:"haut"}[state.dock]],
    ["Langue   ",LANGS[state.lang]],
    ["",""],
    ["","<span class='d'>lexos help — la liste des commandes</span>"]];
  let out="";
  const rows = Math.max(FETCH_ART.length, info.length);
  for(let i=0;i<rows;i++){
    const a=(FETCH_ART[i]||"").padEnd(30);
    const inf = info[i] ? (info[i][0] ? `<span class='a'>${info[i][0]}</span><span class='d'>:</span> <span class='w'>${info[i][1]}</span>` : info[i][1]) : "";
    out += `<span class='a'>${a}</span> ${inf}\n`;

  return out;
}

<span class='a'>lexos avion</span> on|off    mode avion (simulé)
<span class='a'>lexos lang</span> [code]     fr_CA · fr_FR · en_US · en_CA · es_ES · de_DE (simulé)
<span class='a'>lexos format</span>         formater une clé USB/téléphone (vraie ISO seulement)
<span class='a'>clear</span> · <span class='a'>date</span> · <span class='a'>whoami</span> · <span class='a'>echo</span> · <span class='a'>uname -a</span>

<span class='d'>Le vrai système a bien plus : wifi, bluetooth, partage QR,
plusieurs écrans, installation chiffrée… Il vit sur l'ISO.</span>
`;
function runCmd(raw){
  const line = raw.trim();
  const [c0,...rest] = line.split(/\s+/);
  const arg = rest.join(" ");
  let out="";
  if(!line){ }
  else if(c0==="help"||line==="lexos help"||line==="lexos") out=HELP;
  else if(c0==="lexfetch"||line==="lexos info") out="\n"+fetchOut();
  else if(c0==="clear"){ tEl.innerHTML=""; tNewPrompt(); return; }
  else if(c0==="date") out=new Date().toLocaleString("fr-CA")+"\n";
  else if(c0==="whoami") out="lex\n";
  else if(line==="uname -a"||c0==="uname") out="Linux lexos 6.12-lexos #1 SMP LexOS 1.0 x86_64 GNU/Linux\n";
  else if(c0==="echo") out=esc(arg)+"\n";
  else if(line.startsWith("lexos accent")){
    const a=rest[1];
    if(!a) out=`Accent courant : <span class='a'>${state.accent}</span>\nDisponibles    : orange bleu rouge vert gris violet neon\n`;
    else if(setAccent(a)) out=`<span class='p'>✓</span> Accent : ${a}\n`;
    else out=`<span class='err'>✗ Accent inconnu : ${esc(a)}</span>\n`;
  }
  else if(line.startsWith("lexos dock")){
    const p=rest[1];
    if(!p) out=`Position du dock : <span class='a'>${{right:"droite",left:"gauche",bottom:"bas",top:"haut"}[state.dock]}</span>\n`;
    else if(setDock(p)) out=`<span class='p'>✓</span> Dock déplacé : ${p}\n`;
    else out=`<span class='err'>✗ Position inconnue : ${esc(p)} (droite | gauche | bas | haut)</span>\n`;
  }
  else if(line.startsWith("lexos crt")){
    const m=rest[1];
    if(m==="on"||m==="off"){ setCrt(m==="on"); out=`<span class='p'>✓</span> Effets CRT : ${m}\n`; }
    else out=`Effets CRT : <span class='a'>${state.crt?"on":"off"}</span>  <span class='d'>(lexos crt on|off)</span>\n`;
  }
  else if(line.startsWith("lexos perf")){
    const p=rest[1];
    if(!p||p==="status"){
      out=`\n<span class='w'>Performance — profil <span class='a'>${state.perf}</span></span>\n<span class='d'>${PERF_LABEL[state.perf]}</span>\n\n`+
          `  Gouverneur CPU     ${ {petit:"powersave",medium:"schedutil",performant:"performance",max:"performance"}[state.perf] }\n`+
          `  Effets CRT         ${state.crt?"on":"off"}\n`+
          `  <span class='d'>(simulation — le vrai lexos-perf règle le noyau, zram, services)</span>\n`;
    } else if(PERF_LABEL[p]){
      state.perf=p; setCrt(p==="performant"||p==="max");
      out=`<span class='p'>✓</span> Profil <span class='a'>${p}</span> appliqué — ${PERF_LABEL[p]}\n`;
    } else out=`<span class='err'>✗ Profil inconnu : ${esc(p)} (petit | medium | performant | max)</span>\n`;
  }
  else if(line.startsWith("lexos avion")){
    const m=rest[1];
    if(m==="on"||m==="off"){ state.avion=(m==="on");
      out=`<span class='p'>✓</span> Mode avion ${m==="on"?"activé — radios coupées":"désactivé — radios rallumées"} <span class='d'>(simulé)</span>\n`;
      updateTrayIcon();
    } else out=`Mode avion : <span class='a'>${state.avion?"ACTIVÉ":"désactivé"}</span>\n`;
  }
  else if(line.startsWith("lexos lang")){
    const l=rest[1];
    if(!l) out=`Langue courante : <span class='a'>${state.lang}</span> (${esc(LANGS[state.lang])})\n`+
      `Disponibles     : ${Object.keys(LANGS).join(" · ")}\n<span class='d'>Sur la vraie ISO : locales-all installe TOUTES les langues.</span>\n`;
    else if(LANGS[l]){ state.lang=l; out=`<span class='p'>✓</span> Langue : ${l} (${esc(LANGS[l])})\n`; }
    else out=`<span class='err'>✗ Langue inconnue ou non simulée ici : ${esc(l)}</span>\n  Essaie : ${Object.keys(LANGS).join(" · ")}\n`;
  }
  else if(line==="lexos demo"||c0==="demo"){
    out=`\n  <span class='a'>Session DÉMO WEB</span> — tu es dans ton navigateur.\n`+
        `  Rien n'est installé, rien n'est écrit nulle part.\n\n`+
        `  Le vrai LexOS est une <span class='w'>ISO Linux amorçable</span> : on la grave sur\n`+
        `  une clé USB, on démarre dessus, et on a un vrai système —\n`+
        `  wifi, bluetooth, fichiers, installation chiffrée.\n`;
  }
  else if(line.startsWith("lexos install")||c0==="calamares"){
    out=`<span class='err'>✗</span> L'installation sur disque n'existe que sur la vraie ISO.\n  Ici, ton disque est parfaitement tranquille.\n`;
  }
  else if(line.startsWith("lexos format")){
    out=`<span class='err'>✗</span> Formater un support n'existe que sur la vraie ISO.\n  Là-bas : jamais le disque système, et confirmation exigée (taper <b>FORMATER</b>).\n`;
  }
  else if(c0==="sudo") out=`<span class='d'>Pas besoin de sudo dans la démo — essaie la commande sans lui.</span>\n`;
  else out=`<span class='err'>✗ Commande inconnue : ${esc(c0)}</span>\n  Essaie : <span class='a'>help</span>\n`;
  tPrint(esc("")+out);
  tNewPrompt();
}

//  Assombrit une couleur : sert au dos du dossier, pour le relief.
function shade(hex, k){
  const n=parseInt(hex.slice(1),16);
  const c=[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*k))));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}

                   "a 26 26 0 0 1 26 26 v 214 a 26 26 0 0 1 -26 26 H 70 a 26 26 0 0 1 -26 -26 Z";
const FOLD_FRONT = "M 78 206 h 378 a 24 24 0 0 1 23 30 l -38 156 a 26 26 0 0 1 -25 20 H 90 "+
                   "a 26 26 0 0 1 -25 -20 L 27 236 a 24 24 0 0 1 23 -30 Z";

/*  Rebond au clic, réutilisable partout. Le retrait puis la relance de la

/* --- Autocollants : découpe du sujet, façon Samsung, en local ------------ */
function floodCutout(ctx,w,h,fuzzPct){
  const data=ctx.getImageData(0,0,w,h);
  const px=data.data;
  const n=w*h;
  const visited=new Uint8Array(n);
  const qx=new Int32Array(n), qy=new Int32Array(n);
  let qh=0, qt=0;
  const idx=(x,y)=>(y*w+x);
  const at=(x,y)=>{const i=idx(x,y)*4; return [px[i],px[i+1],px[i+2]];};
  const seeds=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]];
  const seedColors=seeds.map(([x,y])=>at(x,y));
  const thresh=(fuzzPct||10)/100*255*1.7320508;
  const matches=c=>seedColors.some(sc=>Math.hypot(c[0]-sc[0],c[1]-sc[1],c[2]-sc[2])<=thresh);
  for(const [sx,sy] of seeds){ const i=idx(sx,sy); if(!visited[i]){visited[i]=1; qx[qt]=sx; qy[qt]=sy; qt++;} }
  while(qh<qt){
    const x=qx[qh], y=qy[qh]; qh++;
    const nb=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for(const [nx,ny] of nb){
      if(nx<0||ny<0||nx>=w||ny>=h) continue;
      const ni=idx(nx,ny);
      if(visited[ni]) continue;
      if(matches(at(nx,ny))){ visited[ni]=1; qx[qt]=nx; qy[qt]=ny; qt++; }
    }
  }
  for(let i=0;i<n;i++){ if(visited[i]) px[i*4+3]=0; }
  ctx.putImageData(data,0,0);
}
function stickerSourceFor(file){ return file==="mascot.png" ? MASCOT_URI : null; }
function stickerDownload(canvas,name){
  canvas.toBlob(blob=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name||"autocollant.png";
    document.body.appendChild(a); a.click(); a.remove();
    toast("✓ Autocollant enregistré : "+(name||"autocollant.png"));
  },"image/png");
}
let stkPressTimer=null, stkLongFired=false;
function stickerPressStart(file,e){
  e.stopPropagation();
  stkLongFired=false;
  clearTimeout(stkPressTimer);
  stkPressTimer=setTimeout(()=>{ stkLongFired=true; stickerInstant(file); }, 2000);
}
function stickerPressEnd(){ clearTimeout(stkPressTimer); }
function stickerPressClick(file,e){
  e.stopPropagation();

function stickerInstant(file){
  const uri=stickerSourceFor(file);
  if(!uri){ toast("Astuce : sur la vraie ISO, clic droit → Créer un autocollant marche sur n'importe quelle photo."); return; }
  toast("✂ Découpe en cours…");
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas");
    c.width=img.naturalWidth; c.height=img.naturalHeight;
    const ctx=c.getContext("2d");
    ctx.drawImage(img,0,0);
    floodCutout(ctx,c.width,c.height,10);
    stickerDownload(c,"autocollant-"+file.replace(/\.[a-z]+$/i,"")+".png");
  };
  img.src=uri;
}
function openSticker(file){
  const uri=stickerSourceFor(file);
  if(!uri){ toast("Astuce : sur la vraie ISO, clic droit → Créer un autocollant marche sur n'importe quelle photo."); return; }
  openWin("sticker","Autocollant — "+file,"🧷",
  `<div class="pad">
    <p class="sub" style="margin-bottom:10px">Découpe le sujet de la photo — comme les autocollants
    d'un téléphone Samsung, mais 100% local.</p>
    <div style="background:repeating-conic-gradient(#2a2a2a 0% 25%,#1c1c1c 0% 50%) 0 0/20px 20px;
                border-radius:8px;padding:8px;display:inline-block">
      <canvas id="stkCanvas" style="display:block;max-width:100%;border-radius:4px"></canvas>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="stickerCut()">✂ Découper</button>
      <button class="btn ghost" id="stkSaveBtn" style="display:none" onclick="stickerSave()">💾 Enregistrer le fichier</button>
    </div>
    <p class="notice" style="margin-top:10px">Astuce : dans Fichiers, presse 2 secondes sur une
    image pour découper et enregistrer tout de suite, sans passer par cette fenêtre.</p>
  </div>`,320,380);
  requestAnimationFrame(()=>{
    const c=document.getElementById("stkCanvas");
    if(!c) return;
    const img=new Image();
    img.onload=()=>{
      c.width=img.naturalWidth; c.height=img.naturalHeight;
      c.getContext("2d").drawImage(img,0,0);
    };
    img.src=uri;
  });
}
function stickerCut(){
  const c=document.getElementById("stkCanvas");
  if(!c || !c.width) return;
  floodCutout(c.getContext("2d"),c.width,c.height,10);
  const b=document.getElementById("stkSaveBtn");
  if(b) b.style.display="";
  toast("✂ Sujet découpé — fond transparent");
}
function stickerSave(){
  const c=document.getElementById("stkCanvas");
  if(!c || !c.width) return;
  stickerDownload(c,"autocollant.png");
}

      les applique, ou <code>lexos update</code> pour juste vérifier.</p>`;
    case "accessibilite": return `<h2>Accessibilité</h2><div class="sub">Confort visuel et clavier</div>
      ${swRow("Contraste élevé",false,"")}
      ${swRow("Curseur large",false,"")}`;
    case "utilisateurs": return `<h2>Utilisateurs</h2><div class="sub">Comptes locaux</div>
      <div class="srow"><div class="t">lex</div><div class="d">Administrateur — compte de la session démo</div></div>`;
    case "region": return `<h2>Région et langue</h2><div class="sub">Langue du système</div>
      <div class="row">${Object.entries(LANGS).map(([c,l])=>
        `<button class="btn ${c===state.lang?"":"ghost"}" onclick="setLang('${c}')">${l}</button>`).join("")}
      </div>
      <p class="notice">Démo : change juste l'étiquette ci-dessus. Sur la vraie ISO, LexOS installe
      <code>locales-all</code> — toutes les langues de glibc, déjà prêtes — et
      <code>lexos lang quebecois</code> (ou tout code : <code>fr_FR.UTF-8</code>, <code>en_US.UTF-8</code>…)
      change la langue du système entier. <code>lexos lang toutes</code> les liste toutes.</p>`;
    case "clavier": return `<h2>Clavier</h2><div class="sub">Disposition, raccourcis</div>
      <div class="srow"><div class="t">Disposition</div><div class="d">Français (Canada)</div></div>`;
    case "apropos": return `<h2>À propos de LexOS</h2><div class="sub">1.0 « Nomad »</div>
      <p>Base Debian trixie · noyau 6.12 LTS · XFCE · LexOS Noir</p>
      <p class="notice">Licence MIT (branding TI-LEX-AL excepté). Construit avec
      <code>make build</code> depuis le dépôt GitHub.</p>`;
    default: return `<p class="set-soon">Section indisponible.</p>`;
  }
}
function updateTrayIcon(){ const b=document.getElementById("qsBtn"); if(b) b.textContent=state.avion?"✈":"▲"; }
function toggleAvion(){ state.avion=!state.avion; updateTrayIcon(); showSettingsSection(); }
function toggleWifiAuto(){ state.wifiAuto=!state.wifiAuto; showSettingsSection(); }
function toggleWifiIssue(){ state.wifiIssue=!state.wifiIssue; showSettingsSection(); qsRefreshIfOpen(); }
//  Le panneau rapide, s'il est ouvert, doit refléter le changement tout de suite.
function qsRefreshIfOpen(){ const p=document.querySelector(".qs-panel"); if(p) p.innerHTML=qsRender(); }
function setLum(v){
  state.lum = parseInt(v,10);
  //  Le curseur bouge en continu : on met à jour le seul chiffre affiché,
  //  sans reconstruire la section — sinon le curseur perdrait le focus.
  const n = document.querySelector("#setMain .srow span[style*='min-width']");
  if(n) n.textContent = state.lum + "%";
}
function toggleEco(){
  state.eco = !state.eco;
  //  L'économiseur agit vraiment sur les autres réglages, comme sur la vraie
  //  ISO : luminosité à 40%, profil « petit », effets coupés.
  if(state.eco){ state.lumAvant = state.lum; state.lum = 40; setPerf("petit"); }
  else { state.lum = state.lumAvant ?? 80; }
  showSettingsSection();
  toast(state.eco ? "🔋 Économiseur d'énergie activé" : "Économiseur désactivé");
}
function toggleDimBat(){ state.dimBat=!state.dimBat; showSettingsSection(); }
function setPerf(p){
  const avant = state.perf;
  state.perf = p;
  setCrt(p==="performant"||p==="max");
  showSettingsSection();
  qsRefreshIfOpen();
  //  showSettingsSection() recrée le SVG : un élément neuf n'a pas d'état de
  //  départ, l'aiguille sauterait donc à sa place sans transition. On la
  //  repositionne d'abord sur l'ANCIENNE valeur, sans transition, puis on
  //  lance la nouvelle à l'image suivante — ce qui donne le balayage.
  requestAnimationFrame(()=>{
    document.querySelectorAll(".gauge .needle").forEach(n=>{
      n.style.transition = "none";
      n.style.transform  = `rotate(${gaugeAngle(PERF_RPM[avant] ?? 4)}deg)`;
      void n.getBoundingClientRect();          // force le navigateur à appliquer
      n.style.transition = "";
      n.style.transform  = `rotate(${gaugeAngle(PERF_RPM[p] ?? 4)}deg)`;
    });
  });
}
function renderSettingsNav(cur){
  return SETTINGS_NAV.map(g=>
    `<div class="grp">${g.grp}</div>`+
    g.items.map(([k,ic,label])=>{
      // Une icône peut être une fonction : elle est alors évaluée à CHAQUE
      // rendu, pour que le Wi-Fi affiche son état courant et non celui du
      // chargement de la page.
      const glyph = (typeof ic === "function") ? ic() : ic;
      return `<button class="${k===cur?"on":""}" onclick="showSettingsSection('${k}')">${glyph} ${label}</button>`;
    }).join("")
  ).join("");
}
function showSettingsSection(key){
  const cur = key || openSettings._last || "apparence";
  openSettings._last = cur;
  const win = document.getElementById("win-set");
  if(!win){ openSettings(cur); return; }
  win.querySelector(".set-nav").innerHTML = renderSettingsNav(cur);
  win.querySelector("#setMain").innerHTML = settingsSection(cur);
}
function openSettings(section){
  const cur = section || openSettings._last || "apparence";
  openSettings._last = cur;
  const existing = document.getElementById("win-set");
  if(existing){ focusWin(existing); showSettingsSection(cur); return existing; }
  const el = openWin("set","Paramètres","⚙",
    `<div class="set-shell">
      <div class="set-nav">${renderSettingsNav(cur)}</div>
      <div class="set-main" id="setMain">${settingsSection(cur)}</div>
    </div>`,720,480);
  return el;
}
function openInstall(){
  openWin("inst","Installer LexOS sur le disque","💽",
  `<div class="pad">
    <h2>⚠ Ici, rien à installer</h2>
    <p>Tu es dans la <b>démo web</b> : ton disque dur n'est pas accessible,
    et c'est très bien comme ça.</p>
    <div class="warnbox">Sur la vraie ISO, ce bouton ouvre un garde-fou :
    liste des disques, avertissement « l'effacement est irréversible », et il
    faut taper <b>EFFACER</b> ou cliquer « J'ai compris » avant que
    l'installateur ne se lance. Jamais d'effacement sans confirmation.</div>
    <p>Le parcours réel : <code>ISO → clé USB → session démo → installation</code></p>
  </div>`,470);
}

/* ======================= Paramètres rapides ======================= */
let qsEl=null, qsExpanded=null;
function qsClose(){ if(qsEl){ qsEl.remove(); qsEl=null; } qsExpanded=null; }
function qsToggle(){
  if(qsEl){ qsClose(); return; }
  qsEl=document.createElement("div");
  qsEl.className="qs-panel";
  qsEl.innerHTML=qsRender();
  document.body.appendChild(qsEl);
}
function qsRefresh(){ if(qsEl) qsEl.innerHTML=qsRender(); }
function qsToggleCompact(){ state.qsCompact=!state.qsCompact; qsExpanded=null; qsRefresh(); }

function qsTileHTML(key,icon,title,sub,on,disabled,hasChev){
  const compact=state.qsCompact;
  const cls=`qs-tile${on?" on":""}${compact?" compact":""}${disabled?" qs-disabled":""}`;
  const chev=(hasChev && !compact)
    ? `<button class="qs-chev" onclick="event.stopPropagation();qsExpand('${key}')">${qsExpanded===key?"⌃":"⌄"}</button>` : "";
  const body=compact ? "" : `<span class="ti">${title}</span><span class="su">${sub}</span>`;
  const click=disabled ? "" : ` onclick="event.stopPropagation();qsTileClick('${key}')"`;
  return `<div class="${cls}"${click} title="${title}" role="button" tabindex="0">`+
    `${chev}<span class="ic">${icon}</span>${body}</div>`;
}
function qsSubHTML(key){
  if(key==="wifi"){
    if(state.avion) return `<div class="row2"><span>Mode avion activé</span></div>`;
    return `<div class="row2"><span>${state.wifi?wifiGlyph()+" BELL507":wifiGlyph()+" Wi-Fi désactivé"}</span>`+
      `<span class="m">${state.wifi?"connecté":""}</span></div>`+
      `<div class="row2"><span>Voisin_5G</span><span class="m">moyen</span></div>`+
      `<div class="row2"><span>Café-Public (ouvert)</span><span class="m">faible</span></div>`;
  }
  if(key==="bt"){
    if(state.avion) return `<div class="row2"><span>Mode avion activé</span></div>`;
    return `<div class="row2"><span><i class="gly gly-bt"></i> ${state.bt?"Alex Marceau":"Bluetooth désactivé"}</span>`+
      `<span class="m">${state.bt?"connecté":""}</span></div>`+
      `<div class="row2"><span>Écouteurs LexPods</span><span class="m">appairé</span></div>`;
  }
  return "";
}
function qsRender(){
  const compact=state.qsCompact;
  const wifiOn = state.wifi && !state.avion;
  const btOn   = state.bt && !state.avion;
  let tiles = [
    qsTileHTML("wifi",wifiGlyph(),"Wi-Fi", wifiOn?"BELL507":"Désactivé", wifiOn, state.avion, true),
    qsTileHTML("bt",'<i class="gly gly-bt"></i>',"Bluetooth", btOn?"Alex Marceau":"Désactivé", btOn, state.avion, true),
    qsTileHTML("avion",avionGlyph(),"Mode avion", state.avion?"Activé":"Désactivé", state.avion, false, false),
    qsTileHTML("partage",'<i class="gly gly-share"></i>',"Partager", "Envoyer un fichier", false, false, false),
  ];
  if(!compact){
    tiles.push(
      qsTileHTML("perf",perfGauge(19),"Performance", PERF_LABEL[state.perf].split(" —")[0], state.perf==="performant"||state.perf==="max", false, false),
      qsTileHTML("theme", state.mode==="clair"?"☀":"🌑", state.mode==="clair"?"Style clair":"Style sombre",
        state.mode==="clair"?"Thème de jour":"LexOS Noir", state.mode==="clair", false, false),
      qsTileHTML("clavier","⌨","Clavier", "Français (Québec)", false, false, false),
      qsTileHTML("crt","📺","Effets TV 1980", state.crt?"Activés":"Désactivés", state.crt, false, false),
    );
  }
  const sub = (qsExpanded && !compact) ? `<div class="qs-sub">${qsSubHTML(qsExpanded)}</div>` : "";
  return `<div class="qs-head"><span class="t">Paramètres rapides</span>`+
    `<button class="qs-headbtn" onclick="event.stopPropagation();qsToggleCompact()" title="${compact?"Agrandir":"Réduire"}">${compact?"⤢":"⤡"}</button></div>`+
    `<div class="qs-grid${compact?" compact":""}">${tiles.join("")}${sub}</div>`;
}
function qsExpand(key){ qsExpanded=(qsExpanded===key)?null:key; qsRefresh(); }
function qsTileClick(key){
  switch(key){
    case "wifi": if(!state.avion) state.wifi=!state.wifi; break;
    case "bt": if(!state.avion) state.bt=!state.bt; break;
    case "avion": state.avion=!state.avion; updateTrayIcon(); break;
    case "partage": qsClose(); openShare(); return;
    case "perf": {
      const order=["petit","medium","performant","max"];
      state.perf = order[(order.indexOf(state.perf)+1)%order.length];
      setCrt(state.perf==="performant"||state.perf==="max");
      break;
    }
    case "theme": setMode(state.mode==="clair"?"sombre":"clair"); break;
    case "crt": setCrt(!state.crt); break;
    case "clavier": qsClose(); openSettings("clavier"); return;
  }
  qsRefresh();
}

  {ic:"🛡", label:"Confidentialité", fn:()=>openSettings("confidentialite")},
  {ic:"⬇", label:"Mises à jour", fn:()=>openSettings("maj")},
  {ic:"🧑‍💻", label:"Utilisateurs", fn:()=>openSettings("utilisateurs")},
  {ic:"👋", label:"Bienvenue",    fn:openWelcome},
];
const appsView=document.getElementById("appsview");
const appGrid=document.getElementById("appgrid");
const appSearch=document.getElementById("appSearch");

function renderApps(filter){
  const q=(filter||"").trim().toLowerCase();
  const list=q ? APPS.filter(a=>a.label.toLowerCase().includes(q)) : APPS;
  if(!list.length){ appGrid.innerHTML=`<div class="empty">Aucune application ne correspond à « ${esc(q)} ».</div>`; return; }
  appGrid.innerHTML=list.map((a,i)=>
    `<button class="app" data-i="${APPS.indexOf(a)}"><span class="ai">${a.ic}</span><span class="an">${a.label}</span></button>`
  ).join("");
  appGrid.querySelectorAll(".app").forEach(b=>b.onclick=()=>{
    const app=APPS[+b.dataset.i]; closeApps(); app.fn();
  });
}
function openApps(){
  appsView.classList.add("on");
  appSearch.value=""; renderApps("");
  requestAnimationFrame(()=>appSearch.focus());
}
function closeApps(){ appsView.classList.remove("on"); }
function toggleApps(){ appsView.classList.contains("on") ? closeApps() : openApps(); }

appSearch.addEventListener("input",()=>renderApps(appSearch.value));
appSearch.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeApps(); return; }
  if(e.key==="Enter"){
    const first=appGrid.querySelector(".app");
    if(first) first.click();
  }
});
appsView.addEventListener("click",e=>{ if(e.target===appsView) closeApps(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && appsView.classList.contains("on")) closeApps();
});
document.getElementById("appsBtn").onclick=e=>{ e.stopPropagation(); toggleApps(); };
document.getElementById("qsBtn").onclick=e=>{ e.stopPropagation(); qsToggle(); };

/* ======================= Menu de démarrage ======================= */
let pwMenuEl=null, powerState=null;   // powerState: null | "lock" | "off"
function pwClose(){ if(pwMenuEl){ pwMenuEl.remove(); pwMenuEl=null; } }
function pwToggle(btn){
  if(pwMenuEl){ pwClose(); return; }
  const r=btn.getBoundingClientRect();
  pwMenuEl=document.createElement("div");
  pwMenuEl.className="menu pw-menu";
  pwMenuEl.style.top=(r.bottom+6)+"px"; pwMenuEl.style.left="auto";
  pwMenuEl.style.right=Math.max(8, innerWidth-r.right)+"px";
  pwMenuEl.innerHTML=
    `<button onclick="pwLock()"><span class="picto">🔒</span> Verrouiller l'écran</button>`+
    `<div class="msep"></div>`+
    `<button onclick="pwSuspend()"><span class="picto">🌙</span> Mettre en veille</button>`+
    `<button onclick="pwRestart()"><span class="picto">↻</span> Redémarrer</button>`+
    `<button onclick="pwShutdown()"><span class="picto">⏻</span> Éteindre</button>`;
  document.body.appendChild(pwMenuEl);
}
document.addEventListener("click", e=>{
  if(pwMenuEl && !e.target.closest(".pw-menu,#offBtn")) pwClose();
});

function showPowerOverlay(kind, picto, msg, hint){
  pwClose();
  const el=document.getElementById("powerOverlay");
  el.className="on"; el.classList.toggle("suspend", kind==="suspend");
  el.innerHTML=`<div class="picto">${picto}</div><div class="msg">${msg}</div>`+
    (hint?`<div class="hint">${hint}</div>`:"");
  powerState=kind;
}
/* --- Écran de connexion (verrouillage) : sélecteur lex / Invité ---------- */
function loginScreenHTML(){
  return `<div class="login-title">Session verrouillée — choisis un profil</div>`+
    `<div class="login-tiles">`+
      `<div class="login-tile" id="loginTileLex" role="button" tabindex="0" `+
        `onclick="event.stopPropagation();loginSelect('lex')" `+
        `onkeydown="event.stopPropagation();loginTileKey(event,'lex')">`+
        `<div class="login-avatar lex"><img src="${MASCOT_URI}" alt="Avatar de lex"></div>`+
        `<div class="login-name">lex</div><div class="login-sub">Principal</div>`+
      `</div>`+
      `<div class="login-tile" id="loginTileGuest" role="button" tabindex="0" `+
        `onclick="event.stopPropagation();loginSelect('guest')" `+
        `onkeydown="event.stopPropagation();loginTileKey(event,'guest')">`+
        `<div class="login-avatar guest">👤</div>`+
        `<div class="login-name">Invité</div><div class="login-sub">Session invité</div>`+
      `</div>`+
    `</div>`+
    `<div class="login-pass" id="loginPassBox" style="display:none">`+
      `<input type="password" id="loginPassInput" class="login-pass-input" `+
        `placeholder="Mot de passe de lex" autocomplete="off" `+
        `onclick="event.stopPropagation()" onkeydown="event.stopPropagation();loginPassKey(event)">`+
      `<button class="btn" onclick="event.stopPropagation();loginSubmit()">Déverrouiller</button>`+
      `<div class="login-err" id="loginErr"></div>`+
    `</div>`;
}
function pwLock(){
  pwClose();
  const el=document.getElementById("powerOverlay");
  el.className="on login";
  el.innerHTML=loginScreenHTML();
  powerState="lock";
}
function loginSelect(user){
  if(user==="guest"){ loginUnlock(); return; }
  const tile=document.getElementById("loginTileLex");
  if(tile) tile.classList.add("sel");
  const box=document.getElementById("loginPassBox");
  if(box) box.style.display="flex";
  const input=document.getElementById("loginPassInput");
  if(input) requestAnimationFrame(()=>input.focus());
}
function loginTileKey(e,user){
  if(e.key==="Enter" || e.key===" "){ e.preventDefault(); loginSelect(user); }
}
function loginPassKey(e){
  if(e.key==="Enter"){ e.preventDefault(); loginSubmit(); }
}
function loginSubmit(){
  const input=document.getElementById("loginPassInput");
  if(!input) return;
  if(!input.value.trim()){
    input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
    const err=document.getElementById("loginErr");
    if(err) err.textContent="Mot de passe requis";
    return;
  }
  loginUnlock();
}
function loginUnlock(){
  const el=document.getElementById("powerOverlay");
  el.className=""; el.innerHTML="";
  powerState=null;
}
function pwSuspend(){
  showPowerOverlay("suspend","🌙","Mise en veille…","");
  setTimeout(()=>{
    if(powerState!=="suspend") return;
    document.getElementById("powerOverlay").className="";
    powerState=null;
  }, 1400);
}
function pwRestart(){
  pwClose();
  document.querySelectorAll(".win").forEach(w=>w.remove());
  document.body.classList.add("off");
  setTimeout(()=>{ document.body.classList.remove("off"); boot(); }, 700);
}
function pwShutdown(){
  showPowerOverlay("off","⏻","Système éteint","Clique pour rallumer");
}
function powerOverlayClick(){
  // Le verrouillage ("lock") utilise l'écran de connexion avec ses propres
  // contrôles (voir loginSelect/loginSubmit) — un clic dans le vide ne doit
  // pas fermer la session avant l'authentification.
  if(powerState==="off"){
    document.getElementById("powerOverlay").className="";
    powerState=null;
    boot();
  }
}
document.getElementById("offBtn").onclick=e=>{ e.stopPropagation(); pwToggle(e.currentTarget); };

/* ======================= Horloge & démarrage ======================= */
/*  Effet « Matrix » sur l'horloge : quand un chiffre de l'heure change, il
    défile sur trois idéogrammes avant d'afficher le vrai chiffre. Seuls les
    caractères qui CHANGENT sont animés — sinon toute l'heure clignoterait
    chaque minute. */
const MTX_GLYPHES = "日月火水木金土山川田人大小上中下一二三四五六七八九十百千万時分秒天空雷風零";
function mtxRandom(){ return MTX_GLYPHES[Math.floor(Math.random()*MTX_GLYPHES.length)]; }
function heureCellules(t){
  return [...t].map(ch=>`<span class="ck">${ch===" "?"&nbsp;":esc(ch)}</span>`).join("");
}
function mtxScramble(cell, final){
  if(cell._mtx) clearInterval(cell._mtx);       // un changement peut en chasser un autre
  let n = 0;
  cell.classList.add("mtx");
  cell._mtx = setInterval(()=>{
    n++;
    if(n > 3){                                   // trois glyphes, puis le vrai
      clearInterval(cell._mtx); cell._mtx = null;
      cell.classList.remove("mtx");
      cell.innerHTML = final===" " ? "&nbsp;" : esc(final);
      return;
    }
    cell.textContent = mtxRandom();
  }, 78);
}
let heurePrec = "";
function tick(){
  const d = new Date();
  const date  = d.toLocaleDateString("fr-CA",{weekday:"short",day:"2-digit",month:"short"});
  const heure = d.toLocaleTimeString("fr-CA",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("clkdate").textContent = date + "  ";
  const zone = document.getElementById("clktime");

  //  Premier affichage, ou format de longueur différente : on pose tel quel.
  if(heurePrec.length !== heure.length){
    zone.innerHTML = heureCellules(heure); heurePrec = heure; return;
  }
  if(heure === heurePrec) return;
  const cells = zone.querySelectorAll(".ck");
  [...heure].forEach((ch,i)=>{
    if(ch !== heurePrec[i] && cells[i]) mtxScramble(cells[i], ch);
  });
  heurePrec = heure;
}
//  Une seconde : sans ça le changement de minute serait vu jusqu'à 10 s trop
//  tard et l'effet tomberait à côté. La fonction ne fait rien tant que
//  l'heure affichée n'a pas changé.
setInterval(tick,1000); tick();
applyDock();   // pose la flèche et l'infobulle de la poignée dès le départ

function boot(){
  document.querySelectorAll(".win").forEach(w=>w.remove());
  const b=document.getElementById("boot");
  b.style.display="flex";
  const bar=b.querySelector(".bar i");
  bar.style.animation="none"; void bar.offsetWidth; bar.style.animation="";
  setTimeout(()=>{
    b.style.display="none";
    const s=document.getElementById("screen");
    s.classList.remove("on"); void s.offsetWidth; s.classList.add("on");
    setTimeout(openWelcome, 900);
  }, 2300);
}
boot();
</script>
