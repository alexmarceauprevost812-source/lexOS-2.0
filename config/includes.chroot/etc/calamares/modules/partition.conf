# =============================================================================
#  LexOS — module « partition » de Calamares
# =============================================================================
#  POURQUOI CE FICHIER EXISTE.
#  Debian ne livre AUCUN partition.conf dans calamares-settings-debian
#  (vérifié en dépaquetant calamares-settings-debian 13.0.5 : le dossier
#  modules/ contient bootloader, users, fstab… mais pas partition). Le hook
#  0500 le cherchait pour y écrire les réglages de chiffrement, ne le
#  trouvait pas, et chaque journal de construction portait la ligne
#  « !! partition.conf absent — chiffrement non préconfiguré ». Sans ce
#  fichier, on ne contrôle rien : ni le chiffrement, ni la place réclamée,
#  ni la façon dont la partition EFI de Windows est traitée.
#
#  CE QUI EST EN JEU POUR LE DOUBLE DÉMARRAGE. Calamares sait déjà installer
#  « à côté de » un autre système : quand os-prober trouve Windows, il
#  propose l'écran avec le curseur de partage — le même geste que sur Ubuntu.
#  Ce n'est pas à réécrire : son redimensionnement NTFS est éprouvé sur des
#  millions de machines, et il montre toujours un écran de confirmation avant
#  d'écrire. Notre travail est de le CONFIGURER correctement, pas de le
#  remplacer.
#
#  Clés vérifiées une par une dans le binaire du module
#  (libcalamares_viewmodule_partition.so) et non recopiées d'un exemple.
# =============================================================================
---

#  AUCUN CHOIX PRÉ-COCHÉ, VOLONTAIREMENT.
#  Pré-cocher « effacer le disque » sur une machine qui a Windows dessus est
#  une invitation à l'accident : un Entrée de trop et les jeux d'Alex sont
#  partis. Avec « none », les quatre possibilités s'affichent côte à côte et
#  c'est l'utilisateur qui désigne la sienne — dont « Installer à côté de ».
initialPartitioningChoice: none

#  Le partitionnement manuel reste offert : c'est la porte de sortie quand
#  une machine a une disposition inhabituelle que l'automatique refuse.
allowManualPartitioning: true

#  ── La partition EFI ────────────────────────────────────────────────────
#  Sur une machine qui a déjà Windows, la partition EFI EXISTE : c'est
#  Windows qui l'a créée, et c'est elle qui contient son amorceur. Calamares
#  la réutilise et y ajoute LexOS à côté — il ne la reformate pas, ce qui
#  effacerait le démarrage de Windows. On nomme juste le point de montage
#  attendu ; la taille ne sert que si aucune EFI n'existe (disque vierge).
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: LEXOS_EFI

#  ── Espace réclamé ──────────────────────────────────────────────────────
#  PLANCHER, PAS CIBLE. C'est le minimum sous lequel Calamares prévient que
#  ça ne rentrera pas. La cible confortable visée pour une installation à
#  côté de Windows est de 40 Go — mais l'écrire ici comme minimum
#  ABSOLU empêcherait d'installer sur une machine qui n'a que 30 Go de
#  libre, alors que LexOS y tiendrait. Le plancher est donc ce dont LexOS a
#  réellement besoin ; c'est « lexos dualboot » qui conseille les 40 Go, en
#  donnant le chiffre exact à régler sur le curseur.
requiredStorage: 25

#  ── Système de fichiers ─────────────────────────────────────────────────
#  ext4 : le plus prévisible à réparer quand quelque chose se passe mal, et
#  celui que tous les outils de secours savent lire. btrfs reste proposé
#  pour qui veut les instantanés.
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]

#  ── Fichier d'échange ───────────────────────────────────────────────────
#  Un FICHIER d'échange plutôt qu'une partition : il se redimensionne après
#  coup et ne prend pas une place figée sur un disque partagé avec Windows.
#  « suspend » (assez pour la mise en veille prolongée) reste offert.
initialSwapChoice: file
userSwapChoices: [none, small, suspend, file]

#  ── Chiffrement du disque ───────────────────────────────────────────────
#  Coché à l'installation, tout le contenu est illisible même en sortant le
#  disque de la machine. C'est la vraie protection contre le vol de
#  l'ordinateur. LUKS2 est le format actuel.
#
#  À SAVOIR POUR LE DOUBLE DÉMARRAGE : chiffrer ne concerne que LexOS. La
#  partition Windows n'est pas touchée et continue de démarrer normalement.
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
