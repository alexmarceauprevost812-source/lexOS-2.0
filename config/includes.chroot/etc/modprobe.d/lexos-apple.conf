# =============================================================================
#  LexOS — clavier Apple
# =============================================================================
#  Sur un clavier Apple, F1..F12 pilotent par défaut la luminosité et le
#  son ; il faut tenir Fn pour obtenir une vraie touche F. Presque personne
#  ne s'attend à ça en arrivant d'ailleurs, et beaucoup de raccourcis Linux
#  passent par F2, F5, F11.
#
#  fnmode=2 rend la rangée aux touches F. Fn + F1 redonne la luminosité.
#  Pour revenir au comportement d'Apple :  lexos mac clavier multimedia
#
#  Ce fichier est sans effet sur une machine qui n'est pas un Mac : le
#  module hid_apple ne s'y charge jamais.
# =============================================================================
options hid_apple fnmode=2
