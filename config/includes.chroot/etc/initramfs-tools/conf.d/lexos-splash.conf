# =============================================================================
#  LexOS — Plymouth doit avoir de quoi dessiner DÈS la première seconde
# =============================================================================
#  ALEX : « la vidéo de démarrage, j'aimerais bien qu'on ne voie pas les
#  outils ouvrir quand il est en train de faire l'animation ».
#
#  Sans FRAMEBUFFER=y, le hook plymouth d'initramfs-tools n'embarque pas le
#  pilote d'affichage (i915 sur le ThinkPad T460, Skylake). Plymouth démarre
#  alors sur son greffon TEXTE — celui qui écrit les lignes de services à
#  l'écran — et le greffon graphique n'arrive qu'une fois i915 chargé par le
#  vrai système, si tard que l'animation est déjà entamée. On voit donc du
#  texte au début, puis l'animation par-dessus : exactement ce qu'Alex décrit.
#
#  MODULES reste au défaut de Debian, « most », et ce n'est pas un oubli :
#  « dep » n'embarque que les modules du matériel PRÉSENT AU MOMENT DE LA
#  CONSTRUCTION — c'est-à-dire celui du runner de la CI, pas celui du
#  ThinkPad ni celui de l'Alienware. Sur une ISO vivante, qui doit démarrer
#  sur une machine inconnue, « dep » est le mauvais choix. Aucun autre
#  fichier de conf.d/ ne doit le forcer ; le banc test_lexos_plymouth.sh
#  le vérifie.
FRAMEBUFFER=y
