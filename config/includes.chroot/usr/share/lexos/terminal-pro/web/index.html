<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>LexOS Pro Terminal</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: dark;
  --noir:        #000000;
  --chrome:      #0a0807;
  --chrome-hi:   #16110d;
  --ligne:       #1a1512;
  --ligne-vive:  #33261e;
  --texte:       #ffffff;
  --texte-2:     #c6bdb7;
  --texte-3:     #7d726b;
  --orange:      #ff6a1a;
  --orange-clair:#ff9d5c;
  --braise:      #E8590C;
  --vert:        #6fd99a;
  --jaune:       #f0c463;
  --rouge:       #ff6f6f;
  --mauve:       #93a9c2;
  --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --r: 5px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--noir);
  color:var(--texte);
  font-family:var(--sans);
  font-size:14px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--orange);outline-offset:1px}

/* ---------- coquille ---------- */
#app{height:100dvh;display:flex;flex-direction:column;background:var(--noir)}

/* ---------- barre d'onglets ---------- */
#barre{
  display:flex;align-items:stretch;gap:0;
  background:var(--chrome);
  border-bottom:1px solid var(--ligne);
  padding-left:10px;
  min-height:38px;
  user-select:none;
}
#marque{
  display:flex;align-items:center;gap:8px;
  padding-right:14px;margin-right:6px;
  border-right:1px solid var(--ligne);
  color:var(--texte-3);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  white-space:nowrap;
}
#marque .lys{color:var(--orange);font-size:14px;letter-spacing:0}
/*  ALEX : « je veux on voir bien LEXOS en orange en haut de écran ». */
#marque .nomlex{color:var(--orange);letter-spacing:.02em}
#onglets{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;position:relative}
#onglets::-webkit-scrollbar{display:none}
#glisseur{
  position:absolute;top:0;height:2px;left:0;width:0;
  background:var(--orange);border-radius:0 0 2px 2px;
  transition:left .3s cubic-bezier(.22,.61,.36,1), width .3s cubic-bezier(.22,.61,.36,1);
  pointer-events:none;
}
.onglet{
  display:flex;align-items:center;gap:8px;
  padding:0 10px 0 12px;
  max-width:220px;min-width:112px;
  border-right:1px solid var(--ligne);
  color:var(--texte-3);
  font-size:12.5px;
  position:relative;
  white-space:nowrap;
  cursor:pointer;
}
.onglet .nom{overflow:hidden;text-overflow:ellipsis;flex:1}
.onglet .num{font-family:var(--mono);font-size:10.5px;color:var(--texte-3);opacity:.7}
.onglet:hover{background:var(--chrome-hi);color:var(--texte-2)}
.onglet[aria-selected="true"]{background:var(--noir);color:var(--texte)}
.onglet .x{
  width:18px;height:18px;border-radius:3px;line-height:16px;text-align:center;
  color:var(--texte-3);font-size:14px;flex:none;
}
.onglet .x:hover{background:var(--ligne-vive);color:var(--texte)}
#plus{
  width:36px;flex:none;font-size:18px;color:var(--texte-3);
}
#plus:hover{color:var(--texte);background:var(--chrome-hi)}

/* ---------- espace de travail ---------- */
#travail{flex:1;min-height:0;position:relative;background:var(--noir)}
.tab-root{position:absolute;inset:0;display:none}
.tab-root.actif{display:flex;animation:page-fondu .3s cubic-bezier(.22,.61,.36,1) both}
.tab-root.actif.de-droite{animation-name:page-droite}
.tab-root.actif.de-gauche{animation-name:page-gauche}
@keyframes page-fondu{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:none}}
@keyframes page-droite{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes page-gauche{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

.noeud{display:flex;min-width:0;min-height:0;flex:1}
.noeud.row{flex-direction:row}
.noeud.col{flex-direction:column}

.sep{flex:none;background:var(--ligne);position:relative;z-index:2}
.noeud.row > .sep{width:1px;cursor:col-resize}
.noeud.col > .sep{height:1px;cursor:row-resize}
.sep::after{content:"";position:absolute;inset:-3px}
.noeud.row > .sep:hover,.noeud.col > .sep:hover,.sep.tire{background:var(--orange)}

/* ---------- fenêtre (pane) ---------- */
.fen{
  display:flex;flex-direction:column;min-width:0;min-height:0;flex:1;
  background:var(--noir);
  border:1px solid transparent;
  animation:fen-entre .22s ease both;
}
@keyframes fen-entre{from{opacity:.35}to{opacity:1}}
.fen.actif{border-color:#3d2716}
.fen-tete{
  display:flex;align-items:center;gap:8px;flex:none;
  height:24px;padding:0 4px 0 9px;
  background:var(--noir);
  border-bottom:1px solid var(--ligne);
  font-size:11px;color:var(--texte-3);
  user-select:none;
}
.fen.actif .fen-tete{border-bottom-color:#3d2716}
.fen-tete .pastille{
  width:6px;height:6px;border-radius:50%;background:var(--ligne-vive);flex:none;
}
.fen.actif .fen-tete .pastille{background:var(--orange)}
.fen-tete .chemin{
  font-family:var(--mono);font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.fen.actif .fen-tete .chemin{color:var(--texte-2)}
.fen-outils{display:flex;gap:1px;flex:none}
.fen-outils button{
  width:22px;height:18px;border-radius:3px;
  color:var(--texte-3);
  display:grid;place-items:center;
}
.fen-outils button:hover{background:var(--ligne-vive);color:var(--texte)}
.fen-outils button.danger:hover{background:#3a1414;color:var(--rouge)}
.fen-outils svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.6}

.fen-corps{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:8px 10px 12px;
  font-family:var(--mono);
  font-size:12.5px;
  line-height:1.55;
  cursor:text;
}
.fen-corps::-webkit-scrollbar{width:9px}
.fen-corps::-webkit-scrollbar-thumb{background:var(--ligne-vive);border-radius:9px}
.fen-corps::-webkit-scrollbar-track{background:transparent}
.fen-corps{scrollbar-width:thin;scrollbar-color:var(--ligne-vive) transparent}

.ligne{white-space:pre-wrap;word-break:break-word}
.ligne.vide{height:.55em}
.d{color:var(--orange-clair);font-weight:500}      /* dossier */
.g{color:var(--vert)}
.j{color:var(--jaune)}
.r{color:var(--rouge)}
.m{color:var(--mauve)}
.m34{color:#7aa2ff}
.m35{color:#d68aff}
.m36{color:#5fd1d6}
.s0{color:var(--texte-3)}
.s{color:var(--texte-3)}
.t2{color:var(--texte-2)}
.gras{font-weight:700}

.invite{display:flex;align-items:baseline;position:relative}
.invite .ps1{flex:none;white-space:pre}
.ps1 .u{color:var(--vert)}
.ps1 .h{color:var(--orange)}
.ps1 .p{color:var(--orange-clair)}
.ps1 .f{color:var(--texte-3)}
.champ{
  flex:1;min-width:0;
  background:transparent;border:0;outline:0;padding:0;margin:0;
  font:inherit;color:var(--texte);
  caret-color:transparent;
}
.curseur{
  position:absolute;top:.14em;
  width:.62em;height:1.15em;
  background:var(--texte);
  mix-blend-mode:difference;
  pointer-events:none;
}
.fen:not(.actif) .curseur{background:var(--texte-3);animation:none}
.curseur.clignote{animation:clign 1.1s steps(1) infinite}
@keyframes clign{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.occupe .invite{display:none}
.travaille{color:var(--texte-3)}
.travaille::after{content:"▂";animation:pouls .8s steps(1) infinite}
@keyframes pouls{0%,50%{opacity:1}50.01%,100%{opacity:.2}}

/* bannière */
.banniere{color:var(--orange);font-weight:500;line-height:1.15;white-space:pre;font-size:11.5px}
@media (max-width:560px){.banniere{font-size:8px}}

table.tb{border-collapse:collapse;font:inherit}
table.tb td{padding:0 16px 0 0;vertical-align:top}
.pill{
  display:inline-block;padding:0 6px;border-radius:3px;font-size:11px;
  border:1px solid currentColor;line-height:16px;
}

/* ---------- barre d'état ---------- */
#etat{
  flex:none;display:flex;align-items:center;gap:14px;
  height:26px;padding:0 12px;
  background:var(--chrome);
  border-top:1px solid var(--ligne);
  font-family:var(--mono);font-size:11px;color:var(--texte-3);
  user-select:none;
}
#etat .bloc{display:flex;align-items:center;gap:6px;white-space:nowrap}
#etat .k{color:var(--texte-2)}
#etat .sep-v{width:1px;height:12px;background:var(--ligne-vive);flex:none}
#etat .pousse{margin-left:auto}
#etat kbd{
  font-family:var(--mono);font-size:10px;color:var(--texte-2);
  border:1px solid var(--ligne-vive);border-radius:3px;padding:0 4px;line-height:15px;display:inline-block;
}
#horloge{font-variant-numeric:tabular-nums;color:var(--texte-2)}
#prefixe-ind{color:var(--noir);background:var(--jaune);padding:0 6px;border-radius:3px;font-weight:700;display:none}
#prefixe-ind.on{display:inline-block}
#backend-ind{padding:0 6px;border-radius:3px;font-weight:600}
#backend-ind.branche{color:var(--vert)}
#backend-ind.absent{color:var(--rouge)}
@media (max-width:820px){#etat .cacher-mobile{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div id="barre">
    <div id="marque"><span class="lys">⚜</span><span class="nomlex">LexOS</span><span>&nbsp;Pro</span></div>
    <div id="onglets" role="tablist"></div>
    <button id="plus" title="Nouvelle page (Ctrl+B puis T)" aria-label="Nouvelle page">+</button>
  </div>
  <div id="travail"></div>
  <div id="etat">
    <span class="bloc"><span id="prefixe-ind">PRÉFIXE</span></span>
    <span class="bloc"><span class="k" id="e-onglets">1</span> <span id="e-onglets-m">page</span> · <span class="k" id="e-fen">1</span> <span id="e-fen-m">fenêtre</span></span>
    <span class="sep-v"></span>
    <span class="bloc" id="e-chemin">~</span>
    <span class="sep-v"></span>
    <span class="bloc"><span id="backend-ind" class="absent">démo — sans backend</span></span>
    <span class="bloc pousse cacher-mobile"><kbd>Ctrl+B</kbd> <span>D</span> diviser à droite</span>
    <span class="bloc cacher-mobile"><kbd>Ctrl+B</kbd> <span>B</span> diviser en bas</span>
    <span class="bloc cacher-mobile"><kbd>Ctrl+PgDn</kbd> page suivante</span>
    <span class="sep-v cacher-mobile"></span>
    <span class="bloc"><span id="horloge">--:--</span></span>
  </div>
</div>

<script>
"use strict";
(function(){

/* =========================================================
   1. Le pont vers le vrai système — lexos-terminal-pro.py
   ========================================================= */
/*  ═══ CE QUE CETTE FENÊTRE PEUT FAIRE, ET CE QU'ELLE NE PEUT PAS ═══
    Ce n'est pas un émulateur de terminal : pas de grille de caractères, pas
    de curseur qu'on déplace, pas d'écran qu'on efface pour le redessiner.
    C'est un journal qui défile. Les commandes SIMPLES (qui lisent, écrivent,
    impriment et se terminent) marchent très bien. Les programmes PLEIN
    ÉCRAN (vim, nano, htop, less, man…) ne peuvent pas s'afficher ici — le
    pont les reconnaît et le dit, plutôt que de montrer un carnage de codes
    d'échappement. Voir /usr/lib/lexos/terminal-pro.py pour le détail. */
const _params = new URLSearchParams(location.search);
const _port  = _params.get("port");
const _jeton = _params.get("jeton");

let ACCUEIL = "~";

//  Le serveur rend déjà du HTML sûr (couleurs comprises, contenu échappé) :
//  jamais besoin de le ré-échapper. Pour retrouver du texte BRUT (un nom de
//  fichier obtenu par la complétion, par exemple), on repasse par le DOM —
//  c'est l'inverse fiable de l'échappement HTML, sans réimplémenter les
//  entités à la main.
function desEchapper(html){
  const d = document.createElement("div");
  d.innerHTML = html;
  return d.textContent;
}

async function appelBackend(cmd, ctx){
  if(!_port || !_jeton) return null;
  try{
    const r = await fetch("/api/exec", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Lexos-Jeton": _jeton },
      body: JSON.stringify({ cmd, cwd: ctx.cwd })
    });
    const j = await r.json();
    if(!j || j.ok !== true){
      return { sortie: '<span class="r">' + esc((j && j.erreur) || "le pont local ne répond pas") + '</span>', cwd: ctx.cwd };
    }
    return { sortie: j.sortie || "", cwd: j.cwd || ctx.cwd };
  } catch(e){
    return { sortie: '<span class="r">le pont local ne répond pas — relance lexos-pro-terminal</span>', cwd: ctx.cwd };
  }
}

/* =========================================================
   2. Utilitaires d'affichage
   ========================================================= */
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function joli(chemin){
  if(!chemin) return chemin;
  if(chemin === ACCUEIL) return "~";
  if(ACCUEIL !== "~" && chemin.startsWith(ACCUEIL + "/")) return "~" + chemin.slice(ACCUEIL.length);
  return chemin;
}
//  Découpage minimal, pour lire le PREMIER mot d'une ligne (choisir entre un
//  built-in de fenêtre et le vrai bash) — jamais pour réinterpréter la ligne
//  elle-même : celle-ci part ENTIÈRE et TELLE QUELLE vers bash, qui sait déjà
//  parser guillemets, pipes et « && » bien mieux qu'un réimplémentation ici.
function premierMot(ligne){
  const m = ligne.match(/^\s*(\S+)/);
  return m ? m[1] : "";
}

/* =========================================================
   3. Fenêtre (pane)
   ========================================================= */
let compteurFen = 0;
const ICONES = {
  droite:'<svg viewBox="0 0 12 12"><rect x="1" y="1.5" width="10" height="9" rx="1"/><line x1="6" y1="1.5" x2="6" y2="10.5"/></svg>',
  bas:   '<svg viewBox="0 0 12 12"><rect x="1" y="1.5" width="10" height="9" rx="1"/><line x1="1" y1="6" x2="11" y2="6"/></svg>',
  zoom:  '<svg viewBox="0 0 12 12"><polyline points="4.5,1.5 1.5,1.5 1.5,4.5"/><polyline points="7.5,10.5 10.5,10.5 10.5,7.5"/></svg>',
  x:     '<svg viewBox="0 0 12 12"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/></svg>'
};

class Fenetre {
  constructor(cwd){
    this.id = ++compteurFen;
    this.cwd = cwd || ACCUEIL;
    this.hist = chargerHistorique();
    this.hi = this.hist.length;
    this.brouillon = "";
    this.occupe = false;
    this.annule = false;
    this.construire();
  }
  construire(){
    const el = document.createElement("div");
    el.className = "fen";
    el.tabIndex = -1;
    el.innerHTML =
      '<div class="fen-tete">'+
        '<span class="pastille"></span>'+
        '<span class="chemin"></span>'+
        '<span class="fen-outils">'+
          '<button data-a="droite" title="Diviser à droite (Ctrl+B D)" aria-label="Diviser à droite">'+ICONES.droite+'</button>'+
          '<button data-a="bas" title="Diviser en bas (Ctrl+B B)" aria-label="Diviser en bas">'+ICONES.bas+'</button>'+
          '<button data-a="zoom" title="Plein écran (Ctrl+B Z)" aria-label="Plein écran">'+ICONES.zoom+'</button>'+
          '<button data-a="fermer" class="danger" title="Fermer (Ctrl+B X)" aria-label="Fermer la fenêtre">'+ICONES.x+'</button>'+
        '</span>'+
      '</div>'+
      '<div class="fen-corps">'+
        '<div class="sortie"></div>'+
        '<div class="invite">'+
          '<span class="ps1"></span>'+
          '<input class="champ" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="ligne de commande">'+
          '<span class="curseur clignote"></span>'+
        '</div>'+
      '</div>';
    this.el = el;
    this.corps  = el.querySelector(".fen-corps");
    this.sortie = el.querySelector(".sortie");
    this.inviteEl = el.querySelector(".invite");
    this.ps1El = el.querySelector(".ps1");
    this.champ = el.querySelector(".champ");
    this.curseur = el.querySelector(".curseur");

    el.querySelector(".fen-outils").addEventListener("mousedown", e => e.stopPropagation());
    el.querySelector(".fen-outils").addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      e.stopPropagation();
      Terminal.activer(this);
      const a = b.dataset.a;
      if(a === "droite") Terminal.diviser("row");
      if(a === "bas")    Terminal.diviser("col");
      if(a === "zoom")   Terminal.zoom();
      if(a === "fermer") Terminal.fermerFenetre();
    });
    el.addEventListener("mousedown", () => Terminal.activer(this));
    this.corps.addEventListener("click", () => {
      const sel = window.getSelection();
      if(sel && String(sel).length) return;
      this.focus();
    });
    this.champ.addEventListener("input", () => this.majCurseur());
    this.champ.addEventListener("keyup", () => this.majCurseur());
    this.champ.addEventListener("click", () => this.majCurseur());
    this.champ.addEventListener("keydown", e => this.touche(e));
    this.champ.addEventListener("focus", () => Terminal.activer(this));
    this.majPS1();
  }

  /* --- affichage --- */
  ecrire(html, cls){
    const d = document.createElement("div");
    d.className = "ligne" + (cls ? " " + cls : "");
    d.innerHTML = html === "" ? "&nbsp;" : html;
    this.sortie.appendChild(d);
    this.bas();
    return d;
  }
  txt(s, cls){ return this.ecrire(esc(s), cls); }
  saut(){ const d = document.createElement("div"); d.className = "ligne vide"; this.sortie.appendChild(d); }
  bas(){ this.corps.scrollTop = this.corps.scrollHeight; }

  majPS1(){
    this.ps1El.innerHTML =
      '<span class="u">' + esc(Terminal.utilisateur) + '</span><span class="f">@</span><span class="h">lexos</span>' +
      '<span class="f">:</span><span class="p">' + esc(joli(this.cwd)) + '</span><span class="f">$</span>&nbsp;';
    const t = this.el.querySelector(".chemin");
    t.textContent = "fen " + this.id + " · " + joli(this.cwd);
    requestAnimationFrame(() => this.majCurseur());
    Terminal.majEtat();
  }
  majCurseur(){
    const cw = Terminal.largeurCar(this.champ);
    const dep = this.champ.selectionStart ?? this.champ.value.length;
    const gauche = this.ps1El.offsetWidth + dep * cw - this.champ.scrollLeft;
    this.curseur.style.left = Math.max(0, gauche) + "px";
    this.curseur.style.width = Math.max(6, cw) + "px";
    this.curseur.classList.remove("clignote");
    clearTimeout(this._tc);
    this._tc = setTimeout(() => this.curseur.classList.add("clignote"), 420);
  }
  focus(){ if(!this.occupe) this.champ.focus({preventScroll:true}); this.bas(); }

  /* --- clavier --- */
  touche(e){
    if(Terminal.prefixe) return;             /* le mode préfixe a la priorité */
    if(e.key === "Enter"){
      e.preventDefault();
      const v = this.champ.value;
      this.champ.value = "";
      this.soumettre(v);
    } else if(e.key === "ArrowUp"){
      e.preventDefault();
      if(this.hi === this.hist.length) this.brouillon = this.champ.value;
      if(this.hi > 0){ this.hi--; this.champ.value = this.hist[this.hi]; this.finLigne(); }
    } else if(e.key === "ArrowDown"){
      e.preventDefault();
      if(this.hi < this.hist.length){
        this.hi++;
        this.champ.value = this.hi === this.hist.length ? this.brouillon : this.hist[this.hi];
        this.finLigne();
      }
    } else if(e.key === "Tab"){
      e.preventDefault(); this.completer();
    } else if(e.key === "l" && e.ctrlKey){
      e.preventDefault(); this.effacer();
    } else if(e.key === "c" && e.ctrlKey && !this.champ.selectionEnd){
      e.preventDefault();
      this.ecrire(this.ps1El.innerHTML + esc(this.champ.value) + '<span class="r">^C</span>');
      this.champ.value = ""; this.annule = true; this.majCurseur();
    } else if(e.key === "u" && e.ctrlKey){
      e.preventDefault(); this.champ.value = ""; this.majCurseur();
    }
  }
  finLigne(){
    const n = this.champ.value.length;
    requestAnimationFrame(() => { this.champ.setSelectionRange(n,n); this.majCurseur(); });
  }
  async completer(){
    const v = this.champ.value;
    const args = v.split(/\s+/);
    const frag = args[args.length-1] || "";
    if(args.length <= 1){
      const choix = Object.keys(COMMANDES).filter(c => c.startsWith(frag));
      if(choix.length === 1){ this.champ.value = choix[0] + " "; this.finLigne(); }
      else if(choix.length > 1) this.ecrire(this.ps1El.innerHTML + esc(v)) &&
        this.ecrire(choix.map(c => '<span class="j">'+esc(c)+"</span>").join("   "));
      return;
    }
    //  ═══ COMPLÉTION SUR LE VRAI SYSTÈME DE FICHIERS ═══
    //  Aucune route à part : on réutilise /api/exec avec « compgen », le
    //  même outil que bash emploie lui-même pour Tab. C'est bash qui
    //  connaît les vrais fichiers, jamais une liste recopiée ici.
    if(!Terminal.backend) return;
    const rep = await Terminal.backend(
      "compgen -A file -- " + JSON.stringify(frag).replace(/'/g,"'\\''"),
      {cwd:this.cwd, fenetre:this.id});
    if(!rep) return;
    const choix = desEchapper(rep.sortie).split("\n").map(s => s.trim()).filter(Boolean);
    if(choix.length === 1){
      args[args.length-1] = choix[0];
      this.champ.value = args.join(" ");
      this.finLigne();
    } else if(choix.length > 1){
      this.ecrire(this.ps1El.innerHTML + esc(v));
      this.ecrire(choix.map(c => '<span class="t2">'+esc(c)+"</span>").join("   "));
    }
  }
  effacer(){ this.sortie.innerHTML = ""; this.bas(); }

  /* --- exécution --- */
  async soumettre(ligne){
    this.ecrire(this.ps1El.innerHTML + esc(ligne));
    const brut = ligne.trim();
    if(brut){
      this.hist.push(brut); sauverHistorique(this.hist);
    }
    this.hi = this.hist.length; this.brouillon = "";
    if(!brut){ this.bas(); return; }

    this.occupe = true; this.annule = false;
    this.el.classList.add("occupe");
    const attente = this.ecrire('<span class="travaille"></span>');
    try {
      await this.executer(brut);
    } catch(err){
      this.txt("lexsh : erreur interne — " + err.message, "r");
    }
    attente.remove();
    this.occupe = false;
    this.el.classList.remove("occupe");
    this.majPS1();
    if(Terminal.active === this) this.focus();
    this.bas();
  }
  async executer(brut){
    const nom = premierMot(brut);
    const cmd = COMMANDES[nom];
    if(cmd){ await cmd.run(this, brut.trim().slice(nom.length).trim().split(/\s+/).filter(Boolean)); return; }
    if(!Terminal.backend){
      this.ecrire('<span class="r">lexsh : pas de backend branché</span>' +
                  '<span class="s"> — ouvre cette page avec </span>' +
                  '<span class="j">lexos-pro-terminal</span>' +
                  '<span class="s">, pas directement dans un onglet de navigateur.</span>');
      return;
    }
    const rep = await Terminal.backend(brut, {cwd:this.cwd, fenetre:this.id});
    if(!rep) return;
    if(rep.sortie) this.ecrire(rep.sortie);
    if(typeof rep.cwd === "string" && rep.cwd && rep.cwd !== this.cwd){
      this.cwd = rep.cwd;
    }
  }
}

/* =========================================================
   4. Arbre de disposition : feuilles + divisions
   ========================================================= */
function feuille(fen){ return {type:"feuille", fen}; }

class Onglet {
  constructor(fen){
    this.racine = feuille(fen);
    this.zoomee = null;
    this.el = document.createElement("div");
    this.el.className = "tab-root";
    this.el.setAttribute("role","tabpanel");
  }
  fenetres(n = this.racine, acc = []){
    if(n.type === "feuille") acc.push(n.fen);
    else { this.fenetres(n.a, acc); this.fenetres(n.b, acc); }
    return acc;
  }
  chercher(fen, n = this.racine, p = null){
    if(n.type === "feuille") return n.fen === fen ? {noeud:n, parent:p} : null;
    return this.chercher(fen, n.a, n) || this.chercher(fen, n.b, n);
  }
  rendre(){
    this.el.innerHTML = "";
    if(this.zoomee && this.fenetres().includes(this.zoomee)){
      this.el.appendChild(this.zoomee.el);
      this.zoomee.el.style.flex = "1";
      return;
    }
    this.zoomee = null;
    this.el.appendChild(this.construire(this.racine));
  }
  construire(n){
    if(n.type === "feuille"){ n.fen.el.style.flex = "1"; return n.fen.el; }
    const box = document.createElement("div");
    box.className = "noeud " + n.dir;
    const a = this.construire(n.a), b = this.construire(n.b);
    a.style.flex = n.ratio + " 1 0%";
    b.style.flex = (1 - n.ratio) + " 1 0%";
    const sep = document.createElement("div");
    sep.className = "sep";
    sep.addEventListener("pointerdown", e => this.tirer(e, n, box, a, b, sep));
    box.append(a, sep, b);
    return box;
  }
  tirer(e, n, box, a, b, sep){
    e.preventDefault();
    sep.setPointerCapture(e.pointerId);
    sep.classList.add("tire");
    const horiz = n.dir === "row";
    const bouger = ev => {
      const r = box.getBoundingClientRect();
      let t = horiz ? (ev.clientX - r.left) / r.width : (ev.clientY - r.top) / r.height;
      t = Math.min(.88, Math.max(.12, t));
      n.ratio = t;
      a.style.flex = t + " 1 0%";
      b.style.flex = (1 - t) + " 1 0%";
    };
    const finir = () => {
      sep.classList.remove("tire");
      sep.removeEventListener("pointermove", bouger);
      sep.removeEventListener("pointerup", finir);
      sep.removeEventListener("pointercancel", finir);
    };
    sep.addEventListener("pointermove", bouger);
    sep.addEventListener("pointerup", finir);
    sep.addEventListener("pointercancel", finir);
  }
}

/* =========================================================
   5. Terminal : onglets, fenêtres, raccourcis
   ========================================================= */
const Terminal = {
  onglets: [], iOnglet: 0, active: null,
  backend: null, prefixe: false, utilisateur: "lexos",
  _cw: null,

  init(){
    this.travail = document.getElementById("travail");
    this.barre   = document.getElementById("onglets");
    document.getElementById("plus").addEventListener("click", () => this.nouvelOnglet());
    window.addEventListener("keydown", e => this.clavier(e), true);
    this.nouvelOnglet(true);
    setInterval(() => this.horloge(), 1000); this.horloge();
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
      this._cw = null; this.onglets.forEach(o => o.fenetres().forEach(f => f.majCurseur()));
    });
    window.addEventListener("resize", () => this.active && this.active.majCurseur());
  },

  largeurCar(champ){
    if(this._cw) return this._cw;
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
    probe.style.font = getComputedStyle(champ).font;
    probe.textContent = "0".repeat(100);
    document.body.appendChild(probe);
    this._cw = probe.getBoundingClientRect().width / 100;
    probe.remove();
    return this._cw;
  },

  get onglet(){ return this.onglets[this.iOnglet]; },

  nouvelOnglet(premier){
    const fen = new Fenetre(ACCUEIL);
    const ong = new Onglet(fen);
    this.onglets.push(ong);
    this.travail.appendChild(ong.el);
    ong.el.classList.add("de-droite");
    this.iOnglet = this.onglets.length - 1;
    ong.rendre();
    this.majOnglets();
    this.activer(fen);
    bienvenue(fen, premier);
  },
  fermerOnglet(i){
    if(this.onglets.length === 1) return;
    const ong = this.onglets[i];
    ong.el.remove();
    this.onglets.splice(i, 1);
    this.iOnglet = Math.min(this.iOnglet, this.onglets.length - 1);
    this.majOnglets();
    this.activer(this.onglet.fenetres()[0]);
  },
  allerOnglet(i){
    if(i < 0 || i >= this.onglets.length || i === this.iOnglet) return;
    const cible = this.onglets[i].el;
    cible.classList.remove("de-droite","de-gauche");
    void cible.offsetWidth;                       /* relance l'animation */
    cible.classList.add(i > this.iOnglet ? "de-droite" : "de-gauche");
    this.iOnglet = i;
    this.majOnglets();
    const f = this.onglet.fenetres();
    this.activer(f.includes(this.active) ? this.active : f[0]);
  },
  majOnglets(){
    this.barre.innerHTML = "";
    const glisseur = document.createElement("div");
    glisseur.id = "glisseur";
    this.onglets.forEach((o, i) => {
      const t = document.createElement("div");
      t.className = "onglet";
      t.setAttribute("role","tab");
      t.setAttribute("aria-selected", i === this.iOnglet ? "true" : "false");
      const n = o.fenetres().length;
      t.innerHTML = '<span class="num">'+(i+1)+'</span><span class="nom">lexsh'+
                    (n>1 ? ' · '+n+' fen.' : '')+'</span>'+
                    (this.onglets.length > 1 ? '<span class="x" title="Fermer l\'onglet">×</span>' : '');
      t.addEventListener("click", e => {
        if(e.target.classList.contains("x")){ this.fermerOnglet(i); return; }
        this.allerOnglet(i);
      });
      this.barre.appendChild(t);
    });
    this.barre.appendChild(glisseur);
    const actif = this.barre.children[this.iOnglet];
    if(actif){
      const poser = () => { glisseur.style.left = actif.offsetLeft + "px"; glisseur.style.width = actif.offsetWidth + "px"; };
      if(this._glisseurPret) poser();
      else { glisseur.style.transition = "none"; poser(); requestAnimationFrame(() => { glisseur.style.transition = ""; }); this._glisseurPret = true; }
      actif.scrollIntoView({block:"nearest", inline:"nearest", behavior:"smooth"});
    }
    this.onglets.forEach((o, i) => o.el.classList.toggle("actif", i === this.iOnglet));
    this.majEtat();
  },

  activer(fen){
    if(this.active === fen && fen && fen.el.classList.contains("actif")) return;
    this.active = fen;
    this.onglets.forEach(o => o.fenetres().forEach(f => f.el.classList.toggle("actif", f === fen)));
    if(fen) fen.focus();
    this.majEtat();
  },

  diviser(dir){
    const ong = this.onglet, fen = this.active;
    if(!fen) return;
    const t = ong.chercher(fen);
    if(!t) return;
    const rect = fen.el.getBoundingClientRect();
    if((dir === "row" && rect.width < 260) || (dir === "col" && rect.height < 150)){
      fen.txt("lexsh : pas assez de place pour diviser cette fenêtre.", "j");
      return;
    }
    const neuve = new Fenetre(fen.cwd);
    const feuilleAncienne = feuille(fen);
    const nouveau = {type:"division", dir, ratio:.5, a:feuilleAncienne, b:feuille(neuve)};
    if(t.parent === null) ong.racine = nouveau;
    else if(t.parent.a === t.noeud) t.parent.a = nouveau;
    else t.parent.b = nouveau;
    ong.zoomee = null;
    ong.rendre();
    this.majOnglets();
    this.activer(neuve);
    bienvenue(neuve, false);
  },
  fermerFenetre(){
    const ong = this.onglet, fen = this.active;
    const liste = ong.fenetres();
    if(liste.length === 1){
      if(this.onglets.length === 1){
        fen.txt("lexsh : dernière fenêtre — on la garde ouverte.", "j");
        return;
      }
      this.fermerOnglet(this.iOnglet);
      return;
    }
    const t = ong.chercher(fen);
    const frere = t.parent.a === t.noeud ? t.parent.b : t.parent.a;
    const gp = this.parentDe(t.parent, ong.racine, null);
    if(gp === null) ong.racine = frere;
    else if(gp.a === t.parent) gp.a = frere;
    else gp.b = frere;
    ong.zoomee = null;
    ong.rendre();
    this.majOnglets();
    this.activer(ong.fenetres()[0]);
  },
  parentDe(cible, n, p){
    if(n === cible) return p;
    if(n.type === "feuille") return null;
    const g = this.parentDe(cible, n.a, n);
    return g !== null ? g : this.parentDe(cible, n.b, n);
  },
  zoom(){
    const ong = this.onglet;
    if(ong.fenetres().length === 1) return;
    ong.zoomee = ong.zoomee ? null : this.active;
    ong.rendre();
    this.activer(this.active);
  },
  naviguer(dir){
    const liste = this.onglet.fenetres();
    if(liste.length < 2) return;
    const r0 = this.active.el.getBoundingClientRect();
    const c0 = {x:r0.left + r0.width/2, y:r0.top + r0.height/2};
    let meilleur = null, dist = Infinity;
    for(const f of liste){
      if(f === this.active) continue;
      const r = f.el.getBoundingClientRect();
      const c = {x:r.left + r.width/2, y:r.top + r.height/2};
      const dx = c.x - c0.x, dy = c.y - c0.y;
      const ok = dir === "ArrowLeft" ? dx < -1 : dir === "ArrowRight" ? dx > 1
               : dir === "ArrowUp"   ? dy < -1 : dy > 1;
      if(!ok) continue;
      const d = Math.hypot(dx, dy);
      if(d < dist){ dist = d; meilleur = f; }
    }
    if(meilleur) this.activer(meilleur);
  },

  clavier(e){
    if(this.prefixe){
      e.preventDefault(); e.stopPropagation();
      this.prefixe = false;
      document.getElementById("prefixe-ind").classList.remove("on");
      const k = e.key.toLowerCase();
      if(k === "t" || k === "c") this.nouvelOnglet();
      else if(k === "n") this.allerOnglet((this.iOnglet + 1) % this.onglets.length);
      else if(k === "p") this.allerOnglet((this.iOnglet - 1 + this.onglets.length) % this.onglets.length);
      else if(k === "d") this.diviser("row");
      else if(k === "b") this.diviser("col");
      else if(k === "x") this.fermerFenetre();
      else if(k === "z") this.zoom();
      else if(k === "o"){ const l = this.onglet.fenetres(); this.activer(l[(l.indexOf(this.active)+1) % l.length]); }
      else if(e.key.startsWith("Arrow")) this.naviguer(e.key);
      else if(/^[1-9]$/.test(k)) this.allerOnglet(parseInt(k,10) - 1);
      return;
    }
    if(e.ctrlKey && (e.key === "PageDown" || e.key === "PageUp")){
      e.preventDefault();
      const d = e.key === "PageDown" ? 1 : -1;
      this.allerOnglet((this.iOnglet + d + this.onglets.length) % this.onglets.length);
      return;
    }
    if(e.ctrlKey && !e.altKey && !e.shiftKey && e.key.toLowerCase() === "b"){
      e.preventDefault();
      this.prefixe = true;
      document.getElementById("prefixe-ind").classList.add("on");
      clearTimeout(this._tp);
      this._tp = setTimeout(() => {
        this.prefixe = false;
        document.getElementById("prefixe-ind").classList.remove("on");
      }, 3000);
    }
  },

  majEtat(){
    const nf = this.onglet ? this.onglet.fenetres().length : 1;
    document.getElementById("e-onglets").textContent = this.onglets.length;
    document.getElementById("e-onglets-m").textContent = this.onglets.length > 1 ? "pages" : "page";
    document.getElementById("e-fen").textContent = nf;
    document.getElementById("e-fen-m").textContent = nf > 1 ? "fenêtres" : "fenêtre";
    document.getElementById("e-chemin").textContent = this.active ? joli(this.active.cwd) : "~";
  },
  horloge(){
    const d = new Date();
    document.getElementById("horloge").textContent =
      String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") + ":" +
      String(d.getSeconds()).padStart(2,"0");
  }
};

    f.ecrire('<span class="s">Lance </span><span class="j">lexos-pro-terminal</span><span class="s"> pour l\'obtenir.</span>');
  }
  f.saut();
}, "Fenêtres");

cmd("about", "à propos de ce terminal", f => {
  f.saut();
  f.ecrire('<span class="gras">LexOS Pro Terminal</span> <span class="s">— le terminal officiel de LexOS Pro.</span>');
  f.ecrire('<span class="s">Onglets illimités · divisions horizontales et verticales imbriquées · séparateurs déplaçables ·</span>');
  f.ecrire('<span class="s">historique persistant · complétion Tab sur le vrai système · thème noir pur, texte blanc.</span>');
  f.ecrire('<span class="s">Les commandes tapées ici s\'exécutent réellement, via </span><span class="d">/usr/lib/lexos/terminal-pro.py</span><span class="s">.</span>');
  f.ecrire('<span class="s">Les programmes plein écran (vim, nano, htop…) restent l\'affaire du </span><span class="j">Terminal classique</span><span class="s">.</span>');
  f.saut();
}, "Fenêtres");

/* =========================================================
   8. API publique + démarrage
   ========================================================= */
window.LexOS = {
  fenetreActive(){ return Terminal.active; },
  nouvelOnglet(){ Terminal.nouvelOnglet(); },
  diviser(dir){ Terminal.diviser(dir === "bas" ? "col" : "row"); },
  ecrire(txt){ if(Terminal.active) Terminal.active.txt(txt); }
};

//  ═══ CROCHET DE BANC ═══
//  Expose les morceaux qu'un banc peut éprouver SANS un vrai navigateur —
//  même principe que app.js:__banc. « _BANC_NE_PAS_DEMARRER » retient le
//  démarrage automatique (qui suppose un vrai DOM complet) pendant qu'on
//  teste ces fonctions à la pièce.
if(typeof globalThis !== "undefined"){
  globalThis.__banc = { COMMANDES, Terminal, Fenetre, premierMot, esc, joli,
                         desEchapper, appelBackend, get ACCUEIL(){ return ACCUEIL; } };
}

async function demarrage(){
  if(_port && _jeton){
    Terminal.backend = appelBackend;
    //  Le VRAI dossier personnel, avant d'ouvrir la première fenêtre — sinon
    //  elle démarrerait dans « ~ » puis changerait de valeur sous les yeux.
    //  UN « \n » ENTRE LES DEUX, EXPLICITEMENT. « printf "%s" » n'ajoute
    //  aucun saut de ligne : sans lui, la sortie de $HOME et celle de
    //  whoami se collaient en une seule chaîne (« /rootroot ») — repéré en
    //  chargeant la vraie page dans un vrai navigateur, contre un vrai
    //  pont : le dossier personnel ET le nom d'utilisateur étaient FAUX
    //  tous les deux, et rien dans un bac à sable avec un fetch simulé ne
    //  pouvait le voir.
    const r = await appelBackend('printf "%s\\n" "$HOME"; whoami', {cwd:"/"});
    if(r && r.sortie){
      const lignes = desEchapper(r.sortie).trim().split("\n");
      if(lignes[0]) ACCUEIL = lignes[0].trim();
      if(lignes[1]) Terminal.utilisateur = lignes[1].trim();
    }
    document.getElementById("backend-ind").textContent = "branché — " + Terminal.utilisateur + "@lexos";
    document.getElementById("backend-ind").className = "branche";
  }
  Terminal.init();
}
if(typeof globalThis === "undefined" || !globalThis.__BANC_NE_PAS_DEMARRER__) demarrage();

})();
</script>
