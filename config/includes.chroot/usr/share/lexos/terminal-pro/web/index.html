<title>LexOS Pro Terminal</title>
<!--  ═══ AUCUNE POLICE DISTANTE, ET CE N'EST PAS UN DÉTAIL ═══
      Cette page allait chercher JetBrains Mono et IBM Plex Sans chez Google
      à CHAQUE ouverture. Vérifié dans un vrai navigateur, contre ce vrai
      pont : la requête échoue (ERR_CONNECTION_RESET) — un système installé
      sur un portable n'a pas toujours le réseau, et l'ISO doit fonctionner
      hors ligne par principe. Trois conséquences, toutes mauvaises :
        · le terminal principal du système attend une réponse qui ne vient
          pas avant de peindre son premier caractère ;
        · xterm.js MESURE la largeur d'un caractère pour calculer le nombre
          de colonnes : si la police change en cours de route, la grille est
          mesurée deux fois et le shell reçoit deux tailles différentes ;
        · ouvrir un terminal ne devrait rien annoncer à personne.
      La police vient donc du paquet Debian « fonts-jetbrains-mono » (liste
      obligatoire lexos-core), comme tout le reste. -->

<!--  ═══ xterm.js — LA GRILLE DE CARACTÈRES, ET D'OÙ ELLE VIENT ═══
      Le pont ouvre maintenant un VRAI pseudo-terminal : ce qui en sort n'est
      plus un journal de lignes, c'est un flot d'ordres — place le curseur
      ici, efface de là à la fin, inverse ces couleurs. Interpréter ça
      demande une grille de caractères ; l'écrire à la main reviendrait à
      réécrire xterm.js.

      CES DEUX FICHIERS NE SONT PAS DANS LE DÉPÔT : ce sont des liens posés
      au moment de construire l'ISO (hook 0455) vers /usr/share/nodejs, que
      le paquet Debian « node-xterm » installe. Même règle que PySide6 pour
      le pont : les bibliothèques viennent des paquets de la distribution,
      jamais de npm ni de « pip --break-system-packages ». -->
<link rel="stylesheet" href="vendor/xterm.css">
<script src="vendor/xterm.js"></script>
<script src="vendor/xterm-addon-fit.js"></script>
<style>
:root{
  color-scheme: dark;
  --noir:        #000000;
  --chrome:      #0a0807;
  --chrome-hi:   #16110d;
  --ligne:       #1a1512;
  --ligne-vive:  #33261e;
  --texte:       #ffffff;
  --texte-2:     #c6bdb7;
  --texte-3:     #7d726b;
  --orange:      #ff6a1a;
  --orange-clair:#ff9d5c;
  --braise:      #E8590C;
  --vert:        #6fd99a;
  --jaune:       #f0c463;
  --rouge:       #ff6f6f;
  --mauve:       #93a9c2;
  --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --r: 5px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--noir);
  color:var(--texte);
  font-family:var(--sans);
  font-size:14px;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--orange);outline-offset:1px}

/* ---------- coquille ---------- */
#app{height:100dvh;display:flex;flex-direction:column;background:var(--noir)}

/* ---------- barre d'onglets ---------- */
#barre{
  display:flex;align-items:stretch;gap:0;
  background:var(--chrome);
  border-bottom:1px solid var(--ligne);
  padding-left:10px;
  min-height:38px;
  user-select:none;
}
#marque{
  display:flex;align-items:center;gap:8px;
  padding-right:14px;margin-right:6px;
  border-right:1px solid var(--ligne);
  color:var(--texte-3);
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  white-space:nowrap;
}
#marque .lys{color:var(--orange);font-size:14px;letter-spacing:0}
/*  ALEX : « je veux on voir bien LEXOS en orange en haut de écran ». */
#marque .nomlex{color:var(--orange);letter-spacing:.02em}
#onglets{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;position:relative}
#onglets::-webkit-scrollbar{display:none}
#glisseur{
  position:absolute;top:0;height:2px;left:0;width:0;
  background:var(--orange);border-radius:0 0 2px 2px;
  transition:left .3s cubic-bezier(.22,.61,.36,1), width .3s cubic-bezier(.22,.61,.36,1);
  pointer-events:none;
}
.onglet{
  display:flex;align-items:center;gap:8px;
  padding:0 10px 0 12px;
  max-width:220px;min-width:112px;
  border-right:1px solid var(--ligne);
  color:var(--texte-3);
  font-size:12.5px;
  position:relative;
  white-space:nowrap;
  cursor:pointer;
}
.onglet .nom{overflow:hidden;text-overflow:ellipsis;flex:1}
.onglet .num{font-family:var(--mono);font-size:10.5px;color:var(--texte-3);opacity:.7}
.onglet:hover{background:var(--chrome-hi);color:var(--texte-2)}
.onglet[aria-selected="true"]{background:var(--noir);color:var(--texte)}
.onglet .x{
  width:18px;height:18px;border-radius:3px;line-height:16px;text-align:center;
  color:var(--texte-3);font-size:14px;flex:none;
}
.onglet .x:hover{background:var(--ligne-vive);color:var(--texte)}
#plus{
  width:36px;flex:none;font-size:18px;color:var(--texte-3);
}
/* Le catalogue d'audit se trouve DANS le terminal officiel, pas dans
   une deuxième application. La barre XFCE continue de n'avoir besoin
   que de l'icône Terminal existante. */
#audit{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:0 12px;color:var(--texte-2);font-size:12px;
  border-left:1px solid var(--ligne);white-space:nowrap;
}
#audit .pic{font-size:15px;color:var(--orange)}
#audit:hover{background:var(--chrome-hi);color:var(--orange)}
@media(max-width:680px){#audit .libelle{display:none}#audit{padding:0 10px}}
#plus:hover{color:var(--texte);background:var(--chrome-hi)}

/* ---------- espace de travail ---------- */
#travail{flex:1;min-height:0;position:relative;background:var(--noir)}
.tab-root{position:absolute;inset:0;display:none}
.tab-root.actif{display:flex;animation:page-fondu .3s cubic-bezier(.22,.61,.36,1) both}
.tab-root.actif.de-droite{animation-name:page-droite}
.tab-root.actif.de-gauche{animation-name:page-gauche}
@keyframes page-fondu{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:none}}
@keyframes page-droite{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes page-gauche{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

.noeud{display:flex;min-width:0;min-height:0;flex:1}
.noeud.row{flex-direction:row}
.noeud.col{flex-direction:column}

.sep{flex:none;background:var(--ligne);position:relative;z-index:2}
.noeud.row > .sep{width:1px;cursor:col-resize}
.noeud.col > .sep{height:1px;cursor:row-resize}
.sep::after{content:"";position:absolute;inset:-3px}
.noeud.row > .sep:hover,.noeud.col > .sep:hover,.sep.tire{background:var(--orange)}

/* ---------- fenêtre (pane) ---------- */
.fen{
  display:flex;flex-direction:column;min-width:0;min-height:0;flex:1;
  background:var(--noir);
  border:1px solid transparent;
  animation:fen-entre .22s ease both;
}
@keyframes fen-entre{from{opacity:.35}to{opacity:1}}
.fen.actif{border-color:#3d2716}
.fen-tete{
  display:flex;align-items:center;gap:8px;flex:none;
  height:24px;padding:0 4px 0 9px;
  background:var(--noir);
  border-bottom:1px solid var(--ligne);
  font-size:11px;color:var(--texte-3);
  user-select:none;
}
.fen.actif .fen-tete{border-bottom-color:#3d2716}
.fen-tete .pastille{
  width:6px;height:6px;border-radius:50%;background:var(--ligne-vive);flex:none;
}
.fen.actif .fen-tete .pastille{background:var(--orange)}
.fen-tete .chemin{
  font-family:var(--mono);font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.fen.actif .fen-tete .chemin{color:var(--texte-2)}
.fen-outils{display:flex;gap:1px;flex:none}
.fen-outils button{
  width:22px;height:18px;border-radius:3px;
  color:var(--texte-3);
  display:grid;place-items:center;
}
.fen-outils button:hover{background:var(--ligne-vive);color:var(--texte)}
.fen-outils button.danger:hover{background:#3a1414;color:var(--rouge)}
.fen-outils svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.6}

/*  Le corps ne défile plus lui-même : c'est xterm.js qui gère le
    défilement, l'historique et la molette, à l'intérieur. « position
    relative » + « overflow hidden » lui donnent un cadre exact à remplir. */
.fen-corps{
  flex:1;min-height:0;position:relative;overflow:hidden;
  cursor:text;
}

/*  ═══ L'ÉCRAN : xterm.js occupe tout le corps du volet ═══
    Ce qui a disparu ici, et pourquoi : « .sortie » (le journal de lignes),
    « .invite », « .champ » (la ligne de saisie maison) et « .curseur »
    (un rectangle qu'on repositionnait à la main). C'est bash qui tient
    l'invite et l'historique, et xterm.js qui tient le curseur — les avoir
    en double donnerait deux curseurs et deux historiques désaccordés. */
.ecran{position:absolute;inset:0}
.ecran .xterm{height:100%;padding:6px 8px}
.ecran .xterm-viewport{background:transparent!important;scrollbar-width:thin;scrollbar-color:var(--ligne-vive) transparent}
.ecran .xterm-viewport::-webkit-scrollbar{width:9px}
.ecran .xterm-viewport::-webkit-scrollbar-thumb{background:var(--ligne-vive);border-radius:9px}
.ecran .xterm-viewport::-webkit-scrollbar-track{background:transparent}
/*  Le volet qui n'a pas le focus garde un curseur visible mais éteint :
    sans ça, on ne sait plus lequel des quatre volets reçoit les frappes. */
.fen:not(.actif) .ecran{opacity:.82}

/* ---------- barre d'état ---------- */
#etat{
  flex:none;display:flex;align-items:center;gap:14px;
  height:26px;padding:0 12px;
  background:var(--chrome);
  border-top:1px solid var(--ligne);
  font-family:var(--mono);font-size:11px;color:var(--texte-3);
  user-select:none;
}
#etat .bloc{display:flex;align-items:center;gap:6px;white-space:nowrap}
#etat .k{color:var(--texte-2)}
#etat .sep-v{width:1px;height:12px;background:var(--ligne-vive);flex:none}
#etat .pousse{margin-left:auto}
#etat kbd{
  font-family:var(--mono);font-size:10px;color:var(--texte-2);
  border:1px solid var(--ligne-vive);border-radius:3px;padding:0 4px;line-height:15px;display:inline-block;
}
#horloge{font-variant-numeric:tabular-nums;color:var(--texte-2)}
#prefixe-ind{color:var(--noir);background:var(--jaune);padding:0 6px;border-radius:3px;font-weight:700;display:none}
#prefixe-ind.on{display:inline-block}
#backend-ind{padding:0 6px;border-radius:3px;font-weight:600}
#backend-ind.branche{color:var(--vert)}
#backend-ind.absent{color:var(--rouge)}
@media (max-width:820px){#etat .cacher-mobile{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
(function(){

/* =========================================================
   1. Le pont vers le vrai système — lexos-terminal-pro.py
   ========================================================= */
/*  ═══ LE PONT : TROIS ROUTES, UN VRAI PSEUDO-TERMINAL ═══
    ALEX : « j'ai beau essayer le terminal LexOS Pro, je suis même pas
    capable de lancer claude ». Ce n'était pas un bogue mais l'architecture :
    chaque commande partait dans un bash jetable, entrée fermée, sortie
    ramassée à la fin, tué au bout de 25 secondes — et sans pseudo-terminal,
    donc isatty() faux, donc claude refusait de démarrer.

    Maintenant, chaque volet a SON shell, vivant, derrière un vrai pty :

      GET  /api/flux?fen=…   la sortie, en flux continu (SSE)
      POST /api/saisie       les frappes, telles quelles
      POST /api/taille       colonnes × lignes (TIOCSWINSZ)
      POST /api/fermer       raccroche le shell et tout ce qu'il a lancé

    LA SÉCURITÉ N'A PAS BOUGÉ : 127.0.0.1 seulement, le jeton tiré au hasard
    exigé dans l'en-tête X-Lexos-Jeton de CHAQUE requête, l'origine vérifiée.
    Le raisonnement est écrit en tête de /usr/lib/lexos/terminal-pro.py. */
const _params = new URLSearchParams(location.search);
const _port  = _params.get("port");
const _jeton = _params.get("jeton");

/*  ═══ UN SEUL FLUX POUR TOUS LES VOLETS — ET POURQUOI ═══
    Chaque volet ouvrait SON flux « /api/flux?fen=… », une connexion HTTP
    tenue ouverte tant que le volet vit. Or un navigateur n'accorde que SIX
    connexions simultanées par origine en HTTP/1.1. MESURÉ dans un vrai
    Chromium contre le vrai pont, en ouvrant les flux un à un :

        1 à 5 flux ouverts → /api/saisie répond en 3 à 6 ms
        6 flux et au-delà  → /api/saisie ne répond plus (abandonné à 5 s)

    Au sixième volet — trois onglets divisés en deux, c'est vite arrivé — le
    terminal se figeait ENTIÈREMENT : plus une frappe, plus un
    redimensionnement, et rien à l'écran pour le dire.

    Le pont accepte donc « fens=a,b,c » : un seul flux suit tous les volets et
    étiquette chaque bloc avec le volet auquel il appartient. Ouvrir un volet
    est devenu une requête COURTE (« /api/ouvrir »), qui ne tient rien.
    Résultat : UNE connexion tenue, quel que soit le nombre de volets. */
const FLUX = {
  volets: new Map(),
  _ctl: null,
  _relance: null,

  /*  Ouvrir ou fermer un volet ne ROUVRE PAS le flux : le pont suit
      « toutes les sessions » (fens=*) et découvre les nouvelles tout seul.
      Rouvrir obligerait à abandonner la requête en cours — une requête
      échouée dans la page, que le banc du navigateur signale à juste titre. */
  ajouter(v){ this.volets.set(String(v.id), v); this.demarrer(); },
  retirer(id){ this.volets.delete(String(id)); },

  demarrer(){
    if(this._ctl) return;               /* déjà ouvert, il suit tout */
    if(this._relance) clearTimeout(this._relance);
    this._relance = setTimeout(() => { this._relance = null; this.boucle(); }, 0);
  },

  async boucle(){
    if(!this.volets.size || !_port || !_jeton) return;
    const ctl = new AbortController();
    this._ctl = ctl;
    const q = new URLSearchParams({fens: "*"});
    let r;
    try{
      r = await fetch("/api/flux?" + q.toString(),
                      {headers:{"X-Lexos-Jeton":_jeton}, signal: ctl.signal});
    }catch(e){ return; }
    if(!r || !r.ok || !r.body || this._ctl !== ctl) return;
    const lecteur = r.body.getReader();
    const dec = new TextDecoder();
    let reste = "";
    for(;;){
      let bloc;
      try{ bloc = await lecteur.read(); }catch(e){ break; }
      if(bloc.done) break;
      if(this._ctl !== ctl) return;          /* un flux plus récent a pris la main */
      reste += dec.decode(bloc.value, {stream:true});
      const parts = reste.split("\n\n");
      reste = parts.pop();
      for(const ev of parts){
        if(ev.startsWith("event: fin")){
          const m = ev.match(/\ndata: (.*)$/);
          const v = m && this.volets.get(m[1].trim());
          if(v){ this.volets.delete(m[1].trim()); v.finSession(); }
          continue;
        }
        for(const ligne of ev.split("\n")){
          if(!ligne.startsWith("data: ")) continue;   /* « : … » = maintien */
          const reste2 = ligne.slice(6);
          const sep = reste2.indexOf(" ");
          if(sep < 0) continue;
          const v = this.volets.get(reste2.slice(0, sep));
          if(v && v.term) v.term.write(base64Octets(reste2.slice(sep + 1)));
        }
      }
    }
    /*  Le tuyau s'est refermé (pont relancé, hoquet). Si des volets
        attendent encore, on rouvre. */
    if(this._ctl === ctl){ this._ctl = null; if(this.volets.size) this.demarrer(); }
  },
};

//  xterm.js s'installe sur « window.Terminal ». Or CE fichier appelle déjà
//  « Terminal » son gestionnaire d'onglets et de divisions, et son « const »
//  masque le global dans toute cette portée. On capture donc la classe sous
//  un autre nom : « window.Terminal » est une lecture de PROPRIÉTÉ, que le
//  masquage de l'identifiant ne touche pas.
const XTerm = window.Terminal;
const XFit  = window.FitAddon && window.FitAddon.FitAddon;

const ENTETES = { "Content-Type": "application/json", "X-Lexos-Jeton": _jeton || "" };

//  « ~ » veut dire « le dossier personnel, décidé par le pont ». La page ne
//  demande plus $HOME au démarrage : c'est le shell qui sait où il est, et
//  c'est lui qui l'écrit dans son invite. Une seule source de vérité.
let ACCUEIL = "~";

async function poste(route, corps){
  if(!_port || !_jeton) return null;
  try{
    const r = await fetch(route, {method:"POST", headers:ENTETES, body:JSON.stringify(corps)});
    return await r.json();
  }catch(e){ return null; }
}

/* =========================================================
   2. Utilitaires d'affichage
   ========================================================= */
//  « esc » sert encore au seul endroit où l'on écrit du HTML : le message
//  de secours quand xterm.js manque. Tout le reste passe par le terminal,
//  qui ne connaît que des octets — donc plus rien à échapper.
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

//  CE QUI A DISPARU ICI : « joli() » raccourcissait le dossier courant en
//  « ~ » pour l'invite que la page dessinait elle-même, et « sleep() »
//  cadençait l'affichage ligne par ligne. La page ne dessine plus d'invite
//  et n'affiche plus rien à son rythme : bash fait les deux.

/* =========================================================
   3. Fenêtre (pane)
   ========================================================= */
let compteurFen = 0;
const ICONES = {
  droite:'<svg viewBox="0 0 12 12"><rect x="1" y="1.5" width="10" height="9" rx="1"/><line x1="6" y1="1.5" x2="6" y2="10.5"/></svg>',
  bas:   '<svg viewBox="0 0 12 12"><rect x="1" y="1.5" width="10" height="9" rx="1"/><line x1="1" y1="6" x2="11" y2="6"/></svg>',
  zoom:  '<svg viewBox="0 0 12 12"><polyline points="4.5,1.5 1.5,1.5 1.5,4.5"/><polyline points="7.5,10.5 10.5,10.5 10.5,7.5"/></svg>',
  x:     '<svg viewBox="0 0 12 12"><line x1="2.5" y1="2.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="2.5" x2="2.5" y2="9.5"/></svg>'
};

class Fenetre {
  constructor(cwd){
    this.id = ++compteurFen;
    this.cwd = cwd || ACCUEIL;
    this.fermee = false;
    this.construire();
    this.brancher();
  }
  construire(){
    const el = document.createElement("div");
    el.className = "fen";
    el.tabIndex = -1;
    el.innerHTML =
      '<div class="fen-tete">'+
        '<span class="pastille"></span>'+
        '<span class="chemin"></span>'+
        '<span class="fen-outils">'+
          '<button data-a="droite" title="Diviser à droite (Ctrl+B D)" aria-label="Diviser à droite">'+ICONES.droite+'</button>'+
          '<button data-a="bas" title="Diviser en bas (Ctrl+B B)" aria-label="Diviser en bas">'+ICONES.bas+'</button>'+
          '<button data-a="zoom" title="Plein écran (Ctrl+B Z)" aria-label="Plein écran">'+ICONES.zoom+'</button>'+
          '<button data-a="fermer" class="danger" title="Fermer (Ctrl+B X)" aria-label="Fermer la fenêtre">'+ICONES.x+'</button>'+
        '</span>'+
      '</div>'+
      '<div class="fen-corps"><div class="ecran"></div></div>';
    this.el = el;
    this.corps  = el.querySelector(".fen-corps");
    this.hote   = el.querySelector(".ecran");

    el.querySelector(".fen-outils").addEventListener("mousedown", e => e.stopPropagation());
    el.querySelector(".fen-outils").addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      e.stopPropagation();
      Terminal.activer(this);
      const a = b.dataset.a;
      if(a === "droite") Terminal.diviser("row");
      if(a === "bas")    Terminal.diviser("col");
      if(a === "zoom")   Terminal.zoom();
      if(a === "fermer") Terminal.fermerFenetre();
    });
    el.addEventListener("mousedown", () => Terminal.activer(this));
    this.majTitre();
  }

  /* --- L'ÉCRAN : xterm.js, pas un journal de lignes -------------------
     Ce qui a disparu ici : « ecrire/txt/saut » (fabriquer des <div> de
     sortie), « majPS1/majCurseur » (dessiner une invite et un curseur à la
     main), « touche/completer/soumettre/executer » (réimplémenter une ligne
     de commande) et « chargerHistorique/sauverHistorique ». Tout ça existe
     déjà, en mieux : l'invite, l'historique et la complétion sont à bash ;
     le curseur, la grille et le défilement sont à xterm.js. */
  brancher(){
    if(!XTerm){
      //  Pas de bibliothèque : on le DIT dans le volet, on ne laisse pas un
      //  rectangle noir muet. Le lanceur bascule normalement sur le Terminal
      //  classique avant d'en arriver là — ce message est le dernier filet.
      this.hote.innerHTML =
        '<div style="padding:14px;font-family:var(--mono);font-size:12.5px;color:var(--rouge)">'+
        'xterm.js est introuvable — l\'affichage du terminal ne peut pas démarrer.'+
        '<div style="color:var(--texte-3);margin-top:6px">sudo apt install node-xterm, '+
        'puis relance lexos-pro-terminal.</div></div>';
      return;
    }
    this.term = new XTerm({
      allowProposedApi: true,
      cursorBlink: true,
      //  « bar » plutôt que le bloc plein : c'est le curseur de la plupart
      //  des terminaux modernes, et il ne cache pas le caractère dessous.
      cursorStyle: "bar",
      fontFamily: getComputedStyle(document.documentElement).getPropertyValue("--mono").trim()
                  || "monospace",
      fontSize: 12.5,
      lineHeight: 1.2,
      //  Un historique généreux : c'est lui qui remplace le journal qu'on
      //  faisait défiler à la main, et c'est xterm.js qui le tient.
      scrollback: 20000,
      //  Le collage au clic du milieu, comme dans tous les terminaux X.
      rightClickSelectsWord: true,
      theme: paletteXterm()
    });
    if(XFit){ this.ajust = new XFit(); this.term.loadAddon(this.ajust); }
    this.term.open(this.hote);

    //  ═══ COPIER-COLLER ═══
    //  ALEX y tenait, et xterm.js ne le fait pas tout seul : il intercepte
    //  les frappes AVANT le navigateur. Ctrl+Maj+C/V sont les raccourcis
    //  habituels sous Linux ; Ctrl+C sans sélection doit rester
    //  l'INTERRUPTION (c'est un terminal), et copier seulement quand il y a
    //  quelque chose de sélectionné — exactement ce que font GNOME Console
    //  et xfce4-terminal.
    this.term.attachCustomKeyEventHandler(e => {
      if(e.type !== "keydown") return true;
      if(Terminal.prefixe) return false;          /* Ctrl+B a la priorité */
      if(e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "c"){ this.copier(); return false; }
      if(e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "v"){ this.coller(); return false; }
      if(e.ctrlKey && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "c"
         && this.term.hasSelection()){ this.copier(); return false; }
      return true;
    });
    //  Le clic du milieu colle la sélection, comme partout sous X.
    this.hote.addEventListener("auxclick", e => {
      if(e.button === 1){ e.preventDefault(); this.coller(); }
    });

    this.term.onData(d => this.envoyer(d));
    //  onBinary porte les octets bruts que le mode « souris » de certains
    //  programmes émet : les oublier ferait sauter le clic dans htop et vim.
    this.term.onBinary(d => this.envoyer(d));
    this.term.onTitleChange(t => { this.titre = t; this.majTitre(); });

    //  ═══ LA TAILLE ═══
    //  ResizeObserver plutôt que l'événement « resize » de la fenêtre : un
    //  volet change aussi de taille quand on DÉPLACE UN SÉPARATEUR ou qu'on
    //  zoome un autre volet, sans que la fenêtre bouge d'un pixel. Sans ça,
    //  htop dessinerait à l'ancienne largeur (validation n° 7).
    //  insister() plutôt qu'ajuster() : quand un volet réapparaît (onglet
    //  d'arrière-plan, séparateur déplacé), xterm.js n'a pas encore
    //  remesuré au moment où l'observateur nous prévient — un seul essai
    //  laisserait la grille à 80×24. Voir ajuster().
    this._ro = new ResizeObserver(() => this.insister());
    this._ro.observe(this.corps);
    //  La police peut arriver après le premier dessin : une dernière passe
    //  quand le navigateur dit qu'elles sont toutes chargées.
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.insister());

    this.ouvrirFlux();
  }

  /*  ═══ AJUSTER, ET SAVOIR SI ÇA A PRIS ═══
      MESURÉ, et c'est un vrai défaut trouvé par la CI : sur le coureur
      GitHub, le terminal s'ouvrait en 80×24 — la grille PAR DÉFAUT de
      xterm.js — dans une fenêtre de 1200×760. Le shell y voyait 80
      colonnes, donc bash repliait ses lignes à 80 caractères alors qu'il
      restait la moitié de la fenêtre à droite. Et ça ne se corrigeait
      JAMAIS tout seul : il fallait redimensionner la fenêtre.

      LA CAUSE, reproduite ici à l'identique (page cachée au démarrage,
      puis révélée) :
          cachée au démarrage : 80x24
          après révélation    : grille 80x24, corps 1198x670,
                                cellule 7,5375x18, proposé 154x36
      xterm.js ne peut pas mesurer la largeur d'un caractère tant que rien
      n'est dessiné. fit() appelle proposeDimensions(), qui rend « rien »
      dans ce cas — et fit() NE FAIT RIEN, sans le dire. Quand la mesure
      devient possible, plus personne ne rappelle fit() : proposeDimensions
      annonce 154×36 et la grille reste à 80×24.

      C'est exactement l'échec muet que ce dépôt traque : une fonction qui
      rend la main comme si elle avait travaillé. ajuster() dit maintenant
      si la mesure a PRIS, et insister() réessaie tant qu'elle n'a pas pris.  */
  ajuster(){
    if(!this.term || !this.ajust || this.fermee) return false;
    if(this.corps.clientWidth < 20 || this.corps.clientHeight < 20) return false;
    //  proposeDimensions() rend « rien » tant que la largeur d'un caractère
    //  n'est pas mesurable. C'est la SEULE façon de distinguer « ajusté »
    //  de « fit() n'a rien fait » : fit() ne rend rien et ne lève rien.
    let p;
    try{ p = this.ajust.proposeDimensions(); }catch(e){ return false; }
    if(!p || !p.cols || !p.rows) return false;
    try{ this.ajust.fit(); }catch(e){ return false; }
    const c = this.term.cols, l = this.term.rows;
    if(c === this._c && l === this._l) return true;
    this._c = c; this._l = l;
    //  Avant que le flux réponde, il n'y a pas encore de session à
    //  redimensionner : c'est le paramètre « colonnes » de /api/flux qui
    //  porte la taille de départ. Poster ici donnerait un 404 silencieux.
    if(this.pret) poste("/api/taille", {fen:String(this.id), colonnes:c, lignes:l});
    return true;
  }

  /*  ═══ ET ON INSISTE JUSQU'À CE QUE LA MESURE PRENNE ═══
      Une seule chaîne à la fois, elle s'arrête dès qu'ajuster() rend vrai —
      donc sur une machine où la mesure est possible tout de suite (le cas
      normal), c'est UN appel et rien de plus. Deux secondes de plafond :
      passé ce délai, la fenêtre est cachée pour de bon (un onglet en
      arrière-plan ne dessine pas), et le ResizeObserver relancera une
      chaîne quand elle réapparaîtra.  */
  insister(){
    if(this.fermee || this.ajuster() || this._insiste) return;
    this._insiste = true;
    let n = 0;
    const tour = () => {
      if(this.fermee || this.ajuster() || ++n > 120){ this._insiste = false; return; }
      requestAnimationFrame(tour);
    };
    requestAnimationFrame(tour);
  }

  /* --- Les frappes ------------------------------------------------------
     ═══ UNE SEULE ÉCRITURE EN VOL À LA FOIS, ET RIEN NE SE PERD ═══
     MESURÉ dans un vrai navigateur, pas déduit : en tapant « echo tres tot »
     dès l'ouverture de la fenêtre, le shell recevait « trse tot ». Deux
     défauts distincts, et chacun suffit à rendre le terminal inutilisable
     par moments :

       1. CE QUI EST TAPÉ TROP TÔT ÉTAIT PERDU. Cette fonction postait vers
          /api/saisie sans savoir si la session existait ; tant que le flux
          n'avait pas répondu, le pont répondait 404 et les caractères
          disparaissaient EN SILENCE. Quelqu'un qui ouvre le terminal avec
          Super+T et se met à taper tout de suite — le geste le plus banal
          qui soit — perdait le début de sa première commande.

       2. CE QUI EST TAPÉ VITE ARRIVAIT DANS LE DÉSORDRE. Chaque touche
          partait dans SA propre requête, sans attendre la précédente : deux
          requêtes en vol en même temps, et le serveur les traite dans
          l'ordre où elles arrivent, pas dans celui où on a frappé. D'où le
          « tres » devenu « trse ». Coller un bloc de texte, ou simplement
          taper vite, suffisait.

     Le correctif est le même pour les deux : ce qu'on tape s'accumule, et
     un seul envoi est en vol à la fois. Ce qui est frappé pendant qu'une
     requête voyage part avec la suivante, d'un bloc — donc moins de
     requêtes, et l'ordre garanti par construction. */
  envoyer(texte){
    if(this.fermee || !texte) return;
    this.enAttente = (this.enAttente || "") + texte;
    this.verser();
  }

  async verser(){
    //  Pas encore de session (le flux n'a pas répondu) : on garde tout. Le
    //  versement sera relancé dès que /api/flux répond.
    if(this._enVol || !this.pret || this.fermee) return;
    this._enVol = true;
    try{
      while(this.enAttente){
        const bloc = this.enAttente;
        this.enAttente = "";
        await poste("/api/saisie", {fen:String(this.id), texte:bloc});
      }
    } finally {
      this._enVol = false;
    }
  }

  /* --- Le flux de sortie ------------------------------------------------
     fetch() + getReader(), PAS EventSource : EventSource ne sait pas poser
     d'en-tête personnalisé, il ne pourrait donc pas porter le jeton — et
     sans jeton le pont répond 403, à raison. On découpe donc les événements
     SSE nous-mêmes, ce qui est trois lignes.

     Les données arrivent en base64 : ce qui sort d'un pty est un flot
     d'octets lu par blocs, et un bloc peut couper un caractère accentué en
     deux. Le base64 les transporte intacts ; c'est le décodeur UTF-8 à état
     de xterm.js qui recolle les morceaux. */
  /* --- L'ouverture d'un volet -------------------------------------------
     DEUX GESTES, ET C'EST LE CORRECTIF. Avant, « /api/flux?fen=… » faisait
     les deux à la fois : il créait le shell ET tenait le tuyau de sortie
     ouvert pour toujours. Une connexion par volet, donc — et un navigateur
     n'en accorde que six par origine. Au sixième volet, tout se figeait
     (mesuré : /api/saisie sans réponse au-delà de 5 s).

     Maintenant : « /api/ouvrir » est une requête COURTE qui crée le shell et
     rend la main ; l'écoute passe par le flux PARTAGÉ (voir FLUX, plus
     haut), qui suit tous les volets sur UNE seule connexion.

     Les données arrivent en base64 : ce qui sort d'un pty est un flot
     d'octets lu par blocs, et un bloc peut couper un caractère accentué en
     deux. Le base64 les transporte intacts ; c'est le décodeur UTF-8 à état
     de xterm.js qui recolle les morceaux. */
  async ouvrirFlux(){
    if(!_port || !_jeton){
      this.term.write("\r\n\x1b[33m! cette page a été ouverte sans le pont local\x1b[0m\r\n" +
                      "\x1b[90m  lance \x1b[0mlexos-pro-terminal\x1b[90m pour obtenir un vrai terminal.\x1b[0m\r\n");
      return;
    }
    //  On ajuste AVANT d'ouvrir : le shell doit naître à la bonne taille,
    //  sinon sa première invite et sa bannière sont dessinées à 80 colonnes
    //  puis reflowées de travers.
    //  ajuster() plutôt que fit() nu : fit() ne dit pas s'il a travaillé, et
    //  un shell né à 80×24 dans une grande fenêtre reste de travers tant
    //  qu'on ne redimensionne pas. Si la mesure n'est pas encore possible,
    //  insister() (armé plus haut) rattrapera et postera /api/taille.
    this.ajuster();
    let r;
    try{
      r = await poste("/api/ouvrir", {
        fen: String(this.id), cwd: this.cwd === "~" ? "" : this.cwd,
        colonnes: String(this.term.cols), lignes: String(this.term.rows)
      });
    }catch(e){ r = null; }
    if(!r || r.ok === false){
      this.term.write("\r\n\x1b[31m— le pont local ne répond pas ; relance lexos-pro-terminal\x1b[0m\r\n");
      return;
    }
    this.pret = true;
    //  La session existe : ce qui a été tapé en attendant part MAINTENANT,
    //  dans l'ordre, avant toute nouvelle frappe.
    this.verser();
    Terminal.majEtat();
    FLUX.ajouter(this);
  }

  finSession(){
    this.pret = false;
    if(this.fermee || !this.term) return;
    this.term.write("\r\n\x1b[90m— session terminée. Ctrl+B puis X pour fermer ce volet.\x1b[0m\r\n");
  }

  /* --- Presse-papier ---------------------------------------------------
     DEUX CHEMINS, ET LE SECOND N'EST PAS DU ZÈLE. navigator.clipboard est
     l'API moderne, mais elle est refusée hors contexte sûr selon la version
     de QtWebEngine ; document.execCommand est obsolète et marche encore
     partout. Sans le repli, le raccourci serait muet sur certaines versions
     — et un raccourci muet, on croit que c'est le presse-papier qui est
     cassé. Côté Qt, DEUX réglages sont nécessaires (écriture ET lecture) :
     voir terminal-pro.py. */
  async copier(){
    const texte = this.term ? this.term.getSelection() : "";
    if(!texte) return;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(texte); return;
      }
    }catch(_){ /* on tombe sur le repli */ }
    try{ document.execCommand("copy"); }catch(_){}
  }
  async coller(){
    let texte = "";
    try{
      if(navigator.clipboard && navigator.clipboard.readText){
        texte = await navigator.clipboard.readText();
      }
    }catch(_){ texte = ""; }
    //  Rien lu : mieux vaut ne rien envoyer que d'envoyer du vide au shell.
    if(texte) this.envoyer(texte);
  }

  majTitre(){
    const t = this.el.querySelector(".chemin");
    t.textContent = "fen " + this.id + (this.titre ? " · " + this.titre : "");
    Terminal.majEtat();
  }

  focus(){ if(this.term) this.term.focus(); }

  /* --- Fermeture -------------------------------------------------------
     RACCROCHER LE SHELL EST OBLIGATOIRE, pas une politesse : sans cet appel,
     fermer un onglet pendant qu'un htop tourne laisserait le programme
     vivant, sans plus aucune fenêtre pour l'atteindre. */
  detruire(){
    if(this.fermee) return;
    this.fermee = true;
    if(this._ro){ try{ this._ro.disconnect(); }catch(e){} }
    //  Quitter le flux partagé AVANT de fermer : sinon le pont continuerait
    //  de suivre un volet qui n'existe plus, et le flux serait rouvert pour
    //  rien à chaque bloc reçu.
    FLUX.retirer(this.id);
    poste("/api/fermer", {fen:String(this.id)});
    if(this.term){ try{ this.term.dispose(); }catch(e){} }
  }
}

/*  La palette de xterm.js, tirée des MÊMES variables CSS que le reste de la
    fenêtre : deux jeux de couleurs à tenir en accord finiraient par diverger
    — c'est exactement ce qui est arrivé au fond du bureau et à ui.css. */
function paletteXterm(){
  const v = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  return {
    background: v("--noir") || "#000000",
    foreground: v("--texte") || "#ffffff",
    cursor: v("--orange") || "#ff6a1a",
    cursorAccent: v("--noir") || "#000000",
    selectionBackground: "rgba(255,106,26,.32)",
    black: "#1a1512", red: v("--rouge"), green: v("--vert"), yellow: v("--jaune"),
    blue: "#7aa2ff", magenta: "#d68aff", cyan: "#5fd1d6", white: v("--texte-2"),
    brightBlack: v("--texte-3"), brightRed: v("--rouge"), brightGreen: v("--vert"),
    brightYellow: v("--jaune"), brightBlue: "#7aa2ff", brightMagenta: "#d68aff",
    brightCyan: "#5fd1d6", brightWhite: v("--texte")
  };
}

//  atob rend une chaîne dont chaque caractère porte UN octet : on la
//  retransforme en octets pour que xterm.js fasse lui-même le décodage
//  UTF-8. Passer par une chaîne JavaScript casserait les accents.
function base64Octets(b64){
  const brut = atob(b64);
  const o = new Uint8Array(brut.length);
  for(let i = 0; i < brut.length; i++) o[i] = brut.charCodeAt(i);
  return o;
}

/* =========================================================
   4. Arbre de disposition : feuilles + divisions
   ========================================================= */
function feuille(fen){ return {type:"feuille", fen}; }

class Onglet {
  constructor(fen){
    this.racine = feuille(fen);
    this.zoomee = null;
    this.el = document.createElement("div");
    this.el.className = "tab-root";
    this.el.setAttribute("role","tabpanel");
  }
  fenetres(n = this.racine, acc = []){
    if(n.type === "feuille") acc.push(n.fen);
    else { this.fenetres(n.a, acc); this.fenetres(n.b, acc); }
    return acc;
  }
  chercher(fen, n = this.racine, p = null){
    if(n.type === "feuille") return n.fen === fen ? {noeud:n, parent:p} : null;
    return this.chercher(fen, n.a, n) || this.chercher(fen, n.b, n);
  }
  rendre(){
    this.el.innerHTML = "";
    if(this.zoomee && this.fenetres().includes(this.zoomee)){
      this.el.appendChild(this.zoomee.el);
      this.zoomee.el.style.flex = "1";
      return;
    }
    this.zoomee = null;
    this.el.appendChild(this.construire(this.racine));
  }
  construire(n){
    if(n.type === "feuille"){ n.fen.el.style.flex = "1"; return n.fen.el; }
    const box = document.createElement("div");
    box.className = "noeud " + n.dir;
    const a = this.construire(n.a), b = this.construire(n.b);
    a.style.flex = n.ratio + " 1 0%";
    b.style.flex = (1 - n.ratio) + " 1 0%";
    const sep = document.createElement("div");
    sep.className = "sep";
    sep.addEventListener("pointerdown", e => this.tirer(e, n, box, a, b, sep));
    box.append(a, sep, b);
    return box;
  }
  tirer(e, n, box, a, b, sep){
    e.preventDefault();
    sep.setPointerCapture(e.pointerId);
    sep.classList.add("tire");
    const horiz = n.dir === "row";
    const bouger = ev => {
      const r = box.getBoundingClientRect();
      let t = horiz ? (ev.clientX - r.left) / r.width : (ev.clientY - r.top) / r.height;
      t = Math.min(.88, Math.max(.12, t));
      n.ratio = t;
      a.style.flex = t + " 1 0%";
      b.style.flex = (1 - t) + " 1 0%";
    };
    const finir = () => {
      sep.classList.remove("tire");
      sep.removeEventListener("pointermove", bouger);
      sep.removeEventListener("pointerup", finir);
      sep.removeEventListener("pointercancel", finir);
    };
    sep.addEventListener("pointermove", bouger);
    sep.addEventListener("pointerup", finir);
    sep.addEventListener("pointercancel", finir);
  }
}

/* =========================================================
   5. Terminal : onglets, fenêtres, raccourcis
   ========================================================= */
const Terminal = {
  onglets: [], iOnglet: 0, active: null,
  backend: false, prefixe: false, utilisateur: "lexos",

  init(){
    this.travail = document.getElementById("travail");
    this.barre   = document.getElementById("onglets");
    document.getElementById("plus").addEventListener("click", () => this.nouvelOnglet());
    document.getElementById("audit").addEventListener("click", () => this.ouvrirAudit());
    window.addEventListener("keydown", e => this.clavier(e), true);
    this.nouvelOnglet();
    setInterval(() => this.horloge(), 1000); this.horloge();
    //  La police d'écran arrive après le premier rendu : quand elle est là,
    //  la largeur d'un caractère change, donc le nombre de colonnes aussi.
    //  Sans ce recalcul, le shell resterait persuadé d'avoir la largeur
    //  mesurée avec la police de repli.
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
      this.onglets.forEach(o => o.fenetres().forEach(f => f.ajuster()));
    });
    //  Chaque volet observe déjà SA taille (ResizeObserver), ce qui couvre
    //  aussi les séparateurs déplacés et le zoom — rien à rebrancher ici.
  },

  get onglet(){ return this.onglets[this.iOnglet]; },

  ouvrirAudit(){
    // L'action reste dans le VRAI PTY d'un NOUVEL onglet : jamais
    // de commande injectée dans une session qui exécute déjà un programme.
    // Commande fixe, aucune entrée venant d'une page ou d'un paquet.
    if(!_port || !_jeton){
      if(this.active && this.active.term)
        this.active.term.write("\r\n\x1b[33m— le catalogue d'audit demande LexOS Pro Terminal en session réelle.\x1b[0m\r\n");
      return;
    }
    this.nouvelOnglet();
    if(this.active){
      this.active.titre = "Audit";
      this.active.majTitre();
      // envoyer() conserve le texte jusqu'à la création de la session PTY.
      this.active.envoyer("lexos audit\r");
      if(this.active.term) this.active.term.focus();
    }
  },

  nouvelOnglet(){
    const fen = new Fenetre(ACCUEIL);
    const ong = new Onglet(fen);
    this.onglets.push(ong);
    this.travail.appendChild(ong.el);
    ong.el.classList.add("de-droite");
    this.iOnglet = this.onglets.length - 1;
    ong.rendre();
    this.majOnglets();
    this.activer(fen);
    bienvenue(fen);
  },
  fermerOnglet(i){
    if(this.onglets.length === 1) return;
    const ong = this.onglets[i];
    //  Un onglet peut contenir PLUSIEURS volets divisés : les raccrocher
    //  tous, pas seulement celui qui a le focus.
    ong.fenetres().forEach(f => f.detruire());
    ong.el.remove();
    this.onglets.splice(i, 1);
    this.iOnglet = Math.min(this.iOnglet, this.onglets.length - 1);
    this.majOnglets();
    this.activer(this.onglet.fenetres()[0]);
  },
  allerOnglet(i){
    if(i < 0 || i >= this.onglets.length || i === this.iOnglet) return;
    const cible = this.onglets[i].el;
    cible.classList.remove("de-droite","de-gauche");
    void cible.offsetWidth;                       /* relance l'animation */
    cible.classList.add(i > this.iOnglet ? "de-droite" : "de-gauche");
    this.iOnglet = i;
    this.majOnglets();
    const f = this.onglet.fenetres();
    this.activer(f.includes(this.active) ? this.active : f[0]);
  },
  majOnglets(){
    this.barre.innerHTML = "";
    const glisseur = document.createElement("div");
    glisseur.id = "glisseur";
    this.onglets.forEach((o, i) => {
      const t = document.createElement("div");
      t.className = "onglet";
      t.setAttribute("role","tab");
      t.setAttribute("aria-selected", i === this.iOnglet ? "true" : "false");
      const n = o.fenetres().length;
      t.innerHTML = '<span class="num">'+(i+1)+'</span><span class="nom">lexsh'+
                    (n>1 ? ' · '+n+' fen.' : '')+'</span>'+
                    (this.onglets.length > 1 ? '<span class="x" title="Fermer l\'onglet">×</span>' : '');
      t.addEventListener("click", e => {
        if(e.target.classList.contains("x")){ this.fermerOnglet(i); return; }
        this.allerOnglet(i);
      });
      this.barre.appendChild(t);
    });
    this.barre.appendChild(glisseur);
    const actif = this.barre.children[this.iOnglet];
    if(actif){
      const poser = () => { glisseur.style.left = actif.offsetLeft + "px"; glisseur.style.width = actif.offsetWidth + "px"; };
      if(this._glisseurPret) poser();
      else { glisseur.style.transition = "none"; poser(); requestAnimationFrame(() => { glisseur.style.transition = ""; }); this._glisseurPret = true; }
      actif.scrollIntoView({block:"nearest", inline:"nearest", behavior:"smooth"});
    }
    this.onglets.forEach((o, i) => o.el.classList.toggle("actif", i === this.iOnglet));
    this.majEtat();
  },

  activer(fen){
    if(this.active === fen && fen && fen.el.classList.contains("actif")) return;
    this.active = fen;
    this.onglets.forEach(o => o.fenetres().forEach(f => f.el.classList.toggle("actif", f === fen)));
    if(fen) fen.focus();
    this.majEtat();
  },

  diviser(dir){
    const ong = this.onglet, fen = this.active;
    if(!fen) return;
    const t = ong.chercher(fen);
    if(!t) return;
    const rect = fen.el.getBoundingClientRect();
    if((dir === "row" && rect.width < 260) || (dir === "col" && rect.height < 150)){
      fen.term && fen.term.write("\r\n\x1b[33m— pas assez de place pour diviser ce volet.\x1b[0m\r\n");
      return;
    }
    const neuve = new Fenetre(fen.cwd);
    const feuilleAncienne = feuille(fen);
    const nouveau = {type:"division", dir, ratio:.5, a:feuilleAncienne, b:feuille(neuve)};
    if(t.parent === null) ong.racine = nouveau;
    else if(t.parent.a === t.noeud) t.parent.a = nouveau;
    else t.parent.b = nouveau;
    ong.zoomee = null;
    ong.rendre();
    this.majOnglets();
    this.activer(neuve);
    bienvenue(neuve);
  },
  fermerFenetre(){
    const ong = this.onglet, fen = this.active;
    const liste = ong.fenetres();
    if(liste.length === 1){
      if(this.onglets.length === 1){
        fen.term && fen.term.write("\r\n\x1b[33m— dernier volet : on le garde ouvert.\x1b[0m\r\n");
        return;
      }
      this.fermerOnglet(this.iOnglet);
      return;
    }
    const t = ong.chercher(fen);
    fen.detruire();
    const frere = t.parent.a === t.noeud ? t.parent.b : t.parent.a;
    const gp = this.parentDe(t.parent, ong.racine, null);
    if(gp === null) ong.racine = frere;
    else if(gp.a === t.parent) gp.a = frere;
    else gp.b = frere;
    ong.zoomee = null;
    ong.rendre();
    this.majOnglets();
    this.activer(ong.fenetres()[0]);
  },
  parentDe(cible, n, p){
    if(n === cible) return p;
    if(n.type === "feuille") return null;
    const g = this.parentDe(cible, n.a, n);
    return g !== null ? g : this.parentDe(cible, n.b, n);
  },
  zoom(){
    const ong = this.onglet;
    if(ong.fenetres().length === 1) return;
    ong.zoomee = ong.zoomee ? null : this.active;
    ong.rendre();
    this.activer(this.active);
  },
  naviguer(dir){
    const liste = this.onglet.fenetres();
    if(liste.length < 2) return;
    const r0 = this.active.el.getBoundingClientRect();
    const c0 = {x:r0.left + r0.width/2, y:r0.top + r0.height/2};
    let meilleur = null, dist = Infinity;
    for(const f of liste){
      if(f === this.active) continue;
      const r = f.el.getBoundingClientRect();
      const c = {x:r.left + r.width/2, y:r.top + r.height/2};
      const dx = c.x - c0.x, dy = c.y - c0.y;
      const ok = dir === "ArrowLeft" ? dx < -1 : dir === "ArrowRight" ? dx > 1
               : dir === "ArrowUp"   ? dy < -1 : dy > 1;
      if(!ok) continue;
      const d = Math.hypot(dx, dy);
      if(d < dist){ dist = d; meilleur = f; }
    }
    if(meilleur) this.activer(meilleur);
  },

  clavier(e){
    if(this.prefixe){
      e.preventDefault(); e.stopPropagation();
      this.prefixe = false;
      document.getElementById("prefixe-ind").classList.remove("on");
      const k = e.key.toLowerCase();
      if(k === "t" || k === "c") this.nouvelOnglet();
      else if(k === "n") this.allerOnglet((this.iOnglet + 1) % this.onglets.length);
      else if(k === "p") this.allerOnglet((this.iOnglet - 1 + this.onglets.length) % this.onglets.length);
      else if(k === "d") this.diviser("row");
      else if(k === "b") this.diviser("col");
      else if(k === "x") this.fermerFenetre();
      else if(k === "z") this.zoom();
      else if(k === "?" || k === "/") aide(this.active);
      else if(k === "o"){ const l = this.onglet.fenetres(); this.activer(l[(l.indexOf(this.active)+1) % l.length]); }
      else if(e.key.startsWith("Arrow")) this.naviguer(e.key);
      else if(/^[1-9]$/.test(k)) this.allerOnglet(parseInt(k,10) - 1);
      return;
    }
    if(e.ctrlKey && (e.key === "PageDown" || e.key === "PageUp")){
      e.preventDefault();
      const d = e.key === "PageDown" ? 1 : -1;
      this.allerOnglet((this.iOnglet + d + this.onglets.length) % this.onglets.length);
      return;
    }
    if(e.ctrlKey && !e.altKey && !e.shiftKey && e.key.toLowerCase() === "b"){
      e.preventDefault();
      this.prefixe = true;
      document.getElementById("prefixe-ind").classList.add("on");
      clearTimeout(this._tp);
      this._tp = setTimeout(() => {
        this.prefixe = false;
        document.getElementById("prefixe-ind").classList.remove("on");
      }, 3000);
    }
  },

  majEtat(){
    const nf = this.onglet ? this.onglet.fenetres().length : 1;
    document.getElementById("e-onglets").textContent = this.onglets.length;
    document.getElementById("e-onglets-m").textContent = this.onglets.length > 1 ? "pages" : "page";
    document.getElementById("e-fen").textContent = nf;
    document.getElementById("e-fen-m").textContent = nf > 1 ? "fenêtres" : "fenêtre";
    //  Le dossier courant n'est plus suivi par la page : c'est le shell qui
    //  le tient, et c'est lui qui l'annonce dans le titre du terminal (la
    //  séquence OSC que bash émet à chaque invite). On affiche donc ce que
    //  le shell dit, jamais une valeur qu'on aurait recopiée de notre côté.
    document.getElementById("e-chemin").textContent =
      (this.active && this.active.titre) ? this.active.titre : "~";
  },
  horloge(){
    const d = new Date();
    document.getElementById("horloge").textContent =
      String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0") + ":" +
      String(d.getSeconds()).padStart(2,"0");
  }
};

/* =========================================================
   6. Bannière d'accueil
   ========================================================= */
const ART = [
"  ██╗     ███████╗██╗  ██╗ ██████╗ ███████╗",
"  ██║     ██╔════╝╚██╗██╔╝██╔═══██╗██╔════╝",
"  ██║     █████╗   ╚███╔╝ ██║   ██║███████╗",
"  ██║     ██╔══╝   ██╔██╗ ██║   ██║╚════██║",
"  ███████╗███████╗██╔╝ ██╗╚██████╔╝███████║",
"  ╚══════╝╚══════╝╚═╝  ╚═╝ ╚═════╝ ╚══════╝"
].join("\n");

/*  La bannière s'écrit DANS le terminal, en séquences ANSI — pas en HTML.
    Il n'y a plus de journal de <div> où insérer du balisage : xterm.js ne
    connaît que des octets, exactement comme un vrai terminal. */
function bienvenue(fen){
  if(!fen.term) return;
  const O = "\x1b[38;5;208m", S = "\x1b[90m", V = "\x1b[32m", J = "\x1b[33m", R = "\x1b[0m";
  fen.term.write(O + ART.split("\n").join("\r\n") + R + "\r\n\r\n");
  fen.term.write("LexOS Pro Terminal" + S + "  ·  fr-CA  ·  " + R + O + "⚜ Produit du Québec" + R + "\r\n");
  fen.term.write(_port && _jeton
    ? V + "✓ vrai terminal" + S + " — pty complet : claude, sudo, nano, htop, less y tournent." + R + "\r\n"
    : J + "! mode démonstration" + S + " — page ouverte sans le pont (lance lexos-pro-terminal)." + R + "\r\n");
  fen.term.write(S + "Ctrl+B puis D/B divise · T nouvel onglet · X ferme · ? l'aide." + R + "\r\n\r\n");
}

/* =========================================================
   7. L'aide — un RACCOURCI, plus une commande tapée
   -----------------------------------------------------------------------
   CE QUI A DISPARU ICI, ET POURQUOI CE N'EST PAS UNE PERTE. Cette page avait
   ses propres commandes (« aide », « split », « tab », « backend »,
   « about ») : elles étaient interceptées AVANT bash, parce que bash n'était
   pas vraiment là — chaque ligne partait dans un processus jetable. Le volet
   parle maintenant à un shell VIVANT : tout ce qu'on tape lui appartient, et
   intercepter « aide » ou « split » masquerait un vrai programme portant ce
   nom, exactement le piège que le banc de ce terminal traque depuis le début
   (la page d'origine réimplémentait ls, cd, cat… contre un faux disque).

   L'aide reste donc atteignable, mais par le PRÉFIXE — Ctrl+B puis « ? » —
   comme les autres actions de fenêtre, et elle s'écrit dans le terminal.
   ========================================================= */
function aide(fen){
  if(!fen || !fen.term) return;
  const S = "\x1b[90m", J = "\x1b[33m", M = "\x1b[38;5;147m", G = "\x1b[1m", R = "\x1b[0m";
  const l = t => fen.term.write(t + "\r\n");
  l("");
  l(G + "LexOS Pro Terminal — aide" + R + S + "   (Ctrl+B puis ?)" + R);
  l("");
  l(J + G + "Fenêtres" + R + S + "   préfixe : Ctrl+B, puis la touche" + R);
  [["D", "diviser à droite"], ["B", "diviser en bas"], ["X", "fermer ce volet"],
   ["Z", "plein écran / retour"], ["O", "volet suivant"], ["flèches", "aller au volet voisin"],
   ["T", "nouvel onglet"], ["N / P", "onglet suivant / précédent"], ["1..9", "aller à l'onglet n"],
   ["?", "cette aide"]].forEach(([k, d]) => l("  " + M + k.padEnd(13) + R + d));
  l("");
  l(J + G + "Sans préfixe" + R);
  //  Ctrl+C a DEUX comportements, et une aide qui n'en dit qu'un envoie
  //  chercher la panne au mauvais endroit. Avec une sélection il copie ;
  //  sans sélection il descend au shell et interrompt pour de vrai.
  [["Ctrl+C", "copie s'il y a une sélection, sinon interrompt"],
   ["Ctrl+PgDn / PgUp", "onglet suivant / précédent"],
   ["Ctrl+Maj+C", "copier la sélection"],
   ["Ctrl+Maj+V", "coller"],
   ["clic du milieu", "coller"]].forEach(([k, d]) => l("  " + M + k.padEnd(20) + R + d));
  l("");
  l(J + G + "Tout le reste" + R + " appartient au shell : " + S +
    "ls, cd, sudo, git, claude, vim, htop, less…" + R);
  l(S + "C'est un vrai pseudo-terminal — les programmes plein écran s'affichent ici." + R);
  l(M + "Audit : clique sur 🛡 Audit dans la barre supérieure pour parcourir les outils" + R);
  l(M + "sans quitter LexOS Pro Terminal, et sans lancer d'analyse automatiquement." + R);
  l("");
}

/* =========================================================
   8. API publique + démarrage
   ========================================================= */
window.LexOS = {
  fenetreActive(){ return Terminal.active; },
  nouvelOnglet(){ Terminal.nouvelOnglet(); },
  diviser(dir){ Terminal.diviser(dir === "bas" ? "col" : "row"); },
  //  « écrire » pose du texte À L'ÉCRAN, il ne l'envoie pas au shell : c'est
  //  la même distinction que dans un vrai terminal entre ce qu'on affiche et
  //  ce qu'on tape. Pour taper, il y a « saisir ».
  ecrire(txt){ if(Terminal.active && Terminal.active.term) Terminal.active.term.write(String(txt)); },
  saisir(txt){ if(Terminal.active) Terminal.active.envoyer(String(txt)); }
};

//  ═══ CROCHET DE BANC ═══
//  Expose les morceaux qu'un banc peut éprouver SANS un vrai navigateur —
//  même principe que app.js:__banc. « _BANC_NE_PAS_DEMARRER » retient le
//  démarrage automatique (qui suppose un vrai DOM complet) pendant qu'on
//  teste ces fonctions à la pièce.
if(typeof globalThis !== "undefined"){
  globalThis.__banc = { Terminal, Fenetre, esc, aide,
                         poste, base64Octets, paletteXterm,
                         get ACCUEIL(){ return ACCUEIL; } };
}

async function demarrage(){
  //  PLUS DE COMMANDE DE DÉMARRAGE. L'ancienne page interrogeait le pont sur
  //  le dossier personnel et le nom d'utilisateur avant d'ouvrir la première
  //  fenêtre, pour dessiner une invite crédible. Il n'y a plus d'invite à
  //  dessiner : c'est bash qui écrit la sienne, avec les vraies valeurs, dès
  //  qu'il démarre. Un aller-retour de moins, et UNE source de vérité au
  //  lieu de deux — c'est cette duplication qui avait collé les deux
  //  réponses en une seule chaîne (« /rootroot »), silencieusement fausse.
  //
  //  « cwd » vide veut dire « le dossier personnel » côté pont : c'est lui
  //  qui sait où il est, pas nous.
  const ind = document.getElementById("backend-ind");
  if(_port && _jeton){
    Terminal.backend = true;
    ind.textContent = "vrai terminal — pty sur 127.0.0.1:" + _port;
    ind.className = "branche";
  } else {
    ind.textContent = "démo — sans le pont local";
    ind.className = "absent";
  }
  Terminal.init();
}
if(typeof globalThis === "undefined" || !globalThis.__BANC_NE_PAS_DEMARRER__) demarrage();

})();
