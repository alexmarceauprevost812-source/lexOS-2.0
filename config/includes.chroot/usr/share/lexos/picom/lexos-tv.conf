# =============================================================================
#  LexOS — l'extinction « téléviseur 1980 », pour de vrai cette fois
# =============================================================================
#  ALEX : « une animation pour fermer les fenêtres comme une vieille T.V. —
#  l'effet d'animation n'est pas là quand je ferme des fenêtres ».
#
#  ═══ POURQUOI CE FICHIER EXISTE, ALORS QUE L'EFFET ÉTAIT DÉJÀ CONFIGURÉ ═══
#  Il l'était — pour COMPIZ. /etc/dconf/db/local.d/01-lexos-compiz pose
#  « close-effects = Glide 2 », qui est exactement ce geste. Seulement Compiz
#  a été RETIRÉ de Debian trixie : lexos-wm cherche le binaire, ne le trouve
#  pas, écrit « compiz absent » dans son journal et se replie sur xfwm4.
#  Et xfwm4 n'a AUCUNE animation d'ouverture ni de fermeture — il n'y avait
#  donc pas un réglage à corriger, il n'y avait pas de moteur du tout.
#
#  picom, lui, est dans Debian, et sait animer depuis sa version 12
#  (« Animations! Yes, now picom officially supports animations », son propre
#  CHANGELOG, v12-rc1, 12 août 2024). D'où ce fichier.
#
#  ═══ TOUT CE QUI SUIT VIENT DU MANUEL DE picom, PAS D'UN EXEMPLE TROUVÉ ═══
#  man/picom.1.adoc, section ANIMATIONS. Quatre points qui décident de la
#  forme de ce qui suit, et qu'on ne devine pas :
#
#   1. L'ORIGINE DE L'ÉCHELLE EST LE COIN HAUT-GAUCHE, pour la fenêtre comme
#      pour son ombre. Une fenêtre qu'on écrase avec « scale-y » seul se
#      collerait donc au haut de son cadre au lieu de se refermer sur son
#      milieu. D'où les deux « offset » ci-dessous : ils remettent le centre
#      au centre. Sans eux, ce n'est pas un téléviseur, c'est un store.
#
#   2. UNE VARIABLE DE SORTIE NON DÉFINIE PREND LA VALEUR PAR DÉFAUT DE
#      L'ÉTAT. Le manuel le dit en toutes lettres : si « opacity » n'est pas
#      défini pour le déclencheur « close », la fenêtre a l'opacité 0 —
#      « so you will just see it disappear instantly ». C'est exactement le
#      piège qui donne une animation invisible : elle joue, mais sur une
#      fenêtre déjà transparente. On tient donc l'opacité à 1 jusqu'à la fin.
#
#   3. LA DURÉE TOTALE EST CELLE DE LA PLUS LONGUE FONCTION. C'est
#      « opacity » (0,24 + 0,06 = 0,30 s) : l'image reste donc à l'écran
#      pendant toute la mise en boîte, et ne s'éteint qu'après.
#
#   4. LE SIGNE MOINS VEUT DES ESPACES AUTOUR. « 1 - scale-y » est une
#      soustraction ; « 1-scale-y » serait le nom d'une variable. Le manuel
#      prévient, parce que les noms de variables peuvent contenir un tiret.
#
#  ═══ LE GESTE, EN TROIS TEMPS — CELUI D'UN TUBE CATHODIQUE QU'ON COUPE ═══
#    1. l'image s'écrase vers une ligne horizontale        (0,00 → 0,14 s)
#    2. la ligne se referme en un point                     (0,14 → 0,24 s)
#    3. le point s'éteint                                   (0,24 → 0,30 s)
#  Trois dixièmes de seconde en tout : assez pour qu'on le voie, trop court
#  pour qu'on l'attende. Un effet de fermeture qu'on attend devient vite
#  insupportable — c'est pour ça que Compiz mettait 260 ms, et on reste dans
#  cet ordre de grandeur.
# =============================================================================

#  LE MOTEUR DE RENDU. Le défaut de picom est « xrender » ; « glx » est celui
#  qui met à l'échelle sans peiner. On peut l'exiger ici parce que lexos-wm
#  n'allume ce fichier QUE si l'accélération 3D est réelle (il refuse
#  llvmpipe, softpipe et swrast) — la même condition qui gardait Compiz.
backend = "glx";
vsync = true;

#  LES OMBRES. xfwm4 en dessinait ; son compositeur est éteint pendant que
#  picom tourne, alors picom doit les reprendre — sinon les fenêtres
#  paraissent posées à plat, et ce serait une régression visible pour un
#  effet qu'on venait ajouter. Mêmes valeurs que le décorateur de Compiz
#  (01-lexos-compiz) : rayon 9, opacité 0,6, noir.
#  ═══ LE SUIVI DES DÉGÂTS, ÉPINGLÉ PLUTÔT QUE SUPPOSÉ ═══
#  « use-damage » vaut déjà true sur picom v12, mais c'est un DÉFAUT, pas un
#  contrat : il a changé entre versions. Sans lui, picom repeint l'écran
#  entier à chaque image — exactement le défaut de Compiz 0.8 qu'on vient de
#  retirer. On l'écrit.
use-damage = true;

#  Le tampon de stencil ne sert à rien ici et coûte une passe sur i915
#  (le HD 520 du T460 de référence).
glx-no-stencil = true;

shadow = true;
#  ═══ 6 px ET NON 9 : L'OMBRE EST UN FLOU GAUSSIEN PERMANENT ═══
#  Un rayon de 9 px sur CHAQUE fenêtre, c'est un flou recalculé à chaque
#  image sur un GPU intégré qui partage la mémoire système. 6 px se voit
#  autant et coûte nettement moins.
shadow-radius = 6;
shadow-opacity = 0.6;
shadow-offset-x = -9;
shadow-offset-y = -9;
shadow-color = "#000000";

#  LE FONDU SIMPLE EST ÉTEINT : les animations le remplacent. Le manuel note
#  que « fade » n'a de toute façon aucun effet quand une animation joue ; on
#  l'écrit quand même pour que le fichier dise ce qu'il fait.
fading = false;

#  Une fenêtre en plein écran (un film, un jeu) fait décrocher le
#  compositeur : c'est ce qu'on veut, l'image passe alors directement à
#  l'écran, sans une couche de plus.
#  ═══ LES SURFACES QUI N'ONT RIEN À GAGNER D'UNE OMBRE ═══
#  Elles la paient pourtant à chaque image, parce qu'elles sont grandes ou
#  toujours visibles : le dock, le bureau, et toute fenêtre en plein écran.
shadow-exclude = [
	"class_g = 'Plank'",
	"class_g = 'Xfdesktop'",
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"_NET_WM_STATE@[0]:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

#  ═══ unredir-if-possible : GARDÉ, MAIS SURVEILLÉ ═══
#  Il laisse une fenêtre plein écran court-circuiter le compositeur — un vrai
#  gain sur un jeu ou une vidéo. Sur picom v12, la combinaison avec les
#  animations est connue pour faire clignoter l'entrée et la sortie du plein
#  écran. Si ça clignote sur la machine d'Alex, la réponse est
#  « unredir-if-possible-exclude » sur la fenêtre fautive, PAS de le couper
#  globalement : ce serait payer partout pour un défaut d'un seul cas.
unredir-if-possible = true;

animations = (
	#  ═══ FERMETURE — l'extinction ═══
	{
		triggers = [ "close" ];

		#  1. L'ÉCRASEMENT. La courbe part doucement et finit sec
		#  (cubic-bezier 0.4/0/1/1) : c'est la nervosité d'un tube qui
		#  perd sa déflexion, pas un rideau qu'on baisse.
		#  0.006 et non 0 : à zéro, il n'y a plus rien à afficher, donc
		#  plus de ligne à voir — or la ligne EST l'effet.
		scale-y = {
			curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
			duration = 0.14;
			start = 1;
			end = 0.006;
		};

		#  2. LA LIGNE SE REFERME, une fois l'écrasement fini (delay).
		scale-x = {
			curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
			delay = 0.14;
			duration = 0.10;
			start = 1;
			end = 0.002;
		};

		#  LE CENTRE RESTE LE CENTRE. Voir le point 1 de l'en-tête :
		#  l'échelle a pour origine le coin haut-gauche.
		offset-x = "(1 - scale-x) * window-width / 2";
		offset-y = "(1 - scale-y) * window-height / 2";

		#  3. L'EXTINCTION. Voir le point 2 : sans cette ligne, la fenêtre
		#  serait invisible dès la première image et tout ce qui précède
		#  ne se verrait jamais.
		opacity = {
			duration = 0.06;
			delay = 0.24;
			start = 1;
			end = 0;
		};
		blur-opacity = "opacity";

		#  L'OMBRE PART TOUT DE SUITE. Une ombre rectangulaire de la
		#  taille d'origine autour d'une ligne d'un pixel trahit le
		#  truc : on la retire au lieu de la suivre.
		shadow-opacity = 0;
	},

	#  ═══ OUVERTURE — le même geste à l'envers, l'allumage ═══
	#  Alex n'a demandé que la fermeture. On fait quand même l'ouverture,
	#  parce que c'est ce que la configuration Compiz d'origine faisait
	#  (open-effects = Glide 2) et qu'une fenêtre qui s'éteint comme un
	#  téléviseur mais s'ouvre sèchement n'a l'air de rien. Plus court que
	#  la fermeture : on attend moins volontiers ce qui commence.
	{
		triggers = [ "open" ];

		opacity = {
			duration = 0.04;
			start = 0;
			end = 1;
		};
		blur-opacity = "opacity";

		scale-x = {
			curve = "cubic-bezier(0.0, 0.0, 0.2, 1.0)";
			duration = 0.10;
			start = 0.002;
			end = 1;
		};
		scale-y = {
			curve = "cubic-bezier(0.0, 0.0, 0.2, 1.0)";
			delay = 0.10;
			duration = 0.14;
			start = 0.006;
			end = 1;
		};
		offset-x = "(1 - scale-x) * window-width / 2";
		offset-y = "(1 - scale-y) * window-height / 2";
		shadow-opacity = 0;
	}
);

#  ═══ CE QUI NE DOIT PAS S'ÉTEINDRE COMME UN TÉLÉVISEUR ═══
#  Un menu qui met trois dixièmes de seconde à se fermer rend le bureau
#  poisseux : on ouvre un menu vingt fois par minute, une fenêtre trois fois
#  par heure. Compiz faisait déjà cette distinction — ses « close-matches »
#  séparaient les fenêtres normales des menus et des infobulles. On la
#  refait ici, avec un fondu court.
#
#  « window_type *= "menu" » attrape aussi « dropdown_menu » et
#  « popup_menu » : l'opérateur *= est une correspondance par sous-chaîne
#  (manuel, FORMAT OF CONDITIONS).
rules = (
	#  ═══ LE MENU WHISKER — CETTE RÈGLE DOIT RESTER LA PREMIÈRE ═══
	#  picom applique la PREMIÈRE correspondance et s'arrête là (manuel,
	#  section RULES). La règle générique juste en dessous attrape
	#  « window_type *= 'menu' » ; or le menu Whisker EST de ce type-là.
	#  Placée après, celle-ci ne serait donc jamais atteinte, et le menu
	#  garderait le fondu de 80 ms de tout le monde. L'ordre n'est pas une
	#  préférence de lecture : c'est ce qui fait marcher la chose.
	#
	#  ═══ MESURÉ, PAS DEVINÉ ═══
	#  Session X réelle, xfce4-whiskermenu-plugin 2.8.3 (la version de
	#  trixie), panneau lancé avec la configuration LexOS, menu ouvert :
	#
	#      WM_CLASS(STRING)          = "wrapper-2.0", "Wrapper-2.0"
	#      _NET_WM_WINDOW_TYPE(ATOM) = _NET_WM_WINDOW_TYPE_MENU
	#      WM_NAME(STRING)           = "Whisker Menu"
	#
	#  ON MATCHE SUR LE NOM, ET C'EST OBLIGÉ. La classe vaut
	#  « wrapper-2.0 » : c'est le nom du programme qui héberge TOUS les
	#  greffons du panneau. Une règle sur la classe attraperait donc aussi
	#  l'horloge, le son, la batterie — tout le panneau. WM_NAME est le seul
	#  discriminant. C'est précisément ce que la mesure a servi à établir.
	{
		match = "name = 'Whisker Menu'";
		#  L'OMBRE RESTE ALLUMÉE ICI, contrairement aux menus contextuels
		#  juste en dessous : le menu Whisker est une grande surface noire
		#  posée sur un fond d'écran sombre. Sans ombre, son bord se perd.
		shadow = true;
		animations = (
			{
				triggers = [ "open" ];
				#  « opacity » EST ÉCRIT, jamais laissé implicite — voir le
				#  point 2 de l'en-tête : une variable de sortie non définie
				#  retombe au défaut de l'état, et pour l'ouverture ce
				#  défaut ferait jouer l'animation sur une fenêtre déjà
				#  transparente. L'animation serait « là » et invisible.
				opacity   = { curve = "cubic-bezier(0.0, 0.0, 0.2, 1.0)";
				              duration = 0.16; start = 0; end = 1; };
				#  Le menu DESCEND en s'ouvrant : douze pixels au-dessus de
				#  sa place, puis il se pose. Pas un simple fondu (on ne
				#  verrait pas le geste), pas l'écrasement téléviseur non
				#  plus (trop lent pour quelque chose qu'on ouvre vingt fois
				#  par minute).
				offset-y  = { curve = "cubic-bezier(0.0, 0.0, 0.2, 1.0)";
				              duration = 0.16; start = -12; end = 0; };
				blur-opacity = "opacity";
			},
			{
				triggers = [ "close" ];
				#  160 ms à l'ouverture, 100 ms à la fermeture : assez pour
				#  que le geste se voie, assez court pour qu'on ne l'attende
				#  pas. Le raisonnement de l'en-tête sur la fermeture des
				#  fenêtres vaut ici aussi — un effet qu'on attend devient
				#  vite insupportable.
				opacity  = { duration = 0.10; start = 1; end = 0; };
			}
		);
	},
	#  ═══ LE VOLET LEXOS — CETTE RÈGLE DOIT RESTER AVANT LA SUIVANTE ═══
	#  ALEX : « qu'il ouvre fluidement, et se ferme avec l'animation de
	#  vieille télévision ».
	#
	#  POURQUOI ELLE N'EXISTAIT PAS, ET POURQUOI L'ANIMATION NE JOUAIT PAS.
	#  Le volet est créé en Qt.Tool (volet.py), et Qt.Tool devient
	#  _NET_WM_WINDOW_TYPE_UTILITY. Il tombait donc dans la règle générique
	#  juste en dessous — celle qui attrape « window_type = 'utility' » — et
	#  recevait son fondu de 80 ms au lieu de l'extinction téléviseur.
	#  Ce n'était PAS un oubli : c'est une règle juste (« un menu qui met
	#  trois dixièmes de seconde à se fermer rend le bureau poisseux ») qui
	#  attrapait un cas de trop. Même mécanique que le menu Whisker plus
	#  haut : picom applique la PREMIÈRE correspondance et s'arrête là.
	#  Placée APRÈS la générique, celle-ci ne serait jamais atteinte.
	#
	#  ═══ LE SÉLECTEUR N'EST PAS DEVINÉ : IL EST IMPOSÉ ═══
	#  Le menu Whisker, plus haut, a dû être MESURÉ parce que son WM_CLASS
	#  vaut « wrapper-2.0 » pour tout le panneau et que seul WM_NAME
	#  discriminait. Ici, le volet est NOTRE programme : plutôt que de
	#  relever ce que Qt produit par défaut — une valeur qui peut changer
	#  d'une version de Qt à l'autre, et la règle se décrocherait en
	#  silence — volet.py POSE le titre lui-même :
	#
	#      vue.setWindowTitle("Volet LexOS")
	#
	#  La chaîne est donc écrite des deux côtés, et le banc
	#  tests/test_lexos_barre_volet.sh exige qu'elles soient les mêmes.
	#  Une mesure qu'on peut supprimer en la rendant inutile vaut mieux
	#  qu'une mesure qu'il faut refaire à chaque version.
	{
		match = "name = 'Volet LexOS'";
		#  L'ombre part avec la fenêtre : voir shadow-opacity ci-dessous.
		shadow = true;
		animations = (
			{
				#  ═══ OUVERTURE : UN FONDU COURT, PAS L'ALLUMAGE TÉLÉ ═══
				#  La PAGE a déjà son animation d'ouverture — « .shade » se
				#  déplie en scaleY sur 0,34 s (style.css), et index.html
				#  explique que tout le volet est bâti pour ça : « le volet
				#  est dans la page, pas la page dans le volet ». Si picom
				#  étirait EN PLUS la fenêtre, les deux gestes se
				#  superposeraient et donneraient un mouvement mou.
				#  UNE SEULE ANIMATION D'OUVERTURE, ET C'EST CELLE DU CSS.
				#  Ici, juste de quoi que la fenêtre ne surgisse pas d'un
				#  bloc avant que la page ait dessiné.
				triggers = [ "open" ];
				#  « opacity » est ÉCRIT, jamais laissé implicite — point 2
				#  de l'en-tête : une sortie non définie retombe au défaut
				#  de l'état, et l'animation jouerait sur une fenêtre déjà
				#  transparente : « là » et invisible.
				opacity = { curve = "cubic-bezier(0.0, 0.0, 0.2, 1.0)";
				            duration = 0.12; start = 0; end = 1; };
				blur-opacity = "opacity";
			},
			{
				#  ═══ FERMETURE : L'EXTINCTION TÉLÉVISEUR, ENTIÈRE ═══
				#  Recopiée du bloc « close » de la section « animations »
				#  de ce fichier, sans rien simplifier : chacune de ces
				#  lignes corrige un piège réel, expliqué en tête.
				triggers = [ "close" ];

				#  1. L'ÉCRASEMENT. Courbe qui part doucement et finit sec :
				#  la nervosité d'un tube qui perd sa déflexion. 0.006 et
				#  non 0 — à zéro il n'y a plus rien à afficher, donc plus
				#  de ligne à voir, or la ligne EST l'effet.
				scale-y = {
					curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
					duration = 0.14;
					start = 1;
					end = 0.006;
				};

				#  2. LA LIGNE SE REFERME, une fois l'écrasement fini.
				scale-x = {
					curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
					delay = 0.14;
					duration = 0.10;
					start = 1;
					end = 0.002;
				};

				#  LE CENTRE RESTE LE CENTRE : l'échelle a pour origine le
				#  coin haut-gauche. Sans ces deux lignes, le volet
				#  s'écraserait vers son coin au lieu de vers son milieu.
				offset-x = "(1 - scale-x) * window-width / 2";
				offset-y = "(1 - scale-y) * window-height / 2";

				#  3. L'EXTINCTION, RETARDÉE. Sans ce delay, la fenêtre
				#  serait invisible dès la première image et tout ce qui
				#  précède ne se verrait jamais.
				opacity = {
					duration = 0.06;
					delay = 0.24;
					start = 1;
					end = 0;
				};
				blur-opacity = "opacity";

				#  L'OMBRE PART TOUT DE SUITE. Une ombre rectangulaire de la
				#  taille d'origine autour d'une ligne d'un pixel trahit le
				#  truc : on la retire au lieu de la suivre.
				shadow-opacity = 0;
			}
		);
	},
	{
		match = "window_type *= 'menu' || window_type = 'tooltip' || window_type = 'notification' || window_type = 'utility' || window_type = 'combo' || window_type = 'dnd' || window_type = 'popup_menu' || window_type = 'dropdown_menu'";
		shadow = false;
		animations = (
			{
				triggers = [ "open" ];
				opacity = { duration = 0.08; start = 0; end = 1; };
			},
			{
				triggers = [ "close" ];
				opacity = { duration = 0.08; start = 1; end = 0; };
			}
		);
	}
);
