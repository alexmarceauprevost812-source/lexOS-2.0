<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volet LexOS</title>
<!-- ui.css AVANT style.css : les jetons communs d'abord, les règles
     propres au panneau ensuite — elles l'emportent en cas de doublon. -->
<script>
/*  LE MODE (sombre / clair) ARRIVE PAR L'ADRESSE. Le lanceur Python lit
    ~/.config/lexos/mode — écrit par lexos-theme-gen depuis toujours — et
    l'ajoute en ?mode=… : aucun chemin nouveau, aucune requête de plus, et
    l'attribut est posé AVANT le premier rendu, donc pas d'éclair blanc au
    démarrage. Sans paramètre, on reste en sombre, qui est le défaut. */
try{var m=new URLSearchParams(location.search).get("mode");
    if(m==="clair")document.documentElement.dataset.mode="clair";}catch(e){}
</script>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--  Le volet est dans la page, pas la page dans le volet : c'est ce qui
      permet de l'ANIMER. Un élément qui vient d'apparaître n'a pas d'état de
      départ à quitter, donc rien à animer. Qt ouvre une fenêtre transparente
      déjà à sa taille finale, et le volet s'y déplie tout seul — exactement
      comme sur la démo, avec la même courbe et la même durée. -->
<div class="shade" id="volet" role="dialog">
  <div class="shade-in" id="dedans"></div>
</div>
<script src="app.js"></script>
</body>
</html>
