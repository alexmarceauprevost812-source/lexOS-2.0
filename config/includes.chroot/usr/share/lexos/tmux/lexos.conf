# =============================================================================
#  LexOS — volets et onglets dans le terminal
# =============================================================================
#  CE QUE ÇA COMBLE. xfce4-terminal a des onglets (Ctrl+Shift+T) mais n'a
#  jamais eu de volets divisibles. C'était la seule fonction que LexOS Pro
#  Terminal avait vraiment en plus — et lui ne peut pas travailler, faute de
#  pseudo-terminal. tmux donne les deux au terminal qui, lui, travaille.
#
#  ET IL EST UN VRAI PSEUDO-TERMINAL. C'est le point décisif : Claude Code,
#  nano, htop, ssh et l'invite de mot de passe de sudo fonctionnent dedans,
#  parce que tmux ouvre un vrai pty par volet. Un terminal en volets qui ne
#  saurait pas faire ça ne servirait à rien ici.
# =============================================================================

# --- Le préfixe ---------------------------------------------------------------
#  ON GARDE Ctrl+B, LE DÉFAUT DE tmux. C'est un compromis assumé : Ctrl+B est
#  aussi « reculer d'un caractère » dans bash. On le perd. En échange, toute la
#  documentation de tmux du monde entier s'applique telle quelle, et quiconque
#  connaît déjà tmux n'a rien à réapprendre.
#
#  Ctrl+A, l'autre préfixe courant, aurait pris « aller au début de la ligne » —
#  nettement plus utile au quotidien que reculer d'un caractère, que les
#  flèches font déjà.

# --- Souris -------------------------------------------------------------------
#  ALLUMÉE, ET C'EST LE RÉGLAGE LE PLUS IMPORTANT DU FICHIER. Il rend tmux
#  utilisable sans rien connaître : cliquer sur un volet pour y aller, tirer la
#  bordure pour redimensionner, cliquer un onglet, rouler pour remonter.
#
#  CONTREPARTIE À CONNAÎTRE : la roulette n'envoie plus le défilement au
#  terminal, elle entre dans le mode copie de tmux. On en sort avec Échap. Ce
#  n'est pas un défaut, c'est le fonctionnement de tmux — mais ça surprend la
#  première fois.
set -g mouse on

# --- Le délai d'échappement ---------------------------------------------------
#  10 MILLISECONDES, ET CE N'EST PAS UN DÉTAIL. Par défaut tmux attend 500 ms
#  après Échap pour voir si une séquence de touches suit. Dans nano, dans vim et
#  dans Claude Code, ça se traduit par une demi-seconde de latence à chaque
#  Échap — l'impression exacte que « le système lague ». 0 provoquerait des
#  touches fantômes sur une liaison lente ; 10 est le compromis usuel.
set -sg escape-time 10

# --- Confort ------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 20000
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#W — LexOS"

#  Les vraies couleurs : sans ça, l'orange de la bannière et le vert de l'invite
#  sont approximés par la palette 256 et changent de teinte dès qu'on entre dans
#  tmux. Le terminal aurait alors deux apparences selon qu'on est dedans ou non.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# --- Diviser ------------------------------------------------------------------
#  LES SÉPARATEURS DISENT CE QU'ILS FONT. La barre verticale coupe en deux
#  colonnes, le tiret en deux rangées. Les lettres -h et -v de tmux disent le
#  contraire de ce qu'on attend (« -h » donne deux volets côte à côte), et c'est
#  la confusion la plus répandue chez les débutants de tmux.
#
#  -c garde le dossier courant : sans lui, chaque nouveau volet repart du
#  dossier personnel, et on repasse son temps à retaper le même cd.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"

# --- Se déplacer entre les volets ---------------------------------------------
#  ALT + FLÈCHES, SANS PRÉFIXE. C'est le seul raccourci sans préfixe du fichier,
#  et le choix est contraint : bash utilise déjà Alt+b, Alt+d, Alt+f, Alt+t et
#  Alt+chiffre pour ses propres fonctions d'édition de ligne. Les voler ferait
#  gagner des raccourcis à tmux en cassant l'édition de commande — un mauvais
#  échange. Alt+flèches, lui, n'est réservé par rien.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Redimensionner -----------------------------------------------------------
#  -r : répétable. On garde le doigt sur la flèche sans refaire le préfixe.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# --- Recharger ce fichier -----------------------------------------------------
bind r source-file /usr/share/lexos/tmux/lexos.conf \; \
       display-message "Réglages LexOS rechargés"

# =============================================================================
#  L'APPARENCE — la même règle de couleur que le reste du terminal LexOS
# =============================================================================
#  vert 40 = ce que la machine dit · vert 35 = le mot LEXOS · orange 208 =
#  le NOM et ce qui est actif · jaune 220 = ce qu'on peut faire ·
#  rouge 196 = ce qui ne va pas
#
#  ⚠ CETTE LIGNE DISAIT « vert 35 », ET « lexos-couleurs-terminal.md ».
#  Le 35 (#00AF5F) était le vert de l'invite AVANT qu'Alex demande « un vert
#  plus visible » : l'invite est passée au 40 (#00D700) et tmux est resté en
#  arrière — exactement la divergence qu'il signale en disant « les couleurs,
#  on les retrouve dans les autres terminaux aussi ». Et le fichier cité
#  n'existe pas dans ce dépôt : la référence a été retirée plutôt que
#  réparée, la source est lexos-theme-gen.
#
#  ⚠ ET LEXOS Y ÉTAIT ÉCRIT EN ORANGE, c'est-à-dire dans la couleur que
#  l'invite donne au NOM de l'utilisateur. Les deux rôles étaient inversés
#  par rapport à la consigne « la couleur de marceau pour l'orange et le
#  vert pour LEXOS ». LEXOS prend donc le 35, le repli 256 de LEXOS_PS_LOGO.
#  Ces trois index sont CEUX de lexos-theme-gen (PS_MACHINE_256 = 40,
#  PS_LOGO_256 = 35, PS_UTILISATEUR_256 = 208) : tmux n'annonce pas
#  COLORTERM, il lit donc la palette 256, la même que la console texte.

set -g status-position bottom
set -g status-style "bg=colour232,fg=colour40"
set -g status-left  " #[fg=colour35,bold]LEXOS#[default] "
set -g status-left-length 20

#  L'onglet actif est ORANGE. La note disait « la même couleur que ce qu'on
#  tape » : c'était déjà faux depuis que la frappe est BLANCHE. L'orange est
#  celui de l'accent — curseur, sélection, onglet actif — et son index 256
#  coïncide maintenant avec celui du nom dans l'invite. Les deux ne se
#  rencontrent jamais sur la même ligne (l'un est dans la barre d'état,
#  l'autre dans l'invite), mais c'est écrit ici pour que personne ne les
#  croie liés.
setw -g window-status-current-style "fg=colour208,bold"
setw -g window-status-current-format " #I #W "
setw -g window-status-style "fg=colour244"
setw -g window-status-format " #I #W "

#  Le rappel des raccourcis, en JAUNE : « ce que vous pourriez taper ». Il tient
#  sur une ligne et il est là en permanence, parce que ces trois-là sont
#  exactement ceux qu'on oublie.
set -g status-right "#[fg=colour220]^B |#[fg=colour244] diviser  #[fg=colour220]^B -#[fg=colour244] empiler  #[fg=colour220]^B c#[fg=colour244] onglet "
set -g status-right-length 60

#  La bordure du volet actif en orange : sans elle, on ne sait pas où on tape
#  quand quatre volets affichent la même chose.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour208"

#  Les messages de tmux reprennent le vert des réponses de la machine — parce
#  que c'en sont.
#  ⚠ ET LA VALEUR NE SUIVAIT PAS LE COMMENTAIRE : elle valait colour35, qui
#  est le vert de « LEXOS », pas celui de la machine. L'histoire le dit :
#  status-style et message-style avaient été écrits ensemble en colour35,
#  puis status-style est passé à colour40 pour « un vert plus visible » et
#  message-style est resté en arrière. Le contrôle du banc ne lisait que
#  status-left et status-style — message-style n'était comparé à rien.
set -g message-style "bg=colour232,fg=colour40"

#  La cloche et l'activité en rouge : « ce qui demande votre attention ».
setw -g window-status-bell-style "fg=colour196,bold"
