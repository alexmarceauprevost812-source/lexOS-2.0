# =============================================================================
#  LexOS — TLP seulement là où il a un sens : sur une machine À BATTERIE
# =============================================================================
#  TLP est un économiseur d'énergie pensé pour les portables. Sur une tour
#  branchée au mur il n'économise rien, et il peut faire du dégât : sans
#  adaptateur secteur à lire (/sys/class/power_supply/AC absent sur une
#  tour), il peut se croire sur batterie et appliquer son profil le plus
#  agressif — dont la mise en veille des périphériques PCI « inutilisés ».
#
#  Constaté sur l'Alienware Aurora (RTX 5060, TV Hisense en HDMI) : en mode
#  secours, où AUCUN pilote graphique n'a le droit de se charger, le signal
#  HDMI se perdait quand même à ~20 secondes — pile quand TLP démarre. Sans
#  pilote pour la tenir occupée, la carte graphique est un périphérique PCI
#  « inutilisé » que TLP peut endormir… pendant qu'elle envoie l'image.
#
#  Ce drop-in conditionne le service à la présence d'une batterie : sur le
#  ThinkPad, TLP tourne comme avant ; sur une tour, il ne démarre simplement
#  pas (ligne « ConditionPathExistsGlob » dans le journal, pas une erreur).
[Unit]
ConditionPathExistsGlob=/sys/class/power_supply/BAT*
