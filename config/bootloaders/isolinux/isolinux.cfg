# =============================================================================
#  LexOS — menu de démarrage BIOS (isolinux)
# =============================================================================
#  « timeout 0 » dans le modèle de live-build veut dire ATTENDRE INDÉFINIMENT :
#  une clé oubliée dans un port laisse un écran figé jusqu'à ce que quelqu'un
#  passe. On met donc un délai. L'unité est le dixième de seconde : 200 = 20 s.
#
#  RÉSERVE HONNÊTE SUR LE CÔTÉ UEFI. Aucun « set timeout » n'est fixé nulle
#  part dans le dépôt : le menu GRUB emploie le défaut de live-build, et la
#  capture prise en machine virtuelle montrait « dans 4 s ». Les deux menus
#  ne sont donc PAS au même délai aujourd'hui. 20 s reste le bon choix ici —
#  c'est le menu qu'on voit sur une machine ancienne, souvent avec un écran
#  lent à s'allumer — mais si on veut vraiment les aligner un jour, c'est le
#  hook 0910 qu'il faut toucher, pas ce fichier.
#
#  « ui vesamenu.c32 » plutôt que « default vesamenu.c32 » : la forme « ui »
#  est celle recommandée par syslinux 6, et c'est elle qui garantit que le
#  menu graphique est l'interface, pas une simple entrée par défaut.
# =============================================================================

include menu.cfg
ui vesamenu.c32
prompt 0
timeout 200
