# =============================================================================
#  LexOS — entrées « installation » du menu de démarrage BIOS
# =============================================================================
#  Le modèle de live-build pour ce fichier ne contient que « # FIXME » : les
#  entrées réelles sont ajoutées par lb_binary_syslinux quand
#  --debian-installer est actif, avec des libellés anglais. On les écrit donc
#  nous-mêmes, en français, et live-build remplace @LB_BOOTAPPEND_INSTALL@.
#
#  Les chemins /install/ sont ceux que pose --debian-installer live. Si une
#  entrée pointe vers un fichier absent, syslinux le dit à l'écran au lieu de
#  démarrer : d'où la vérification dans le hook 0905.
# =============================================================================

label install
	menu label Installer LexOS sur le disque
	kernel /install/vmlinuz
	append initrd=/install/gtk/initrd.gz @LB_BOOTAPPEND_INSTALL@

label install-texte
	menu label Installer en mode texte
	kernel /install/vmlinuz
	append initrd=/install/initrd.gz @LB_BOOTAPPEND_INSTALL@

label hd
	menu label Démarrer sur le disque dur
	localboot 0x80
