# =============================================================================
#  LexOS — couleurs et géométrie du menu de démarrage BIOS (vesamenu.c32)
# =============================================================================
#  REMPLACE le modèle de live-build, dont la barre de sélection est BLEUE
#  (#76a1d0), le titre « Boot menu » anglais et le décompte « Automatic boot
#  in N seconds... » anglais lui aussi.
#
#  LA GRILLE. Le fond fait 640x480 et la police de vesamenu 8x16 : l'écran
#  est donc une grille de 80 colonnes sur 30 lignes. Les nombres ci-dessous
#  sont des LIGNES et des COLONNES, jamais des pixels. Ils sont calés sur le
#  cadre dessiné dans splash.svg.in — déplacer l'un sans l'autre fait sortir
#  le texte du cadre.
#
#    cadre dessiné   : colonnes 7 -> 73, lignes 11 -> 22
#    entrées         : lignes 14 -> 18, colonnes 10 -> 70
#    décompte        : ligne 25
#    aide clavier    : ligne 27 — DESSINÉE dans le fond, pas écrite ici
#
#  Format des couleurs : #AARRGGBB (alpha en premier). « #00000000 » = invisible.
# =============================================================================

menu background splash.png

#  ── Géométrie ───────────────────────────────────────────────────────────────
#  vesamenu place le titre sur la ligne « vshift » et commence les entrées
#  trois lignes plus bas. vshift 11 met donc la première entrée sur la 14.
menu vshift 11
menu hshift 6
menu width 60
menu margin 2
menu rows 5
#  ATTENTION : « timeoutrow », « helpmsgrow », « tabmsgrow » et « cmdlinerow »
#  sont comptées À PARTIR DE vshift, pas du haut de l'écran. Vérifié en
#  machine virtuelle : avec vshift 11, « timeoutrow 26 » ne descend pas à la
#  ligne 26 — il sort de l'écran et syslinux le ramène tout en bas. 14 + 11
#  donne bien la ligne 25.
menu timeoutrow 14

#  L'aide clavier et le message TAB sont dans l'image : on renvoie les lignes
#  correspondantes hors de l'écran (30 lignes en tout) plutôt que de les
#  laisser se superposer au dessin.
menu helpmsgrow 31
menu helpmsgendrow 31
menu cmdlinerow 31
menu tabmsgrow 31

#  ── Couleurs ────────────────────────────────────────────────────────────────
#  « CHOISIR UN DÉMARRAGE » est déjà dessiné dans le fond : le titre de
#  vesamenu est rendu invisible plutôt que supprimé (menu.cfg doit garder une
#  ligne « menu title », sinon syslinux affiche la sienne).
menu color title        * #00000000 #00000000 none
menu color border       * #00000000 #00000000 none
menu color screen       * #00000000 #00000000 none
menu color scrollbar    * #00000000 #00000000 none

#  Entrée choisie : blanc sur orange — le même orange que le site et le thème
#  GRUB (#ff6a1a), assombri à #d2560f pour que le blanc reste lisible dessus
#  (contraste ≈ 4,6:1).
menu color sel          * #fff2ede2 #ffd2560f none
menu color hotsel       * #fff2ede2 #ffd2560f none

#  Entrées non choisies : gris clair sur le panneau translucide du fond.
#  « hotkey » prend EXACTEMENT la couleur de « unsel » à dessein : le menu
#  UEFI n'a pas de lettres-raccourcis, et une initiale orange sur une ligne
#  non choisie faisait un damier de lettres colorées sans rapport avec le
#  reste. Les raccourcis restent actifs, ils ne sont simplement plus criards.
menu color unsel        * #ffc8c8cf #00000000 none
menu color hotkey       * #ffc8c8cf #00000000 none
menu color disabled     * #ff5a5a63 #00000000 none

#  Bas de l'écran
menu color timeout      * #ffff6a1a #00000000 none
menu color timeout_msg  * #ff8c8a86 #00000000 none
menu color tabmsg       * #00000000 #00000000 none
menu color help         * #00000000 #00000000 none
menu color cmdmark      * #ffff6a1a #00000000 none
menu color cmdline      * #fff2ede2 #00000000 none

#  Le « # » est remplacé par le nombre de secondes restantes. Même phrase que
#  le thème GRUB, au mot près.
menu autoboot Démarrage automatique dans # s
