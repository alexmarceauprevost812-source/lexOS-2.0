# =============================================================================
#  LexOS — réponses préremplies de l'installateur
# =============================================================================
#  Chaque ligne ici est une question que l'installateur ne posera plus.
#
#  ── Ce qu'on ne préremplit PAS, et pourquoi ─────────────────────────────
#  Rien de ce qui touche au DISQUE. Le partitionnement reste entièrement
#  manuel, écran par écran, confirmation par confirmation. C'est la seule
#  étape de toute l'installation qui peut détruire des données, et une
#  réponse toute faite à cet endroit — même prudente — retirerait à
#  l'utilisateur le seul moment où il peut encore dire non.
#
#  Pas de mot de passe non plus : un mot de passe écrit dans un fichier
#  présent sur la clé USB n'est pas un mot de passe.
# =============================================================================

# --- Réseau ------------------------------------------------------------------
#  « Le domaine est la partie de l'adresse Internet à droite du nom de
#  machine » — une question qui n'a de sens qu'en entreprise, posée à tout
#  le monde. Sur une machine à la maison, la bonne réponse est « rien ».
#
#  Pourquoi vide plutôt que « .local » : .local est réservé au mDNS, le
#  mécanisme par lequel imprimantes et téléphones se trouvent tout seuls
#  sur le réseau. L'employer comme domaine casse cette découverte, et le
#  symptôme — « mon imprimante a disparu » — ne ressemble en rien à la
#  cause. Le conseil de mettre « .local » circule pourtant partout.
#
#  « seen true » est ce qui fait vraiment disparaître la question : sans
#  lui, l'installateur affiche quand même l'écran avec la valeur pré-remplie.
d-i netcfg/get_domain string
d-i netcfg/get_domain seen true

#  Ne pas s'arrêter si le Wi-Fi n'est pas encore configuré : on est en
#  session live, le réseau peut se régler après l'installation.
d-i netcfg/enable boolean true
d-i netcfg/link_wait_timeout string 10

# --- Horloge ------------------------------------------------------------------
#  L'horloge matérielle en UTC : c'est ce qu'attend Linux. La régler sur
#  l'heure locale ne se remarque qu'au changement d'heure, six mois plus
#  tard, quand plus personne ne fait le lien.
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# --- Ce qui vient déjà de la ligne de commande de démarrage -------------------
#  langue, clavier et fuseau sont passés par --bootappend-install dans
#  auto/config ; les répéter ici ne ferait que créer deux endroits à
#  corriger le jour où ils changent.
