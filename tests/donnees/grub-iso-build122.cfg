# Installer (if any)
if true; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if false; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if true; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	/live/vmlinuz-6.12.113+deb13-amd64 boot=live components username=lex user-fullname=LexOS Live hostname=lexos locales=fr_CA.UTF-8 keyboard-layouts=ca keyboard-variants=fr timezone=America/Toronto   loglevel=3 udev.log_level=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0 nvidia-drm.modeset=1 nvidia-drm.fbdev=1 nvidia-modeset.hdmi_deepcolor=0 nouveau.modeset=0 findiso=${iso_path} verify-checksums
			initrd	/live/initrd.img-6.12.113+deb13-amd64
		}
	fi
}
# --- lexos-theme-debut (posé par config/hooks/normal/0910) -------------------
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
loadfont /boot/grub/themes/lexos/fonts/lexos-medium-14.pf2
loadfont /boot/grub/themes/lexos/fonts/lexos-mono-16.pf2
loadfont /boot/grub/themes/lexos/fonts/lexos-regular-22.pf2
loadfont /boot/grub/themes/lexos/fonts/lexos-semibold-22.pf2
#  Le thème est calé sur 1920x1080. On propose des replis, et « auto » en
#  dernier : mieux vaut un menu à la mauvaise taille que pas de menu.
set gfxmode=1920x1080,1280x720,1024x768,auto
set gfxpayload=keep
terminal_output gfxterm
set theme=/boot/grub/themes/lexos/theme.txt
export theme
set timeout=8
set timeout_style=menu
# --- lexos-theme-fin --------------------------------------------------------
