# LexOS USB AI — gabarit, NON installé automatiquement.
# Placer uniquement lors de l'installation validée sur SSD externe.
# Le service Ollama existant conserve son ExecStart principal.
[Unit]
# Sans /data monté : pas de service, pas d'écriture sur la partition système.
RequiresMountsFor=/data
ConditionPathIsMountPoint=/data

[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_NO_CLOUD=1"
Environment="OLLAMA_MODELS=/data/ollama/models"
ExecStartPre=/usr/bin/test -d /data/ollama/models
