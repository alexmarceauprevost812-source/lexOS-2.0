<style>
  /* ---- menu du site, par-dessus la démo ---- */
  .demo-topbar{
    position:fixed; top:0; left:0; right:0; z-index:100; height:48px;
    display:flex; align-items:center; gap:18px; padding:0 20px;
    background:rgba(19,19,22,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid #232327; font-family:'JetBrains Mono','IBM Plex Mono','Courier New',monospace;
  }
  .demo-topbar a{color:#8c8a86; text-decoration:none; font-size:12.5px; font-weight:600;
    padding:6px 10px; border-radius:4px; letter-spacing:0.02em;}
  .demo-topbar a:hover{color:#f2ede2; background:#1d1d20;}
  .demo-topbar .brand{color:#f2ede2; font-weight:700; padding-left:0;}
  .demo-topbar .brand b{color:#ff6a1a;}
  .demo-topbar nav{display:flex; gap:2px; margin-left:auto; flex-wrap:wrap;}
  .demo-topbar .quit{border:1px solid #ff6a1a; color:#ff6a1a;}
  .demo-topbar .quit:hover{background:rgba(255,106,26,0.12); color:#ff6a1a;}
  :root{
    --bg: #0a0a0d;
    --panel: #131316;
    --panel-edge: #232327;
    --orange: #ff6a1a;
    --orange-glow: rgba(255,106,26,0.55);
    --green: #37c96b;
    --green-dim: #1f7a41;
    --green-glow: rgba(55,201,107,0.5);
    --text: #f2ede2;
    --muted: #8c8a86;
    --mono: 'JetBrains Mono','IBM Plex Mono','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:var(--mono); overflow:hidden;
  }
  #scanlines{
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px,
      transparent 2px, transparent 3px
    );
    mix-blend-mode:overlay;
  }
  #crt-vignette{
    position:fixed; inset:0; pointer-events:none; z-index:49;
    box-shadow: inset 0 0 180px 40px rgba(0,0,0,0.75);
  }
  #watermark{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center; opacity:0.14;
  }
  #watermark img{ width:min(40vw,480px); max-width:75%; }

  .page{
    position:relative; z-index:2; min-height:100vh; display:flex;
    align-items:center; justify-content:center; padding:6vh 6vw;
  }
  .dl-card{width:min(560px,90vw);}
  .dl-title{
    font-size:12px; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase;
    margin-bottom:4px;
  }
  .dl-title b{color:var(--orange);}
  .dl-filename{
    font-size:18px; font-weight:600; color:var(--text); margin-bottom:22px;
    word-break:break-all;
  }

  .bar-outer{
    width:100%; height:16px; background:#17171a; border:1px solid var(--panel-edge);
    overflow:hidden; position:relative;
  }
  .bar-inner{
    height:100%; width:0%; background:linear-gradient(90deg, var(--green-dim), var(--green));
    box-shadow:0 0 10px var(--green-glow);
    transition:width 0.12s linear;
  }

  .dl-meta{
    display:flex; justify-content:space-between; margin-top:10px;
    font-size:12px; color:var(--muted);
  }
  .dl-meta .pct{color:var(--green); font-weight:700; font-size:14px;}

  .dl-log{
    margin-top:22px; height:120px; overflow-y:auto; font-size:11.5px; color:#8f8d89;
    background:#0e0e10; border:1px solid var(--panel-edge); padding:10px 12px; line-height:1.7;
  }
  .dl-log .ok{color:var(--green);}

  .dl-done{
    display:none; flex-wrap:wrap; align-items:center; gap:10px 16px; margin-top:18px; font-size:13px; color:var(--green);
  }
  .dl-done.show{display:flex;}
  .dl-done .check{font-size:18px;}
  .dl-next{
    color:var(--orange); text-decoration:none; font-weight:600; border:1px solid var(--orange);
    padding:6px 14px; border-radius:3px; transition:background 0.15s;
  }
  .dl-next:hover{background:rgba(255,106,26,0.12);}

  .corner-avatar{
    position:fixed; bottom:0; left:24px; z-index:5; pointer-events:none;
    width:180px; max-width:26vw;
    filter:drop-shadow(0 0 18px rgba(0,0,0,0.6));
  }

  .corner-logo{
    position:fixed; top:20px; right:24px; z-index:5; pointer-events:none;
    width:200px; max-width:30vw;
  }
</style>

<script>
const TOTAL_MO = 1900; // taille réelle du morceau lexos-1.2.1-pro...iso.part-00
let downloaded = 0;
const bar = document.getElementById('bar');
const pctEl = document.getElementById('dl-pct');
const speedEl = document.getElementById('dl-speed');
const etaEl = document.getElementById('dl-eta');
const log = document.getElementById('dl-log');
const doneEl = document.getElementById('dl-done');

function logLine(text){
  const d = document.createElement('div');
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
logLine('Connexion au serveur ti-lex...');
logLine('Démarrage du téléchargement...');

const timer = setInterval(()=>{
  const speed = 60 + Math.random()*70; // Mo/s simulé — connexion rapide, pour que la démo ne s'éternise pas
  downloaded = Math.min(TOTAL_MO, downloaded + speed*0.15);
  const pct = (downloaded / TOTAL_MO) * 100;
  bar.style.width = pct + '%';
  pctEl.textContent = Math.floor(pct) + '%';
  speedEl.textContent = speed.toFixed(1) + ' Mo/s';
  const remaining = TOTAL_MO - downloaded;
  const etaSec = speed > 0 ? Math.max(0, Math.round(remaining / speed)) : 0;
  etaEl.textContent = 'ETA ' + (etaSec > 60 ? Math.floor(etaSec/60)+'m'+(etaSec%60)+'s' : etaSec+'s');

  if(Math.floor(pct) % 20 === 0 && Math.floor(pct) > 0){
    logLine(Math.floor(downloaded) + ' Mo / ' + TOTAL_MO + ' Mo reçus...');
  }

  if(pct >= 100){
    clearInterval(timer);
    pctEl.textContent = '100%';
    speedEl.textContent = '—';
    etaEl.textContent = 'Terminé';
    logLine('Vérification de l\u2019intégrité du fichier...');
    setTimeout(()=>{
      logLine('Intégrité confirmée.');
      document.getElementById('dl-total-size').textContent = TOTAL_MO + ' Mo';
      doneEl.classList.add('show');
    }, 500);
  }
}, 150);
</script>
