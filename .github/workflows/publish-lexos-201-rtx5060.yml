name: Publier LexOS Pro 2.0.1-rtx5060 depuis l'artefact valide

on:
  push:
    branches: [fix/lexos-2.0.1-live-desktop-nvidia]
    paths: [.github/workflows/publish-lexos-201-rtx5060.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lexos-pro-201-rtx5060-publication
  cancel-in-progress: false

jobs:
  publier:
    name: Publier l'ISO de test sur une Release distincte
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Liberer de l'espace pour extraire et decouper 5 Gio
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Recuperer exactement l'artefact de la construction USB validee
        uses: actions/download-artifact@v4
        with:
          name: lexos-pro-test-bf5091c49ff22072e7cf5ad869e8d82f3945a96a
          run-id: 37880351430
          github-token: ${{ github.token }}
          path: extrait

      - name: Verifier SHA-256 et preparer des morceaux acceptes par GitHub
        shell: bash
        run: |
          set -euo pipefail
          cd extrait
          ISO="lexos-2.0.1-rtx5060-pro-amd64.hybrid.iso"
          test -s "$ISO"
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          mkdir -p ../assets
          cp SHA256SUMS "../assets/${ISO}.sha256"
          split -b 1900M -d --suffix-length=2 "$ISO" "../assets/${ISO}.part-"
          test "$(find ../assets -maxdepth 1 -name "${ISO}.part-*" -type f | wc -l)" -ge 3
          ls -lh ../assets/
          cd ..
          df -h /

      - name: Publier une preversion sans remplacer latest-pro
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="lexos-pro-2.0.1-rtx5060"
          ISO="lexos-2.0.1-rtx5060-pro-amd64.hybrid.iso"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La Release $TAG existe deja : aucune substitution automatique."
            exit 1
          fi
          cat > notes.md <<'EOF'
          ## LexOS Pro 2.0.1-rtx5060 — ISO USB testée

          ISO construite par GitHub Actions le 9 octobre 2026
          (commit `bf5091c49ff22072e7cf5ad869e8d82f3945a96a`).
          Test USB utilisateur : XFCE et NVIDIA GeForce RTX 5060 reconnue par
          `nvidia-smi` (pilote 615.71.09).

          ### Télécharger et reconstituer l'ISO

          Téléchargez **tous les fichiers** `lexos-2.0.1-rtx5060-pro-amd64.hybrid.iso.part-XX` et
          `lexos-2.0.1-rtx5060-pro-amd64.hybrid.iso.sha256` dans un même dossier.

          **Linux :**

          `cat lexos-2.0.1-rtx5060-pro-amd64.hybrid.iso.part-* > lexos-2.0.1-rtx5060-pro-amd64.hybrid.iso`

          `sha256sum -c lexos-2.0.1-rtx5060-pro-amd64.hybrid.iso.sha256`

          **Windows (PowerShell) :** ouvrez PowerShell dans le dossier puis collez :

          ```powershell
          $iso = "lexos-2.0.1-rtx5060-pro-amd64.hybrid.iso"
          $out = [IO.File]::Create((Join-Path (Get-Location) $iso))
          try {
            Get-ChildItem "$iso.part-*" | Sort-Object Name | ForEach-Object {
              $inputFile = [IO.File]::OpenRead($_.FullName)
              try { $inputFile.CopyTo($out) } finally { $inputFile.Dispose() }
            }
          } finally { $out.Dispose() }
          (Get-FileHash $iso -Algorithm SHA256).Hash
          ```

          Comparez ce SHA256 avec le contenu du fichier `lexos-2.0.1-rtx5060-pro-amd64.hybrid.iso.sha256`.
          Pour tester en Live, utilisez une clé USB de 16 Go ou plus.

          **Attention :** préversion publique issue de l'artefact de test.
          La Release existante `latest-pro` (2.0.0) n'est pas remplacée.
          Ne lancez pas d'installation sur le SSD Windows sans sauvegarde.

          [Construction et diagnostics](https://github.com/alexmarceauprevost812-source/lexOS-2.0/actions/runs/37880351430)
          EOF
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target bf5091c49ff22072e7cf5ad869e8d82f3945a96a \
            --title "LexOS Pro 2.0.1-rtx5060 — ISO USB" \
            --notes-file notes.md \
            --prerelease \
            assets/*
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets \
            --jq '{url:.url,assets:[.assets[].name]}'
