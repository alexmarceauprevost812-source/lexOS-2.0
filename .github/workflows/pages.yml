name: Publier le site et la démo

# =============================================================================
#  Le site LexOS et la démo du bureau, en ligne, sans clé USB
# =============================================================================
#  POURQUOI CE FICHIER EXISTE
#  Tout était déjà écrit — website/ (le site) et web-demo/ (le bureau LexOS
#  jouable dans un navigateur) — mais RIEN n'était publié. Pour voir à quoi
#  ressemble LexOS, il fallait graver une clé USB et redémarrer la machine.
#  Ce fichier met les deux en ligne à chaque poussée.
#
#  POURQUOI GITHUB PAGES ET PAS VERCEL
#  Le site est du HTML pur : pas de serveur, pas de base de données, aucun
#  code qui tourne côté serveur. Vercel sait faire tout ça, mais rien de tout
#  ça n'est utilisé ici. Le dépôt étant déjà sur GitHub, Pages publie sans
#  deuxième compte ni deuxième tableau de bord, et la configuration reste
#  DANS le dépôt, versionnée et relisible — au lieu d'être cachée dans les
#  réglages d'un service. Vercel redeviendra le bon choix le jour où il
#  faudra un vrai nom de domaine ou des aperçus par branche.
#
#  ATTENTION — le poids. branding/ pèse 12 Mo à lui seul (mascottes animées,
#  affiches, rendus). Le site n'a besoin que d'UNE image de ce dossier. On
#  copie donc fichier par fichier plutôt que le dossier entier : publier
#  12 Mo pour un logo de 30 Ko ferait payer le chargement à chaque visiteur.
# =============================================================================

on:
  push:
    branches: ['**']
    paths:
      - 'website/**'
      - 'web-demo/**'
      - 'branding/logo-ti-lex-al-icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

#  Une seule publication à la fois. Ici on ANNULE la précédente, contrairement
#  à la construction d'ISO : republier un site prend vingt secondes, et c'est
#  toujours la dernière version qu'on veut voir en ligne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    name: Site + démo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      #  Dire en clair, en français, ce qu'il faut faire — plutôt que de
      #  laisser l'échec anglais de l'étape suivante, qui renvoie vers la
      #  documentation de l'API REST au lieu du menu à cliquer.
      - name: GitHub Pages est-il activé ?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "✓ Pages est activé sur ce dépôt."
          else
            {
              echo "### ⚠ Une seule chose à faire, une seule fois"
              echo
              echo "GitHub Pages n'est pas encore activé sur ce dépôt."
              echo "Le jeton des Actions n'a pas le droit de l'activer lui-même —"
              echo "activer Pages relève de l'administration du dépôt."
              echo
              echo "**Va à :** https://github.com/${GITHUB_REPOSITORY}/settings/pages"
              echo
              echo "Sous **Build and deployment → Source**, choisis **GitHub Actions**."
              echo "Puis relance cette construction — le site sera en ligne en vingt secondes."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::Pages non activé — voir le résumé de la construction"
            exit 1
          fi

      #  Le MÊME script que Vercel (vercel.json → buildCommand). Deux
      #  hébergeurs, une seule recette : sinon l'une des deux prend du retard
      #  sans que personne s'en aperçoive, jusqu'au jour où l'adresse qu'on
      #  donne aux gens montre une version d'il y a trois semaines.
      - name: Assembler le site
        run: sh scripts/build-site.sh _site

      #  IL FAUT UN CLIC, UNE SEULE FOIS, ET PERSONNE NE PEUT LE FAIRE À TA
      #  PLACE — pas même cette construction.
      #
      #  Essayé, et raté : le paramètre « enablement: true », que le message
      #  d'erreur de GitHub recommande lui-même, demande à l'action de créer
      #  le site par l'API. Le jeton des Actions n'en a pas le droit :
      #  « Create Pages site failed. Error: Resource not accessible by
      #  integration ». Activer Pages relève de l'administration du dépôt, et
      #  un jeton de construction ne peut pas s'auto-accorder ce pouvoir —
      #  c'est voulu, et c'est sain. On ne s'entête donc pas.
      #
      #  Réglages du dépôt → Pages → « Build and deployment » → Source :
      #  choisir « GitHub Actions ». Une fois pour toutes.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4

      - name: Adresse du site
        run: |
          {
            echo "### 🌐 Site publié"
            echo
            echo "**[${{ steps.deploiement.outputs.page_url }}](${{ steps.deploiement.outputs.page_url }})**"
            echo
            echo "La démo du bureau : ${{ steps.deploiement.outputs.page_url }}demo/"
          } >> "$GITHUB_STEP_SUMMARY"
