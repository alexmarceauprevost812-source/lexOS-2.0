          bash tests/test_lexos_terminal_copier.sh

      - name: « sudo miss a jour » — poser le dépôt sans reconstruire l'ISO
        if: ${{ !cancelled() }}
        run: |
          #  Chaque modification d'un script demandait une ISO complète : une
