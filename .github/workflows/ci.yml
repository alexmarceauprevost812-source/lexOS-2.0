          bash tests/test_lexos_utilisateurs.sh

      - name: Partage — le nom que les autres appareils voient, et ce qui manque
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « le contenu comme Ubuntu ». Sa page « Partage » commence
          #  par le NOM DE L'ORDINATEUR ; ici il n'y avait qu'une ligne,
          #  « serveur actif » ou « au repos », et LexOS n'avait AUCUN moyen
