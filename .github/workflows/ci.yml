      - name: La vidéo d'accueil — la boucle du greeter et le halo de l'après-connexion
        if: ${{ !cancelled() }}
        run: |
          #  ALEX A ENVOYÉ DEUX VIDÉOS ET UN CONSTAT : celle du greeter ne
          #  bouclait pas, et la nouvelle vidéo d'après-connexion est CARRÉE
          #  (720×720). Étirée sur un écran 16/9 elle déformait les visages ;
          #  le hook 0300 lui compose donc, à la construction, un halo flou
          #  1920×1080 tiré d'elle-même, et pose l'original net au centre.
          #
          #  Ce banc fait tourner le VRAI extrait du hook avec un VRAI ffmpeg,
          #  puis RELÈVE LES PIXELS de l'image produite : la bande de gauche
          #  doit être floue et non noire, et le sujet garder ses proportions.
          #  Une composition qui se relit dans le script ne prouve rien — la
          #  première version passait la relecture et déformait quand même.
          for p in ffmpeg mpv imagemagick xvfb xdotool; do
            dpkg -s "$p" >/dev/null 2>&1 \
              || sudo apt-get install -y --no-install-recommends "$p" >/dev/null
          done
          python3 -c 'import PIL' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-pil >/dev/null
          bash tests/test_lexos_intro.sh

      - name: Les fonds d'écran d'Alex — cadrés, pas étirés
        if: ${{ !cancelled() }}
        run: |
          #  Les images qu'Alex a envoyées ne sont pas au format de l'écran :
          #  un portrait de la mascotte, et une bannière très large. Mises
          #  telles quelles, la première s'étirait en largeur et la seconde
          #  se faisait rogner au mauvais endroit.
          #
          #  DEUX CONTRÔLES DE CE BANC ONT DÉJÀ ÉTÉ SANS DENTS, et c'est
          #  pourquoi cette étape existe : l'un comparait la largeur de
          #  l'image de RÉFÉRENCE (toujours la même, donc toujours vert),
          #  l'autre exigeait une marge noire que le fond du portrait fournit
          #  de lui-même. Ils mesurent maintenant la boîte du CONTENU.
          for p in imagemagick; do
            dpkg -s "$p" >/dev/null 2>&1 \
              || sudo apt-get install -y --no-install-recommends "$p" >/dev/null
          done
          python3 -c 'import PIL' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-pil >/dev/null
          bash tests/test_lexos_fonds_alex.sh

      - name: L'animation d'avant l'installateur — et son filet de sécurité
        if: ${{ !cancelled() }}
        run: |
          #  Une animation qui se fige AVANT l'installateur, c'est un système
          #  qu'on ne peut plus installer. Le lanceur borne donc la lecture
          #  par « timeout -k », et ce banc le prouve en faisant tourner un
          #  mpv VOLONTAIREMENT bloqué : sans la borne, il ne rendrait jamais
          #  la main.
          #
          #  CE CONTRÔLE A DÉJÀ ÉTÉ VERT À TORT : « exec -a » n'existe pas
          #  dans dash, le faux mpv mourait aussitôt, et le banc mesurait
          #  « 0 s » en croyant avoir mesuré la borne. D'où le plancher de
          #  durée et la pré-vérification qu'il porte maintenant.
          for p in ffmpeg mpv; do
            dpkg -s "$p" >/dev/null 2>&1 \
              || sudo apt-get install -y --no-install-recommends "$p" >/dev/null
          done
          bash tests/test_lexos_install_animation.sh

      - name: Les icônes du bureau suivent celles du menu
        if: ${{ !cancelled() }}
        run: |
          #  Le raccourci posé sur le bureau et le lanceur du menu portent le
          #  même nom de fichier mais deux « Icon= » différents : le bureau
          #  gardait l'icône d'origine du paquet là où le menu montrait déjà
          #  celle de LexOS. lexos-icones-bureau resynchronise la SEULE ligne
          #  Icon=, sans toucher au reste du fichier.
          #
          #  Une mutation de ce banc a survécu au premier essai : le décor
          #  donnait au raccourci copié la MÊME icône qu'à son homologue
          #  système, donc l'outil n'avait rien à faire et le contrôle passait
          #  quoi qu'on casse. Les deux icônes diffèrent maintenant.
          bash tests/test_lexos_icones_bureau.sh

      - name: Le guetteur de téléchargements — sans inotify-tools, sans sondage
        if: ${{ !cancelled() }}
        run: |
          #  Le guetteur emploie Gio.FileMonitor, déjà fourni par python3-gi :
          #  aucune dépendance nouvelle dans l'ISO. Sans ce paquet ici, le
          #  banc SAUTE la moitié qui compte et reste vert pour rien — on
          #  l'installe donc explicitement.
          #
          #  UN CONTRÔLE DE CE BANC LISAIT LA PROSE : le grep « inotifywait »
          #  tombait sur le commentaire qui explique pourquoi inotify n'est
          #  PAS employé. Il décommente d'abord, maintenant.
          python3 -c 'import gi' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-gi >/dev/null
          bash tests/test_lexos_telechargements.sh

      - name: Les Paramètres répondent tout de suite — et ne mentent jamais
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « il faudrait au moins que les Paramètres soient fluides
          #  quand on change les couleurs et qu'on prend des options — qu'elles
          #  soient bien sélectionnées ».
          #
          #  Ce n'est pas sa machine : chaque clic relisait TOUT l'état —
          #  trente-huit collecteurs, soixante-dix commandes externes — avant
          #  de redessiner. Le réglage prenait tout de suite ; c'est
          #  l'affichage qui attendait.
          #
          #  Le banc charge la VRAIE page dans node, remplace le pont, et
          #  vérifie les deux moitiés : le bouton s'allume au clic, ET il
          #  revient à l'état réel si l'action échoue. La seconde compte le
          #  plus — un bouton resté allumé sur un réglage qui n'a pas pris est
          #  le mensonge du bogue du dock.
          bash tests/test_lexos_fluidite.sh

      - name: La page « Formater un support » — la page demande, l'outil décide
        if: ${{ !cancelled() }}
        run: |
          #  ALEX voulait une vraie page plutôt que la suite de boîtes zenity.
          #  La règle du chantier : la page AFFICHE et DEMANDE, lexos-format
          #  DÉCIDE et EXÉCUTE. Aucune vérification de sécurité n'est réécrite
          #  en JavaScript ni en Python — deux juges finissent par ne plus dire
          #  la même chose, et ce jour-là c'est un disque qui y passe.
          #
          #  Le banc fait tourner le VRAI lexos-format sur un décor de quatre
          #  disques dont un seul est formatable, et lui donne un VRAI
          #  périphérique bloc (une boucle losetup) pour éprouver le refus
          #  d'une cible non amovible : sans un vrai bloc, le programme
          #  sortirait avant le contrôle qui compte et le banc serait vert
          #  pour la mauvaise raison.
          bash tests/test_lexos_formatage_page.sh

      - name: L'assistant Nextcloud ne s'ouvre plus à chaque démarrage
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « la page pour ajouter un compte nextcloud s'affiche tout
          #  le temps quand on ouvre l'ordinateur ».
          #
          #  nextcloud-desktop est dans optional-packages/48-comptes.list, et
          #  le hook 0250 installe ces listes DANS l'ISO. Le paquet pose son
          #  entrée dans /etc/xdg/autostart : le client démarre à chaque
          #  session et, faute de compte, ouvre son assistant.
          #
          #  Le banc fait tourner le VRAI hook 0256 sur un répertoire
          #  d'autostart fabriqué — avec nm-applet et blueman à côté, parce
          #  qu'un hook qui ratisse un répertoire peut très bien emporter le
          #  réseau et le Bluetooth au passage, et que ça ne se verrait qu'au
          #  démarrage suivant.
          bash tests/test_lexos_autostart.sh

      - name: Les boîtes de dialogue montrent tout ce qu'elles proposent
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « la page de formatage, on pourrait-tu la mettre un peu
          #  plus gros pour bien voir tout le menu ? »
          #
          #  Le vrai défaut était pire que celui qu'il signalait : à 560x260
          #  la liste n'avait la place que de DEUX rangées, alors que le code
          #  en propose TROIS. « ext4 » était offert par le programme et
          #  invisible à l'écran. Et le repli zenity du bouton rouge n'avait
          #  AUCUNE taille : sur cinq gestes, trois s'affichaient —
          #  « Éteindre » tombait sous le bord.
          #
          #  Ce banc refait la mesure pour LES QUINZE polices que LexOS sait
          #  poser (douze écritures à la main, trois polices d'interface) :
          #  une taille en pixels tient avec l'une et déborde avec l'autre,
          #  et Alex change d'écriture quand il veut.
          #  python3-gi + gir1.2-gtk-3.0 : sans eux la moitié qui MESURE est
          #  sautée et le banc reste vert pour rien.
          python3 -c 'import gi; gi.require_version("Gtk","3.0"); from gi.repository import Gtk' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 >/dev/null
          dpkg -s xvfb >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends xvfb >/dev/null
          bash tests/test_lexos_format_boites.sh

      - name: Ollama posé à la main — le panneau IA le voit, le terminal Pro aussi
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « ollama est invisible dans le terminal Pro ». Il l'avait
          #  posé par le script officiel, qui l'écrit dans /usr/local/bin.
          #
          #  LA MESURE A DÉMENTI L'HYPOTHÈSE. On soupçonnait « bash --noprofile
          #  --norc » de perdre /usr/local/bin : c'est faux, ces deux options
          #  empêchent de LIRE des fichiers, elles ne réinitialisent aucune
          #  variable. Les deux PATH sont identiques, mesurés côte à côte.
          #  Ce banc gèle la mesure pour que personne n'aille « corriger » le
          #  PATH en croyant tenir le coupable, et garde le vrai point
          #  sensible : « installé, à l'arrêt » ne doit pas se lire
          #  « pas installé ».
          bash tests/test_lexos_ia_ollama.sh

  partage:
    name: Serveur de partage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Téléchargement, envoi, collisions, remontée de chemin
        if: ${{ !cancelled() }}
        run: python3 tests/test_share_server.py

      - name: LexOS Boost — le profil suit le matériel, et tout se défait
        if: ${{ !cancelled() }}
        run: |
          #  BANC ORPHELIN PENDANT CINQ ISO. Ajouté le 21 août avec LexOS
          #  Boost, il n'était lancé par aucune tâche : 23 cas d'essai qui
          #  n'ont jamais protégé quoi que ce soit. Les builds 73 à 77 sont
          #  sortis avec ce filet décroché.
          #
          #  Ce qu'il garde est la promesse centrale de Boost : toute action
          #  qui s'applique doit produire ses données de restauration. Sans
          #  ça, on laisse un utilisateur avec une machine modifiée qu'il ne
          #  peut plus remettre d'aplomb — et on ne l'apprend que sur SA
          #  machine, une fois l'ISO gravée.
          #
          #  Il vérifie aussi que le profil calculé suit le matériel décrit :
          #  zram inversement proportionnel à la RAM, aucun saut brutal
          #  autour des seuils, pas de zram sur une grosse machine. Ce sont
          #  des règles qu'une refonte casse sans le vouloir.
          #
          #  Aucune dépendance à installer : bibliothèque standard seulement,
          #  et le banc construit lui-même son chemin d'import.
          python3 tests/test_boost.py
