name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Scripts et configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils d'analyse
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck libxml2-utils

      - name: shellcheck
        run: |
          shellcheck -S warning \
            build.sh \
            auto/config auto/build auto/clean \
            tools/render-branding.sh \
            config/hooks/normal/*.hook.chroot \
            config/includes.chroot/usr/bin/* \
            config/includes.chroot/etc/profile.d/lexos.sh \
            config/includes.chroot/usr/share/lexos/shell/*.sh

      - name: Syntaxe des fichiers de complétion (touche Tab)
        run: |
          #  Ces fichiers ne passent pas par shellcheck : ils emploient les
          #  tournures de bash-completion (COMPREPLY, compgen, _filedir) que
          #  l'analyseur signale à tort hors de leur contexte. On vérifie donc
          #  la syntaxe, et surtout qu'ils déclarent bien leur « complete » —
          #  un fichier sans cette ligne se charge sans rien faire, et la
          #  touche Tab reste muette sans le moindre message d'erreur.
          for f in config/includes.chroot/usr/share/bash-completion/completions/*; do
            bash -n "$f"
            grep -q '^complete ' "$f" \
              || { echo "::error file=$f::pas de ligne « complete » : Tab resterait muet"; exit 1; }
            echo "  ok $f"
          done

      - name: Syntaxe bash des outils embarqués
        run: |
          for f in config/includes.chroot/usr/bin/*; do
            head -n1 "$f" | grep -q bash && bash -n "$f"
          done

      - name: Syntaxe Python des rouages internes
        run: |
          # ast.parse plutôt que py_compile : vérifie la syntaxe sans écrire de
          # __pycache__ dans config/includes.chroot, qui partirait dans l'ISO.
          for f in config/includes.chroot/usr/lib/lexos/*.py; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1], encoding='utf-8').read(), sys.argv[1])" "$f"
            echo "  ok $f"
          done

      - name: Pas de script Python dans /usr/bin
        run: |
          # /usr/bin ne contient que des commandes shell — shellcheck les passe
          # toutes en revue et s'étrangle sur un fichier Python. Les aides en
          # Python vivent dans /usr/lib/lexos, comme share-server.py.
          for f in config/includes.chroot/usr/bin/*; do
            case "$f" in
              *.py) echo "::error file=$f::les scripts Python vont dans /usr/lib/lexos, pas /usr/bin"; exit 1 ;;
            esac
          done
          echo "  ok — aucun script Python dans /usr/bin"

      - name: Validité des SVG
        run: |
          for f in branding/*.svg config/bootloaders/isolinux/*.svg; do
            xmllint --noout "$f" && echo "ok  $f"
          done

      - name: Validité des XML de configuration XFCE
        run: |
          for f in $(find config/includes.chroot -name '*.xml'); do
            xmllint --noout "$f" && echo "ok  $f"
          done

      - name: Listes de paquets bien formées
        run: |
          bad=0
          for f in config/package-lists/*.list.chroot flavours/*/*.list.chroot \
                   config/includes.chroot/usr/share/lexos/optional-packages/*.list; do
            while IFS= read -r line; do
              case "$line" in
                ''|\#*) continue ;;
              esac
              if ! printf '%s' "$line" | grep -qE '^[a-z0-9][a-z0-9+.:-]*$'; then
                echo "::error file=$f::nom de paquet suspect : '$line'"
                bad=1
              fi
            done < "$f"
          done
          exit $bad

      - name: Bits d'exécution présents
        run: |
          bad=0
          for f in build.sh auto/config auto/build auto/clean \
                   tools/render-branding.sh \
                   config/hooks/normal/*.hook.chroot \
                   config/includes.chroot/usr/bin/*; do
            [ -x "$f" ] || { echo "::error file=$f::doit être exécutable (chmod +x)"; bad=1; }
          done
          exit $bad

      - name: Cohérence de lexos.conf
        run: |
          # shellcheck disable=SC1091
          . ./lexos.conf
          test -n "$LEXOS_NAME"    || { echo "LEXOS_NAME vide"; exit 1; }
          test -n "$LEXOS_VERSION" || { echo "LEXOS_VERSION vide"; exit 1; }
          case "$LEXOS_FLAVOUR" in
            minimal|standard|dev|full|gaming|pro) ;;
            *) echo "LEXOS_FLAVOUR invalide : $LEXOS_FLAVOUR"; exit 1 ;;
          esac
          case "$LEXOS_ACCENT_NAME" in
            orange|bleu|rouge|vert|gris|violet|neon) ;;
            *) echo "LEXOS_ACCENT_NAME invalide : $LEXOS_ACCENT_NAME"; exit 1 ;;
          esac
          case "$LEXOS_DOCK_POSITION" in
            right|left|bottom|top) ;;
            *) echo "LEXOS_DOCK_POSITION invalide : $LEXOS_DOCK_POSITION"; exit 1 ;;
          esac
          case "$LEXOS_PERF_PROFILE" in
            auto|petit|medium|performant|max) ;;
            *) echo "LEXOS_PERF_PROFILE invalide : $LEXOS_PERF_PROFILE"; exit 1 ;;
          esac
          case "$LEXOS_KERNEL_CHANNEL" in
            stock|backports) ;;
            *) echo "LEXOS_KERNEL_CHANNEL invalide : $LEXOS_KERNEL_CHANNEL"; exit 1 ;;
          esac
          if [ "$LEXOS_WIFI_AUTO_OPEN" != "off" ]; then
            echo "::error::LEXOS_WIFI_AUTO_OPEN doit rester 'off' par défaut :"
            echo "::error::se connecter seul à un réseau non chiffré ne doit pas être imposé."
            exit 1
          fi
          echo "lexos.conf : $LEXOS_NAME $LEXOS_VERSION ($LEXOS_FLAVOUR / $LEXOS_ACCENT_NAME)"

  theme:
    name: Génération du thème
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chaque accent produit un thème complet
        run: |
          for accent in orange bleu rouge vert gris violet neon; do
            out="/tmp/theme-$accent"
            mkdir -p "$out"
            HOME="$out" ./config/includes.chroot/usr/bin/lexos-theme-gen "$accent" --target "$out"
            test -s "$out/.config/gtk-3.0/gtk.css"
            test -s "$out/.config/xfce4/terminal/terminalrc"
            test -s "$out/.gtkrc-2.0"
            grep -q '#000000' "$out/.config/gtk-3.0/gtk.css"
          done
          echo "7 accents validés."

      - name: Un accent inconnu est refusé
        run: |
          if HOME=/tmp/x ./config/includes.chroot/usr/bin/lexos-theme-gen mauve 2>/dev/null; then
            echo "Un accent invalide aurait dû être rejeté"; exit 1
          fi
          echo "ok"

  outils:
    name: Outils embarqués
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Profils de performance — tous chargeables
        run: |
          for p in petit medium performant max; do
            ./config/includes.chroot/usr/bin/lexos-perf "$p" --user-only --quiet \
              || { echo "profil $p en échec"; exit 1; }
          done
          ./config/includes.chroot/usr/bin/lexos-perf list
          echo "4 profils validés."

      - name: Profil inconnu refusé
        run: |
          if ./config/includes.chroot/usr/bin/lexos-perf turbo 2>/dev/null; then
            echo "un profil invalide aurait dû être rejeté"; exit 1
          fi
          echo ok

      - name: Commande d'écran inconnue refusée
        run: |
          if ./config/includes.chroot/usr/bin/lexos-display teleporter 2>/dev/null; then
            echo "une commande invalide aurait dû être rejetée"; exit 1
          fi
          echo ok

      - name: Position de dock inconnue refusée
        run: |
          if ./config/includes.chroot/usr/bin/lexos dock diagonale 2>/dev/null; then
            echo "une position invalide aurait dû être rejetée"; exit 1
          fi
          echo ok

      - name: Catalogues de la Logithèque identiques
        run: |
          # La démo web annonce les VRAIS noms de paquets Debian, ceux que
          # « lexos logitheque install » utilise. Si les deux catalogues
          # divergent, la démo se met à montrer des applications qui ne
          # s'installeront pas — exactement ce qu'on veut éviter.
          python3 - <<'EOF'
          import re, sys

          demo = set(re.findall(
              r'\{pkg:"([^"]+)"',
              open("web-demo/index.html", encoding="utf-8").read()))

          src = open("config/includes.chroot/usr/bin/lexos-logitheque",
                     encoding="utf-8").read()
          bloc = re.search(r'CATALOGUE="\n(.*?)\n"', src, re.S)
          if not bloc:
              sys.exit("catalogue introuvable dans lexos-logitheque")
          cli = {l.split("|")[1] for l in bloc.group(1).splitlines() if l.strip()}

          if demo != cli:
              print("démo seulement :", sorted(demo - cli))
              print("CLI  seulement :", sorted(cli - demo))
              sys.exit("les deux catalogues de la Logithèque ont divergé")
          print(f"ok — {len(demo)} paquets, mêmes noms des deux côtés")
          EOF

      - name: Classement du matériel Apple
        run: |
          # 36 machines dont on connaît la réponse : Mac Intel, T2, EFI 32
          # bits, Core Duo, Apple Silicon, et des PC qui ne sont pas des Mac.
          # « lexos mac » décide si quelqu'un écrit une clé USB pour rien —
          # une table qui glisse doit casser la CI, pas une soirée.
          bash tests/test_lexos_mac.sh

      - name: Tables de modèles Mac identiques
        run: |
          # Le panneau « Mac (Apple) » de la démo répond exactement à la même
          # question que « lexos mac » sur l'ISO : cette machine peut-elle
          # démarrer LexOS ? Deux tables séparées, donc deux occasions de se
          # contredire — et un utilisateur à qui la démo promet un démarrage
          # que la vraie ISO refusera. On les compare, modèle par modèle.
          python3 - <<'EOF'
          import re, sys

          def tables(texte, motif):
              out = {}
              for cle, corps in re.findall(motif, texte, re.S):
                  out[cle.lower()] = set(corps.replace("\n", " ").replace('"', "")
                                         .replace(",", " ,").split())
              return out

          sh = open("config/includes.chroot/usr/bin/lexos-mac", encoding="utf-8").read()
          shells = {}
          for cle in ("T2", "EFI32", "CPU32", "SILICON"):
              b = re.search(r'MODELES_%s="(.*?)"' % cle, sh, re.S)
              if not b:
                  sys.exit("table MODELES_%s introuvable" % cle)
              shells[cle.lower()] = set(b.group(1).split())

          js = open("web-demo/index.html", encoding="utf-8").read()
          demos = {}
          for cle in ("T2", "EFI32", "CPU32", "SILICON"):
              b = re.search(r'const MAC_%s = \[(.*?)\];' % cle, js, re.S)
              if not b:
                  sys.exit("table MAC_%s introuvable dans la démo" % cle)
              demos[cle.lower()] = set(re.findall(r'"([^"]+)"', b.group(1)))

          faute = 0
          for cle in shells:
              if shells[cle] != demos[cle]:
                  print("%s — ISO seulement : %s" % (cle, sorted(shells[cle] - demos[cle])))
                  print("%s — démo seulement : %s" % (cle, sorted(demos[cle] - shells[cle])))
                  faute = 1
              else:
                  print("ok  %-8s %d modèles" % (cle, len(shells[cle])))
          if faute:
              sys.exit("les tables de modèles Mac ont divergé entre la démo et l'ISO")
          EOF

      - name: Services de comptes en ligne identiques
        run: |
          # Le « type rclone » est ce que la démo affiche sous chaque service
          # et ce que « lexos comptes ajouter » dit de répondre. Une faute
          # d'un côté seulement, et l'utilisateur tape un type que rclone
          # refuse avec « unknown remote type ». On compare clé et type.
          python3 - <<'EOF'
          import re, sys

          sh = open("config/includes.chroot/usr/bin/lexos-comptes", encoding="utf-8").read()
          bloc = re.search(r'SERVICES="\n?(.*?)"\n', sh, re.S)
          if not bloc:
              sys.exit("catalogue SERVICES introuvable dans lexos-comptes")
          cli = {}
          for l in bloc.group(1).splitlines():
              if not l.strip():
                  continue
              p = l.split("|")
              cli[p[0]] = p[1]

          js = open("web-demo/index.html", encoding="utf-8").read()
          b = re.search(r'const CPT_SERVICES = \[(.*?)\n\];', js, re.S)
          if not b:
              sys.exit("CPT_SERVICES introuvable dans la démo")
          demo = dict(re.findall(r'cle:"([^"]+)",\s*type:"([^"]+)"', b.group(1)))

          if demo != cli:
              print("ISO  :", sorted(cli.items()))
              print("démo :", sorted(demo.items()))
              sys.exit("les services de comptes en ligne ont divergé")
          print("ok — %d services, mêmes types rclone des deux côtés" % len(cli))
          EOF

      - name: Dispositions de clavier et VPN identiques
        run: |
          # Deux tables de plus dupliquées entre la démo et l'ISO. Pour le
          # clavier, une faute sur le couple (disposition, variante) donne
          # un setxkbmap qui échoue ; pour le VPN, une entrée présente d'un
          # seul côté est un service recommandé sans l'être vraiment.
          python3 - <<'EOF'
          import re, sys

          js = open("web-demo/index.html", encoding="utf-8").read()
          faute = 0

          sh = open("config/includes.chroot/usr/bin/lexos-clavier", encoding="utf-8").read()
          b = re.search(r'CATALOGUE="\n?(.*?)"\n', sh, re.S)
          if not b:
              sys.exit("CATALOGUE introuvable dans lexos-clavier")
          cli = {l.split("|")[0]: (l.split("|")[1], l.split("|")[2])
                 for l in b.group(1).splitlines() if l.strip()}
          d = re.search(r'const CLAVIERS = \[(.*?)\n\];', js, re.S)
          if not d:
              sys.exit("CLAVIERS introuvable dans la démo")
          demo = {m[0]: (m[1], m[2]) for m in
                  re.findall(r'cle:"([^"]+)", xkb:"([^"]+)", var:"([^"]*)"', d.group(1))}
          if cli != demo:
              print("ISO  :", sorted(cli.items()))
              print("démo :", sorted(demo.items()))
              faute = 1
          else:
              print("ok  clavier : %d dispositions, mêmes couples xkb" % len(cli))

          shv = open("config/includes.chroot/usr/bin/lexos-vpn", encoding="utf-8").read()
          b = re.search(r'GRATUITS="\n?(.*?)"\n', shv, re.S)
          if not b:
              sys.exit("GRATUITS introuvable dans lexos-vpn")
          cliv = {l.split("|")[0] for l in b.group(1).splitlines() if l.strip()}
          d = re.search(r'const VPN_GRATUITS = \[(.*?)\n\];', js, re.S)
          if not d:
              sys.exit("VPN_GRATUITS introuvable dans la démo")
          demov = set(re.findall(r'cle:"([^"]+)"', d.group(1)))
          if cliv != demov:
              print("ISO  :", sorted(cliv), " démo :", sorted(demov))
              faute = 1
          else:
              print("ok  vpn : %d services gratuits des deux côtés" % len(cliv))

          if faute:
              sys.exit("une table a divergé entre la démo et l'ISO")
          EOF

      - name: Aucune variable CSS fantôme dans la démo
        run: |
          # Une var(--nom) qui n'existe pas ne provoque aucune erreur : la
          # propriété est simplement ignorée. Une bordure devient invisible,
          # une barre de graphique transparente, et rien ne le signale — ni
          # la console, ni un test qui vérifie la géométrie. C'est le genre
          # de défaut qu'on ne voit qu'en regardant, donc autant le refuser.
          python3 - <<'EOF'
          import re, sys

          s = open("web-demo/index.html", encoding="utf-8").read()
          style = s[: s.find("</style>")]
          definies = set(re.findall(r'(--[a-z0-9-]+)\s*:', style))
          employees = set(re.findall(r'var\((--[a-z0-9-]+)\)', s))
          manque = sorted(employees - definies)
          if manque:
              for v in manque:
                  print("::error::var(%s) est employée mais jamais définie" % v)
              sys.exit("variable CSS fantôme")
          print("ok — %d variables employées, toutes définies" % len(employees))
          EOF

      - name: Aides affichables sans erreur
        run: |
          for t in lexos lexfetch lexos-perf lexos-net lexos-share lexos-display lexos-mac lexos-comptes lexos-bienetre lexos-clavier; do
            ./config/includes.chroot/usr/bin/$t help >/dev/null \
              || ./config/includes.chroot/usr/bin/$t >/dev/null \
              || { echo "$t help en échec"; exit 1; }
          done
          echo ok

      - name: Alignement des colonnes hors locale UTF-8
        run: |
          # lexfetch aligne ses colonnes avec ${#chaine}. Sans locale
          # multi-octets, bash compte les octets et l'art ASCII décale tout.
          # Le script force un repli C.UTF-8 : on vérifie que ça tient.
          LC_ALL=C ./config/includes.chroot/usr/bin/lexfetch > /tmp/fetch.txt
          NO_COLOR=1 python3 - <<'EOF'
          import sys
          lines = [l.rstrip("\n") for l in open("/tmp/fetch.txt", encoding="utf-8")]
          cols = {l.index(":") for l in lines if " : " in l}
          print("\n".join(lines[:6]))
          if len(cols) > 1:
              sys.exit(f"colonnes désalignées : positions {sorted(cols)}")
          print(f"ok — colonne unique à {cols.pop() if cols else '?'}")
          EOF

  partage:
    name: Serveur de partage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Téléchargement, envoi, collisions, remontée de chemin
        run: python3 tests/test_share_server.py
