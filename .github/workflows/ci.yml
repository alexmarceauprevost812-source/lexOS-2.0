          #  rien ne soit effacé. La mutation qui remet ce défaut fait sortir
          #  le banc en TimeoutExpired : la commande attend une réponse qui ne
          #  viendra jamais.
          bash tests/test_lexos_pages_vides.sh

      - name: L'extinction « téléviseur 1980 » à la fermeture des fenêtres
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « une animation pour fermer les fenêtres comme une vieille
          #  T.V. — l'effet d'animation n'est pas là quand je ferme des
          #  fenêtres ». Il avait raison, et ce n'était PAS un réglage de
          #  travers : l'effet était configuré pour COMPIZ, retiré de Debian
          #  trixie. lexos-wm ne trouvait plus le binaire et se repliait sur
          #  xfwm4, QUI N'A AUCUNE ANIMATION. L'interrupteur des Paramètres
          #  restait là et ne commandait plus rien.
          #
          #  picom le fait, depuis sa v12. Le banc éprouve le script
          #  d'animation contre ce que le manuel de picom EXIGE — en
          #  particulier « opacity » dans le bloc « close », sans laquelle la
          #  fenêtre est invisible dès la première image et l'animation joue
          #  pour rien ; et les deux « offset », sans lesquels l'écrasement se
          #  colle en haut au lieu de se refermer sur le centre.
          #
          #  On installe picom pour que le fichier soit lu par un VRAI picom :
          #  une accolade oubliée et il refuse tout, ce qu'aucune relecture ne
          #  dit. La version d'Ubuntu est trop ancienne pour jouer les
          #  animations — elle suffit pour la syntaxe et pour la détection.
          for p in picom xvfb; do
            dpkg -s "$p" >/dev/null 2>&1               || sudo apt-get install -y --no-install-recommends "$p" >/dev/null
          done
          bash tests/test_lexos_crt.sh

      - name: Un fichier téléchargé s'installe d'un double-clic, sans terminal
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, deux fois le même jour : « peux-tu faire aussi que tout ce
          #  qu'on télécharge, on puisse les exécuter comme Windows, pas
          #  avoir besoin de passer par le terminal tout le temps », puis
          #  « quand on télécharge, l'application soit déjà installée au lieu
          #  de passer par le terminal ».
          #
          #  Il avait raison, et le trou était COMPLET : /etc/xdg/mimeapps.list
          #  ne nommait que sept types (pages web, texte, dossiers, PNG, JPEG).
          #  Double-cliquer sur un .deb, une AppImage ou un .flatpakref ne
          #  faisait littéralement rien, et le seul outil d'installation,
          #  lexos-run-ins, refuse tout ce qui n'est pas un .zip.
          #
          #  CE QUE CE BANC PROTÈGE, ET QUI EST FACILE À CASSER SANS LE VOIR :
          #
          #   · LA RECONNAISSANCE SE FAIT DANS LES OCTETS. « file --mime-type »
          #     ne peut pas servir de référence : mesuré, il annonce une
          #     AppImage comme « application/x-pie-executable », un type qui
          #     n'existe même pas dans shared-mime-info.
          #   · RIEN NE S'EXÉCUTE SANS ACCORD. C'est la doctrine écrite du
          #     dépôt (lexos-run-ins:9-23). Le banc lâche un script PIÈGE qui
          #     laisse une trace et vérifie qu'il ne laisse rien tant que le
          #     mot « lancer » n'a pas été tapé.
          #   · GIO IGNORE EN SILENCE un .desktop dont le « Exec= » ne mène
          #     nulle part — et update-desktop-database l'inscrit quand même.
          #     On croit l'association posée ; « gio mime » répond « No default
          #     applications ». Le banc vérifie que le programme existe.
          #   · L'AGENT POLKIT. Le dépôt affirmait que l'agent du mot de passe
          #     « arrive par les Recommends de xfce4-session » : c'est FAUX
          #     (ces Recommends ne nomment que dbus, logind, un économiseur
          #     d'écran, upower, xfdesktop4, xfwm4). Sans agent, pkexec échoue
          #     sans fenêtre et sans message — tous les boutons
          #     d'administration des Paramètres sont muets, ce qu'Alex a
          #     décrit sur son vieil ordinateur.
          #
          #  Le banc n'a besoin d'aucun écran : sans DISPLAY, l'outil prend son
          #  chemin terminal, qui porte exactement le même garde-fou.
          bash tests/test_lexos_ouvrir.sh

      - name: LexOS Pro Terminal — le terminal officiel qui remplace l'ancien
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « c'est le new terminal officiel de LexOS Pro, pour le
          #  terminal normal je veux que ce soit lui qui le remplace. »
          #
          #  Une page HTML ne peut, seule, qu'afficher du texte qui défile :
          #  toutes les commandes passent par un pont local
          #  (terminal-pro.py) qui les exécute pour de vrai dans bash, avec
          #  les droits de la personne qui les tape.
          #
          #  CE QUE CE BANC PROTÈGE :
          #   · LE PONT EXÉCUTE N'IMPORTE QUOI, EXPRÈS — donc seul QUI peut
          #     l'atteindre compte : 127.0.0.1 seulement, un jeton tiré au
          #     hasard exigé dans un EN-TÊTE (jamais l'URL seule — une
          #     requête simple part avant toute vérification CORS), et
          #     l'Origine quand le navigateur en pose une.
          #   · AUCUNE COMMANDE FICTIVE NE MASQUE PLUS UNE VRAIE COMMANDE.
          #     La page reçue réimplémentait ls/cd/cat/mkdir/whoami/ps…
          #     contre un système de fichiers en mémoire ; si un seul de ces
          #     noms redevenait un built-in local, taper « ls » ne
          #     montrerait plus jamais le vrai dossier.
          #   · TOUTES LES FORMES D'APPEL ARRIVENT AU BON TERMINAL. « -e »,
          #     « -x », « --working-directory », « --hold » : le pont
          #     x-terminal-emulator les transmet, et terminal-pro.py les
          #     comprend — dans les DEUX conventions (celle de
          #     xfce4-terminal et celle de Debian).
          bash tests/test_lexos_terminal_pro.sh

      - name: Le terminal a un VRAI pseudo-terminal — « je suis même pas capable de lancer claude »
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « j'ai beau essayer le terminal LexOS Pro, je suis même
          #  pas capable de lancer claude ». Ce n'était pas un bogue mais
          #  l'architecture : chaque commande partait dans un bash JETABLE,
          #  entrée fermée, sortie ramassée à la fin, tué au bout de 25 s —
          #  et sans pseudo-terminal, donc « isatty() » faux, donc claude
          #  refusait de démarrer, comme sudo, nano, htop et less.
          #
          #  Ce banc éprouve le remplacement avec de VRAIS programmes, jamais
          #  en relisant le code :
          #   · « test -t 0 » est vrai — le verrou qui bloquait claude ;
          #   · une invite de mot de passe s'affiche, reçoit ce qu'on tape,
          #     et l'écho est coupé (le mécanisme exact de sudo) ;
          #   · Ctrl+C interrompt sans tuer la session ;
          #   · une commande de plus de 25 s n'est plus tuée ;
          #   · redimensionner atteint le programme EN COURS (SIGWINCH) ;
          #   · fermer un volet ne laisse aucun orphelin, ni au premier plan
          #     ni en fond ;
          #   · LA MATRICE COMPLÈTE des quatre routes contre les trois refus
          #     — c'est elle qui a trouvé que /api/flux, la route qui OUVRE
          #     le shell, ne vérifiait ni le jeton ni l'origine.
          bash tests/test_lexos_terminal_pty.sh

      - name: Le terminal s'affiche pour de vrai — la vraie page dans un vrai navigateur
        if: ${{ !cancelled() }}
        run: |
          #  Le banc ci-dessus éprouve le pont ; celui-ci éprouve L'ÉCRAN.
          #  Un pseudo-terminal parle en grille de caractères — place le
          #  curseur ici, efface de là — et c'est xterm.js qui tient cette
          #  grille. Rien de tout ça ne se voit dans un bac à sable au
          #  « fetch » simulé : on charge donc la VRAIE page dans Chromium,
          #  contre le VRAI pont, on TAPE au clavier, et on lit ce que le
          #  terminal affiche.
          #
          #  CE QUE CE BANC A TROUVÉ EN ÉTANT ÉCRIT, et qu'aucune relecture
          #  n'avait vu : la page ne s'ouvrait pas du tout (« ACCUEIL is not
          #  defined »), et elle allait chercher ses polices chez Google à
          #  chaque ouverture — sur un portable sans réseau, le terminal
          #  principal du système attendait une réponse qui ne vient jamais.
          #
          #  ═══ ET IL NE S'EST JAMAIS EXÉCUTÉ ICI — MESURÉ ═══
          #  Le commentaire d'origine disait « si Chromium ou node-xterm
          #  manquent, ce banc le DIT et se saute ». Il le disait, en effet.
          #  Sauf que cette étape N'INSTALLAIT RIEN : ni node-xterm, ni
          #  playwright, ni Chromium. Le banc sautait donc à CHAQUE
          #  construction — et rendait 0, c'est-à-dire VERT. La preuve est
          #  dans le journal du coureur : cette étape dure ZÉRO SECONDE,
          #  construction après construction.
          #
          #  Le seul banc qui éprouve L'AFFICHAGE du terminal principal du
          #  système n'a donc jamais tourné, tout en s'annonçant vert. C'est
          #  le faux vert que ce dépôt traque partout ailleurs, et il portait
          #  sur la pièce la plus visible de l'ISO.
          #
          #  On pose donc les trois outils, et LEXOS_EXIGER_NAVIGATEUR=1 fait
          #  du saut un ROUGE : ici, l'affichage DOIT être éprouvé.
          #    · node-xterm — la grille de caractères, PAQUET DEBIAN (jamais
          #      npm : c'est la règle du dépôt, et c'est ce paquet-là que le
          #      hook 0455 pose sur l'ISO, donc celui qu'il faut éprouver ;
          #    · playwright + Chromium — le vrai navigateur.
          #  ═══ ON CHOISIT OÙ VA CHROMIUM, ON NE LE CHERCHE PLUS ═══
          #  Première tentative : poser playwright, lancer « playwright
          #  install chromium », et chercher le binaire aux endroits connus.
          #  L'installation a rendu 0 — et le banc a quand même dit
          #  « absent : chromium ». Deviner l'emplacement par défaut d'un
          #  outil qui peut le changer d'une version à l'autre, c'est
          #  exactement ce que ce dépôt reproche aux contrôles qui lisent
          #  au lieu de mesurer.
          #  PLAYWRIGHT_BROWSERS_PATH FIXE l'endroit : playwright y pose
          #  « chromium-XXXX/chrome-linux/chrome », disposition vérifiée sur
          #  une installation réelle. Le banc regarde cette variable en
          #  premier ; il ne peut donc plus le rater.
          #  HORS DU DÉPÔT : « $RUNNER_TEMP », pas le répertoire de travail.
          #  Des centaines de mégaoctets de binaires de navigateur déposés
          #  dans le dépôt seraient relus par les étapes suivantes — celles
          #  qui ratissent les fichiers du projet — et un banc finirait par
          #  se plaindre d'un fichier qui n'est pas à nous.
          export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP:-$HOME/.cache}/lexos-navigateurs"
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          sudo apt-get install -y --no-install-recommends node-xterm >/dev/null \
            || { echo "::error::node-xterm n'a pas pu être posé — la grille du terminal ne peut pas être éprouvée"; exit 1; }
          npm i --no-save --no-audit --no-fund playwright >/dev/null 2>&1 \
            || { echo "::error::playwright n'a pas pu être posé"; exit 1; }
          #  ET ON NE JETTE PLUS SA SORTIE. Un « >/dev/null 2>&1 » sur une
          #  commande qui rend 0 sans avoir rien fait, c'est un échec muet —
          #  celui qui vient de coûter une construction.
          npx --yes playwright install chromium \
            || { echo "::error::Chromium n'a pas pu être posé par playwright"; exit 1; }
          echo "navigateurs posés dans $PLAYWRIGHT_BROWSERS_PATH :"
          ls -1 "$PLAYWRIGHT_BROWSERS_PATH" 2>/dev/null || echo "  (dossier vide)"
          LEXOS_EXIGER_NAVIGATEUR=1 bash tests/test_lexos_terminal_navigateur.sh

