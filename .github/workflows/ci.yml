name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Scripts et configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils d'analyse
        run: |
          #  L'index d'abord, et sans se laisser abattre par un dépôt tiers :
          #  voir .github/scripts/apt-sain.sh. Sans lui, un « Hash Sum
          #  mismatch » chez Google Chrome — un dépôt que ce projet n'emploie
          #  PAS — faisait rendre 100 à apt, tuait cette étape, et laissait
          #  xmllint absent pour les deux étapes suivantes, qui se
          #  plaignaient alors de SVG et de XML au lieu de nommer la panne.
          bash .github/scripts/apt-sain.sh
          sudo apt-get install -y shellcheck libxml2-utils

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: |
          #  usr/lib/lexos/*.sh n'existe pas : ce dossier mélange du bash SANS
          #  extension et du Python (settings.py…) — un glob large y ferait
          #  s'étrangler shellcheck sur les .py (mesuré : SC1071) et sur les
          #  sous-dossiers (boost/, diagnostic/ : « is a directory »). On nomme
          #  donc les scripts un par un, plutôt que de les laisser hors de
          #  toute analyse statique (angle mort trouvé par une revue
          #  adversariale : une erreur de syntaxe après le dernier point de
          #  sortie de polkit-agent n'était vue ni ici ni par « bash -n »).
          shellcheck -S warning \
            build.sh \
            auto/config auto/build auto/clean \
            tools/render-branding.sh \
            config/hooks/normal/*.hook.chroot \
            config/hooks/normal/*.hook.binary \
            config/includes.chroot/usr/bin/* \
            config/includes.chroot/etc/profile.d/lexos.sh \
            config/includes.chroot/usr/share/lexos/shell/*.sh \
            config/includes.chroot/usr/lib/lexos/claude-apres-installation \
            config/includes.chroot/usr/lib/lexos/demo-guard \
            config/includes.chroot/usr/lib/lexos/gpu-garde \
            config/includes.chroot/usr/lib/lexos/grub-defaut-windows \
            config/includes.chroot/usr/lib/lexos/lexos-fuseau-confirmer \
            config/includes.chroot/usr/lib/lexos/lexos-fuseau-position \
            config/includes.chroot/usr/lib/lexos/polkit-agent

      - name: Syntaxe des fichiers de complétion (touche Tab)
        if: ${{ !cancelled() }}
        run: |
          #  Ces fichiers ne passent pas par shellcheck : ils emploient les
          #  tournures de bash-completion (COMPREPLY, compgen, _filedir) que
          #  l'analyseur signale à tort hors de leur contexte. On vérifie donc
          #  la syntaxe, et surtout qu'ils déclarent bien leur « complete » —
          #  un fichier sans cette ligne se charge sans rien faire, et la
          #  touche Tab reste muette sans le moindre message d'erreur.
          for f in config/includes.chroot/usr/share/bash-completion/completions/*; do
            bash -n "$f"
            grep -q '^complete ' "$f" \
              || { echo "::error file=$f::pas de ligne « complete » : Tab resterait muet"; exit 1; }
            echo "  ok $f"
          done

      - name: Syntaxe bash des outils embarqués
        if: ${{ !cancelled() }}
        run: |
          #  LA FORME « head | grep -q bash && bash -n » A FAIT ROUGIR LA CI
          #  POUR RIEN. Le code de sortie d'une étape est celui de sa DERNIÈRE
          #  commande : au dernier tour de boucle, un fichier en « #!/bin/sh »
          #  fait échouer le grep, donc la liste « && », donc l'étape — alors
          #  que la syntaxe de tout le monde est bonne. Tant que le dernier
          #  fichier du glob était un « lexos-* » en bash, personne ne l'a vu ;
          #  « miss » trie APRÈS tous les « lexos-* », et le piège s'est
          #  refermé au premier ajout.
          #  Un « if » ne rend pas le code du test, et le compte final donne à
          #  l'étape un état qui ne dépend plus de l'ordre alphabétique.
          vus=0
          for f in config/includes.chroot/usr/bin/*; do
            if head -n1 "$f" | grep -q bash; then
              bash -n "$f"
              vus=$((vus + 1))
            fi
          done
          echo "  ok — $vus outil(s) bash de syntaxe correcte"

      - name: Syntaxe Python des rouages internes
        if: ${{ !cancelled() }}
        run: |
          # ast.parse plutôt que py_compile : vérifie la syntaxe sans écrire de
          # __pycache__ dans config/includes.chroot, qui partirait dans l'ISO.
          for f in config/includes.chroot/usr/lib/lexos/*.py; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1], encoding='utf-8').read(), sys.argv[1])" "$f"
            echo "  ok $f"
          done

      - name: Pas de script Python dans /usr/bin
        if: ${{ !cancelled() }}
        run: |
          # /usr/bin ne contient que des commandes shell — shellcheck les passe
          # toutes en revue et s'étrangle sur un fichier Python. Les aides en
          # Python vivent dans /usr/lib/lexos, comme share-server.py.
          for f in config/includes.chroot/usr/bin/*; do
            case "$f" in
              *.py) echo "::error file=$f::les scripts Python vont dans /usr/lib/lexos, pas /usr/bin"; exit 1 ;;
            esac
          done
          echo "  ok — aucun script Python dans /usr/bin"

      - name: Validité des SVG
        if: ${{ !cancelled() }}
        run: |
          #  LE FOND DU MENU BIOS S'APPELLE « splash.svg.in », PAS « .svg ».
          #  live-build ne lit QUE le .in : il le rend en splash.png, puis
          #  écrase et efface tout .svg du même dossier. Le dessin d'Alex
          #  portait le nom sans « .in » et n'a jamais atteint une clé USB.
          #  Le motif « *.svg » ne trouvait donc plus rien après le
          #  renommage, et le shell passait l'étoile elle-même à xmllint —
          #  une CI rouge sur un dépôt sain. On nomme les deux formes, et
          #  on saute proprement un motif sans correspondance.
          bad=0
          for f in branding/*.svg \
                   config/bootloaders/isolinux/*.svg \
                   config/bootloaders/isolinux/*.svg.in; do
            [ -e "$f" ] || continue
            xmllint --noout "$f" && echo "ok  $f" || bad=1
          done
          #  Un fond absent des DEUX noms, c'est le menu BIOS sur fond noir :
          #  personne ne le verrait avant la clé USB.
          ls config/bootloaders/isolinux/splash.svg.in >/dev/null 2>&1 \
            || { echo "::error::config/bootloaders/isolinux/splash.svg.in manque : le menu de démarrage BIOS démarrerait sur fond noir"; bad=1; }
          exit $bad

      - name: Validité des XML de configuration XFCE
        if: ${{ !cancelled() }}
        run: |
          for f in $(find config/includes.chroot -name '*.xml'); do
            xmllint --noout "$f" && echo "ok  $f"
          done

      - name: Un paquet n'est pas à la fois obligatoire et « au mieux »
        if: ${{ !cancelled() }}
        run: |
          #  LES DEUX RÉGIMES NE FONT PAS LA MÊME PROMESSE.
          #  Une liste .list.chroot est OBLIGATOIRE : si le paquet manque, la
          #  construction s'arrête. Une liste optional-packages est posée « au
          #  mieux » par le hook 0250 : si le paquet ne passe pas, la
          #  construction CONTINUE SANS RIEN DIRE et l'ISO sort quand même.
          #
          #  Écrire le même nom des deux côtés, c'est donc deux vérités pour un
          #  seul paquet — et le jour où l'une des deux change, plus personne ne
          #  sait laquelle fait foi. C'est aussi ce qui brouille
          #  /etc/lexos/optional-report : un paquet qui ne peut pas manquer y
          #  figure quand même, et on le lit comme s'il pouvait manquer.
          #
          #  On ne compare QU'AVEC config/package-lists/, la liste de TOUTES les
          #  saveurs. Les listes de flavours/ sont écartées volontairement : un
          #  paquet strict dans flavours/gaming n'atteint pas la saveur
          #  « minimal », et le régime « au mieux » y garde alors un sens.
          #  Un contrôle plus large aurait été plus sévère et FAUX.
          noms() {
            sed 's/#.*//' "$1" | tr '|' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -E '^[a-z0-9]' || true
          }
          STRICTS="$(for f in config/package-lists/*.list.chroot; do
            [ -r "$f" ] && noms "$f"; done | sort -u)"
          bad=0
          for f in config/includes.chroot/usr/share/lexos/optional-packages/*.list; do
            [ -r "$f" ] || continue
            while IFS= read -r n; do
              [ -n "$n" ] || continue
              if printf '%s\n' "$STRICTS" | grep -qx -- "$n"; then
                echo "::error file=$f::'$n' est à la fois obligatoire (config/package-lists/) et optionnel. Deux régimes, deux promesses : choisir l'un des deux."
                bad=1
              fi
            done <<< "$(noms "$f")"
          done
          [ "$bad" = 0 ] && echo "  ok — aucun paquet dans les deux régimes à la fois"
          exit "$bad"

      - name: Le Wi-Fi cliquable et ses outils sont OBLIGATOIRES
        if: ${{ !cancelled() }}
        run: |
          #  LE MOTEUR DU WI-FI EST LÀ TROIS FOIS — les quatre composantes
          #  d'archive ouvertes, --firmware-chroot/--firmware-binary, et
          #  network-manager + wpasupplicant en obligatoire. Ce qui manquait,
          #  c'est la POIGNÉE : network-manager-gnome, l'applet de la barre,
          #  était posé « au mieux ». Le jour où il ne passe pas, la carte
          #  marche, le pilote est chargé, et il n'y a AUCUNE icône — pour qui
          #  n'ouvre pas de terminal, c'est « le Wi-Fi ne marche pas ».
          #  Exactement la leçon des dossiers blancs de l'ISO 72.
          bad=0
          for p in network-manager-gnome bluez blueman bluez-obexd; do
            if ! grep -qxF "$p" flavours/standard/desktop.list.chroot; then
              echo "::error file=flavours/standard/desktop.list.chroot::'$p' n'y est plus. Posé « au mieux », son absence ne ferait PAS échouer la construction — l'ISO sortirait sans icône réseau."
              bad=1
            fi
          done
          #  POURQUOI wireless-regdb EST OBLIGATOIRE, ET POURQUOI CE N'EST PAS
          #  CE QU'ON CROYAIT. On a longtemps écrit ici que --firmware-chroot
          #  « ne prend que les paquets nommés firmware-* ». C'est très
          #  probablement faux : live-build sélectionne par CHEMIN, pas par
          #  nom — il lit les fichiers Contents de l'archive et retient tout
          #  paquet qui dépose quelque chose sous lib/firmware, quel que soit
          #  son nom. Vérifié directement dans le paquet : wireless-regdb
          #  dépose bien ./lib/firmware/regulatory.db (+ sa signature), donc
          #  serait ramassé de toute façon si l'hypothèse tient.
          #  « très probablement » et pas « vérifié » : la source exacte de
          #  live-build pour Debian 13 n'a pas pu être relue dans cette passe
          #  (dépôt hors de la liste des hôtes autorisés pour ce réseau) — à
          #  confirmer sur une vraie construction plutôt qu'à trancher ici.
          #
          #  On garde wireless-regdb obligatoire dans tous les cas : un
          #  deuxième filet ne coûte rien, et une base de régulation absente
          #  ne se voit pas — canaux 5 GHz amputés, puissance réduite, un
          #  Wi-Fi qui marche moins loin sans qu'aucune erreur ne le dise, et
          #  qu'on met sur le dos du routeur.
          #  x11-xserver-utils fournit xrandr : SIX chemins en dépendent, dont
          #  la section Écrans des Paramètres, qui s'affichait VIDE quand il
          #  manquait. pulseaudio-utils fournit pactl, appelé à quatre endroits
          #  de settings.py : sans lui la section Son s'ouvre et ne fait rien.
          for p in x11-xserver-utils pulseaudio-utils; do
            if ! grep -qxF "$p" flavours/standard/desktop.list.chroot; then
              echo "::error file=flavours/standard/desktop.list.chroot::'$p' n'y est plus. Posé « au mieux », son absence ne ferait PAS échouer la construction — et une section entière des Paramètres s'afficherait vide sans rien dire."
              bad=1
            fi
          done
          for p in wireless-regdb iw ethtool; do
            if ! grep -qxF "$p" config/package-lists/lexos-core.list.chroot; then
              echo "::error file=config/package-lists/lexos-core.list.chroot::'$p' manque."
              bad=1
            fi
          done
          [ "$bad" = 0 ] && echo "  ok — l'applet réseau, le Bluetooth et les trois outils sont obligatoires"
          exit "$bad"

      - name: Listes de paquets bien formées
        if: ${{ !cancelled() }}
        run: |
          #  Une LIGNE peut proposer plusieurs noms séparés par « | » : le hook
          #  0250 les essaie dans l'ordre et garde le premier qui s'installe
          #  (« ppsspp-qt|ppsspp|ppsspp-sdl »). C'est ce qui évite qu'un paquet
          #  renommé entre deux versions de Debian fasse perdre la fonction.
          #  Ce contrôle l'ignorait et rejetait ces lignes : on valide donc
          #  chaque nom de rechange SÉPARÉMENT, ce qui reste aussi strict sur
          #  chacun d'eux.
          bad=0
          for f in config/package-lists/*.list.chroot flavours/*/*.list.chroot \
                   config/includes.chroot/usr/share/lexos/optional-packages/*.list; do
            while IFS= read -r line; do
              case "$line" in
                ''|\#*) continue ;;
              esac
              #  « | » n'est autorisé que dans les listes optionnelles : les
              #  listes obligatoires doivent nommer un paquet unique, sinon la
              #  garantie « le build échoue si absent » n'a plus de sens.
              case "$f" in
                *optional-packages/*) ;;
                *) if printf '%s' "$line" | grep -q '|'; then
                     echo "::error file=$f::nom de rechange interdit en liste obligatoire : '$line'"
                     bad=1
                     continue
                   fi ;;
              esac
              nom_ko=""
              IFS='|' read -r -a alternatives <<< "$line"
              for nom in "${alternatives[@]}"; do
                if ! printf '%s' "$nom" | grep -qE '^[a-z0-9][a-z0-9+.:-]*$'; then
                  nom_ko="$nom"
                  break
                fi
              done
              if [ -n "$nom_ko" ]; then
                echo "::error file=$f::nom de paquet suspect : '$nom_ko' (dans la ligne '$line')"
                bad=1
              fi
            done < "$f"
          done
          exit $bad

      - name: Les tuiles du panneau n'emploient que des balises que genmon connaît
        if: ${{ !cancelled() }}
        run: |
          #  LE SILENCE QUE CE CONTRÔLE ATTRAPE.
          #  genmon lit la sortie d'un script et n'y comprend qu'un jeu FERMÉ
          #  de balises. Une balise qu'il ne connaît pas, il la jette — sans
          #  un mot. La tuile s'affiche donc parfaitement, et seule l'action
          #  manque.
          #
          #  C'est arrivé : nos tuiles écrivaient <click>, qui n'existe pas.
          #  La bonne balise est <txtclick>. L'horloge et la météo étaient
          #  jolies dans la barre et ne s'ouvraient sur rien, sur une ISO
          #  entière, avant qu'Alex ne le voie sur sa machine.
          #
          #  Liste tirée de la documentation officielle du greffon :
          #  https://docs.xfce.org/panel-plugins/xfce4-genmon-plugin/start
          CONNUES="txt txtclick img imgclick icon iconclick bar tool css"

          bad=0
          for f in config/includes.chroot/usr/bin/*; do
            [ -f "$f" ] || continue
            grep -q -- '--panneau' "$f" || continue
            #  UNE PAIRE COMPLÈTE, SUR UNE LIGNE QUI N'EST PAS UN COMMENTAIRE.
            #  Première version de ce contrôle : toute balise ouvrante. Elle
            #  hurlait sur <nom>, <code>, <vent>, <min>, <max> — qui sont des
            #  espaces réservés dans l'aide (« lexos meteo ville <nom> ») et
            #  dans des commentaires, pas de la sortie genmon. Un contrôle qui
            #  crie au loup finit par être ignoré, et c'est comme ça qu'on
            #  rate le vrai. On ne regarde donc que ce qui ressemble
            #  VRAIMENT à de la sortie genmon : <x>…</x> sur une ligne de code.
            for T in $(grep -v '^[[:space:]]*#' "$f" \
                       | grep -oE '<[a-z][a-z0-9]*>[^<]*</[a-z][a-z0-9]*>' \
                       | sed 's/^<\([a-z0-9]*\)>.*/\1/' | sort -u); do
              ok=0
              for C in $CONNUES; do [ "$T" = "$C" ] && ok=1 && break; done
              if [ "$ok" = "0" ]; then
                echo "::error file=$f::balise genmon inconnue : <$T>. genmon l'ignorera en silence — la tuile s'affichera et ne fera rien. Balises admises : $CONNUES"
                bad=1
              fi
            done
          done
          [ "$bad" = "0" ] && echo "  ok — toutes les tuiles n'emploient que des balises connues"
          exit $bad

      - name: Le contrôle 16 dit la même chose dans toutes les locales
        if: ${{ !cancelled() }}
        run: |
          #  NÉ D'UNE CI ROUGE POUR RIEN. Le contrôle 16 attrapait les alias
          #  accentués du dispatcheur avec la classe [à-ÿ]. Un intervalle de
          #  caractères non ASCII dépend de la locale : sur ce runner, sed a
          #  répondu « Invalid collation character » — deux lignes noyées
          #  dans la sortie — l'extraction a rendu du vide, et trois outils
          #  parfaitement branchés ont été déclarés absents de l'aide.
          #
          #  On engendre VRAIMENT les locales avant de lancer le test : sans
          #  ça, setlocale échoue en silence, tout retombe en C, et le test
          #  annonce quatre locales éprouvées sans en avoir éprouvé une
          #  seule. Il le dit maintenant quand une locale manque — mieux
          #  vaut un test qui se déclare aveugle qu'un test qui ment.
          #  Si locale-gen manque, le test le DIRA (⏭ locale absente) et
          #  continuera sur C.UTF-8, toujours présente : on ne casse pas
          #  la CI pour ça, on perd juste deux locales de couverture.
          sudo locale-gen en_US.UTF-8 fr_CA.UTF-8 \
            || echo "::warning::locale-gen indisponible — couverture réduite à C.UTF-8"
          bash tests/test_verifier_parametres.sh

      - name: Contrôle 16 — chaque outil est branché (Paramètres, case, aide)
        if: ${{ !cancelled() }}
        run: |
          #  Le script vit à la racine pour qu'Alex puisse le lancer à la main.
          #  --strict : une erreur du contrôle 16 arrête la CI. Les
          #  avertissements (lanceurs volontairement absents) ne bloquent pas.
          ./verifier-parametres.sh --strict

      - name: Un paquet de backports exige que backports soit ouvert
        if: ${{ !cancelled() }}
        run: |
          #  LE SILENCE QUE CE CONTRÔLE ATTRAPE.
          #  Un paquet qui n'existe QUE dans trixie-backports, écrit dans une
          #  liste optionnelle sans que config/archives ouvre l'archive : apt
          #  ne le trouve pas, le hook 0250 tolère un paquet absent (à raison),
          #  la construction réussit, et l'ISO sort sans la fonction. Aucune
          #  erreur nulle part — le pire des deux silences, celui qui a l'air
          #  d'un succès.
          #
          #  CE CONTRÔLE A LUI-MÊME MENTI PENDANT 67 CONSTRUCTIONS.
          #  Il tenait « llama.cpp » pour un paquet de backports sur la foi
          #  d'une liste écrite à la main, vérifiait la PLOMBERIE (archive
          #  ouverte ? épinglée ?), la trouvait correcte, et affichait
          #  « ok — llama.cpp : backports ouvert et épinglé ». Tout était vrai
          #  sauf la prémisse : llama.cpp n'a jamais été dans trixie-backports.
          #  On vérifiait la serrure sans regarder s'il y avait une porte.
          #
          #  Le runner a bien accès au réseau — c'est celui qui installe les
          #  paquets de la CI. On lit donc l'index de l'archive pour de vrai.
          #  Si l'archive est injoignable, on AVERTIT sans bloquer : une panne
          #  réseau ne doit pas casser la CI, mais elle ne doit pas non plus
          #  se faire passer pour une validation.
          #  LA LISTE, REFAITE À PARTIR DE L'INDEX PLUTÔT QUE DE MÉMOIRE.
          #  « llama.cpp » y figurait à tort : il n'est pas dans backports, il
          #  n'est que dans testing et unstable. Il en sort.
          #  Y entrent les deux paquets qui en viennent VRAIMENT, tous deux en
          #  composante contrib : sans config/archives/, l'ISO perdrait le
          #  compositeur de jeu et le miroir d'écran Android, en silence.
          BACKPORTS_SEULEMENT="gamescope scrcpy"

          if [ -z "$BACKPORTS_SEULEMENT" ]; then
            echo "  aucun paquet declaré « backports seulement » — rien à vérifier"
            exit 0
          fi

          #  LES QUATRE COMPOSANTES, PAS SEULEMENT MAIN. gamescope et scrcpy
          #  sont en contrib : un index limité à main les déclarerait absents
          #  et ferait échouer la CI sur deux paquets parfaitement installés.
          #  C'est l'erreur exacte qui a fait croire un temps qu'ils
          #  manquaient — vérifier une archive, c'est vérifier TOUTE l'archive.
          INDEX="$(mktemp)"
          INDEX_OK=1
          for c in main contrib non-free non-free-firmware; do
            for a in amd64 all; do
              curl -fsS --max-time 60 \
                "https://deb.debian.org/debian/dists/trixie-backports/$c/binary-$a/Packages.xz" \
                2>/dev/null | unxz -c 2>/dev/null >> "$INDEX" || true
            done
          done
          [ -s "$INDEX" ] || INDEX_OK=0

          bad=0
          for pkg in $BACKPORTS_SEULEMENT; do
            trouve=""
            for f in config/package-lists/*.list.chroot \
                     config/includes.chroot/usr/share/lexos/optional-packages/*.list; do
              [ -r "$f" ] || continue
              if grep -qE "^[[:space:]]*${pkg}([[:space:]]|\||$)" "$f"; then
                trouve="$f"
                break
              fi
            done
            [ -n "$trouve" ] || continue
            if ! grep -rqs 'trixie-backports' config/archives/*.list.chroot 2>/dev/null; then
              echo "::error file=$trouve::'$pkg' n'existe que dans trixie-backports, mais config/archives/ n'ouvre pas cette archive. apt ne le trouvera pas, le build RÉUSSIRA quand même, et l'ISO sortira sans."
              bad=1
              continue
            fi
            #  Ouvrir backports sans épingler, c'est laisser la moitié du
            #  système y migrer au fil des mois. Le fichier de préférences
            #  n'est pas optionnel.
            if ! ls config/archives/*.pref.chroot >/dev/null 2>&1; then
              echo "::error::config/archives ouvre trixie-backports sans fichier .pref.chroot : sans épinglage, le reste du système finira par venir de backports."
              bad=1
            fi
            #  LA PRÉMISSE, enfin vérifiée : le paquet est-il DANS l'archive ?
            if [ "$INDEX_OK" = "0" ]; then
              echo "::warning file=$trouve::'$pkg' : archive backports injoignable, sa présence n'a PAS pu être vérifiée. Plomberie correcte, prémisse inconnue."
            elif grep -qE "^Package: ${pkg}\$" "$INDEX"; then
              echo "  ok — $pkg : présent dans trixie-backports, archive ouverte et épinglée"
            else
              echo "::error file=$trouve::'$pkg' est réclamé comme paquet de trixie-backports, mais l'archive NE LE PUBLIE PAS. apt ne le trouvera pas, le hook 0250 tolérera l'absence, le build RÉUSSIRA et l'ISO sortira sans. Retirer le nom de BACKPORTS_SEULEMENT, ou trouver la vraie archive qui le fournit."
              bad=1
            fi
          done
          rm -f "$INDEX"
          exit $bad

      - name: Le matériel vital ne disparaît plus en silence — hook 0250 sur un banc
        if: ${{ !cancelled() }}
        run: |
          #  RELEVÉ SUR L'ALIENWARE AURORA ACT1250 D'ALEX. firmware-iwlwifi
          #  (son Wi-Fi 7 BE200), firmware-realtek, intel-microcode… vivent
          #  dans une liste « au mieux » : avant ce banc, leur absence
          #  finissait comme une ligne « !! indisponible » noyée dans une
          #  heure de journal de construction, et l'ISO sortait sans Wi-Fi
          #  sans un mot de plus.
          #  Le banc rejoue le hook réel (mêmes chemins d'apt, même boucle de
          #  reprise) avec de faux apt/dpkg/systemctl/modinfo sur un PATH
          #  fermé — 12 scénarios, dont deux qui attrapent un bogue réel
          #  trouvé en écrivant ce banc : un « ls … | sed … || repli » se
          #  rattachait au code de sortie de sed, qui réussit même sur une
          #  entrée vide — le repli « aucun micrologiciel » ne se
          #  déclenchait donc JAMAIS.
          bash tests/test_lexos_optional_firmware.sh

      - name: Le module NVIDIA est vérifié pour le BON noyau — hook 0260 sur un banc
        if: ${{ !cancelled() }}
        run: |
          #  verifie_module() est la porte qui décide si une tentative
          #  d'installation du pilote NVIDIA est déclarée RÉUSSIE. Tout le
          #  hook 0260 s'articule dessus : si elle dit oui à tort, la
          #  construction est verte et l'ISO démarre sans pilote — l'écran
          #  noir de l'Alienware, avec un journal qui dit « ok ».
          #
          #  LE CAS. Le chroot peut contenir DEUX noyaux :
          #  LEXOS_KERNEL_CHANNEL=backports fait installer par le hook 0200
          #  un linux-image-amd64 de backports PAR-DESSUS celui de la suite,
          #  sans retirer l'ancien. Les en-têtes, eux, étaient demandés par
          #  « linux-headers-amd64 » — un méta-paquet qui suit la SUITE —
          #  donc DKMS compilait pour l'ANCIEN noyau. La porte balayait
          #  /lib/modules en entier et trouvait ce module-là : verte. Et
          #  l'image démarre sur le noyau RÉCENT, où il n'y a rien.
          #
          #  Le banc extrait les fonctions DU FICHIER LIVRÉ (pas une copie
          #  qui vieillirait en silence), leur donne une fausse arborescence
          #  de noyaux, et joue les DEUX versions de la porte sur la même
          #  scène : la nouvelle refuse, l'ANCIENNE accepte. C'est cette
          #  seconde moitié qui prouve que le défaut était réel.
          bash tests/test_lexos_nvidia_module.sh

      - name: LEXOS PRO — services, gardes structurelles et démarrage graphique
        if: ${{ !cancelled() }}
        run: |
          #  ON INSTALLE PySide6 ICI, ET C'EST LE POINT DE L'ÉTAPE.
          #  Sans lui, la section 7 du banc se déclare « NON MESURÉ » : le
          #  démarrage graphique n'est pas vérifié, et la CI passerait au
          #  vert sans avoir ouvert la fenêtre une seule fois. C'est
          #  exactement le faux vert qu'on refuse ailleurs dans ce fichier.
          #  L'installation se fait dans le coureur jetable, par pip, sans
          #  toucher aux paquets de l'ISO : sur LexOS, python3-pyside6 est
          #  déjà en liste STRICTE (flavours/standard/desktop.list.chroot).
          #  LES BIBLIOTHÈQUES SYSTÈME DE Qt, ET POURQUOI ELLES SONT LÀ.
          #  MESURÉ, PAS SUPPOSÉ : sans elles, la CI 592 a rendu
          #      ImportError: libEGL.so.1: cannot open shared object file
          #  Qt6Gui se lie à libEGL, libGL, libGLX, libGLdispatch, libdbus-1,
          #  libfontconfig, libfreetype, libglib-2.0 et libxkbcommon DÈS
          #  L'IMPORT — y compris pour la plateforme « offscreen », qui
          #  n'affiche pourtant rien. Le coureur n'a ni libegl1 ni libgl1.
          #  On ne met QUE ce qui manque : pas de serveur X, pas de xvfb.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          python3 -m pip install --quiet --user 'PySide6>=6.4'
          #  QT_QPA_PLATFORM=offscreen (posé par le banc) : la fenêtre est
          #  vraiment ouverte et les 18 pages parcourues, sans serveur X —
          #  donc sans xvfb, et sans libxcb-cursor0 qu'exige le greffon xcb.
          #
          #  LEXOS_PRO_EXIGER_MESURE=1 : ICI, un contrôle « non mesuré » est
          #  un ÉCHEC. C'est tout l'intérêt de cette étape — sans cette
          #  ligne, une installation ratée ferait sauter le démarrage
          #  graphique et la CI passerait au vert sans avoir ouvert la
          #  fenêtre une seule fois. Exactement le faux vert qu'on refuse
          #  partout ailleurs dans ce fichier.
          LEXOS_PRO_EXIGER_MESURE=1 bash tests/test_lexos_pro.sh

      - name: lexos-applis — le filtre s'applique, et Exec n'est pas un shell
        if: ${{ !cancelled() }}
        run: |
          #  TROIS DÉFAUTS MESURÉS SUR LA VERSION D'ORIGINE DE L'OUTIL, et les
          #  deux premiers sont de la pire sorte — la commande répond, sans
          #  message, avec une liste plausible qui n'est pas la réponse à la
          #  question posée :
          #    · « lexos applis --liste settings » rendait les 29 applications
          #      au lieu des 4 qui correspondent ;
          #    · « lexos applis settings | … » aussi, par la branche
          #      « sortie non-terminal ».
          #  Le troisième est une injection : un « ; » NON protégé dans la
          #  ligne Exec lançait une seconde commande, parce que la ligne
          #  partait dans « eval ». Or ~/.local/share/applications s'écrit
          #  sans aucun privilège. Lancé par gio, ce fichier n'aurait obtenu
          #  qu'un argument bizarre ; avec eval, il obtenait un shell.
          #
          #  Le banc monte une fausse arborescence de .desktop et un PATH
          #  fermé : aucune application du coureur n'entre dans la mesure.
          bash tests/test_lexos_applis.sh

      - name: Un Windows chiffré n'est pas un disque vide — lexos-dualboot sur un banc
        if: ${{ !cancelled() }}
        run: |
          #  BitLocker ne présente pas « ntfs » à lsblk mais « BitLocker » :
          #  lexos-dualboot ne trouvait donc rien sur un disque chiffré, et
          #  concluait « aucune partition Windows — l'installateur proposera
          #  d'utiliser tout le disque ». Sur une machine où Windows est
          #  simplement verrouillé (pas le cas de l'Alienware d'Alex
          #  aujourd'hui, mais Windows 11 active le chiffrement tout seul
          #  après certaines mises à jour), c'était une invitation à
          #  l'effacer en croyant installer à côté.
          #  Le banc vérifie aussi que l'outil ne s'arrête JAMAIS en cours de
          #  route sur ce cas — contrairement à un « exit 1 » qui avait été
          #  envisagé : lexos-dualboot est un bilan complet qui va toujours
          #  jusqu'au bout (menu de démarrage, UEFI), quel que soit l'état de
          #  Windows.
          bash tests/test_lexos_dualboot_bitlocker.sh

      - name: L'heure juste dans les deux systèmes — heure-dualboot sur un banc
        if: ${{ !cancelled() }}
        run: |
          #  Linux garde l'horloge matérielle en UTC, Windows la lit en heure
          #  locale : sur une machine à double démarrage, chaque bascule
          #  décale donc l'heure de l'autre système — 4 h l'hiver, 5 h l'été
          #  au Québec. preseed.cfg posait UTC et rien ne rattrapait le coup.
          #  Le banc vérifie les deux moitiés de la règle : l'horloge passe
          #  en heure locale QUAND Windows est dans le menu, et RIEN n'est
          #  touché sinon — une machine sans Windows n'a aucune raison de
          #  quitter UTC.
          #  Il vérifie aussi qu'un réglage déjà posé n'est pas refait :
          #  --adjust-system-clock décale l'heure système pour compenser, et
          #  l'appeler deux fois la décalerait deux fois.
          bash tests/test_lexos_heure_dualboot.sh

      - name: L'accent n'est écrit qu'à un seul endroit
        if: ${{ !cancelled() }}
        run: |
          #  CE QUE CE CONTRÔLE PROTÈGE.
          #  Avant ui.css, l'orange #E8590C était écrit en dur dans les
          #  Paramètres, dans le Volet, dans l'IA et dans la démo web — et les
          #  trois panneaux portaient trois palettes différentes. « Mets les
          #  boutons en écriture noire » se corrigeait alors à huit endroits,
          #  dans des fichiers qui ne se parlent pas, et il en restait toujours
          #  un d'oublié.
          #
          #  La duplication ne revient jamais d'un coup : elle revient une
          #  ligne à la fois, chacune parfaitement raisonnable sur le moment.
          #  D'où ce contrôle, qui coûte deux secondes et rend la rechute
          #  visible tout de suite.
          UI="config/includes.chroot/usr/share/lexos/ui.css"
          [ -r "$UI" ] || { echo "::error::$UI a disparu — c'est la source unique de l'apparence"; exit 1; }

          bad=0
          #  PORTÉE : les feuilles de style des panneaux, et elles seules.
          #  Trois occurrences restent ailleurs, et elles sont légitimes :
          #    · settings/web/app.js — le CATALOGUE des accents (orange, bleu,
          #      rouge, vert…). C'est la liste dans laquelle on choisit ;
          #      l'orange y a sa place au même titre que les autres.
          #    · settings/web/app.js — un dessin SVG écrit en JavaScript.
          #    · musique/index.html — une mini-application à part, palette propre.
          #  Un contrôle qui hurle sur des cas justes finit désactivé. Celui-ci
          #  ne regarde que là où la duplication a réellement coûté des heures.
          #  ═══ ON DÉCOMMENTE D'ABORD, ET CE CONTRÔLE L'A APPRIS À SES DÉPENS ═══
          #  Il a refusé la construction de l'ISO 114 en se déclenchant sur un
          #  COMMENTAIRE — celui qui explique pourquoi la couleur d'appui d'un
          #  bouton est --ac et non --ac-hi, et qui cite la mesure pour le
          #  justifier : « #FF7A33 -> #E8590C ». La feuille, elle, n'avait
          #  aucune couleur en dur.
          #
          #  LA MAUVAISE RÉPONSE AURAIT ÉTÉ DE RETIRER LES CHIFFRES DU
          #  COMMENTAIRE. Dans ce dépôt, une décision de couleur se justifie
          #  par sa mesure ; un commentaire qui n'ose plus citer une couleur ne
          #  vaut plus rien, et le contrôle aurait alors gouverné la prose au
          #  lieu de gouverner le code. C'est le contrôle qui devait apprendre
          #  à lire du CSS.
          #
          #  C'est la même correction que dans tests/test_lexos_sections.sh,
          #  qui portait le MÊME défaut : les deux gardes existaient, une seule
          #  a été corrigée du premier coup — parce que c'est celle qu'on lance
          #  en local. D'où ce rappel : quand un garde-fou de cette famille est
          #  corrigé, il faut chercher ses jumeaux.
          decommente() {   # retire les /* … */, y compris sur plusieurs lignes
            awk '
              { ligne = $0; sortie = ""
                while (length(ligne) > 0) {
                  if (dedans) { i = index(ligne, "*/")
                                if (i == 0) { ligne = "" }
                                else { dedans = 0; ligne = substr(ligne, i + 2) } }
                  else        { i = index(ligne, "/*")
                                if (i == 0) { sortie = sortie ligne; ligne = "" }
                                else { sortie = sortie substr(ligne, 1, i - 1)
                                       dedans = 1; ligne = substr(ligne, i + 2) } } }
                print sortie }' "$1"
          }

          for f in config/includes.chroot/usr/share/lexos/*/web/style.css; do
            [ -r "$f" ] || continue
            CODE="$(decommente "$f")"
            #  Garde contre le vert sur du vide : si le décommentage rendait un
            #  fichier quasi nul, l'absence ci-dessous ne prouverait plus rien.
            if [ "$(printf '%s\n' "$CODE" | grep -c .)" -lt 20 ]; then
              echo "::error file=$f::le décommentage n'a presque rien laissé — contrôle invalide"
              bad=1
              continue
            fi
            #  Les DEUX écritures de l'accent. Le halo du survol s'écrivait
            #  « rgba(232,89,12,.30) » — le même orange, en décimal : un
            #  contrôle qui ne cherche que le code hexadécimal serait passé à
            #  côté de la seule duplication qui restait vraiment partout.
            if grep -qniE '#(E8590C|FF7A33)|\(\s*232\s*,\s*89\s*,\s*12\s*[,)]' <<< "$CODE"; then
              echo "::error file=$f::accent écrit en dur — employer var(--ac) ; la seule définition est dans $UI"
              bad=1
            fi
          done

          #  LE LIEN DE CHAQUE PANNEAU RELIÉ. Sans ui.css, aucun var() ne
          #  résout : la page ne devient pas « un peu différente », elle
          #  devient un texte sans couleur sur un fond sans couleur. Une panne
          #  muette et totale, pour un lien symbolique cassé qu'aucun autre
          #  contrôle ne regarde. Quelques lignes ici valent une soirée
          #  d'enquête plus tard.
          #
          #  ON N'EXIGE LE LIEN QUE DES PANNEAUX QUI LE DÉCLARENT DÉJÀ. Un
          #  contrôle qui réclamerait ui.css partout serait rouge dès
          #  aujourd'hui, et on l'aurait désactivé le jour même. La règle est
          #  donc : qui est relié le reste. Les autres sont NOMMÉS plus bas,
          #  sans faire échouer — pour qu'on les voie à chaque exécution au
          #  lieu de les oublier.
          restants=""
          for d in config/includes.chroot/usr/share/lexos/*/web; do
            [ -f "$d/index.html" ] || continue
            if grep -q 'href="ui.css"' "$d/index.html"; then
              [ -L "$d/ui.css" ] || {
                echo "::error file=$d/ui.css::index.html charge ui.css mais le lien vers la source unique est absent"; bad=1; continue; }
              [ -r "$d/ui.css" ] || {
                echo "::error file=$d/ui.css::lien cassé — il pointe vers $(readlink "$d/ui.css")"; bad=1; }
            else
              restants="$restants $(basename "$(dirname "$d")")"
            fi
          done

          #  CE QUI RESTE À FAIRE, DIT TOUT HAUT. Au 2026-08-22 : « cartes » et
          #  « gps ». Le second porte SON PROPRE ORANGE — #ff6a00, pas
          #  #E8590C — et un quatrième vocabulaire (--orange, --text, --card).
          #  C'est exactement la maladie que ui.css soigne, sur un panneau que
          #  l'unification n'a pas encore atteint. Le premier est une
          #  application à part (maplibre, son propre dossier css/).
          #  Les rattacher demande de regarder chaque écran : c'est un travail,
          #  pas un oubli. Cette ligne existe pour qu'il reste visible.
          [ -n "$restants" ] && echo "  note — panneaux pas encore reliés à ui.css :$restants"

          [ "$bad" = "0" ] && echo "  ok — l'accent n'est défini que dans ui.css, et les trois panneaux y sont reliés"
          exit $bad

      - name: La palette des panneaux est celle du bureau
        if: ${{ !cancelled() }}
        run: |
          #  CE QUE CE CONTRÔLE PROTÈGE, ET POURQUOI IL EXISTE.
          #
          #  Alex, après avoir démarré la 71 : « le côté graphique de la démo
          #  n'est pas celui de l'ISO ». Il avait raison. Relevé ce jour-là :
          #
          #      variable      démo       thème GTK    ui.css
          #      fond          #000       #000000      #161311
          #      texte         #fff       #FFFFFF      #EDE6DF
          #      bordure       #232326    #232326      #3A322B
          #
          #  La démo et le thème GTK étaient identiques VALEUR POUR VALEUR ;
          #  c'est ui.css qui était parti tout seul sur un brun chaud. À
          #  l'écran : une fenêtre Thunar noire à texte blanc, et les
          #  Paramètres — qui sont un panneau web — bruns à texte crème, sur
          #  la même machine, côte à côte.
          #
          #  Les valeurs sont alignées maintenant. Ce contrôle est là parce que
          #  la divergence ne revient jamais d'un coup : elle revient une
          #  variable à la fois, chacune raisonnable sur le moment. C'est déjà
          #  arrivé une fois — sans garde-fou, ça arrivera deux.
          UI="config/includes.chroot/usr/share/lexos/ui.css"
          GEN="config/includes.chroot/usr/bin/lexos-theme-gen"
          DEMO="web-demo/index.html"
          for f in "$UI" "$GEN" "$DEMO"; do
            [ -r "$f" ] || { echo "::error::$f introuvable"; exit 1; }
          done

          #  LA SOURCE DE VÉRITÉ EST lexos-theme-gen : c'est lui qui peint le
          #  bureau. La démo et ui.css doivent le suivre, pas l'inverse.
          #  On extrait au grep -oE plutôt qu'au sed à groupes : la première
          #  version de ce contrôle employait des références arrière, et
          #  l'échappement s'est perdu entre le YAML et le shell — le contrôle
          #  annonçait « valeur illisible » sur des valeurs parfaitement
          #  lisibles. Un contrôle qui se trompe sur du code juste finit
          #  désactivé aussi sûrement qu'un contrôle absent.
          hex1() { grep -oE '#[0-9A-Fa-f]{6}' | head -1; }

          val_gen()       { sed -n '/^else$/,/^fi$/p' "$GEN" | grep -m1 "^[[:space:]]*$1=" | hex1; }
          val_gen_clair() { sed -n '/MODE. == .clair/,/^else$/p' "$GEN" | grep -m1 "^[[:space:]]*$1=" | hex1; }
          val_ui()        { grep -m1 -- "^  --$1:" "$UI" | hex1; }
          val_ui_clair()  { sed -n '/data-mode="clair"/,/^}/p' "$UI" | grep -m1 -- "^  --$1:" | hex1; }

          #  #000 et #000000 sont la même couleur : la démo écrit court. On
          #  développe avant de comparer, sinon le contrôle hurlerait sur une
          #  écriture parfaitement valide.
          val_demo() {
            v="$(grep -oE -- "--$1:[[:space:]]*#[0-9A-Fa-f]{3,6}" "$DEMO" | head -1 | grep -oE '#[0-9A-Fa-f]{3,6}')"
            if [ "${#v}" = "4" ]; then
              printf '#%s%s%s%s%s%s' "${v#\#}" "$(printf '%s' "$v" | cut -c2)" "" "" "" "" >/dev/null
              a="$(printf '%s' "$v" | cut -c2)"; b="$(printf '%s' "$v" | cut -c3)"; c="$(printf '%s' "$v" | cut -c4)"
              printf '#%s%s%s%s%s%s' "$a" "$a" "$b" "$b" "$c" "$c"
            else
              printf '%s' "$v"
            fi
          }

          bad=0
          maj() { printf '%s' "$1" | tr 'a-f' 'A-F'; }
          compare() {   # <étiquette> <attendu> <obtenu> <fichier fautif>
            if [ -z "$2" ] || [ -z "$3" ]; then
              echo "::error::$1 : valeur illisible (bureau « $2 », panneau « $3 ») — le contrôle ne peut pas conclure"
              bad=1; return
            fi
            if [ "$(maj "$2")" != "$(maj "$3")" ]; then
              echo "::error file=$4::$1 : le bureau dit $2, mais on lit $3 — les deux doivent être identiques"
              bad=1
            else
              printf '  ok  %-24s %s\n' "$1" "$2"
            fi
          }

          echo "Mode sombre — ui.css contre lexos-theme-gen :"
          compare "fond"             "$(val_gen BG)"      "$(val_ui bg)"      "$UI"
          compare "fond secondaire"  "$(val_gen BG_ALT)"  "$(val_ui bg-alt)"  "$UI"
          compare "survol"           "$(val_gen BG_HI)"   "$(val_ui bg-hi)"   "$UI"
          compare "bordure"          "$(val_gen BORDER)"  "$(val_ui bd)"      "$UI"
          compare "texte"            "$(val_gen FG)"      "$(val_ui fg)"      "$UI"
          compare "texte secondaire" "$(val_gen FG_DIM)"  "$(val_ui fg-dim)"  "$UI"

          echo "Mode clair — ui.css contre lexos-theme-gen :"
          compare "fond clair"       "$(val_gen_clair BG)"      "$(val_ui_clair bg)"     "$UI"
          compare "survol clair"     "$(val_gen_clair BG_HI)"   "$(val_ui_clair bg-hi)"  "$UI"
          compare "bordure claire"   "$(val_gen_clair BORDER)"  "$(val_ui_clair bd)"     "$UI"
          compare "texte clair"      "$(val_gen_clair FG)"      "$(val_ui_clair fg)"     "$UI"

          #  ET LA DÉMO, qui doit dire la même chose que le bureau. C'est le
          #  sens littéral de la règle d'Alex : « tout ce qu'on fait sur la
          #  version Vercel, on le met aussi dans l'ISO ».
          echo "Démo web contre le bureau :"
          compare "démo · fond"      "$(val_gen BG)"      "$(val_demo bg)"      "$DEMO"
          compare "démo · texte"     "$(val_gen FG)"      "$(val_demo fg)"      "$DEMO"
          compare "démo · bordure"   "$(val_gen BORDER)"  "$(val_demo bd)"      "$DEMO"

          #  LE MODE CLAIR DOIT EXISTER. Sans ce bloc, « lexos theme clair »
          #  repeint le bureau en crème et laisse les trois panneaux web NOIRS
          #  — le défaut trouvé après la 71.
          grep -q 'data-mode="clair"' "$UI" || {
            echo "::error file=$UI::le bloc du mode clair a disparu — les panneaux resteraient noirs sur un bureau clair"; bad=1; }
          for d in config/includes.chroot/usr/share/lexos/*/web; do
            grep -q 'href="ui.css"' "$d/index.html" 2>/dev/null || continue
            grep -q 'dataset.mode' "$d/index.html" || {
              echo "::error file=$d/index.html::le panneau ne lit pas ?mode= — il resterait sombre en mode clair"; bad=1; }
          done

          [ "$bad" = "0" ] && echo "  ok — bureau, démo et panneaux disent la même chose"
          exit $bad

      - name: Rien ne reste noir en mode clair
        if: ${{ !cancelled() }}
        run: |
          #  CE QUE CE CONTRÔLE PROTÈGE.
          #  Le mode clair a été ajouté à ui.css : les jetons changent, et les
          #  panneaux suivent. Sauf là où une couleur est ÉCRITE EN DUR — et
          #  il en restait quatre, chacune raisonnable le jour où elle a été
          #  écrite pour un fond noir :
          #    · le volet : sa seule surface opaque valait rgba(20,18,22,.96).
          #      En clair, le texte passe au noir : noir sur noir, volet vide.
          #    · le panneau IA : l'encadré .notice (#170f08) et les trois fonds
          #      de .diag — la ligne qui dit LAQUELLE des trois pannes.
          #    · les Paramètres : les pastilles d'état en #4ADE80 / #F87171 /
          #      #FBBF24, réglées pour du noir, à 2:1 sur du crème.
          #
          #  Une couleur en dur dans un panneau est un pari sur le mode. Les
          #  valeurs viennent maintenant des jetons ou d'un color-mix sur
          #  var(--bg) : elles suivent le fond, quel qu'il soit.
          bad=0
          for f in config/includes.chroot/usr/share/lexos/*/web/style.css; do
            [ -r "$f" ] || continue
            #  On cherche les couleurs OPAQUES et les rgba de forte opacité
            #  posées en fond ou en texte. Les rgba très translucides (< .30)
            #  sont des voiles : posés sur var(--bg), ils suivent le mode tout
            #  seuls, et les interdire ferait hurler le contrôle sur du code
            #  juste — c'est ainsi qu'un garde-fou finit désactivé.
            DUR="$(grep -nE '(background|color)[^;:]*:[^;]*#[0-9A-Fa-f]{6}' "$f" \
                   | grep -viE 'var\(|color-mix' || true)"
            VOILE="$(grep -nE '(background|color)[^;:]*:[^;]*rgba\([0-9 ,]+,[[:space:]]*\.[3-9][0-9]?\)' "$f" \
                     | grep -viE 'var\(|color-mix|rgba\(0,[[:space:]]*0,[[:space:]]*0|shadow' || true)"
            if [ -n "$DUR" ]; then
              echo "::error file=$f::couleur écrite en dur — elle ne suivra pas le mode clair :"
              printf '%s\n' "$DUR" | sed 's/^/      /'
              bad=1
            fi
            if [ -n "$VOILE" ]; then
              echo "::error file=$f::surface opaque en rgba — elle restera sombre sur un bureau clair :"
              printf '%s\n' "$VOILE" | sed 's/^/      /'
              bad=1
            fi
          done

          [ "$bad" = "0" ] && echo "  ok — les panneaux suivent le mode, aucune couleur ne parie sur le noir"
          exit $bad

      - name: Les points des bureaux restent centrés dans la barre
        if: ${{ !cancelled() }}
        run: |
          #  CE CONTRÔLE EXISTE PARCE QUE LE PIÈGE A DÉJÀ FONCTIONNÉ DEUX FOIS.
          #  Les points des espaces de travail sont centrés dans la barre du
          #  haut par une MARGE calculée à la main : marge + hauteur + marge
          #  doit faire exactement la hauteur de la barre. Les deux valeurs
          #  vivent dans deux fichiers différents — la barre dans
          #  xfce4-panel.xml, la marge dans gtk.css du squelette — et rien ne
          #  les reliait qu'un commentaire.
          #
          #  Ce commentaire a bien fait son travail : la barre est passée de
          #  32 à 44 (build 70), puis de 44 à 52 (build 74), et il a nommé la
          #  ligne à refaire les deux fois. Mais il fallait le LIRE. Un jour
          #  où on change la barre sans ouvrir gtk.css, les points se
          #  recollent au bord haut — et ça se voit du premier coup d'œil,
          #  après une heure et quart de construction.
          #
          #  Deux secondes de calcul valent mieux qu'un commentaire qu'on
          #  espère voir.
          XML="config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml"
          #  LE SQUELETTE DU PANNEAU A DÉMÉNAGÉ (ISO 102). Il vivait dans
          #  etc/skel/.config/gtk-3.0/gtk.css, c'est-à-dire à la priorité
          #  UTILISATEUR de GTK — celle qui écrase le thème ET les
          #  applications. C'était toute la cause des icônes noires et des
          #  dossiers orange ; la feuille est passée dans /usr/share/lexos,
          #  d'où lexos-theme-gen la recopie DANS le thème. Les règles du
          #  pager, elles, n'ont pas bougé d'une ligne.
          CSS="config/includes.chroot/usr/share/lexos/gtk-panneau.css"
          for f in "$XML" "$CSS"; do
            [ -r "$f" ] || { echo "::error::$f introuvable"; exit 1; }
          done

          BARRE="$(grep -oE 'name="size"[[:space:]]+type="uint"[[:space:]]+value="[0-9]+"' "$XML" \
                   | head -1 | grep -oE '[0-9]+"$' | tr -d '"')"
          #  On lit la marge et la hauteur DANS le bloc des points, pas
          #  n'importe où dans la feuille : « margin » y apparaît ailleurs.
          BLOC="$(sed -n '/#XfcePanelWindow .pager button,/,/^}/p' "$CSS")"
          MARGE="$(printf '%s' "$BLOC" | grep -oE 'margin:[[:space:]]*[0-9]+px' | head -1 | grep -oE '[0-9]+')"
          HAUT="$(printf '%s' "$BLOC"  | grep -oE 'min-height:[[:space:]]*[0-9]+px' | head -1 | grep -oE '[0-9]+')"

          if [ -z "$BARRE" ] || [ -z "$MARGE" ] || [ -z "$HAUT" ]; then
            echo "::error::valeurs illisibles (barre=$BARRE marge=$MARGE hauteur=$HAUT) — le contrôle ne peut pas conclure"
            exit 1
          fi

          TOTAL=$(( MARGE + HAUT + MARGE ))
          if [ "$TOTAL" != "$BARRE" ]; then
            echo "::error file=$CSS::les points des bureaux ne sont plus centrés : ${MARGE} + ${HAUT} + ${MARGE} = ${TOTAL}, alors que la barre fait ${BARRE} px. Corriger « margin » dans le bloc .pager de gtk.css."
            exit 1
          fi
          echo "  ok — ${MARGE} + ${HAUT} + ${MARGE} = ${BARRE} px, les points sont centrés"

      - name: Aucun dossier ne reste bleu
        if: ${{ !cancelled() }}
        run: |
          #  PHOTO D'ALEX, DANS FICHIERS : « Bureau » et « Desktop » BLEUS, au
          #  milieu des poches orange. Le thème LexOS était pourtant bien actif.
          #
          #  La cause : GTK ne demande pas « folder-desktop » pour le bureau,
          #  il demande « user-desktop » ; et « user-home » pour le dossier
          #  personnel. Deux noms que le thème ne portait pas — la chaîne
          #  d'héritage continuait donc jusqu'à Papirus-Dark, qui les a, en
          #  bleu. Aucune erreur nulle part : juste deux dossiers de la
          #  mauvaise couleur, et rien pour dire pourquoi.
          #
          #  Ce contrôle liste les noms que GTK réclame RÉELLEMENT pour les
          #  dossiers XDG. Il coûte une seconde et rend ce genre de trou
          #  visible avant l'ISO, pas après.
          T="config/includes.chroot/usr/share/icons/LexOS/places/scalable"
          [ -d "$T" ] || { echo "::error::$T introuvable — le thème d'icônes a disparu"; exit 1; }

          #  Les noms viennent de la correspondance que GTK fait entre les
          #  dossiers XDG et les icônes (gtkfilesystem) — pas d'une supposition.
          #  « inode-directory » EST LE NOM QUI MANQUAIT, ET IL VAUT UNE LIGNE
          #  À LUI. Quand GIO doit nommer l'icône d'un dossier, c'est celui-là
          #  qu'il demande — pas « folder ». Le thème ne le portait pas : la
          #  chaîne d'héritage continuait vers Papirus, absent ce jour-là, et
          #  faute de tout candidat GIO retombait sur l'icône générique d'un
          #  type inconnu. D'où des dossiers en FEUILLE DE PAPIER BLANCHE sur
          #  la photo de l'ISO 72 — et en bleu sur la 71, ou Papirus était
          #  passé. Le même dépôt, deux resultats, selon le temps qu'il faisait
          #  sur les miroirs.
          RECLAMES="folder inode-directory user-home user-desktop folder-documents folder-download folder-music folder-pictures folder-videos folder-publicshare folder-templates folder-drag-accept folder-visiting"
          bad=0
          for n in $RECLAMES; do
            if [ -r "$T/$n.svg" ]; then
              printf '  ok  %s\n' "$n"
            else
              #  Le message dit les DEUX issues, parce qu'on les a vues toutes
              #  les deux : bleu si Papirus est là pour rattraper, feuille de
              #  papier blanche s'il ne l'est pas.
              echo "::error file=$T::« $n.svg » manque — ce dossier retombera sur Papirus (bleu), ou sur l'icône générique (feuille blanche) si Papirus n'est pas passé"
              bad=1
            fi
          done

          #  Un lien cassé est pire qu'un fichier absent : il a l'air présent.
          for f in "$T"/*.svg; do
            [ -L "$f" ] || continue
            [ -r "$f" ] || { echo "::error file=$f::lien cassé vers $(readlink "$f")"; bad=1; }
          done

          #  ET LES DEUX THÈMES DE REPLI DOIVENT ÊTRE STRICTS. Tant qu'ils
          #  voyageaient dans les listes OPTIONNELLES — posées « au mieux » —
          #  l'apparence du bureau dépendait du temps qu'il faisait sur les
          #  miroirs Debian. Un bureau sans thème d'icônes n'est pas dégradé,
          #  il est cassé.
          for PKG in adwaita-icon-theme papirus-icon-theme; do
            grep -qx "$PKG" config/package-lists/lexos-core.list.chroot || {
              echo "::error file=config/package-lists/lexos-core.list.chroot::« $PKG » n'est plus strict — son absence rendrait les dossiers blancs sans que rien ne le dise"; bad=1; }
          done

          [ "$bad" = "0" ] && echo "  ok — tous les dossiers que GTK sait nommer ont leur poche orange, et les thèmes de repli sont stricts"
          exit $bad

      - name: Les trois boutons de capture ne se ressemblent pas
        if: ${{ !cancelled() }}
        run: |
          #  PHOTO D'ALEX, ISO 73 : « sur l'ISO, 1re image, y a 3 appareils
          #  photo ». Les trois lanceurs de capture de la barre du haut —
          #  photo, zone, vidéo — portaient tous « Icon=lexos-camera ». Trois
          #  boutons voisins, identiques, dont deux étaient donc invisibles :
          #  on ne peut pas viser ce qu'on ne distingue pas.
          #
          #  La démo les a toujours distingués (#quickcap) : un appareil
          #  photo, un CADRE (⛶ sur #qcZone), un POINT d'enregistrement
          #  (le ::before rond de #qcVideo). L'ISO doit dire pareil.
          bad=0
          L=config/includes.chroot/etc/skel/.config/xfce4/panel
          NOMS=""
          for n in 9:photo 10:zone 11:video; do
            d="${n%%:*}"; q="${n##*:}"
            f="$L/launcher-$d/lexos-capture-$q.desktop"
            [ -f "$f" ] || { echo "::error::$f manquant"; bad=1; continue; }
            i="$(sed -n 's/^Icon=//p' "$f")"
            [ -n "$i" ] || { echo "::error file=$f::pas d'Icon="; bad=1; continue; }
            NOMS="$NOMS $i"
          done
          U="$(echo $NOMS | tr ' ' '\n' | grep -c . || true)"
          D="$(echo $NOMS | tr ' ' '\n' | grep . | sort -u | wc -l)"
          [ "$U" = "3" ] && [ "$D" = "3" ] || {
            echo "::error::les trois lanceurs de capture doivent porter TROIS icônes différentes (trouvé :$NOMS)"; bad=1; }

          #  Et chaque icône nommée doit exister comme source ET être rendue
          #  par le hook 0300 — sinon GTK retombe sur l'icône générique et on
          #  se retrouve avec trois carrés vides au lieu de trois cameras.
          #  ON EXTRAIT LA LISTE, ON NE CHERCHE PAS LE MOT DANS LE FICHIER.
          #  La première version faisait un « grep <nom> » sur tout le hook :
          #  « github » y passait — il apparaît dans un bloc voisin, sans être
          #  dans la liste. Un contrôle qui répond oui à un nom absent de la
          #  liste ne contrôle rien, et la mutation l'a attrapé. On lit donc la
          #  boucle « for NAME in … ; do » elle-même, continuations comprises.
          H0300=config/hooks/normal/0300-lexos-assets.hook.chroot
          LISTE="$(sed -n '/^for NAME in /,/; do$/p' "$H0300" | tr -d '\\' | tr '\n' ' ' | sed -e 's/^for NAME in //' -e 's/; do *$//')"
          for i in $NOMS; do
            n="${i#lexos-}"
            [ -r "branding/icon-$n.svg" ] || {
              echo "::error::« $i » n'a pas de branding/icon-$n.svg"; bad=1; continue; }
            echo "$LISTE" | tr ' ' '\n' | grep -qx "$n" || {
              echo "::error file=config/hooks/normal/0300-lexos-assets.hook.chroot::« $n » n'est pas dans la liste des icônes rendues — le PNG n'existerait pas"; bad=1; }
          done
          [ "$bad" = "0" ] && echo "  ok — photo, zone et vidéo portent trois dessins distincts, tous rendus"
          exit $bad

      - name: Le menu emploie la clé que whiskermenu lit vraiment
        if: ${{ !cancelled() }}
        run: |
          #  « item-icon-size » était posé dans le xfconf du panneau depuis des
          #  builds, et n'a JAMAIS rien réglé. Dans whiskermenu 2.8.3 (trixie),
          #  settings.cpp lit « /launcher-icon-size » ; « item-icon-size » n'y
          #  survit que comme repli lu par xfce_rc_read_int_entry, c'est-à-dire
          #  dans l'ANCIEN fichier .rc — jamais dans xfconf. Le défaut ne se
          #  voyait pas parce que la valeur écrite (2) était exactement le
          #  défaut du plugin : on demandait ce qu'on aurait eu sans demander.
          #  Même famille que les boutons inertes de la 72 ; on la barre ici.
          F=config/includes.chroot/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml
          bad=0
          grep -q 'name="launcher-icon-size"' "$F" || {
            echo "::error file=$F::« launcher-icon-size » absent — la taille des icônes du menu ne serait pas réglée"; bad=1; }
          grep -q 'name="item-icon-size"' "$F" && {
            echo "::error file=$F::« item-icon-size » est revenu — cette clé n'est lue par personne en xfconf"; bad=1; }
          [ "$bad" = "0" ] && echo "  ok — le menu règle ses icônes par la clé que le greffon lit"
          exit $bad

      - name: Bits d'exécution présents
        if: ${{ !cancelled() }}
        run: |
          bad=0
          for f in build.sh auto/config auto/build auto/clean \
                   tools/render-branding.sh \
                   config/hooks/normal/*.hook.chroot \
                   config/includes.chroot/usr/bin/*; do
            [ -x "$f" ] || { echo "::error file=$f::doit être exécutable (chmod +x)"; bad=1; }
          done
          exit $bad

      - name: Cohérence de lexos.conf
        if: ${{ !cancelled() }}
        run: |
          # shellcheck disable=SC1091
          . ./lexos.conf
          test -n "$LEXOS_NAME"    || { echo "LEXOS_NAME vide"; exit 1; }
          test -n "$LEXOS_VERSION" || { echo "LEXOS_VERSION vide"; exit 1; }
          case "$LEXOS_FLAVOUR" in
            minimal|standard|dev|full|gaming|pro) ;;
            *) echo "LEXOS_FLAVOUR invalide : $LEXOS_FLAVOUR"; exit 1 ;;
          esac
          case "$LEXOS_ACCENT_NAME" in
            orange|bleu|rouge|vert|gris|violet|neon) ;;
            *) echo "LEXOS_ACCENT_NAME invalide : $LEXOS_ACCENT_NAME"; exit 1 ;;
          esac
          case "$LEXOS_DOCK_POSITION" in
            right|left|bottom|top) ;;
            *) echo "LEXOS_DOCK_POSITION invalide : $LEXOS_DOCK_POSITION"; exit 1 ;;
          esac
          case "$LEXOS_PERF_PROFILE" in
            auto|petit|medium|performant|max) ;;
            *) echo "LEXOS_PERF_PROFILE invalide : $LEXOS_PERF_PROFILE"; exit 1 ;;
          esac
          case "$LEXOS_KERNEL_CHANNEL" in
            stock|backports) ;;
            *) echo "LEXOS_KERNEL_CHANNEL invalide : $LEXOS_KERNEL_CHANNEL"; exit 1 ;;
          esac
          if [ "$LEXOS_WIFI_AUTO_OPEN" != "off" ]; then
            echo "::error::LEXOS_WIFI_AUTO_OPEN doit rester 'off' par défaut :"
            echo "::error::se connecter seul à un réseau non chiffré ne doit pas être imposé."
            exit 1
          fi
          echo "lexos.conf : $LEXOS_NAME $LEXOS_VERSION ($LEXOS_FLAVOUR / $LEXOS_ACCENT_NAME)"

      - name: Aucun banc ne renvoie un texte dans « grep -q »
        if: ${{ !cancelled() }}
        run: |
          #  ═══ CE QUE CE CONTRÔLE PROTÈGE, ET IL A DÉJÀ MORDU ═══
          #  « grep -q » S'ARRÊTE AU PREMIER RÉSULTAT et ferme le tuyau. Ce
          #  qui écrivait encore — printf, sed, une commande — reçoit une
          #  erreur d'écriture, et sous « set -o pipefail » c'est TOUT LE
          #  TUYAU qui échoue : la condition devient FAUSSE alors que le motif
          #  A ÉTÉ TROUVÉ.
          #
          #  MESURÉ, PAS SUPPOSÉ. Sur test_lexos_installateur_bandeau.sh, la
          #  forme « sed … | grep -q » échouait 54 fois sur 300 essais — un
          #  faux rouge une fois sur cinq, depuis toujours, sur un banc que
          #  cette CI lance à chaque construction. C'est aussi ce qui a fait
          #  rougir la CI de l'ISO 111 pour rien.
          #
          #  ET LE FAUX ROUGE N'EST PAS LE PLUS GRAVE. Dans un contrôle
          #  INVERSÉ — « si ce motif est là, rougis » — la même course donne
          #  un FAUX VERT : le motif interdit est trouvé, le tuyau échoue, et
          #  le banc annonce que tout va bien.
          #
          #  LA FORME SÛRE : « grep motif <<< "$VAR" » quand le texte est déjà
          #  en mémoire, « grep motif < <(commande) » sinon — la substitution
          #  de processus sort le producteur du tuyau, donc son erreur ne
          #  compte plus dans PIPESTATUS.
          #
          #  ON DÉCOMMENTE D'ABORD : les explications comme celle-ci CITENT le
          #  motif fautif. Un contrôle qui lit la prose se déclenche sur sa
          #  propre justification — c'est arrivé sept fois dans ce chantier.
          bad=0
          for f in tests/*.sh; do
            [ -r "$f" ] || continue
            #  Sans « pipefail », l'erreur du producteur ne remonte pas : le
            #  tuyau garde le code de grep, et la course est sans effet.
            grep -q 'pipefail' "$f" || continue
            #  « [^|] » écarte « || grep -q », qui n'est pas un tuyau.
            DUR="$(sed 's/^[[:space:]]*#.*$//' "$f"                    | grep -nE '[^|]\|[[:space:]]*grep[[:space:]]+-[a-zA-Z]*[qm]' || true)"
            if [ -n "$DUR" ]; then
              echo "::error file=$f::un texte repart dans « grep -q » — la course peut se perdre :"
              printf '%s\n' "$DUR" | sed 's/^/      /'
              bad=1
            fi
          done
          [ "$bad" = "0" ] && echo "  ok — aucun banc ne renvoie un texte dans « grep -q »"
          exit $bad

      - name: Aucune plage de lettres accentuées dans un motif de banc
        if: ${{ !cancelled() }}
        run: |
          #  CE QUE ÇA RÉPARE, ET ÇA VIENT D'ARRIVER. Un contrôle bornait un
          #  mot par « [^a-zà-ÿ] ». Vert sur la machine de développement
          #  (locale POSIX), ROUGE ICI :
          #      grep: Invalid collation character
          #  En C.UTF-8 — la locale de ce coureur — une plage entre lettres
          #  accentuées n'a pas de collation définie : grep REFUSE le motif,
          #  rend une ligne vide, et le contrôle conclut de travers. Le pire
          #  cas n'est pas ce rouge-là : c'est le VERT qu'une telle plage
          #  peut donner quand l'absence de correspondance vaut succès.
          #
          #  La borne portable est « \b » (ou « [[:alpha:]] »), qui ne
          #  dépend d'aucune collation.
          #
          #  On lit le CODE, pas la prose : ce commentaire-ci cite justement
          #  la plage fautive, et un contrôle qui se déclenche sur sa propre
          #  justification apprend à ignorer les rouges.
          #  ET LA PREMIÈRE ÉCRITURE DE CE CONTRÔLE-CI EST TOMBÉE DANS SON
          #  PROPRE PIÈGE : elle cherchait « [^[:ascii:]] ». « ascii » n'est
          #  PAS une classe POSIX — grep répondait « Invalid character class
          #  name » sur les quatre-vingt-neuf bancs, puis le contrôle
          #  affichait vert. Un contrôle qui ne peut pas rougir. D'où Python,
          #  qui n'a ni collation ni classes exotiques à deviner.
          python3 - <<'PY'
          import glob, re, sys

          #  Une plage dans une expression entre crochets dont une borne
          #  n'est pas de l'ASCII : « [a-zà-ÿ] », « [^à-ÿ] »…
          CROCHETS = re.compile(r'\[[^\]]*\]')
          PLAGE    = re.compile(r'[^\x00-\x7f]\s*-|-\s*[^\x00-\x7f]')

          mauvais = []
          for f in sorted(glob.glob("tests/*.sh")):
              for n, ligne in enumerate(open(f, encoding="utf-8"), 1):
                  #  ON LIT LE CODE, PAS LA PROSE : ce fichier-ci cite la
                  #  plage fautive pour l'expliquer, et un contrôle qui se
                  #  déclenche sur sa propre justification apprend à ignorer
                  #  les rouges.
                  code = re.sub(r'\s*#.*$', '', ligne)
                  for bloc in CROCHETS.findall(code):
                      if PLAGE.search(bloc):
                          mauvais.append(f"{f}:{n} : {bloc}")

          for m in mauvais:
              print(f"::error::{m} — plage non-ASCII : « Invalid collation character » en C.UTF-8")
          if not mauvais:
              print("ok  aucun motif de banc ne dépend de la collation")
          sys.exit(1 if mauvais else 0)
          PY

      - name: Aucun banc d'essai orphelin
        if: ${{ !cancelled() }}
        run: |
          #  Deux fois le même piège : le banc Boost décroché pendant cinq
          #  ISO (builds 73 à 77), puis test_lexos_fuseau_gps.sh, présent
          #  dans le dépôt mais appelé par AUCUN travail de cette CI. Un banc
          #  que personne ne lance ne protège rien — et ça ne se voit pas,
          #  parce que la CI reste verte. On le rend visible ici.
          #
          #  [ -f "$t" ] : seuls les FICHIERS comptent. « tests/*ARBRE
          #  __pycache__ » (bytecode Python, gitignore ligne 42) n'existe
          #  jamais sur un clone frais de la CI, mais existe très bien chez
          #  un développeur qui vient de lancer les tests en local — sans ce
          #  filtre, ce garde-fou se déclencherait pour la mauvaise raison
          #  sur SA machine, exactement le genre de faux positif qui apprend
          #  à ignorer les rouges.
          orphelins=0
          for t in tests/*; do
            [ -f "$t" ] || continue
            n="$(basename "$t")"
            if ! grep -qF "$n" .github/workflows/ci.yml; then
              echo "::error file=$t::'$n' n'est lancé par aucune tâche de ci.yml — un banc qui ne tourne pas ne protège rien."
              orphelins=$((orphelins + 1))
            fi
          done
          [ "$orphelins" = 0 ] && echo "  ok — les $(find tests -maxdepth 1 -type f | wc -l) bancs sont tous branchés"
          exit "$orphelins"

  theme:
    name: Génération du thème
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Chaque accent produit un thème complet
        if: ${{ !cancelled() }}
        run: |
          for accent in orange bleu rouge vert gris violet neon; do
            out="/tmp/theme-$accent"
            mkdir -p "$out"
            HOME="$out" ./config/includes.chroot/usr/bin/lexos-theme-gen "$accent" --target "$out"
            #  LE STYLE EST UN VRAI THÈME DEPUIS L'ISO 102. Il partait dans
            #  ~/.config/gtk-3.0/gtk.css, que GTK charge en priorité
            #  UTILISATEUR : au-dessus du thème, et au-dessus de ce que
            #  chaque application demande pour elle-même. D'où les icônes du
            #  bureau qui viraient au noir et les dossiers de Fichiers qui
            #  restaient orange. Il s'écrit maintenant dans
            #  ~/.themes/LexOS-Noir, que GTK charge à sa place — au rang du
            #  thème, où les applications peuvent encore avoir le dernier mot.
            THEME="$out/.themes/LexOS-Noir/gtk-3.0/gtk.css"
            test -s "$THEME"
            test -s "$out/.themes/LexOS-Noir/index.theme"
            test -s "$out/.config/xfce4/terminal/terminalrc"
            test -s "$out/.gtkrc-2.0"
            grep -q '#000000' "$THEME"
            #  ET SURTOUT : PLUS RIEN à la priorité utilisateur. C'est la
            #  moitié du correctif ; sans ce contrôle, un retour en arrière
            #  passerait inaperçu et ramènerait les icônes noires.
            if [ -e "$out/.config/gtk-3.0/gtk.css" ] || [ -e "$out/.config/gtk-4.0/gtk.css" ]; then
              echo "::error::une feuille est revenue dans ~/.config/gtk-*.0 — priorité UTILISATEUR, elle écraserait le thème et les applications"
              exit 1
            fi
          done
          echo "7 accents validés."

      - name: Un accent inconnu est refusé
        if: ${{ !cancelled() }}
        run: |
          if HOME=/tmp/x ./config/includes.chroot/usr/bin/lexos-theme-gen mauve 2>/dev/null; then
            echo "Un accent invalide aurait dû être rejeté"; exit 1
          fi
          echo "ok"

  outils:
    name: Outils embarqués
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      #  ═══ POURQUOI CETTE ÉTAPE EXISTE, ET POURQUOI ELLE EST EN PREMIER ═══
      #  Cette tâche pose une quinzaine de paquets au fil de ses étapes
      #  (imagemagick, python3-pil, librsvg2-bin, flameshot…), chaque fois
      #  avec « apt-get install » SANS rafraîchir l'index. Ça marche tant que
      #  l'index pré-cuit dans l'image du coureur correspond au miroir. Le
      #  3 septembre, il ne correspondait plus :
      #
      #    E: Failed to fetch .../python3-pil_10.2.0-1ubuntu1.2_amd64.deb
      #       404 Not Found
      #
      #  Le miroir avait publié une révision plus récente et retiré celle que
      #  l'index nommait. apt rend 100, « bash -e » tue l'étape, et QUATRE
      #  étapes sont tombées d'un coup — dont une qui n'installait rien et se
      #  contentait d'employer l'ImageMagick d'une étape précédente : elle a
      #  annoncé « wallpaper.png n'est pas un lien symbolique », ce qui ne
      #  nomme pas le vrai défaut. Une demi-journée de rouge pour une ligne.
      #
      #  La tâche « Scripts et configuration » ne tombait pas : elle fait
      #  « apt-get update » avant d'installer, depuis toujours. On applique
      #  ici la même règle, une fois pour toute la tâche.
      #
      #  DEUXIÈME ÉPISODE, LE 9 SEPTEMBRE, ET IL A COÛTÉ UNE ISO ENTIÈRE :
      #
      #    E: Failed to fetch https://dl.google.com/linux/chrome-stable/deb/
      #       dists/stable/main/binary-amd64/Packages.gz  Hash Sum mismatch
      #
      #  Le dépôt apt de Google Chrome — ajouté par l'IMAGE DU COUREUR, dont
      #  LexOS ne prend RIEN — servait un Packages.gz qui ne correspondait
      #  plus à son fichier Release. apt rend 100 dès qu'UN index échoue, et
      #  la construction de l'ISO 120 est morte à sa sixième étape, avant
      #  d'avoir commencé. Le rafraîchissement passe donc maintenant par
      #  .github/scripts/apt-sain.sh, qui retire les dépôts tiers inutiles
      #  et réessaie — sans jamais faire taire une vraie erreur.
      - name: Rafraîchir l'index apt — sinon les paquets d'étape 404
        if: ${{ !cancelled() }}
        run: bash .github/scripts/apt-sain.sh

      - name: Le profil « vif », et l'arrondi de la RAM
        if: ${{ !cancelled() }}
        run: |
          #  DEUX CHOSES, ET LA PREMIÈRE EST UN VRAI BOGUE.
          #  « MemTotal » est TOUJOURS inférieur à la capacité annoncée : le
          #  noyau, le microcode et la mémoire réservée au GPU intégré sont
          #  déjà retranchés. Une barrette de 8 Go rapporte ~7,66 Gio, et la
          #  division entière la classait à 7 — donc sous le seuil des 8.
          #  AUCUNE machine de 8 Go ne pouvait atteindre « performant », et
          #  tout le barème était décalé d'un cran : il fallait 12 Go pour
          #  être traité comme une machine de 8, et 24 pour obtenir « max ».
          #  Le banc rejoue le calcul sur des tailles réelles plutôt que de
          #  se fier à la forme de la ligne.
          #
          #  « vif » comble un trou : « petit » coupe les effets mais étrangle
          #  le processeur, « performant » libère le processeur mais garde le
          #  compositing. La combinaison « processeur à fond, zéro fioriture »
          #  n'existait nulle part — c'est ce qu'il faut à un portable à
          #  graphique intégré.
          bash tests/test_lexos_perf_vif.sh

      - name: Les volets du terminal — la configuration tmux sur un vrai tmux
        if: ${{ !cancelled() }}
        run: |
          #  ═══ POURQUOI CE BANC INSTALLE tmux AU LIEU DE LIRE LE FICHIER ═══
          #  Un .conf tmux ne se compile pas et ne se relit pas utilement. Une
          #  seule option mal orthographiée et tmux affiche une erreur au
          #  démarrage, puis IGNORE LA SUITE DU FICHIER. Le terminal s'ouvre
          #  quand même, la souris ne marche plus, les raccourcis non plus, et
          #  rien à l'écran ne dit pourquoi. Chercher des motifs dans le
          #  fichier trouverait « set -g mouse on » et conclurait que tout va
          #  bien : c'est exactement le faux vert qu'on ne veut pas.
          #
          #  Le banc donne donc le fichier à un VRAI tmux (« -d » : pas besoin
          #  de terminal, « -L » : sur une prise à part, il ne touche à rien),
          #  puis REDEMANDE AU SERVEUR ce qu'il a retenu — la souris, le délai
          #  d'échappement, les raccourcis et leur table. C'est la seule
          #  question qui compte : est-ce que ça marche, oui ou non.
          sudo apt-get install -y --no-install-recommends tmux >/dev/null
          tmux -V
          bash tests/test_lexos_multi.sh

      - name: Le coin actif n'ouvre plus la vue tout seul au démarrage
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « quand on arrive dans la page de LexOS au début, il nous
          #  montre toujours la vue qui zoome où la souris. J'aimerais ne plus
          #  le voir. »
          #  Le veilleur démarrait ARMÉ : si le pointeur se trouvait déjà dans
          #  le coin haut-gauche au moment de l'ouverture de session — et
          #  c'est le coin du bouton Applications — il ouvrait la vue sans
          #  qu'on ait rien demandé.
          #
          #  CE BANC NE LIT PAS LE CODE, IL LE FAIT TOURNER : vrai serveur X,
          #  vrai pointeur déplacé par XWarpPointer, vrai veilleur, et un faux
          #  « lexos-apercu » qui note chaque appel. Il éprouve les deux
          #  moitiés à la fois — rien ne s'ouvre au démarrage, ET le coin
          #  s'arme tout seul dès qu'on en sort, sinon on aurait échangé un
          #  défaut contre une fonction morte.
          sudo apt-get install -y --no-install-recommends xvfb >/dev/null \
            || { echo "::error::xvfb n'a pas pu être posé — le veilleur ne peut pas être mis en marche"; exit 1; }
          bash tests/test_lexos_coin_actif.sh

      - name: Les deux services qui coûtaient 106 s au démarrage
        if: ${{ !cancelled() }}
        run: |
          #  ═══ CE QUE CE BANC PROTÈGE, ET CE N'EST PAS LES 106 SECONDES ═══
          #  Mesuré sur le ThinkPad : 1 min 24 s pour lexos-update-check et
          #  21,9 s pour lexos-gpu-garde, les deux premiers de
          #  « systemd-analyze blame », loin devant tout le reste.
          #
          #  Mais ce que le banc surveille le plus, c'est LA PANNE QU'ON
          #  POURRAIT CAUSER EN LES CHERCHANT. gpu-garde existe pour qu'une
          #  seule ISO « pro » démarre aussi bien sur l'Alienware (RTX 5060)
          #  que sur le ThinkPad Intel : « optimiser » ce service jusqu'à ce
          #  qu'il ne fasse plus son travail rendrait un écran noir sur
          #  l'Alienware — infiniment plus cher que vingt secondes.
          #
          #  Le banc joue donc les deux machines sur une fausse arborescence
          #  PCI, avec un update-initramfs témoin qui écrit au lieu de
          #  travailler : sans carte il ne doit RIEN appeler devant l'écran de
          #  connexion, avec carte il doit l'appeler TOUT DE SUITE — le blocage
          #  de « nouveau » doit valoir dès l'initramfs, d'où il est chargé.
          #  Il joue aussi le bus PCI qui arrive en retard, parce que c'est ce
          #  filet qui remplace systemd-udev-settle, et un filet qu'on n'a
          #  jamais vu retenir personne n'est pas un filet.
          bash tests/test_lexos_services_demarrage.sh

      - name: L'avertissement d'installation tient dans l'écran
        if: ${{ !cancelled() }}
        run: |
          #  ═══ LA PIRE FENÊTRE DU DÉPÔT POUR CE DÉFAUT ═══
          #  C'est la dernière chose qu'on voit avant qu'un disque puisse être
          #  effacé, et elle n'avait aucune hauteur : yad la calculait sur les
          #  ~40 lignes du texte. MESURÉ sur un serveur X de 1920×1080 : la
          #  fenêtre faisait 2146 px de haut — 1066 px hors écran. La moitié
          #  basse, boutons compris, était invisible.
          #
          #  DEUX FAÇONS DE S'Y TROMPER, ET LE BANC TIENT LES DEUX :
          #    · l'avertissement TRONQUÉ — BitLocker et Secure Boot sont à la
          #      FIN du texte, et ce sont eux qui coûtent un disque quand on ne
          #      les a pas lus. Couper vaut donc pire que faire long ;
          #    · les BOUTONS hors écran — et alors quelqu'un appuie sur Entrée
          #      sans les voir. Ce que fait Entrée devient tout.
          #
          #  ON INSTALLE UN VRAI SERVEUR X ET UN VRAI yad. Une option
          #  « --height » présente dans le code ne prouve rien : le banc OUVRE
          #  le dialogue à 1920×1080 et à 1366×768 et lit sa géométrie. Un
          #  contrôle textuel serait resté vert sur la fenêtre de 2146 px.
          #  ═══ UN ÉCHEC MUET NE SE CORRIGE PAS ═══
          #  Cette étape est tombée deux constructions de suite en restant
          #  VERTE sur toutes les machines où on peut la relancer — root et
          #  compte ordinaire, cinq passes chacune. Or son journal se trouve
          #  au tout début d'une tâche de cent étapes : l'API ne rend que la
          #  fin, et la cause n'était donc lisible nulle part.
          #  Deux choses changent ici, et aucune ne touche au banc :
          #    · la pose des paquets ne part plus dans /dev/null. Si un miroir
          #      hoquète, on lit « les paquets n'ont pas pu être posés » au
          #      lieu de croire que le banc a échoué ;
          #    · les versions installées sont imprimées. yad et zenity
          #      décident de la géométrie que ce banc MESURE : une version qui
          #      change est la première chose à regarder.
          if ! sudo apt-get install -y --no-install-recommends \
                 xvfb yad zenity xdotool; then
            echo "::error::les paquets de ce banc (xvfb yad zenity xdotool) n'ont pas pu être posés — ce n'est pas le banc qui a échoué"
            exit 1
          fi
          #  ═══ LES SONDES DISENT LA VÉRITÉ, OU L'ÉTAPE S'ARRÊTE ═══
          #  CE QU'ELLES DISAIENT AVANT, dans le journal du coureur :
          #      yad    :
          #      zenity : 4.0.1
          #      Xvfb   : use: X [:<display>] [option]
          #  Deux sondes sur trois mentaient, et on a lu « yad est cassé ».
          #
          #  MESURÉ ICI, sur le MÊME système que le coureur — ce conteneur est
          #  Ubuntu 24.04 avec yad 0.40.0-1build3, zenity 4.0.1-1build3,
          #  xvfb 2:21.1.12-1ubuntu1.6, les versions exactes du journal :
          #    · « yad --version » SANS DISPLAY n'écrit RIEN sur sa sortie
          #      standard : cette compilation initialise GTK avant de répondre
          #      et se plaint « cannot open display ». Et GLib fait précéder
          #      ses avertissements d'une LIGNE VIDE — que « 2>&1 | head -1 »
          #      rendait fidèlement. D'où « yad    : » suivi de rien.
          #      AVEC un écran : « 0.40.0 (GTK+ 3.24.41) ». Le drapeau était
          #      le bon ; c'est l'écran qui manquait.
          #    · Xvfb n'a AUCUN drapeau de version : « -version », « --version »
          #      et « -showconfig » rendent tous « Unrecognized option ». La
          #      sonde imprimait son mode d'emploi. dpkg, lui, la connaît.
          #  Les sondes tournent donc APRÈS un serveur X, et une réponse vide
          #  arrête l'étape au lieu de passer inaperçue.
          Xvfb -displayfd 3 -screen 0 1024x768x24 3>/tmp/lexos-sonde.aff >/dev/null 2>&1 &
          SONDE_PID=$!
          for _ in $(seq 1 100); do [ -s /tmp/lexos-sonde.aff ] && break; sleep 0.1; done
          if [ ! -s /tmp/lexos-sonde.aff ]; then
            echo "::error::Xvfb n'a pas démarré — aucune sonde ne peut répondre, et le banc mesurerait dans le vide"
            exit 1
          fi
          export DISPLAY=":$(tr -dc 0-9 < /tmp/lexos-sonde.aff)"
          MUETTES=0
          sonder() {   # $1 = nom affiché ; $2… = la commande qui doit répondre
            local nom="$1"; shift
            local rep
            rep="$("$@" 2>/dev/null | grep -m1 . || true)"
            if [ -z "$rep" ]; then
              echo "::error::$nom n'a rien répondu — un outil muet fausse tout ce qui suit"
              MUETTES=1
              return 0
            fi
            printf '%-12s : %s\n' "$nom" "$rep"
          }
          sonder yad     yad --version
          sonder zenity  zenity --version
          sonder xdotool xdotool --version
          sonder Xvfb    dpkg-query -W -f='${Version}\n' xvfb
          #  ET LA GÉNÉRATION DE GTK DE CHACUN. Ce banc mesure une géométrie
          #  que GTK décide, et les deux outils ne sont PAS sur la même :
          #  mesuré ici, yad est en GTK 3, zenity en GTK 4. La fenêtre que la
          #  section 6 ouvre est celle de yad.
          for O in yad zenity; do
            printf '%-12s : %s\n' "$O (GTK)" \
              "$(ldd "$(command -v "$O")" | grep -o 'libgtk-[0-9-]*\.so\.[0-9]*' | sort -u | tr '\n' ' ')"
          done
          kill "$SONDE_PID" 2>/dev/null || true
          unset DISPLAY
          [ "$MUETTES" -eq 0 ] || exit 1
          #  ═══ ON MESURE SUR LE SYSTÈME DE LEXOS, PAS SUR CELUI DU COUREUR ═══
          #  Le journal ne s'en cachait pas : azure.archive.ubuntu.com, noble,
          #  zenity 4.0.1-1build3. Or LexOS est bâti sur DEBIAN TRIXIE, et les
          #  hauteurs que ce banc mesure sont décidées par yad, zenity et GTK —
          #  qui n'ont pas les mêmes versions sur les deux systèmes. Une
          #  géométrie relevée sur noble ne dit rien de sûr de ce qu'Alex verra.
          #  On lance donc le banc DANS debian:trixie, avec les vraies versions.
          #
          #  ET SI LE CONTENEUR NE PEUT PAS ÊTRE PRÉPARÉ, ON LE DIT FORT. Le
          #  repli sur le coureur n'est pas silencieux : « ::warning:: » ici, et
          #  la section 0 du banc imprime le système sur lequel il a mesuré et
          #  compte l'écart comme UN NON MESURÉ. Personne ne peut lire ces
          #  hauteurs en croyant qu'elles viennent de trixie.
          #  ON DÉCIDE SUR UNE MARQUE, PAS SUR UN CODE DE SORTIE. Premier
          #  essai : trier les codes (97, 125, 126, 127) pour distinguer « le
          #  conteneur n'a pas pu être préparé » de « le banc a rougi ».
          #  MESURÉ ICI : le client docker qui ne joint pas son démon rend
          #  simplement 1 — le même code qu'un banc en échec. L'étape serait
          #  donc partie au ROUGE en annonçant un défaut de la fenêtre, alors
          #  qu'aucune fenêtre n'avait été ouverte. Un code de sortie ne dit
          #  pas ce qui s'est passé ; une marque écrite au moment précis où le
          #  banc démarre, si.
          TRACE="$(mktemp)"
          set +e
          docker run --rm -v "$PWD:/depot" -w /depot debian:trixie bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq                                          || exit 97
            apt-get install -y --no-install-recommends \
              xvfb yad zenity xdotool python3 >/dev/null                || exit 97
            echo TRIXIE-PRET
            bash tests/test_lexos_install_avertissement.sh' 2>&1 | tee "$TRACE"
          CODE_TRIXIE=${PIPESTATUS[0]}
          set -e
          if grep -q '^TRIXIE-PRET$' "$TRACE"; then
            #  Le banc a VRAIMENT tourné dans trixie : son verdict est le nôtre.
            rm -f "$TRACE"
            exit "$CODE_TRIXIE"
          fi
          rm -f "$TRACE"
          echo "::warning::le conteneur Debian trixie n'a pas pu être préparé (code $CODE_TRIXIE) — on mesure sur ce coureur, et le banc le dit lui-même dans sa section 0, où l'écart compte comme un NON MESURÉ"
          bash tests/test_lexos_install_avertissement.sh

      - name: Profils de performance — tous chargeables
        if: ${{ !cancelled() }}
        run: |
          #  « vif » manquait ici comme il manquait dans PERFS (settings.py) :
          #  la même omission, à un troisième endroit. Le profil existe depuis
          #  qu'il a été ajouté à lexos-perf, detect_profile() le RECOMMANDE
          #  aux portables de 8 Go, et aucune des deux listes blanches ne le
          #  connaissait. On les tient maintenant ensemble : ce pas-ci les
          #  charge tous les cinq, et tests/test_lexos_perf_vif.sh compare
          #  PERFS à normalize() ligne à ligne.
          for p in petit medium vif performant max; do
            ./config/includes.chroot/usr/bin/lexos-perf "$p" --user-only --quiet \
              || { echo "profil $p en échec"; exit 1; }
          done
          ./config/includes.chroot/usr/bin/lexos-perf list
          echo "5 profils validés."

      - name: Profil inconnu refusé
        if: ${{ !cancelled() }}
        run: |
          if ./config/includes.chroot/usr/bin/lexos-perf turbo 2>/dev/null; then
            echo "un profil invalide aurait dû être rejeté"; exit 1
          fi
          echo ok

      - name: Commande d'écran inconnue refusée
        if: ${{ !cancelled() }}
        run: |
          if ./config/includes.chroot/usr/bin/lexos-display teleporter 2>/dev/null; then
            echo "une commande invalide aurait dû être rejetée"; exit 1
          fi
          echo ok

      - name: Position de dock inconnue refusée
        if: ${{ !cancelled() }}
        run: |
          if ./config/includes.chroot/usr/bin/lexos dock diagonale 2>/dev/null; then
            echo "une position invalide aurait dû être rejetée"; exit 1
          fi
          echo ok

      - name: Catalogues de la Logithèque identiques
        if: ${{ !cancelled() }}
        run: |
          # La démo web annonce les VRAIS noms de paquets Debian, ceux que
          # « lexos logitheque install » utilise. Si les deux catalogues
          # divergent, la démo se met à montrer des applications qui ne
          # s'installeront pas — exactement ce qu'on veut éviter.
          python3 - <<'EOF'
          import re, sys

          demo = set(re.findall(
              r'\{pkg:"([^"]+)"',
              open("web-demo/index.html", encoding="utf-8").read()))

          src = open("config/includes.chroot/usr/bin/lexos-logitheque",
                     encoding="utf-8").read()
          bloc = re.search(r'CATALOGUE="\n(.*?)\n"', src, re.S)
          if not bloc:
              sys.exit("catalogue introuvable dans lexos-logitheque")
          cli = {l.split("|")[1] for l in bloc.group(1).splitlines() if l.strip()}

          if demo != cli:
              print("démo seulement :", sorted(demo - cli))
              print("CLI  seulement :", sorted(cli - demo))
              sys.exit("les deux catalogues de la Logithèque ont divergé")
          print(f"ok — {len(demo)} paquets, mêmes noms des deux côtés")
          EOF

      - name: Classement du matériel Apple
        if: ${{ !cancelled() }}
        run: |
          # 36 machines dont on connaît la réponse : Mac Intel, T2, EFI 32
          # bits, Core Duo, Apple Silicon, et des PC qui ne sont pas des Mac.
          # « lexos mac » décide si quelqu'un écrit une clé USB pour rien —
          # une table qui glisse doit casser la CI, pas une soirée.
          bash tests/test_lexos_mac.sh

      - name: Le coffre chiffré raisonne juste (lexos-prive)
        if: ${{ !cancelled() }}
        run: |
          #  Le plus gros outil du dépôt n'avait aucun test — c'est l'audit
          #  d'Alex qui l'a nommé. On ne teste pas gocryptfs (son travail à
          #  lui), on teste que NOTRE script refuse ce qui doit l'être et
          #  n'invente jamais un coffre. Un faux gocryptfs note tout.
          bash tests/test_prive.sh

      - name: La page matériel — fuites, injection, verdict mémoire
        if: ${{ !cancelled() }}
        run: |
          #  Trois silences dans un seul outil, et un banc de faux outils
          #  pour les trois — aucun vrai matériel n'est nécessaire.
          #
          #  · « lexos materiel rapport » est fait pour être collé dans
          #    lexos ia-locale, et dmidecode livre le NUMÉRO DE SÉRIE de
          #    chaque barrette sans qu'on l'ait demandé ;
          #  · le nom de modèle d'un disque vient du MATÉRIEL : une clé USB
          #    peut annoncer « $(commande) », et la première version de ce
          #    script employait eval sur la sortie de lsblk ;
          #  · sans dmidecode ou sans root, la section mémoire doit DIRE ce
          #    qu'elle ne peut pas lire au lieu de disparaître.
          bash tests/test_lexos_materiel.sh

      - name: Tous les boutons sont lisibles
        if: ${{ !cancelled() }}
        run: |
          #  « Regarde que tous les boutons soient corrects » — Alex, après la
          #  photo de la fenêtre de bienvenue : le libellé posé sur un
          #  rectangle NOIR à l'intérieur du bouton orange, et écrit en BLANC.
          #
          #  Deux défauts distincts, et aucun des deux ne se voit en lisant une
          #  règle isolément — c'est la CASCADE qui trahit :
          #    · « écriture blanche partout » repeignait les libellés qui sont
          #      DANS un bouton, et un enfant qui porte sa propre couleur
          #      n'hérite pas de celle du parent ;
          #    · GTK bâtit un bouton en button > box > label : peindre le
          #      bouton ne repeint pas ses enfants, et le fond sombre du thème
          #      de base restait dessous.
          #
          #  Ce banc GÉNÈRE la feuille pour de vrai — huit accents, deux modes,
          #  128 familles de boutons — et MESURE le contraste de chacune. Il a
          #  d'ailleurs trouvé un troisième défaut que personne ne cherchait :
          #  « action conseillée » et « suppression » posaient un fond sans
          #  jamais poser de couleur de texte.
          bash tests/test_boutons.sh

      - name: Boutons de fenêtre — le hook 0610 sur un banc
        if: ${{ !cancelled() }}
        run: |
          #  POURQUOI CE BANC EXISTE. Le hook 0905 a coûté TROIS ISO — 66, 68,
          #  69 — parce qu'on ne pouvait le lancer que dans une vraie
          #  construction : une heure et quart pour savoir si une ligne de sed
          #  marchait. Celui-ci se lance en deux secondes.
          #
          #  Ce qu'il vérifie et qu'aucune relecture ne prouve :
          #   · les 32 images de la rangée du titre grandissent, et les 13
          #     bordures NE bougent PAS (tout agrandir mettrait un cadre gras
          #     autour de chaque fenêtre) ;
          #   · le nom du thème dérivé arrive jusqu'à lexos-firstrun et
          #     « lexos theme ». C'est LA leçon du build 70 : le thème d'icônes
          #     était dans l'ISO, et deux programmes l'effaçaient à la première
          #     session. Le thème de fenêtre a exactement les mêmes trois
          #     écrivains ;
          #   · sans ImageMagick ou sans Arc-Dark, le hook le DIT et s'arrête.
          #
          #  Pillow fabrique de vrais PNG et tient lieu d'ImageMagick sur le
          #  banc. On l'INSTALLE plutôt que de sauter le contrôle s'il manque :
          #  un test qui se saute tout seul finit par ne plus jamais tourner —
          #  c'est ce qui était arrivé au contrôle des locales.
          python3 -c 'import PIL' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-pil >/dev/null
          #  ET IMAGEMAGICK, POUR LA MÊME RAISON QUE PILLOW. La section 6 du
          #  banc éprouve la forme des coins avec le VRAI outil — celui que le
          #  hook emploiera pendant la construction. Sans lui, elle échouait
          #  sur le runner : « ni magick ni convert dans ce conteneur ». Et
          #  elle a bien fait d'échouer : elle est écrite pour crier au lieu
          #  de se sauter en silence. C'est l'outillage qu'on répare, pas le
          #  contrôle qu'on baisse — un test qui échoue faute d'outil apprend
          #  à lire les rouges comme du bruit, et c'est ainsi qu'un vrai rouge
          #  finit ignoré.
          command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends imagemagick >/dev/null
          bash tests/test_lexos_fenetres.sh

      - name: Le bouton rouge — lexos-session sur un banc
        if: ${{ !cancelled() }}
        run: |
          #  UN OUTIL QUI ÉTEINT LA MACHINE NE SE TESTE PAS EN LE LANÇANT.
          #  Le banc lui donne de faux outils sur un PATH fermé et regarde ce
          #  qu'il APPELLE : chaque geste, chaque repli, et surtout les deux
          #  refus qui comptent — sans écran il ne coupe rien, et sans aucun
          #  outil il le DIT au lieu de rendre 0 en silence.
          #  Il vérifie aussi que la barre et la fenêtre disent la même chose :
          #  « changer d'utilisateur » et « déconnexion » doivent avoir quitté
          #  la rangée du panneau, et le greffon 17 (le rouge) être le dernier
          #  — c'est ce qui le met tout à droite de l'écran.
          #  ALEX : « on aimerait ajouter des logos où la fenêtre pour fermer
          #  ou redémarrer l'ordinateur. » Cinq icônes ont été dessinées pour
          #  ça. Le banc ne se contente pas de vérifier que le script les
          #  CITE — il les ouvre, les rend à 28 px (la taille réelle dans la
          #  liste) et compte les pixels peints : un SVG valide et
          #  entièrement transparent passerait tous les autres contrôles.
          #  D'où ces deux outils, sans lesquels il échoue au lieu de se
          #  sauter en silence.
          command -v rsvg-convert >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends librsvg2-bin >/dev/null
          python3 -c 'import PIL' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-pil >/dev/null
          bash tests/test_lexos_session.sh

      - name: Le fond d'écran « Nomad » — le bureau de la démo, sur l'ISO
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, capture de la démo : « mettre ces images dans l'ISO 96,
          #  dans le fichier images, si je veux les avoir comme fond
          #  d'écran ». Il ne demande pas qu'on lui impose ce fond : il
          #  demande qu'il soit LÀ, choisissable.
          #
          #  Le logo ASCII est tracé en SEGMENTS, pas écrit en texte : une
          #  police monospace absente au moment du rendu (fonts-firacode et
          #  fonts-dejavu voyagent dans une liste optionnelle) donnerait une
          #  bouillie, en silence. Le banc re-rend donc le SVG avec le vrai
          #  rsvg-convert et COMPTE les pixels orange — c'est la seule façon
          #  de distinguer un dessin d'un fichier valide et noir.
          command -v rsvg-convert >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends librsvg2-bin >/dev/null
          python3 -c 'import PIL' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-pil >/dev/null
          bash tests/test_lexos_fond_nomad.sh

      - name: LexOS Diagnostic — le panneau matériel/médecin/disques
        if: ${{ !cancelled() }}
        run: |
          #  Module apporté par Alex, relu avant d'être posé : lecture seule,
          #  aucun shell=True, aucun sudo, HTML échappé partout. Deux choses
          #  ont été ajoutées à l'intégration, et ce banc les tient :
          #
          #  · le serveur écoute sur un port FIXE (7861), contrairement à
          #    celui des Paramètres qui tire un port libre. Un port local
          #    prévisible est joignable par n'importe quelle page web que
          #    l'utilisateur ouvre — le banc DÉMARRE le vrai serveur et
          #    vérifie qu'une origine étrangère et un Host étranger (« DNS
          #    rebinding ») sont refusés, sans gêner notre propre page ;
          #  · le moteur importe psutil sans repli, alors que python3-psutil
          #    voyage dans une liste optionnelle.
          #
          #  psutil est donc installé ici : sans lui le banc échouerait faute
          #  d'outil, et on répare l'outillage, pas le contrôle.
          python3 -c 'import psutil' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-psutil >/dev/null
          #  Le fichier est nommé ICI en toutes lettres, et pas seulement
          #  sous sa forme de module : le garde-fou anti-orphelin de ce
          #  dépôt cherche le NOM DE FICHIER dans ce workflow, et
          #  « tests.test_lexos_diagnostic » ne lui ressemble pas. Un banc
          #  que personne ne lance ne protège rien, et ça ne se voit pas.
          test -f tests/test_lexos_diagnostic.py
          python3 -m unittest tests.test_lexos_diagnostic -v

      - name: Gros texte et bulle de capture — deux gestes du quotidien
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « quand on fait agrandissement 100 % de l'écriture,
          #  faudrait que celle du bureau grossisse aussi ». Le gros texte
          #  réglait la police GTK et le facteur GNOME — jamais le BUREAU,
          #  dessiné par xfdesktop avec sa propre taille. Et le piège :
          #  « /desktop-icons/font-size » ne sert à RIEN tant que
          #  « use-custom-font-size » est faux — le réglage qui a l'air posé
          #  et ne change rien, déjà vu avec « item-icon-size » au build 74.
          #  ALEX AUSSI : « peux-tu le changer pour qu'on puisse aller la voir
          #  directement dans le dossier images ? » — la bulle de capture ne
          #  proposait que « En faire mon fond d'écran ».
          #  Faux xfconf-query sur un PATH fermé, qui NOTE au lieu d'agir.
          bash tests/test_lexos_access_capture.sh

      - name: Les applications sortent de l'ISO, pas les outils de LexOS
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « toutes les applications sont téléchargées dans l'ISO —
          #  j'aimerais, pour faire de la place, qu'elles restent dans la
          #  Logithèque ». Quatre familles sortent (~1,6 Go, 136 paquets).
          #  LE DANGER : douze de ces paquets n'étaient pas des applications
          #  mais des outils que LexOS appelle lui-même — dont « npm », qui
          #  installe Claude Code. Ce banc relève ce que le code déclare
          #  appeler et refuse qu'un seul soit parti avec la coupe. Il a
          #  d'ailleurs trouvé « gamemode » que le relevé à la main avait
          #  manqué (la commande s'appelle « gamemoderun »).
          bash tests/test_lexos_paquets_outils.sh

      - name: Le menu de démarrage doit tenir à toute définition — thème GRUB sur un banc
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, ESSAI SUR L'ALIENWARE : « tout est déformé et les places
          #  pour le boot ne sont pas bien placées ».
          #
          #  La géométrie du thème était en PIXELS ABSOLUS, calée sur
          #  1920x1080. Le hook 0910 demande des replis (1280x720, 1024x768,
          #  auto) et GRUB NE REDIMENSIONNE PAS UN THÈME — mais il étire le
          #  fond. Dès que le firmware ne rend pas le 1920x1080, le cadre
          #  dessiné se déplace et les entrées tombent à côté ; en 4:3 le
          #  fond 16:9 est en plus déformé.
          #
          #  Le banc ne démarre pas GRUB — aucun coureur ne le peut. Il refait
          #  son arithmétique pour six définitions et relève le cadre DANS
          #  background.png, au lieu de croire le commentaire qui l'annonce.
          #  Pillow est nécessaire à cette mesure : sans lui le banc dit
          #  « non mesuré », ce qui n'est pas ce qu'on veut d'une CI.
          python3 -c 'import PIL' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-pil >/dev/null
          bash tests/test_lexos_grub_theme.sh

      - name: YouTube Music est une application, pas un lien — lexos-youtube-musique sur un banc
        if: ${{ !cancelled() }}
        run: |
          #  Un lanceur qui promet « une fenêtre dédiée » doit la tenir, ou
          #  dire qu'il ne la tient pas. Le banc lui donne trois mondes —
          #  chromium présent, seulement firefox, aucun navigateur — et
          #  vérifie l'argument exact passé dans chacun.
          bash tests/test_lexos_youtube_musique.sh

      - name: Les réglages de la fenêtre active — lexos-app-settings sur un banc
        if: ${{ !cancelled() }}
        run: |
          #  Alex : « le bouton vert doit ouvrir les paramètres de LA FENÊTRE,
          #  pas de l'ordinateur ». Un thème de barre de titre ne sait lancer
          #  aucune commande à nous au clic (xfwm4 et Compiz n'ont que des
          #  actions fixes) : le geste passe donc par Super+, et
          #  lexos-app-settings, qui lit la fenêtre au premier plan (xdotool)
          #  et lance les VRAIES préférences de l'application — jamais une
          #  commande inventée : xfce4-terminal --preferences et
          #  thunar-settings sont vérifiés dans leurs propres manuels avant
          #  d'être écrits ici (Thunar lui-même n'a AUCUN commutateur
          #  --preferences).
          #  Le banc donne de faux binaires sur un PATH fermé et regarde ce
          #  qui est appelé, casse mêlée : Firefox, Thunar, le terminal, une
          #  application non reconnue (Mousepad — rien à faire en CLI),
          #  aucune fenêtre active, xdotool absent, et le cas qui compte le
          #  plus — une fenêtre reconnue dont le binaire de préférences est
          #  absent. Dans tous les cas où on ne sait pas, le repli est
          #  toujours le même et honnête : les Paramètres LexOS, jamais un
          #  plantage ni une commande fantôme.
          bash tests/test_lexos_app_settings.sh

      - name: L'écran de connexion — noir, orange, et le démon derrière
        if: ${{ !cancelled() }}
        run: |
          #  ON NE PEUT PAS AFFICHER L'ÉCRAN DE CONNEXION ICI : pas de serveur
          #  X, donc pas de rendu. Le banc résout la cascade CSS lui-même —
          #  priorité du fournisseur, puis spécificité, puis ordre, comme GTK —
          #  et prouve ainsi que la boîte devient NOIRE et l'écriture ORANGE
          #  même face à un thème de base qui dit gris.
          #
          #  Il joue aussi les trois replis du hook 0410 (pas d'image, pas de
          #  CSS, pas de thème de base) et le piège qui compte : le hook 0600
          #  réécrivait « theme-name » SANS CONDITION et aurait annulé tout le
          #  travail en silence, exactement comme le paquet terminal du
          #  build 76 aurait remis Papirus-Dark.
          #  LE BANC MESURE MAINTENANT DE VRAIES COULEURS GTK — il lui faut
          #  donc gi et un écran. Sans ces paquets il SAUTE proprement en le
          #  disant, ce qui est honnête mais ne protège rien : la liste des
          #  comptes est justement passée illisible sans qu'aucun contrôle ne
          #  bronche. On les pose ici pour que le contrôle existe vraiment.
          for p in xvfb python3-gi gir1.2-gtk-3.0; do
            dpkg -s "$p" >/dev/null 2>&1 \
              || sudo apt-get install -y --no-install-recommends "$p" >/dev/null
          done
          bash tests/test_lexos_connexion.sh

      - name: Le fond d'écran officiel — le démon, pas juste une variante
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, après avoir envoyé le logo : « pour la prochaine ios sa
          #  va etre le fond ecren officiel — mais toute noir — avec le
          #  demon ». wallpaper-demon.png existait déjà comme UNE variante
          #  du sélecteur Paramètres → Bureau LexOS ; il devient maintenant
          #  wallpaper.png lui-même (un lien symbolique, pas une copie qui
          #  pourrait diverger) — le fichier que lexos-firstrun pose au
          #  premier lancement et que le repli XFCE du même hook recopie.
          #  Le banc fait tourner le VRAI extrait du hook avec un VRAI
          #  ImageMagick.
          #
          #  ET IL LE DEMANDE LUI-MÊME. Cette étape se contentait d'employer
          #  celui qu'une étape PRÉCÉDENTE avait posé pour un autre banc.
          #  Le jour où cette étape-là est tombée, celle-ci est tombée avec,
          #  en accusant le fond d'écran. Une étape qui dépend d'une autre
          #  sans le dire, c'est un diagnostic faux garanti le jour venu.
          command -v convert >/dev/null 2>&1 || command -v magick >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends imagemagick >/dev/null
          bash tests/test_lexos_fond_officiel.sh

      - name: L'écran de connexion — le bouton « Éteindre » fait quelque chose
        if: ${{ !cancelled() }}
        run: |
          #  « J'avais beau cliquer pour arrêter l'ordinateur et j'étais pas
          #  capable. » Le menu ~power demandait une autorisation que rien ne
          #  pouvait lui accorder : « changer d'utilisateur » LAISSE la session
          #  de départ ouverte, logind bascule alors sur l'action
          #  « -multiple-sessions » (mot de passe administrateur), et aucun
          #  agent d'authentification ne tourne sur l'écran de connexion pour
          #  le réclamer. Refus silencieux, clic sans effet.
          #
          #  Ce banc charge la VRAIE règle polkit comme polkitd la chargerait,
          #  et prouve les DEUX moitiés : le greeter peut enfin éteindre, et
          #  aucun autre compte ne gagne quoi que ce soit au passage. Une règle
          #  qui accorde un pouvoir ne se relit pas, elle s'éprouve.
          node tests/test_lexos_connexion_arret.js

      - name: La page Wi-Fi — le pictogramme et les outils
        if: ${{ !cancelled() }}
        run: |
          #  ALEX A COMPARÉ LES DEUX PAGES CÔTE À CÔTE : « wi-fi, utiliser lui
          #  la 2e image » puis « il manque des outils, la 2e image a plus
          #  d'outils sur le mode wi-fi ». Sur l'ISO, un carré jaune (l'émoji
          #  📶 sans police d'émojis) ; dans la démo, une antenne verte.
          #
          #  « node --check » ne dirait que ceci : le fichier se parse. Le banc
          #  CHARGE app.js, lui donne cinq états inventés et regarde le HTML
          #  rendu — l'antenne devient-elle rouge quand la carte est éteinte,
          #  orange quand on est connecté sans internet, la bascule apparaît-
          #  elle, et la liste des réseaux que l'ISO avait EN PLUS survit-elle.
          node tests/test_lexos_wifi.js

      - name: Aucune fonction des Paramètres déclarée deux fois
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « quand je clique sur le bouton pour changer le dock de
          #  position, il change de position, mais dans les paramètres il
          #  change pas — il reste à droite ». setDock() était déclarée DEUX
          #  FOIS : la première rafraîchissait la page, la seconde se
          #  contentait d'un toast. En JavaScript la dernière écrase la
          #  première — la bonne version était du code mort qui avait l'air
          #  vivant. setLangue() portait le même doublon. Ni « node --check »
          #  (le fichier se parse : c'est du JavaScript valide) ni aucun banc
          #  de rendu ne pouvait le voir. Ce contrôle-ci est structurel.
          node tests/test_lexos_doublons_js.js

      - name: La position du dock — une seule vérité, et le registre que personne ne tenait
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « le bouton de position du dock reste sur Droite quoi
          #  qu'on choisisse ». Deuxième étage du même bogue : le premier —
          #  setDock() déclarée deux fois — a été corrigé plus tôt, et c'est
          #  ce correctif-là qui a rendu celui-ci visible. rafraichir() s'est
          #  mis à relire l'état de la machine… pour y trouver
          #  ~/.config/lexos/dock, un fichier que PERSONNE n'écrit.
          #
          #  glib-compile-schemas permet au banc de compiler un faux schéma
          #  Plank et de jouer l'aller-retour complet « lexos dock <position> »
          #  → gsettings → _dock_etat(). Sans lui le banc se saute en le
          #  disant, mais alors il ne mesure plus le cœur de la correction.
          sudo apt-get install -y -qq libglib2.0-bin
          bash tests/test_lexos_dock.sh

      - name: Le volet — le thème jour/nuit suit vraiment un clic sur sa tuile
        if: ${{ !cancelled() }}
        run: |
          #  PHOTO D'ALEX : « le thème jour/nuit qui fonctionne pas dans les
          #  boutons en haut à droite ». La tuile changeait bien le réglage
          #  réel et son propre libellé (☀/🌑) — la SURFACE du volet, elle,
          #  restait figée dans l'ancien mode jusqu'à fermer la fenêtre et la
          #  rouvrir. Paramètres avait déjà ce correctif (appliqueApparence()) ;
          #  le volet, une page à part, ne l'avait jamais reçu.
          node tests/test_lexos_volet_mode.js

      - name: Santé du démarrage — Secure Boot, mode RAID, règle de version NVIDIA
        if: ${{ !cancelled() }}
        run: |
          #  DEUX RÉGLAGES DU BIOS FONT PASSER L'ALIENWARE POUR CASSÉE, et
          #  aucun des deux ne se voyait : Secure Boot refuse le pilote NVIDIA
          #  (compilé, donc non signé) alors que « nouveau » est en liste
          #  noire — plus AUCUN pilote graphique ; et le mode « RAID On »
          #  cache le disque NVMe, l'installateur affiche une liste vide.
          #
          #  Un avertissement qui se déclenche à tort envoie fouiller un BIOS
          #  qui va bien ; un avertissement qui ne se déclenche jamais ne sert
          #  à rien — et c'est le plus probable des deux, parce que personne
          #  ne remarque un contrôle muet. Le banc joue donc chaque cas sur
          #  de fausses racines /sys et /dev et un PATH fermé.
          #
          #  Il joue aussi la règle de version du pilote : la 610 est écartée
          #  PAR SON NOM, et pas par « tout ce qui est au-dessus » — sinon une
          #  615 future serait refusée à jamais, sans une ligne dans le
          #  journal. Les trois listes vérifient les trois cas.
          bash tests/test_lexos_boot.sh

      - name: Garde-fou de démo — la machine installée n'ouvre plus la démo
        if: ${{ !cancelled() }}
        run: |
          #  LE CORRECTIF DU 12 AOÛT, ENFIN PROTÉGÉ. Commit bd7b999 : « le
          #  système installé ouvrait la session de démo, jamais celle de
          #  l'utilisateur ». Le compte ÉTAIT créé par l'installateur — mais
          #  la machine ouvrait toute seule la session « lex », donc on
          #  n'atteignait jamais l'écran où choisir son compte.
          #
          #  /usr/lib/lexos/demo-guard corrige ça depuis, et n'était couvert
          #  par AUCUN banc ni contrôle : la construction tolérait sa
          #  disparition complète en silence. Le hook 0400 arrête maintenant
          #  la construction, et ce banc joue les DEUX sens — en live les
          #  réglages de démo restent (un garde-fou zélé casserait la clé),
          #  sur système installé ils disparaissent — plus le deuxième
          #  démarrage, qui doit se relancer proprement.
          bash tests/test_lexos_demo_guard.sh

      - name: Compiz — partage d'écran (grid), moitiés et quarts d'écran
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « quand on met une fenêtre dans le coin, qu'elle se
          #  divise à 50 % de l'écran, pour en mettre une autre à côté —
          #  comme Ubuntu ». Ce geste existait déjà pour xfwm4, mais lexos-wm
          #  remplace xfwm4 par Compiz dès qu'une accélération 3D réelle est
          #  détectée — et Compiz gère les fenêtres avec ses PROPRES
          #  greffons. Le greffon « grid » manquait de la liste active :
          #  sur une machine où Compiz démarre, glisser vers un bord ne
          #  faisait rien. Ce banc vérifie le greffon, ses valeurs (lues
          #  dans le vrai grid.xml de compiz-plugins-default), l'aperçu
          #  pendant le glisser, la parité des raccourcis avec xfwm4, et
          #  fait vraiment compiler le fichier avec dconf.
          apt-get install -y dconf-cli >/dev/null 2>&1 || true
          bash tests/test_lexos_compiz_grid.sh

      - name: Écrans — xrandr garanti, la section qui explique, un seul écran partagé
        if: ${{ !cancelled() }}
        run: |
          #  TROIS TROUS, TOUS DE LA MÊME FAMILLE : la machine sait quelque
          #  chose et le garde pour elle.
          #    · xrandr était posé « au mieux » et SIX chemins en dépendaient.
          #      Le pire : la section Écrans des Paramètres s'affichait VIDE,
          #      l'air de dire « tu n'as aucun écran » sur une machine à
          #      quatre écrans allumés.
          #    · « lexos distant partager » envoyait le bureau COMBINÉ — avec
          #      trois dalles, une image de 5760x1080 illisible en face, et on
          #      montre des écrans qu'on ne voulait pas montrer.
          #    · L'aide de « lexos » documentait « distant partager on », une
          #      commande qui mourait. Vérifié en la lançant.
          #
          #  Le banc traduit des noms de sortie en index xinerama sur un faux
          #  xrandr qui énumère un écran BRANCHÉ MAIS ÉTEINT : c'est le cas qui
          #  décale les index si on ne filtre pas sur la géométrie active, et
          #  on partagerait alors le mauvais écran en croyant avoir choisi.
          bash tests/test_lexos_ecrans.sh

      - name: Fond d'écran (images téléchargées, fond noir) et pile de la batterie
        if: ${{ !cancelled() }}
        run: |
          #  DEUX DEMANDES D'ALEX LE MÊME JOUR. Les images TÉLÉCHARGÉES
          #  deviennent des fonds d'écran (Téléchargements n'était pas ratissé,
          #  le sélecteur s'ouvrait dans /usr/share) — l'image ENTIÈRE sur fond
          #  NOIR, et la galerie des Paramètres les montre en vignettes. Et la
          #  pile de ses images (verte 4 barres → rouge 1 barre) entre dans la
          #  section Énergie, ISO et démo.
          #
          #  Le banc joue trois pièges réels : le fond animé de la première
          #  session qui RECOUVRAIT l'image choisie par le menu ; la boucle de
          #  firstrun qui EFFAÇAIT le choix de l'utilisateur pendant une
          #  minute ; et la liste blanche de la galerie — _run y est remplacé
          #  par un faux qui RÉUSSIT, sinon le refus observé pouvait venir de
          #  l'environnement et une liste trouée serait passée verte.
          bash tests/test_lexos_fond_batterie.sh

      - name: Luminosité — le curseur et le panneau lisent la même interface
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « dans les paramètres, la luminosité de l'écran ne
          #  marche pas ». Beaucoup de portables exposent DEUX interfaces
          #  sous /sys/class/backlight/ à la fois — « acpi_videoN » (le
          #  firmware) et une interface native du pilote graphique. La
          #  première, alphabétiquement, accepte l'écriture SANS ERREUR
          #  sans piloter le rétroéclairage : le curseur bougeait, l'écran
          #  non. lexos-brightness ET settings.py préfèrent maintenant tout
          #  interface non-acpi_video, dans cet ordre-là, TOUS LES DEUX —
          #  sinon la barre affichée pourrait ne jamais correspondre à ce
          #  que le curseur vient de régler.
          bash tests/test_lexos_brightness.sh

      - name: Le terminal — la police et les couleurs suivent le canal Xfconf
        if: ${{ !cancelled() }}
        run: |
          #  DÉCOUVERTE EN CHERCHANT POURQUOI LA POLICE D'ALEX NE GROSSISSAIT
          #  JAMAIS : depuis Xfce 4.20 (celle de trixie), xfce4-terminal MIGRE
          #  terminalrc vers le canal Xfconf « xfce4-terminal » à son PREMIER
          #  lancement et ne le relit plus jamais ensuite. lexos-theme-gen
          #  écrit maintenant ce canal directement, comme il le fait déjà pour
          #  xfwm4.xml et xsettings.xml.
          #
          #  Ce banc installe le vrai xfce4-terminal et Xvfb pour prouver le
          #  mécanisme par l'exécution : aucun message de migration, aucune
          #  clé rejetée, le fichier n'est pas réécrit — la preuve qu'un canal
          #  déjà rempli au premier lancement empêche la migration de partir
          #  sur des valeurs par défaut.
          #
          #  xfce4-terminal DÉPEND de libxfconf-0-3 (la bibliothèque) mais PAS
          #  du paquet xfconf, qui porte le démon xfconfd — et il ne fait que
          #  RECOMMANDER un bus D-Bus, que --no-install-recommends écarte.
          #  Sans xfconfd ni bus, le terminal ne peut pas LIRE le canal : il le
          #  voit vide et migre, ce qui faisait échouer ce banc alors que le
          #  fichier produit était bon. Sur une vraie LexOS le métapaquet
          #  « xfce4 » amène xfconfd, donc le cas réel n'a jamais eu ce trou.
          #  dpkg -s, pas « command -v » : le nom du PAQUET (xvfb, xfconf,
          #  dbus-x11) ne correspond pas toujours au nom de la COMMANDE qu'il
          #  installe (Xvfb en majuscule ; xfconfd hors du PATH ; dbus-x11
          #  fournit dbus-launch et dbus-run-session, pas un binaire « dbus-x11 »).
          for p in xfce4-terminal xvfb xfconf dbus-x11; do
            dpkg -s "$p" >/dev/null 2>&1 \
              || sudo apt-get install -y --no-install-recommends "$p" >/dev/null
          done
          bash tests/test_lexos_terminal.sh

      - name: L'invite du terminal — une ligne, vert pour LexOS, blanc pour la frappe
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, PHOTO DU TERMINAL, DEUX REMARQUES : « la ligne est pas
          #  complète et a déjà une espace, faire en sorte que ça suive » —
          #  l'invite tenait sur deux lignes, le chevron seul sur la seconde ;
          #  et « écriture blanc pour écriture de utilisateur, vert pour
          #  lexos » — le chemin et le chevron étaient orange, et la frappe
          #  héritait de cet orange.
          #
          #  Aucun banc de ce dépôt ne lisait interactive.sh : l'invite était
          #  la pièce la plus vue de LexOS et la seule sans filet. Celui-ci
          #  fait DÉVELOPPER PS1 par un vrai bash interactif (${PS1@P}) et
          #  relit les séquences ANSI qui en sortent — il ne cherche pas
          #  « \n » dans le fichier, il regarde ce que le terminal affichera.
          bash tests/test_lexos_invite.sh

      - name: Le haut du navigateur est gris, et Chromium reste l'officiel
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « en haut du navigateur il est trop noir, changer pour
          #  qu'il soit un peu gris » et « garder lui officiel comme
          #  navigateur ».
          #
          #  CE BANC NE SE CONTENTE PAS DE LIRE LES FICHIERS. Une politique
          #  BrowserThemeColor bien écrite ne repeint QUE la barre d'outils
          #  tant que Chromium suit le thème GTK : la bande d'onglets — le
          #  « haut » qu'Alex montre — reste noire. Un banc qui aurait
          #  vérifié « le fichier existe » aurait été vert sur ce
          #  demi-correctif. Celui-ci lance le VRAI navigateur avec les
          #  fichiers du hook et relit les pixels.
          #
          #  Le dossier de politiques appartient à root ; on le prête au
          #  compte du runner, sinon le banc saute sa partie la plus utile.
          sudo mkdir -p /etc/chromium/policies/managed
          sudo chown -R "$(id -u):$(id -g)" /etc/chromium/policies
          for p in xvfb imagemagick python3-pil; do
            dpkg -s "$p" >/dev/null 2>&1 \
              || sudo apt-get install -y --no-install-recommends "$p" >/dev/null
          done
          bash tests/test_lexos_navigateur.sh

      - name: Les applications Qt suivent le sombre, sans un kit chacune
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « pour pas avoir à changer les couleurs et tout le kit sur
          #  chaque appli ». LexOS embarque SEPT applications Qt et rien ne
          #  leur disait de suivre le thème : elles s'ouvraient BLANCHES.
          #
          #  CE BANC MESURE, IL NE LIT PAS UNE VARIABLE. Vérifier la présence
          #  de « QT_QPA_PLATFORMTHEME=gtk3 » aurait été VERT sur un bureau
          #  resté blanc : ce greffon est bien chargé, mais celui de Qt5
          #  fournit les dialogues et les polices, PAS la palette. Seul le
          #  pixel tranche, et il tranche sur le vrai flameshot.
          for p in xvfb imagemagick python3-pil adwaita-qt flameshot; do
            dpkg -s "$p" >/dev/null 2>&1 \
              || sudo apt-get install -y --no-install-recommends "$p" >/dev/null
          done
          bash tests/test_lexos_qt.sh

      - name: LexOS-Noir — le style devient un vrai thème, sans rien changer à l'écran
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « les thèmes des applications, on peut-tu faire que ça soit
          #  pas trop compliqué et que ça reste tout officiel normal, pour pas
          #  avoir à changer les couleurs et tout le kit sur chaque appli. »
          #
          #  Le style partait dans ~/.config/gtk-3.0/gtk.css, chargé en priorité
          #  UTILISATEUR : il écrasait le thème de base ET chaque application
          #  par-dessus. C'est la cause de l'icône du bureau noircie, du dossier
          #  Thunar en silhouette, et des correctifs sur mesure qui allaient avec.
          #
          #  ÉTAPE 1 : le thème existe et rend EXACTEMENT ce que rend la pile
          #  actuelle. Ce banc mesure les deux montages sur un vrai GTK 3.24 et
          #  exige zéro différence — une règle qui gagnait par PRIORITÉ ne gagne
          #  plus que par SPÉCIFICITÉ, et il est là pour nommer celles qui
          #  tombent. Il en a déjà trouvé une (l'infobulle).
          #  ═══ LE SOCLE S'INSTALLE ICI PAR SON NOM, ET CE NOM A CHANGÉ ═══
          #  yaru-theme-gtk livre Yaru-dark, sur quoi LexOS-Noir est construit
          #  depuis l'ISO 110 (arc-theme jusqu'à la 109). Ce n'est pas un
          #  détail d'outillage : SANS LE SOCLE, LE BANC NE TOMBE PAS EN
          #  ROUGE — IL SE SAUTE. Toute la section 3, les treize couleurs
          #  MESURÉES sur un vrai GTK 3.24, disparaît derrière un « — » et la
          #  CI reste verte en n'ayant plus rien éprouvé. C'est le faux vert
          #  qu'on traque partout ailleurs, et il s'est produit pour de vrai à
          #  la première construction de la 110.
          #  Le banc refuse maintenant que cette liste et le socle par défaut
          #  de lexos-theme-gen s'éloignent l'un de l'autre : changer le socle
          #  sans changer cette ligne rougit, au lieu de vider le banc en
          #  silence.
          #  arc-theme reste : il est encore un paquet optionnel de LexOS (le
          #  hook 0610 en dérive les gros boutons de fenêtre).
          for p in xvfb python3-gi gir1.2-gtk-3.0 yaru-theme-gtk arc-theme; do
            dpkg -s "$p" >/dev/null 2>&1 \
              || sudo apt-get install -y --no-install-recommends "$p" >/dev/null
          done
          xvfb-run -a bash tests/test_lexos_theme_systeme.sh

      - name: L'icône du bureau ne s'éteint pas au clic droit
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, DEUX PHOTOS : « quand je clique sur le bouton droit de la
          #  souris, il devient tout noir ». La tuile orange d'une icône
          #  choisie disparaissait dès l'ouverture du menu.
          #
          #  La cause est une question de CASCADE, pas de texte : notre
          #  gtk.css est chargé en priorité UTILISATEUR et sa règle « .view »
          #  attrapait XfdesktopIconView, que xfdesktop veut transparent. Un
          #  banc qui aurait cherché « XfdesktopIconView » dans le fichier
          #  n'aurait rien prouvé — une chaîne présente ne gagne pas
          #  forcément. Celui-ci charge les DEUX feuilles dans un vrai
          #  GTK 3.24, à leurs vraies priorités, et demande à GTK la couleur
          #  résolue dans chacun des états (dont « backdrop », celui du menu
          #  ouvert).
          for p in xvfb python3-gi gir1.2-gtk-3.0 arc-theme binutils; do
            dpkg -s "$p" >/dev/null 2>&1 \
              || sudo apt-get install -y --no-install-recommends "$p" >/dev/null
          done
          xvfb-run -a bash tests/test_lexos_bureau_icone.sh

      - name: Bluetooth — un balayage refusé n'est plus annoncé comme réussi
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « dans les paramètres Bluetooth, il ne trouve rien ».
          #  act_bt_chercher() (settings.py) et « lexos bt scan »
          #  (lexos-net) ignoraient tous les deux le code de retour de
          #  bluetoothctl : un balayage REFUSÉ (contrôleur pas prêt, déjà en
          #  cours…) se terminait par « Recherche terminée » ou « Aucun
          #  appareil trouvé » — le message d'une recherche qui a eu lieu et
          #  n'a rien vu, pas d'une recherche qui n'a jamais eu lieu.
          bash tests/test_lexos_bluetooth.sh

      - name: Les trois pastilles, la capture fermable, l'agenda qui a une fin
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, QUATRE DEMANDES : « bouton rouge pour fermer, jaune pour
          #  réduire, gris pour mettre la page de côté » (il n'y avait AUCUN
          #  bouton réduire) ; « pouvoir fermer la fenêtre de la capture » ;
          #  « écriture noire » sur le rappel des raccourcis ; « ajouter une
          #  heure de fin d'événement ».
          #  Le banc FAIT TOURNER le crochet sur un vrai thème Arc et relit
          #  les pixels — une première version du tiret traversait tout le
          #  disque, et seule l'image l'a montré. Il fait tourner l'agenda de
          #  bout en bout : l'heure de fin était écrite puis JETÉE à la
          #  relecture par le filtre de _agenda_lit().
          bash tests/test_lexos_fenetres_capture.sh

      - name: Chaque bouton fait quelque chose, chaque fenêtre mène quelque part
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « regarde bien pour que tous les boutons et les fenêtres
          #  ouvrent fluidement. » L'audit a trouvé deux fenêtres MORTES sur
          #  trente-cinq : « Applications » et « Applications par défaut »
          #  lançaient exo-preferred-applications, que XFCE ne livre plus
          #  (vérifié dans exo-utils : il ne reste qu'exo-open,
          #  exo-desktop-item-edit et exo-helper). Et le silence était de
          #  notre fait — le moteur renvoyait « Outil absent », la page
          #  jetait la réponse.
          #  Le commentaire de _xfce() raconte que ce défaut avait DÉJÀ tué
          #  neuf fenêtres auparavant. C'est le défaut le plus répété du
          #  dépôt, et rien ne le surveillait.
          bash tests/test_lexos_boutons_fenetres.sh

      - name: L'accent des pages web — une seule table, trois surfaces
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « dans les paramètres les boutons fonctionnent tous, mais
          #  c'est la couleur orange qui ne change pas — pour le dock
          #  surtout. » Deux défauts : rafraichir() relisait l'accent sur la
          #  machine sans jamais le reposer (seul rend(), au démarrage, le
          #  faisait), et le volet des Paramètres rapides ne le posait NULLE
          #  PART — il était orange à vie.
          #  Ce banc interdit surtout la divergence : si une pastille offerte
          #  n'a pas son bloc dans ui.css, le clic ne changerait rien, et on
          #  retrouverait exactement le symptôme d'Alex. Il mesure aussi le
          #  contraste du texte posé sur chaque accent — le noir en dur
          #  donnait 3,34:1 sur le bleu.
          node tests/test_lexos_accents_web.js

      - name: La barre — la flèche des Paramètres rapides, et la cloche retirée
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « changer l'image pour une flèche qui pointe vers le bas,
          #  pour les paramètres rapides » — le bouton portait la MÊME roue
          #  dentée que les Paramètres complets, deux boutons voisins sans
          #  rien pour les distinguer. Et : « Notifications, on peut l'ôter de
          #  là, pis juste le garder dans les Paramètres ».
          #  Ce banc éprouve la CHAÎNE ENTIÈRE de l'icône (source, crochet qui
          #  la rend, lanceur qui la demande) — le maillon coupé au milieu est
          #  exactement ce qui avait rendu l'icône de Thunar invisible — et,
          #  pour la cloche, les deux bouts : partie de la barre sans y
          #  laisser de trou, mais toujours joignable dans les Paramètres.
          bash tests/test_lexos_barre_volet.sh

      - name: Thème d'icônes — un dossier livré que GTK ne regardait pas
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, DEUX PHOTOS DU DOCK : « toujours le gestionnaire de
          #  fichiers, il garde jamais l'image du fichier. » Les cinq icônes
          #  de Thunar étaient bien dans l'ISO, dans apps/scalable — mais
          #  « Directories= » de index.theme ne listait que places/scalable,
          #  et la spécification freedesktop est formelle : un dossier absent
          #  de cette liste n'est PAS parcouru. Cinq icônes livrées,
          #  installées, jamais regardées. Ce banc éprouve que CHAQUE dossier
          #  présent sur le disque est déclaré — la question que personne ne
          #  posait.
          bash tests/test_lexos_icones_theme.sh

      - name: lexos dev-sync — poser le dépôt sans reconstruire l'ISO
        if: ${{ !cancelled() }}
        run: |
          #  Changer une ligne d'un script demandait une ISO complète. Cet
          #  outil pose les fichiers du dépôt sur le système en marche — et
          #  comme il écrit dans /usr en root, presque tout le banc porte sur
          #  ce qu'il REFUSE de faire.
          #
          #  L'assertion la plus importante : « --essai » n'écrit RIEN. On le
          #  lance justement pour regarder avant de décider ; un essai qui
          #  écrit quand même est pire que pas d'essai du tout. Le banc compare
          #  les sommes de contrôle de toute la destination, avant et après.
          #
          #  Le banc éprouve aussi le garde-fou des zones interdites
          #  DIRECTEMENT, en extrayant sa fonction du fichier : les témoins
          #  posés dans /boot restaient intacts même garde-fou cassé, parce que
          #  ces chemins ne sont dans aucun arbre parcouru. Deux protections
          #  qui ne se recouvrent pas, donc deux contrôles distincts.
          bash tests/test_lexos_dev_sync.sh

      - name: Les outils système trouvent leurs commandes depuis le bureau
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « pas capable de faire formater ma clé USB, il affiche
          #  outil manquant ». Le message était TROMPEUR : l'outil n'était pas
          #  absent de la machine, il était absent du PATH.
          #
          #  Debian ne met les répertoires sbin dans le PATH que pour root —
          #  /etc/profile teste l'UID. Un outil lancé depuis le bureau (action
          #  du clic droit, .desktop, page des Paramètres) tourne sous le
          #  compte ordinaire et ne trouvait donc pas parted, mkfs.vfat,
          #  dmidecode, usermod… pourtant installés.
          #
          #  Le banc est un garde-fou de CLASSE : il vérifie les huit outils
          #  concernés, pas un seul cas, et il attrape aussi le prochain
          #  qu'on écrira. Il garde deux détails pris en faute pendant la
          #  correction : les sbin vont EN QUEUE du PATH (mis devant, ils
          #  rendaient deux bancs aveugles), et le seam LEXOS_SANS_SBIN doit
          #  survivre pour qu'un banc puisse encore simuler une vraie absence.
          bash tests/test_lexos_path_sbin.sh

      - name: Le bandeau de l'installateur est lisible — casse des clés ET contraste
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, PHOTO DE L'INSTALLATEUR : le bandeau de gauche était
          #  ILLISIBLE — seule l'étape courante se distinguait. Pas un manque
          #  de contraste : du NOIR SUR NOIR.
          #
          #  Les quatre clés de « style: » étaient écrites en minuscule
          #  initiale. Calamares 3.3 les compare aux noms de son enum C++
          #  (QMetaEnum::valueToKey), donc avec une MAJUSCULE. Établi deux
          #  fois : les seules chaînes du libcalamaresui.so livré sont
          #  SidebarBackground / SidebarBackgroundCurrent / SidebarText /
          #  SidebarTextCurrent, et l'exemple officiel amont les écrit ainsi.
          #
          #  Et la panne était MUETTE : une clé inconnue n'arrête rien,
          #  Calamares le note dans un journal que personne ne lit, puis
          #  styleString() rend une chaîne vide — QColor("") est invalide et
          #  se peint en noir.
          #
          #  Le banc garde la casse, refuse toute clé inconnue, et surtout
          #  calcule le CONTRASTE : écrire les bonnes clés ne suffit pas, un
          #  texte sombre sur fond sombre referait la même panne avec des
          #  clés parfaitement valides.
          bash tests/test_lexos_installateur_bandeau.sh

      - name: Le menu Whisker — noir, et sa règle picom passe en premier
        if: ${{ !cancelled() }}
        run: |
          #  Le menu du bouton LexOS sortait gris, et la barre du haut aussi :
          #  (20, 18, 22) est un gris violacé, pas le noir du reste du système.
          #
          #  MESURÉ EN SESSION X RÉELLE (whiskermenu 2.8.3, la version de
          #  trixie), et c'est cette mesure qui décide de tout :
          #      WM_CLASS   = "wrapper-2.0", "Wrapper-2.0"
          #      WINDOW_TYPE = _NET_WM_WINDOW_TYPE_MENU
          #      WM_NAME    = "Whisker Menu"
          #  Le type contient « menu » : la fenêtre était donc déjà attrapée
          #  par la règle générique de lexos-tv.conf. Sa règle à elle doit
          #  passer AVANT, puisque picom s'arrête à la première
          #  correspondance — c'est l'assertion centrale de ce banc, et rien
          #  d'autre ne signalerait un fichier réordonné.
          #  Et la classe « wrapper-2.0 » est celle de TOUS les greffons du
          #  panneau : matcher dessus attraperait l'horloge et la batterie.
          bash tests/test_lexos_menu_whisker.sh

      - name: Les icônes du sélecteur de fichiers — une seule taille, écrite deux fois
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, SUR LE THINKPAD : les icônes de « Ouvrir les fichiers »
          #  font 16 px, trop petit pour distinguer un dossier d'un fichier.
          #  Ce n'est pas réglable en CSS : GtkFileChooserWidget lit
          #  GTK_ICON_SIZE_MENU dans change_icon_theme(), et
          #  « -gtk-icon-size » n'existe qu'en GTK 4. Le seul levier est
          #  « gtk-icon-sizes ».
          #  Il s'écrit à DEUX endroits parce qu'il le faut : xfsettingsd
          #  écrase /etc/gtk-3.0/settings.ini une fois la session ouverte,
          #  mais settings.ini sert AVANT — dans l'installateur. Ce banc
          #  garde surtout leur ACCORD : un désaccord ne casse aucune
          #  construction et donnerait deux tailles différentes selon
          #  l'endroit, sans qu'aucune erreur ne se lève.
          bash tests/test_lexos_taille_icones_fichiers.sh

      - name: Les trois lettres sur les dossiers
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : « ajouter toujours sur les dossiers, quand on renomme les
          #  dossiers, l'écriture des 3 premières lettres sur le dossier. »
          #
          #  Deux causes, deux correctifs : Bureau, Modèles et Public étaient
          #  des LIENS vers le dossier nu (trois fichiers à écrire) ; les
          #  dossiers qu'Alex crée lui-même n'ont aucun nom d'icône, et aucun
          #  thème ne peut deviner « PRO » à partir d'un nom de dossier — d'où
          #  lexos-etiquette, qui fabrique l'image et la colle sur le dossier.
          #
          #  Le banc DESSINE l'étiquette avec le vrai rsvg-convert et compare
          #  au pixel près la position de la pastille avec celle du thème : une
          #  étiquette maison mal alignée avec DOC et IMG se verrait tout de
          #  suite. Il éprouve aussi le repliage des accents, où deux jets ont
          #  échoué (iconv qui supprime les accents, puis sed qui découpe
          #  l'UTF-8 en octets) — deux pannes muettes sans ce contrôle.
          command -v rsvg-convert >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends librsvg2-bin >/dev/null
          python3 -c 'import PIL' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-pil >/dev/null
          bash tests/test_lexos_etiquette.sh

      - name: Épingler une application au dock, d'un clic droit
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, photo du clic droit sur une icône du bureau : « on voit pas
          #  "épingler" pour le mettre sur le dock ». Plank ne lit pas une
          #  liste dans un réglage : chaque icône épinglée est un fichier
          #  .dockitem dans un dossier qu'il surveille.
          #
          #  Le piège que ce banc garde : l'icône du bureau est un .desktop
          #  posé dans ~/Bureau. L'épingler TEL QUEL marche jusqu'au jour où
          #  Alex efface l'icône du bureau — le dock garde alors un lanceur
          #  mort. Quand le même nom existe au catalogue, c'est celui-là qu'il
          #  faut épingler, et ça ne se voit pas à la lecture du code.
          bash tests/test_lexos_epingler.sh

      - name: Le gestionnaire de fichiers — le dossier orange, pas un engrenage
        if: ${{ !cancelled() }}
        run: |
          #  TROISIÈME SIGNALEMENT D'ALEX SUR LE MÊME SUJET. Les deux
          #  correctifs précédents partaient du même pari : que Thunar
          #  réclame une des écritures qu'on a devinées, et que GTK aille la
          #  chercher là où on croit. Le second était même un NON-ÉVÉNEMENT —
          #  le crochet 0605 réécrit index.theme d'après le disque, donc le
          #  dossier qu'on venait d'y déclarer y figurait déjà.
          #
          #  On n'espère plus : une copie du .desktop de Thunar est posée
          #  dans /usr/local/share/applications avec « Icon=folder-open »,
          #  le seul dossier du thème dont les photos prouvent qu'il est
          #  parcouru. Le banc EXÉCUTE le vrai fragment du crochet 0400 sur
          #  trois disques fabriqués — nom Debian classique, nom renommé,
          #  .desktop sans ligne Icon= — et sur un disque vide, pour vérifier
          #  qu'une absence de Thunar se DIT au lieu de casser l'ISO.
          bash tests/test_lexos_fichiers_icone.sh

      - name: L'écran de démarrage — la mascotte se tient, le logo s'écrit
        if: ${{ !cancelled() }}
        run: |
          #  ALEX : mascotte fixe en haut, « LEXOS » qui s'écrit lettre par
          #  lettre en dessous, barre de progression passée au vert.
          #
          #  UN ÉCRAN DE DÉMARRAGE NE SE REGARDE QU'AU DÉMARRAGE SUIVANT :
          #  une lettre de la mauvaise taille décale tout l'alignement, une
          #  lettre au fond OPAQUE découpe ses voisines pendant le
          #  glissement, une courbe linéaire donne un mouvement de robot — et
          #  rien de tout ça ne se voit avant d'avoir gravé une clé et
          #  redémarré une machine. C'est le pire cycle de retour du dépôt.
          #
          #  Le banc ne peut pas regarder l'écran, alors il mesure : les
          #  dimensions lues dans l'en-tête PNG, le canal alpha DÉCODÉ pixel
          #  par pixel, et le script Plymouth découpé du hook 0300 lui-même.
          #  Il lance aussi « lexos accent bleu » pour de vrai, parce que
          #  #E8590C est un jeton remplacé par sed : une barre écrite avec ce
          #  jeton changerait de couleur avec l'accent.
          #  ═══ ON INSTALLE PLYMOUTH POUR QUE LE BANC LISE LA VRAIE API ═══
          #  L'ISO 112 est partie avec un écran de démarrage sans logo, et la
          #  cause était un appel à « Plymouth.GetTime() » — une fonction qui
          #  N'EXISTE PAS. L'interpréteur de Plymouth ne se plaint pas d'une
          #  fonction inconnue : il rend une valeur nulle et continue. Le temps
          #  restait donc figé, les cinq lettres gardaient l'opacité 0 hors
          #  écran, et l'on voyait la mascotte SANS le logo. Tout était vert.
          #
          #  Le seul contrôle qui mord confronte chaque appel du script produit
          #  à la liste RÉELLE des fonctions du module — et cette liste, le
          #  banc la RELÈVE DANS script.so plutôt que de la recopier. Une liste
          #  recopiée vieillit en silence, et c'est justement une supposition
          #  sur l'API qui a produit ce bogue. Sans le paquet, le banc retombe
          #  sur une liste gelée et le dit ; on préfère la vraie.
          sudo apt-get install -y --no-install-recommends plymouth >/dev/null
          #  La section 8 mesure blanc.png et bye-bye.png avec Pillow, et la
          #  section 9 compile un harnais C qui charge le VRAI module script.so
          #  et fait tourner le thème produit : Pillow, gcc et convert sont
          #  posés ici même, sans compter sur un pas antérieur du même job.
          python3 -c 'import PIL' 2>/dev/null \
            || sudo apt-get install -y --no-install-recommends python3-pil >/dev/null
          command -v convert >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends imagemagick >/dev/null
          command -v gcc >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends gcc libc6-dev >/dev/null
          #  libply.so.5 est fourni par libplymouth5, pas par le paquet
          #  plymouth : le harnais de la section 9 en a besoin pour charger
          #  script.so.
          [ -r /usr/lib/x86_64-linux-gnu/libply.so.5 ] || [ -r /usr/lib/libply.so.5 ] \
            || sudo apt-get install -y --no-install-recommends libplymouth5 >/dev/null
          #  ═══ ET ffmpeg, SANS QUOI LE BANC ROUGIT POUR RIEN ═══
          #  Depuis que la vidéo d'ouverture est découpée en images à la
          #  construction, le fragment du hook 0300 appelle ffmpeg. Sans lui,
          #  le hook crie son repli « ffmpeg absent : pas d'entrée en matière »
          #  et le contrôle « le cas nominal doit être MUET » tombe — un rouge
          #  qui n'accuse rien du dépôt. Il est resté ainsi trois ISO.
          command -v ffmpeg >/dev/null 2>&1 \
            || sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null
          bash tests/test_lexos_plymouth.sh

      - name: Le thème GRUB — plus de rectangle bleu sous « Loading Linux… »
        if: ${{ !cancelled() }}
        run: |
          #  ALEX, PHOTO DU ThinkPad : après avoir choisi LexOS, un grand
          #  rectangle bleu-turquoise à vagues au milieu de l'écran, « on
          #  dirait que mon logiciel est complètement planté ». C'était la
          #  zone terminal du thème, sans « terminal-box », qui laissait voir
