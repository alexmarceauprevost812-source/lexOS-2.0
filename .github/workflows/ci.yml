          #     « ^C » au lieu du texte dans le presse-papier.
          #  2) QtWebEngine INTERDIT le presse-papier par défaut. Il faut
          #     JavascriptCanAccessClipboard (écrire) ET JavascriptCanPaste
          #     (lire) : n'en poser qu'un donne un correctif à moitié, plus
          #     dur à diagnostiquer qu'une panne franche.
          #
          #  Le banc EXÉCUTE la logique de sélection extraite du fichier sur
