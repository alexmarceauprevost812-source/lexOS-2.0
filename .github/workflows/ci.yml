        if: ${{ !cancelled() }}
        run: |
          #  « lexos share qr » ouvrait une fenêtre yad : un dialogue GTK
          #  générique, qui ne prend pas le thème LexOS. Alex, photo de l'ISO
          #  72 : « la page pour partager, elle est pas pareille ». Elle est
          #  maintenant une page web locale dans une fenêtre Qt, comme tous
          #  les autres panneaux.
          #  CE QUE CE BANC GARDE SURTOUT, ce n'est pas l'apparence : c'est le
          #  REPLI. Quatre gardes font retomber la commande sur le QR en
