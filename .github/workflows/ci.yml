          bash tests/test_lexos_partage_page.sh

      - name: Les 37 sections des Paramètres se rendent toutes
        if: ${{ !cancelled() }}
        run: |
          #  « Diagnostic » ne s'affichait PAS. Elle écrivait
          #  « corps.innerHTML = … » puis « break » là où toutes les autres
          #  rendent une chaîne : « corps » n'existe nulle part, donc une
